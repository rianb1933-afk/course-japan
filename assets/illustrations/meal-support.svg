<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg-meal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF8E1"/>
      <stop offset="100%" stop-color="#FFECB3"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg-meal)"/>
  
  <!-- Meal tray with compartments -->
  <rect x="80" y="80" width="240" height="140" rx="12" fill="#FFF" stroke="#FF9800" stroke-width="2"/>
  <line x1="160" y1="80" x2="160" y2="220" stroke="#FF9800" stroke-width="1"/>
  <line x1="240" y1="80" x2="240" y2="220" stroke="#FF9800" stroke-width="1"/>
  <line x1="80" y1="150" x2="320" y2="150" stroke="#FF9800" stroke-width="1"/>
  
  <!-- Food items -->
  <text x="120" y="125" text-anchor="middle" font-size="24">🍚</text>
  <text x="200" y="125" text-anchor="middle" font-size="24">🐟</text>
  <text x="280" y="125" text-anchor="middle" font-size="24">🥬</text>
  <text x="120" y="195" text-anchor="middle" font-size="24">🥣</text>
  <text x="200" y="195" text-anchor="middle" font-size="24">🥒</text>
  <text x="280" y="195" text-anchor="middle" font-size="24">🍵</text>
  
  <!-- Utensils -->
  <line x1="340" y1="90" x2="340" y2="200" stroke="#795548" stroke-width="3" stroke-linecap="round"/>
  <line x1="355" y1="90" x2="355" y2="200" stroke="#795548" stroke-width="3" stroke-linecap="round"/>
  
  <text x="200" y="260" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#E65100">食事支援 (Meal Support)</text>
</svg>
