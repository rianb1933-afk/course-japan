<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- CPR Illustration -->
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8F5E9"/>
      <stop offset="100%" stop-color="#C8E6C9"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg1)"/>
  
  <!-- Heart -->
  <path d="M200 120 C200 100, 230 80, 250 100 C270 80, 300 100, 300 120 C300 160, 200 200, 200 200 C200 200, 100 160, 100 120 C100 100, 130 80, 150 100 C170 80, 200 100, 200 120Z" fill="#E53935" opacity="0.9"/>
  
  <!-- Heartbeat line -->
  <path d="M80 250 L140 250 L160 220 L180 270 L200 230 L220 250 L240 240 L260 260 L280 230 L300 250 L320 250" fill="none" stroke="#1B5E20" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Hands compressing -->
  <ellipse cx="200" cy="140" rx="40" ry="25" fill="none" stroke="#FFA726" stroke-width="3" stroke-dasharray="8,4"/>
  <path d="M180 135 L220 135" stroke="#FFA726" stroke-width="4" stroke-linecap="round"/>
  <path d="M185 145 L215 145" stroke="#FFA726" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Arrows showing compression -->
  <path d="M200 105 L200 125" stroke="#1B5E20" stroke-width="2.5" marker-end="url(#arrow1)"/>
  <path d="M200 175 L200 195" stroke="#1B5E20" stroke-width="2.5" marker-end="url(#arrow1)"/>
  <defs><marker id="arrow1" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1B5E20"/></marker></defs>
  
  <!-- Label -->
  <text x="200" y="285" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1B5E20">心肺蘇生 (CPR) — Kompresi Dada</text>
</svg>
