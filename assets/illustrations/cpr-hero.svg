<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg-main" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
    <linearGradient id="heart-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <linearGradient id="monitor-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="shadow-sm" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <filter id="shadow-md" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.12"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg-main)" rx="16"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="800" height="56" fill="#1E40AF" rx="16"/>
  <rect x="0" y="40" width="800" height="16" fill="#1E40AF"/>
  <circle cx="40" cy="28" r="18" fill="rgba(255,255,255,0.15)"/>
  <text x="40" y="33" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16">🏥</text>
  <text x="70" y="34" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#FFF">CPR · 心肺蘇生 · Cardiopulmonary Resuscitation</text>
  <text x="760" y="34" text-anchor="end" font-family="system-ui,sans-serif" font-size="11" fill="rgba(255,255,255,0.7)">N2 介護</text>
  
  <!-- Left Panel: Key Metrics -->
  <rect x="24" y="72" width="220" height="350" rx="12" fill="#FFF" filter="url(#shadow-md)"/>
  <rect x="24" y="72" width="220" height="44" rx="12" fill="#FEF2F2"/>
  <rect x="24" y="104" width="220" height="12" fill="#FEF2F2"/>
  <text x="134" y="100" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#DC2626">主要数値 (Metrik Utama)</text>
  
  <!-- Compression Rate -->
  <rect x="40" y="128" width="188" height="68" rx="8" fill="#FFF" stroke="#FEE2E2" stroke-width="1.5"/>
  <text x="52" y="148" font-family="system-ui,sans-serif" font-size="10" fill="#9CA3AF">胸骨圧迫 (Kompresi Dada)</text>
  <text x="52" y="172" font-family="system-ui,sans-serif" font-size="28" font-weight="800" fill="#DC2626">100–120</text>
  <text x="195" y="172" font-family="system-ui,sans-serif" font-size="12" fill="#6B7280">回/分</text>
  <text x="52" y="188" font-family="system-ui,sans-serif" font-size="9" fill="#16A34A">● 正常範囲</text>
  
  <!-- Compression Depth -->
  <rect x="40" y="204" width="188" height="68" rx="8" fill="#FFF" stroke="#DBEAFE" stroke-width="1.5"/>
  <text x="52" y="224" font-family="system-ui,sans-serif" font-size="10" fill="#9CA3AF">深さ (Kedalaman)</text>
  <text x="52" y="248" font-family="system-ui,sans-serif" font-size="28" font-weight="800" fill="#2563EB">5–6</text>
  <text x="120" y="248" font-family="system-ui,sans-serif" font-size="14" fill="#6B7280">cm</text>
  <text x="52" y="264" font-family="system-ui,sans-serif" font-size="9" fill="#16A34A">● 成人</text>
  
  <!-- Ratio -->
  <rect x="40" y="280" width="188" height="68" rx="8" fill="#FFF" stroke="#FEF3C7" stroke-width="1.5"/>
  <text x="52" y="300" font-family="system-ui,sans-serif" font-size="10" fill="#9CA3AF">圧迫:呼吸 (Rasio)</text>
  <text x="52" y="328" font-family="system-ui,sans-serif" font-size="32" font-weight="800" fill="#D97706">30 : 2</text>
  <text x="52" y="344" font-family="system-ui,sans-serif" font-size="9" fill="#6B7280">圧迫30回 → 呼吸2回</text>
  
  <!-- Recovery Position -->
  <rect x="40" y="356" width="188" height="50" rx="8" fill="#FFF" stroke="#D1FAE5" stroke-width="1.5"/>
  <text x="52" y="376" font-family="system-ui,sans-serif" font-size="10" fill="#9CA3AF">回復体位 (Posisi Pemulihan)</text>
  <text x="52" y="396" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#16A34A">横向きに寝かせる</text>
  
  <!-- Center: CPR Diagram -->
  <rect x="256" y="72" width="280" height="350" rx="12" fill="#FFF" filter="url(#shadow-md)"/>
  <text x="396" y="96" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#374151">CPR 手順図 (Diagram)</text>
  
  <!-- Ground/Bed -->
  <rect x="280" y="320" width="232" height="8" rx="4" fill="#E5E7EB"/>
  
  <!-- Patient body (more detailed) -->
  <ellipse cx="396" cy="316" rx="16" ry="14" fill="#FDE68A" stroke="#D97706" stroke-width="1.5"/>
  <!-- Torso -->
  <rect x="310" y="302" width="172" height="18" rx="8" fill="#FDE68A" stroke="#D97706" stroke-width="1.5"/>
  <!-- Arms -->
  <rect x="290" y="305" width="20" height="10" rx="4" fill="#FDE68A" stroke="#D97706" stroke-width="1"/>
  <rect x="490" y="305" width="20" height="10" rx="4" fill="#FDE68A" stroke="#D97706" stroke-width="1"/>
  
  <!-- Rescuer (kneeling beside patient) -->
  <!-- Head -->
  <circle cx="396" cy="230" r="18" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <circle cx="390" cy="226" r="2" fill="#2563EB"/>
  <circle cx="402" cy="226" r="2" fill="#2563EB"/>
  <path d="M392 234 Q396 238 400 234" fill="none" stroke="#2563EB" stroke-width="1.5"/>
  
  <!-- Body -->
  <line x1="396" y1="248" x2="396" y2="280" stroke="#2563EB" stroke-width="3"/>
  
  <!-- Arms pushing down -->
  <line x1="396" y1="260" x2="370" y2="295" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/>
  <line x1="396" y1="260" x2="422" y2="295" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Hands on chest -->
  <circle cx="370" cy="298" r="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <circle cx="422" cy="298" r="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  
  <!-- Legs -->
  <line x1="396" y1="280" x2="375" y2="310" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="396" y1="280" x2="417" y2="310" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Compression Arrows -->
  <path d="M360 210 L360 228" stroke="#DC2626" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="354,228 360,240 366,228" fill="#DC2626"/>
  <path d="M432 210 L432 228" stroke="#DC2626" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="426,228 432,240 438,228" fill="#DC2626"/>
  <text x="396" y="205" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#DC2626">↓ 圧迫 ↓</text>
  
  <!-- C-A-B Steps -->
  <rect x="280" y="340" width="232" height="70" rx="8" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="1"/>
  <text x="396" y="358" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#374151">C-A-B 手順</text>
  
  <rect x="292" y="364" width="66" height="36" rx="6" fill="#FEF2F2" stroke="#FECACA"/>
  <text x="325" y="380" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="800" fill="#DC2626">C</text>
  <text x="325" y="394" text-anchor="middle" font-family="system-ui,sans-serif" font-size="7" fill="#6B7280">圧迫</text>
  
  <rect x="365" y="364" width="66" height="36" rx="6" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="398" y="380" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="800" fill="#2563EB">A</text>
  <text x="398" y="394" text-anchor="middle" font-family="system-ui,sans-serif" font-size="7" fill="#6B7280">気道</text>
  
  <rect x="438" y="364" width="66" height="36" rx="6" fill="#F0FDF4" stroke="#BBF7D0"/>
  <text x="471" y="380" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="800" fill="#16A34A">B</text>
  <text x="471" y="394" text-anchor="middle" font-family="system-ui,sans-serif" font-size="7" fill="#6B7280">呼吸</text>
  
  <!-- Right Panel: Monitor & Info -->
  <rect x="548" y="72" width="228" height="350" rx="12" fill="#FFF" filter="url(#shadow-md)"/>
  
  <!-- ECG Monitor -->
  <rect x="560" y="84" width="204" height="120" rx="10" fill="url(#monitor-grad)"/>
  <text x="572" y="104" font-family="system-ui,sans-serif" font-size="9" fill="#4ADE80">Heart Rate Monitor</text>
  <text x="748" y="104" text-anchor="end" font-family="system-ui,sans-serif" font-size="28" font-weight="800" fill="#4ADE80">72</text>
  <text x="748" y="118" text-anchor="end" font-family="system-ui,sans-serif" font-size="10" fill="#6B7280">bpm</text>
  <!-- ECG Waveform -->
  <polyline points="572,140 590,140 600,125 610,155 620,115 630,150 640,135 660,140 680,140 695,130 710,145 725,140 740,140 755,140" fill="none" stroke="#4ADE80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="572" y="180" font-family="system-ui,sans-serif" font-size="9" fill="#94A3B8">SpO₂: 98% · RR: 16/min</text>
  
  <!-- AED Info -->
  <rect x="560" y="216" width="204" height="80" rx="8" fill="#FFF" stroke="#FEE2E2" stroke-width="1.5"/>
  <text x="572" y="236" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#DC2626">AED 使用時</text>
  <text x="572" y="252" font-family="system-ui,sans-serif" font-size="9" fill="#6B7280">1. 電源ON</text>
  <text x="572" y="264" font-family="system-ui,sans-serif" font-size="9" fill="#6B7280">2. パッド貼付</text>
  <text x="572" y="276" font-family="system-ui,sans-serif" font-size="9" fill="#6B7280">3. 解析→ショック</text>
  <text x="572" y="288" font-family="system-ui,sans-serif" font-size="9" fill="#6B7280">4. CPR再開</text>
  
  <!-- Important Notes -->
  <rect x="560" y="304" width="204" height="108" rx="8" fill="#FFFBEB" stroke="#FEF3C7" stroke-width="1"/>
  <text x="572" y="324" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#D97706">⚠ 注意事項</text>
  <text x="572" y="340" font-family="system-ui,sans-serif" font-size="9" fill="#6B7280">● 圧迫を中断しない</text>
  <text x="572" y="352" font-family="system-ui,sans-serif" font-size="9" fill="#6B7280">● 手持ちち瘫がまっすぐ</text>
  <text x="572" y="364" font-family="system-ui,sans-serif" font-size="9" fill="#6B7280">● 肩の力で圧迫</text>
  <text x="572" y="376" font-family="system-ui,sans-serif" font-size="9" fill="#6B7280">● 完全に胸を戻す</text>
  <text x="572" y="388" font-family="system-ui,sans-serif" font-size="9" fill="#6B7280">● 交代は10秒以内</text>
  <text x="572" y="400" font-family="system-ui,sans-serif" font-size="9" fill="#6B7280">● 救急車到着まで継続</text>
</svg>
