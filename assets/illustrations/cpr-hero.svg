<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350">
  <!-- Clean medical textbook style -->
  <rect width="600" height="350" rx="12" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1"/>
  
  <!-- Title bar -->
  <rect x="0" y="0" width="600" height="40" rx="12" fill="#1E40AF"/>
  <rect x="0" y="20" width="600" height="20" fill="#1E40AF"/>
  <text x="300" y="27" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFF">CPR · 心肺蘇生 · Kompresi Dada</text>
  
  <!-- Patient (flat, simple) -->
  <rect x="150" y="180" width="250" height="25" rx="4" fill="#FDE68A" stroke="#D97706" stroke-width="1.5"/>
  <circle cx="140" cy="192" r="18" fill="#FDE68A" stroke="#D97706" stroke-width="1.5"/>
  <circle cx="135" cy="189" r="2" fill="#92400E"/>
  <circle cx="145" cy="189" r="2" fill="#92400E"/>
  <path d="M133 197 Q140 201 147 197" fill="none" stroke="#92400E" stroke-width="1.2"/>
  
  <!-- Rescuer (simple stick figure) -->
  <circle cx="280" cy="130" r="15" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <line x1="280" y1="145" x2="280" y2="175" stroke="#2563EB" stroke-width="2"/>
  <line x1="280" y1="155" x2="260" y2="170" stroke="#2563EB" stroke-width="2"/>
  <line x1="280" y1="155" x2="300" y2="170" stroke="#2563EB" stroke-width="2"/>
  
  <!-- Compression arrows -->
  <line x1="280" y1="105" x2="280" y2="125" stroke="#DC2626" stroke-width="2" marker-end="url(#arr)"/>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="5" refY="10" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L5 10 L10 0Z" fill="#DC2626"/></marker></defs>
  
  <!-- Key metrics (left side) -->
  <rect x="20" y="55" width="120" height="85" rx="8" fill="#FFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="80" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1E40AF">胸骨圧迫</text>
  <line x1="30" y1="82" x2="130" y2="82" stroke="#E5E7EB" stroke-width="1"/>
  <text x="80" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#DC2626">100-120</text>
  <text x="80" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6B7280">回/分 · Kecepatan</text>
  <text x="80" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6B7280">5-6cm · Kedalaman</text>
  
  <!-- Ratio box (right side) -->
  <rect x="460" y="55" width="120" height="60" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="520" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#92400E">30 : 2</text>
  <text x="520" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#B45309">Kompresi : Napas</text>
  
  <!-- ECG line (bottom) -->
  <path d="M460 140 L490 140 L500 120 L510 160 L520 130 L530 140 L560 140" fill="none" stroke="#DC2626" stroke-width="1.5"/>
  
  <!-- Heart icon -->
  <path d="M490 155 C490 148, 505 140, 510 150 C515 140, 530 148, 530 155 C530 170, 510 182, 510 182 C510 182, 490 170, 490 155Z" fill="#FCA5A5" stroke="#DC2626" stroke-width="1"/>
  
  <!-- Bottom info -->
  <rect x="20" y="230" width="560" height="100" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="300" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#374151">C-A-B 手順</text>
  
  <rect x="40" y="265" width="160" height="50" rx="6" fill="#FFF" stroke="#E5E7EB"/>
  <text x="120" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1E40AF">C · Compression</text>
  <text x="120" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#6B7280">胸骨圧迫 30回</text>
  
  <rect x="220" y="265" width="160" height="50" rx="6" fill="#FFF" stroke="#E5E7EB"/>
  <text x="300" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1E40AF">A · Airway</text>
  <text x="300" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#6B7280">気道確保</text>
  
  <rect x="400" y="265" width="160" height="50" rx="6" fill="#FFF" stroke="#E5E7EB"/>
  <text x="480" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1E40AF">B · Breathing</text>
  <text x="480" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#6B7280">人工呼吸 2回</text>
</svg>
