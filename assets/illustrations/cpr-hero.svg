<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <rect width="600" height="400" rx="20" fill="url(#bg)"/>
  
  <!-- Person lying down -->
  <ellipse cx="300" cy="260" rx="150" ry="20" fill="#CBD5E1" opacity="0.3"/>
  
  <!-- Body -->
  <rect x="180" y="230" width="240" height="40" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  
  <!-- Head -->
  <circle cx="160" cy="240" r="25" fill="#FDE68A" stroke="#F59E0B" stroke-width="2"/>
  <circle cx="155" cy="237" r="3" fill="#92400E"/>
  <circle cx="168" cy="237" r="3" fill="#92400E"/>
  <path d="M155 248 Q160 252 165 248" fill="none" stroke="#92400E" stroke-width="1.5"/>
  
  <!-- Rescuer kneeling -->
  <circle cx="280" cy="170" r="20" fill="#FDE68A" stroke="#1E40AF" stroke-width="2"/>
  <circle cx="276" cy="167" r="2.5" fill="#1E3A8A"/>
  <circle cx="286" cy="167" r="2.5" fill="#1E3A8A"/>
  <path d="M276 176 Q280 180 284 176" fill="none" stroke="#1E3A8A" stroke-width="1.5"/>
  
  <!-- Rescuer body -->
  <rect x="265" y="190" width="30" height="40" rx="6" fill="#DBEAFE" stroke="#1E40AF" stroke-width="2"/>
  
  <!-- Arms extending to chest -->
  <line x1="270" y1="200" x2="290" y2="220" stroke="#1E40AF" stroke-width="3" stroke-linecap="round"/>
  <line x1="290" y1="200" x2="310" y2="220" stroke="#1E40AF" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Hands on chest (compression position) -->
  <ellipse cx="300" cy="225" rx="20" ry="10" fill="#FDE68A" stroke="#1E40AF" stroke-width="2"/>
  
  <!-- Compression arrows -->
  <path d="M300 195 L300 215" stroke="#DC2626" stroke-width="3" marker-end="url(#arrow-down)"/>
  <path d="M300 235 L300 255" stroke="#DC2626" stroke-width="3" marker-end="url(#arrow-down)"/>
  <defs>
    <marker id="arrow-down" viewBox="0 0 10 10" refX="5" refY="10" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L5 10 L10 0Z" fill="#DC2626"/>
    </marker>
  </defs>
  
  <!-- Heart with pulse -->
  <path d="M480 120 C480 100, 510 80, 530 100 C550 80, 580 100, 580 120 C580 160, 530 190, 530 190 C530 190, 480 160, 480 120Z" fill="#EF4444" opacity="0.9"/>
  <text x="530" y="145" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#FFF">72</text>
  <text x="530" y="160" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#FEE2E2">bpm</text>
  
  <!-- ECG line -->
  <path d="M450 200 L480 200 L490 180 L500 220 L510 190 L520 200 L550 200 L560 180 L570 220 L580 190 L590 200" fill="none" stroke="#EF4444" stroke-width="2"/>
  
  <!-- Labels -->
  <rect x="40" y="40" width="160" height="50" rx="10" fill="#FFF" filter="url(#shadow)"/>
  <text x="120" y="60" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1E40AF">胸骨圧迫</text>
  <text x="120" y="78" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748B">Kompresi Dada</text>
  
  <rect x="40" y="100" width="160" height="50" rx="10" fill="#FFF" filter="url(#shadow)"/>
  <text x="120" y="120" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1E40AF">100-120回/分</text>
  <text x="120" y="138" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748B">Kecepatan</text>
  
  <rect x="40" y="160" width="160" height="50" rx="10" fill="#FFF" filter="url(#shadow)"/>
  <text x="120" y="180" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1E40AF">5-6cm 深さ</text>
  <text x="120" y="198" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748B">Kedalaman</text>
  
  <!-- 30:2 ratio badge -->
  <rect x="430" y="40" width="120" height="45" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="490" y="58" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#92400E">30 : 2</text>
  <text x="490" y="75" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#B45309">Kompresi : Napas</text>
</svg>
