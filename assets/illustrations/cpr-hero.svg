<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350">
  <!-- Ultra clean flat vector style -->
  <rect width="600" height="350" fill="#FFF"/>
  
  <!-- Title -->
  <rect x="0" y="0" width="600" height="36" fill="#1E40AF"/>
  <text x="300" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#FFF">CPR · 心肺蘇生 · Kompresi Dada</text>
  
  <!-- Left: Info cards -->
  <rect x="24" y="52" width="140" height="44" rx="6" fill="#F3F4F6"/>
  <text x="36" y="70" font-family="system-ui, sans-serif" font-size="10" fill="#6B7280">胸骨圧迫</text>
  <text x="36" y="86" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#DC2626">100-120 回/分</text>
  
  <rect x="24" y="104" width="140" height="44" rx="6" fill="#F3F4F6"/>
  <text x="36" y="122" font-family="system-ui, sans-serif" font-size="10" fill="#6B7280">深さ</text>
  <text x="36" y="138" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#1E40AF">5 - 6 cm</text>
  
  <!-- Right: Ratio -->
  <rect x="436" y="52" width="140" height="56" rx="6" fill="#FEF3C7"/>
  <text x="506" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#92400E">30 : 2</text>
  <text x="506" y="96" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#B45309">圧迫 : 呼吸</text>
  
  <!-- Center: Simple person diagram -->
  <!-- Patient lying -->
  <rect x="200" y="190" width="200" height="20" rx="4" fill="#FDE68A" stroke="#D97706" stroke-width="1.5"/>
  <circle cx="190" cy="200" r="14" fill="#FDE68A" stroke="#D97706" stroke-width="1.5"/>
  
  <!-- Rescuer above -->
  <circle cx="300" cy="155" r="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <line x1="300" y1="167" x2="300" y2="185" stroke="#2563EB" stroke-width="2"/>
  <line x1="300" y1="175" x2="280" y2="185" stroke="#2563EB" stroke-width="2"/>
  <line x1="300" y1="175" x2="320" y2="185" stroke="#2563EB" stroke-width="2"/>
  
  <!-- Compression arrow -->
  <path d="M300 130 L300 150" stroke="#DC2626" stroke-width="2" marker-end="url(#a1)"/>
  <defs><marker id="a1" viewBox="0 0 10 10" refX="5" refY="10" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L5 10 L10 0Z" fill="#DC2626"/></marker></defs>
  
  <!-- Bottom: C-A-B -->
  <rect x="24" y="240" width="552" height="90" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="300" y="262" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#374151">C-A-B 手順</text>
  
  <rect x="44" y="272" width="160" height="44" rx="6" fill="#FFF" stroke="#E5E7EB"/>
  <text x="124" y="290" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1E40AF">C · Compression</text>
  <text x="124" y="306" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#6B7280">胸骨圧迫 30回</text>
  
  <rect x="220" y="272" width="160" height="44" rx="6" fill="#FFF" stroke="#E5E7EB"/>
  <text x="300" y="290" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1E40AF">A · Airway</text>
  <text x="300" y="306" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#6B7280">気道確保</text>
  
  <rect x="396" y="272" width="160" height="44" rx="6" fill="#FFF" stroke="#E5E7EB"/>
  <text x="476" y="290" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1E40AF">B · Breathing</text>
  <text x="476" y="306" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#6B7280">人工呼吸 2回</text>
</svg>
