<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg-med" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFEBEE"/>
      <stop offset="100%" stop-color="#FFCDD2"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg-med)"/>
  
  <!-- Medical cross -->
  <rect x="175" y="40" width="50" height="100" rx="8" fill="#E53935"/>
  <rect x="150" y="65" width="100" height="50" rx="8" fill="#E53935"/>
  
  <!-- Stethoscope -->
  <path d="M160 160 C160 180 180 200 200 200 C220 200 240 180 240 160" fill="none" stroke="#333" stroke-width="3"/>
  <circle cx="200" cy="210" r="12" fill="#FFF" stroke="#333" stroke-width="2"/>
  
  <!-- Patient care icons -->
  <circle cx="80" cy="180" r="25" fill="#FFF" stroke="#E53935" stroke-width="2"/>
  <text x="80" y="175" text-anchor="middle" font-size="16">💉</text>
  <text x="80" y="195" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#333">血糖</text>
  
  <circle cx="160" cy="220" r="25" fill="#FFF" stroke="#E53935" stroke-width="2"/>
  <text x="160" y="215" text-anchor="middle" font-size="16">🧠</text>
  <text x="160" y="235" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#333">脳血管</text>
  
  <circle cx="240" cy="220" r="25" fill="#FFF" stroke="#E53935" stroke-width="2"/>
  <text x="240" y="215" text-anchor="middle" font-size="16">🦴</text>
  <text x="240" y="235" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#333">骨</text>
  
  <circle cx="320" cy="180" r="25" fill="#FFF" stroke="#E53935" stroke-width="2"/>
  <text x="320" y="175" text-anchor="middle" font-size="16">💊</text>
  <text x="320" y="195" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#333">薬物</text>
  
  <text x="200" y="275" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#B71C1C">医療看護 (Medical Care)</text>
</svg>
