<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg-bath" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E0F7FA"/>
      <stop offset="100%" stop-color="#B2EBF2"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg-bath)"/>
  
  <!-- Bathtub -->
  <rect x="80" y="100" width="240" height="100" rx="20" fill="#FFF" stroke="#00838F" stroke-width="3"/>
  <path d="M100 120 Q200 140 300 120" fill="none" stroke="#00BCD4" stroke-width="2"/>
  <path d="M100 140 Q200 160 300 140" fill="none" stroke="#00BCD4" stroke-width="2"/>
  
  <!-- Water drops -->
  <circle cx="120" cy="80" r="5" fill="#00BCD4"/>
  <circle cx="160" cy="70" r="4" fill="#00BCD4"/>
  <circle cx="200" cy="75" r="6" fill="#00BCD4"/>
  <circle cx="240" cy="70" r="4" fill="#00BCD4"/>
  <circle cx="280" cy="80" r="5" fill="#00BCD4"/>
  
  <!-- Steam -->
  <path d="M140 90 Q145 75 140 60" fill="none" stroke="#90A4AE" stroke-width="2" opacity="0.5"/>
  <path d="M200 85 Q205 70 200 55" fill="none" stroke="#90A4AE" stroke-width="2" opacity="0.5"/>
  <path d="M260 90 Q265 75 260 60" fill="none" stroke="#90A4AE" stroke-width="2" opacity="0.5"/>
  
  <!-- Safety icons -->
  <circle cx="80" cy="240" r="22" fill="#FFF" stroke="#00838F" stroke-width="2"/>
  <text x="80" y="235" text-anchor="middle" font-size="14">🌡️</text>
  <text x="80" y="255" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#333">温度</text>
  
  <circle cx="160" cy="240" r="22" fill="#FFF" stroke="#00838F" stroke-width="2"/>
  <text x="160" y="235" text-anchor="middle" font-size="14">🧼</text>
  <text x="160" y="255" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#333">清潔</text>
  
  <circle cx="240" cy="240" r="22" fill="#FFF" stroke="#00838F" stroke-width="2"/>
  <text x="240" y="235" text-anchor="middle" font-size="14">♿</text>
  <text x="240" y="255" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#333">移乗</text>
  
  <circle cx="320" cy="240" r="22" fill="#FFF" stroke="#00838F" stroke-width="2"/>
  <text x="320" y="235" text-anchor="middle" font-size="14">👀</text>
  <text x="320" y="255" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#333">見守り</text>
  
  <text x="200" y="290" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#006064">入浴・排泄ケア (Bathing & Toileting)</text>
</svg>
