<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350">
  <defs>
    <linearGradient id="bg-bath" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#FFF"/>
    </linearGradient>
  </defs>
  <rect width="600" height="350" fill="url(#bg-bath)" rx="12"/>
  <rect x="0" y="0" width="600" height="40" fill="#16A34A" rx="12"/>
  <rect x="0" y="28" width="600" height="12" fill="#16A34A"/>
  <text x="300" y="26" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#FFF">入浴介助 · Bantuan Mandi · Bathing Care</text>
  <rect x="20" y="52" width="260" height="180" rx="10" fill="#FFF" stroke="#D1FAE5" stroke-width="1"/>
  <text x="150" y="72" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#374151">入浴の準備</text>
  <text x="40" y="100" font-family="system-ui,sans-serif" font-size="10" fill="#6B7280">● 湯温を確認 (38-40°C)</text>
  <text x="40" y="118" font-family="system-ui,sans-serif" font-size="10" fill="#6B7280">● 滑り止めマット</text>
  <text x="40" y="136" font-family="system-ui,sans-serif" font-size="10" fill="#6B7280">● 必要な用品を準備</text>
  <text x="40" y="154" font-family="system-ui,sans-serif" font-size="10" fill="#6B7280">● 室温を調整 (24-26°C)</text>
  <text x="40" y="172" font-family="system-ui,sans-serif" font-size="10" fill="#6B7280">● 緊急ベルの確認</text>
  <text x="40" y="190" font-family="system-ui,sans-serif" font-size="10" fill="#6B7280">● 利用者の体調確認</text>
  <text x="40" y="208" font-family="system-ui,sans-serif" font-size="10" fill="#6B7280">● 同性の介護士が担当</text>
  <rect x="310" y="52" width="270" height="180" rx="10" fill="#FFF" stroke="#D1FAE5" stroke-width="1"/>
  <text x="445" y="72" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#374151">入浴手順</text>
  <text x="325" y="100" font-family="system-ui,sans-serif" font-size="10" fill="#374151">1. 洗髪 (Shampoo)</text>
  <text x="325" y="118" font-family="system-ui,sans-serif" font-size="10" fill="#374151">2. 体を洗う (Cuci tubuh)</text>
  <text x="325" y="136" font-family="system-ui,sans-serif" font-size="10" fill="#374151">3. すすぎ (Bilas)</text>
  <text x="325" y="154" font-family="system-ui,sans-serif" font-size="10" fill="#374151">4. 浴槽に入る (Masuk bak)</text>
  <text x="325" y="172" font-family="system-ui,sans-serif" font-size="10" fill="#374151">5. 暖める (Hangatkan)</text>
  <text x="325" y="190" font-family="system-ui,sans-serif" font-size="10" fill="#374151">6. 出る (Keluar)</text>
  <text x="325" y="208" font-family="system-ui,sans-serif" font-size="10" fill="#374151">7. 体を拭く (Keringkan)</text>
  <rect x="20" y="250" width="560" height="85" rx="10" fill="#FFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="300" y="272" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#374151">安全対策 (Keamanan)</text>
  <text x="300" y="300" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#6B7280">● 滑り防止 ● 温度管理 ● 一人で入浴しない ● 緊急対応</text>
  <text x="300" y="320" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#6B7280">Cegah tergelincir · Kelola suhu · Jangan mandi sendirian · Siap darurat</text>
</svg>