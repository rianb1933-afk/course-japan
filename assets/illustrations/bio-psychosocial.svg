<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg-bio" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF3E0"/>
      <stop offset="100%" stop-color="#FFE0B2"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg-bio)"/>
  
  <!-- Three pillars -->
  <rect x="40" y="60" width="100" height="160" rx="10" fill="#FFF" stroke="#FF9800" stroke-width="2"/>
  <text x="90" y="100" text-anchor="middle" font-size="24">🧬</text>
  <text x="90" y="130" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#E65100">身体</text>
  <text x="90" y="150" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#666">Bio</text>
  <text x="90" y="170" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#999">機能・疼痛</text>
  <text x="90" y="185" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#999">ADL・バイタル</text>
  
  <rect x="155" y="60" width="100" height="160" rx="10" fill="#FFF" stroke="#FF9800" stroke-width="2"/>
  <text x="205" y="100" text-anchor="middle" font-size="24">🧠</text>
  <text x="205" y="130" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#E65100">心理</text>
  <text x="205" y="150" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#666">Psychological</text>
  <text x="205" y="170" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#999">認知・感情</text>
  <text x="205" y="185" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#999">意欲・QOL</text>
  
  <rect x="270" y="60" width="100" height="160" rx="10" fill="#FFF" stroke="#FF9800" stroke-width="2"/>
  <text x="320" y="100" text-anchor="middle" font-size="24">👥</text>
  <text x="320" y="130" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#E65100">社会</text>
  <text x="320" y="150" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#666">Social</text>
  <text x="320" y="170" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#999">家族・地域</text>
  <text x="320" y="185" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#999">経済・環境</text>
  
  <text x="200" y="260" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#E65100">生物・心理・社会モデル</text>
  <text x="200" y="280" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#F57F17">Biopsychosocial Model</text>
</svg>
