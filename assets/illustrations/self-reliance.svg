<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg-self" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8F5E9"/>
      <stop offset="100%" stop-color="#C8E6C9"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg-self)"/>
  
  <!-- Person walking independently -->
  <circle cx="180" cy="80" r="20" fill="#FFCCBC" stroke="#D84315" stroke-width="2"/>
  <line x1="180" y1="100" x2="180" y2="155" stroke="#333" stroke-width="3"/>
  <line x1="180" y1="120" x2="155" y2="145" stroke="#333" stroke-width="3"/>
  <line x1="180" y1="120" x2="205" y2="140" stroke="#333" stroke-width="3"/>
  <line x1="180" y1="155" x2="160" y2="200" stroke="#333" stroke-width="3"/>
  <line x1="180" y1="155" x2="200" y2="200" stroke="#333" stroke-width="3"/>
  
  <!-- Support hand -->
  <path d="M230 130 L250 120 L260 130" fill="none" stroke="#4CAF50" stroke-width="3" stroke-linecap="round"/>
  <circle cx="270" cy="115" r="15" fill="#FFCCBC" stroke="#4CAF50" stroke-width="2"/>
  
  <!-- Independence symbols -->
  <circle cx="80" cy="180" r="25" fill="#FFF" stroke="#4CAF50" stroke-width="2"/>
  <text x="80" y="175" text-anchor="middle" font-size="16">🏠</text>
  <text x="80" y="195" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#333">在宅</text>
  
  <circle cx="320" cy="180" r="25" fill="#FFF" stroke="#4CAF50" stroke-width="2"/>
  <text x="320" y="175" text-anchor="middle" font-size="16">🤝</text>
  <text x="320" y="195" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#333">支援</text>
  
  <!-- Progress arrow -->
  <path d="M100 240 L300 240" fill="none" stroke="#4CAF50" stroke-width="3" marker-end="url(#arrow-self)"/>
  <defs><marker id="arrow-self" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4CAF50"/></marker></defs>
  <text x="200" y="235" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1B5E20">自立 → 社会参加</text>
  
  <text x="200" y="275" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1B5E20">自立支援 (Self-Reliance)</text>
</svg>
