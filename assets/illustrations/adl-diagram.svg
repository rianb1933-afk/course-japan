<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F3E5F5"/>
      <stop offset="100%" stop-color="#E1BEE7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg4)"/>
  
  <!-- 5 ADL Icons -->
  <!-- Eating -->
  <circle cx="80" cy="80" r="30" fill="#FFF" stroke="#7B1FA2" stroke-width="2"/>
  <text x="80" y="75" text-anchor="middle" font-size="20">🍽️</text>
  <text x="80" y="95" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">食事</text>
  
  <!-- Dressing -->
  <circle cx="160" cy="80" r="30" fill="#FFF" stroke="#7B1FA2" stroke-width="2"/>
  <text x="160" y="75" text-anchor="middle" font-size="20">👔</text>
  <text x="160" y="95" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">更衣</text>
  
  <!-- Bathing -->
  <circle cx="240" cy="80" r="30" fill="#FFF" stroke="#7B1FA2" stroke-width="2"/>
  <text x="240" y="75" text-anchor="middle" font-size="20">🛁</text>
  <text x="240" y="95" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">入浴</text>
  
  <!-- Toileting -->
  <circle cx="320" cy="80" r="30" fill="#FFF" stroke="#7B1FA2" stroke-width="2"/>
  <text x="320" y="75" text-anchor="middle" font-size="20">🚽</text>
  <text x="320" y="95" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">排泄</text>
  
  <!-- Mobility -->
  <circle cx="200" cy="180" r="30" fill="#FFF" stroke="#7B1FA2" stroke-width="2"/>
  <text x="200" y="175" text-anchor="middle" font-size="20">🚶</text>
  <text x="200" y="195" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">移動</text>
  
  <!-- Connecting lines -->
  <line x1="110" y1="80" x2="130" y2="80" stroke="#CE93D8" stroke-width="2"/>
  <line x1="190" y1="80" x2="210" y2="80" stroke="#CE93D8" stroke-width="2"/>
  <line x1="270" y1="80" x2="290" y2="80" stroke="#CE93D8" stroke-width="2"/>
  <line x1="160" y1="110" x2="180" y2="150" stroke="#CE93D8" stroke-width="2"/>
  <line x1="240" y1="110" x2="220" y2="150" stroke="#CE93D8" stroke-width="2"/>
  
  <text x="200" y="250" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#4A148C">日常生活動作 (ADL)</text>
  <text x="200" y="275" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6A1B9A">Activities of Daily Living</text>
</svg>
