<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg7" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF8E1"/>
      <stop offset="100%" stop-color="#FFECB3"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg7)"/>
  
  <!-- Brain outline -->
  <path d="M200 60 C240 60, 280 80, 280 120 C280 160, 250 180, 220 180 C230 160, 220 140, 200 140 C180 140, 170 160, 180 180 C150 180, 120 160, 120 120 C120 80, 160 60, 200 60Z" fill="none" stroke="#F9A825" stroke-width="2"/>
  
  <!-- Puzzle pieces missing -->
  <path d="M170 90 L190 90 L190 110 L170 110Z" fill="none" stroke="#E65100" stroke-width="2" stroke-dasharray="4,2"/>
  <path d="M210 100 L230 100 L230 120 L210 120Z" fill="none" stroke="#E65100" stroke-width="2" stroke-dasharray="4,2"/>
  <path d="M185 120 L215 120 L215 150 L185 150Z" fill="none" stroke="#E65100" stroke-width="2" stroke-dasharray="4,2"/>
  
  <!-- Memory icons fading -->
  <text x="80" y="200" font-size="20" opacity="0.3">📷</text>
  <text x="120" y="190" font-size="20" opacity="0.5">📅</text>
  <text x="160" y="200" font-size="20" opacity="0.7">👨‍👩‍👧</text>
  <text x="240" y="200" font-size="20" opacity="0.9">🏠</text>
  <text x="280" y="190" font-size="20" opacity="1.0">❤️</text>
  
  <!-- Communication support -->
  <rect x="120" y="220" width="160" height="40" rx="8" fill="#FFF" stroke="#F9A825" stroke-width="2"/>
  <text x="200" y="245" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#E65100">声かけ・コミュニケーション</text>
  
  <text x="200" y="285" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#F57F17">認知症ケア (Dementia Care)</text>
</svg>
