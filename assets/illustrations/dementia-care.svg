<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
    <filter id="sh6" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>
  <rect width="600" height="400" rx="20" fill="url(#bg6)"/>
  
  <!-- Brain outline -->
  <path d="M200 80 C160 80, 120 100, 120 150 C120 200, 150 230, 180 240 C170 220, 165 200, 170 180 C175 160, 190 145, 200 145 C210 145, 225 160, 230 180 C235 200, 230 220, 220 240 C250 230, 280 200, 280 150 C280 100, 240 80, 200 80Z" fill="#FFF" stroke="#D97706" stroke-width="2"/>
  
  <!-- Puzzle pieces (memory loss visualization) -->
  <rect x="155" y="110" width="20" height="20" rx="2" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="3,2"/>
  <rect x="180" y="110" width="20" height="20" rx="2" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
  <rect x="205" y="110" width="20" height="20" rx="2" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="3,2"/>
  <rect x="155" y="135" width="20" height="20" rx="2" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
  <rect x="180" y="135" width="20" height="20" rx="2" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="3,2"/>
  <rect x="205" y="135" width="20" height="20" rx="2" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
  
  <text x="200" y="185" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#92400E">記憶の欠落</text>
  
  <!-- Communication tips -->
  <rect x="310" y="40" width="260" height="150" rx="14" fill="#FFF" filter="url(#sh6)"/>
  <text x="440" y="68" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1E40AF">声かけのコツ</text>
  
  <text x="330" y="95" font-family="sans-serif" font-size="10" fill="#334155">✓ 短く・ゆっくり話す</text>
  <text x="330" y="115" font-family="sans-serif" font-size="10" fill="#334155">✓ 一度に一つのこと</text>
  <text x="330" y="135" font-family="sans-serif" font-size="10" fill="#334155">✓ 肯定から始める</text>
  <text x="330" y="155" font-family="sans-serif" font-size="10" fill="#334155">✓ 指差さず、なだらかな表現</text>
  <text x="330" y="175" font-family="sans-serif" font-size="10" fill="#16A34A" font-weight="bold">✓ 感情を受け止める</text>
  
  <!-- BPSD management -->
  <rect x="310" y="210" width="260" height="160" rx="14" fill="#FFF" filter="url(#sh6)"/>
  <text x="440" y="238" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#7C3AED">BPSD対応</text>
  
  <rect x="325" y="250" width="110" height="45" rx="8" fill="#EDE9FE"/>
  <text x="380" y="268" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#6D28D9">行動・心理症状</text>
  <text x="380" y="283" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#64748B">BPSD</text>
  
  <rect x="445" y="250" width="110" height="45" rx="8" fill="#F0FDF4"/>
  <text x="500" y="268" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#166534">薬物療法</text>
  <text x="500" y="283" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#64748B">デリリウム</text>
  
  <text x="330" y="315" font-family="sans-serif" font-size="9" fill="#334155">• 焦燥感・興奮 → 安全確保</text>
  <text x="330" y="332" font-family="sans-serif" font-size="9" fill="#334155">• 徘徊 → 環境整備</text>
  <text x="330" y="349" font-family="sans-serif" font-size="9" fill="#334155">• 妄想 → 否定しない</text>
  <text x="330" y="366" font-family="sans-serif" font-size="9" fill="#334155">• 夜間不安 → 安らかな環境</text>
  
  <!-- Stages -->
  <rect x="30" y="260" width="260" height="110" rx="14" fill="#FFF" filter="url(#sh6)"/>
  <text x="160" y="288" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#92400E">認知症の進行</text>
  
  <rect x="45" y="300" width="70" height="30" rx="6" fill="#FEF3C7"/>
  <text x="80" y="319" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#92400E">初期</text>
  <rect x="125" y="300" width="70" height="30" rx="6" fill="#FED7AA"/>
  <text x="160" y="319" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#92400E">中期</text>
  <rect x="205" y="300" width="70" height="30" rx="6" fill="#FECACA"/>
  <text x="240" y="319" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#991B1B">末期</text>
  
  <text x="160" y="355" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748B">早期発見・早期介入が重要</text>
</svg>
