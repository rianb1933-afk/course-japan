<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg-dem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F5F3FF"/>
    </linearGradient>
    <filter id="shadow-md" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.12"/>
    </filter>
  </defs>
  
  <rect width="800" height="450" fill="url(#bg-dem)" rx="16"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="800" height="56" fill="#7C3AED" rx="16"/>
  <rect x="0" y="40" width="800" height="16" fill="#7C3AED"/>
  <circle cx="40" cy="28" r="18" fill="rgba(255,255,255,0.15)"/>
  <text x="40" y="33" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16">🧠</text>
  <text x="70" y="34" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#FFF">認知症ケア · Demensia · Dementia Care</text>
  
  <!-- Left: Brain Understanding -->
  <rect x="24" y="72" width="370" height="350" rx="12" fill="#FFF" filter="url(#shadow-md)"/>
  <rect x="24" y="72" width="370" height="44" rx="12" fill="#F5F3FF"/>
  <rect x="24" y="104" width="370" height="12" fill="#F5F3FF"/>
  <text x="209" y="100" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#7C3AED">認知症の理解 (Memahami Demensia)</text>
  
  <!-- Brain Diagram -->
  <ellipse cx="209" cy="200" rx="100" ry="75" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
  <!-- Puzzle pieces (some missing) -->
  <rect x="140" y="155" width="35" height="30" rx="4" fill="#C4B5FD" stroke="#7C3AED" stroke-width="1"/>
  <rect x="180" y="155" width="35" height="30" rx="4" fill="#C4B5FD" stroke="#7C3AED" stroke-width="1"/>
  <rect x="220" y="155" width="35" height="30" rx="4" fill="#DDD6FE" stroke="#7C3AED" stroke-width="1" stroke-dasharray="4,2"/>
  <rect x="140" y="190" width="35" height="30" rx="4" fill="#C4B5FD" stroke="#7C3AED" stroke-width="1"/>
  <rect x="180" y="190" width="35" height="30" rx="4" fill="#DDD6FE" stroke="#7C3AED" stroke-width="1" stroke-dasharray="4,2"/>
  <rect x="220" y="190" width="35" height="30" rx="4" fill="#C4B5FD" stroke="#7C3AED" stroke-width="1"/>
  <rect x="140" y="225" width="35" height="30" rx="4" fill="#DDD6FE" stroke="#7C3AED" stroke-width="1" stroke-dasharray="4,2"/>
  <rect x="180" y="225" width="35" height="30" rx="4" fill="#C4B5FD" stroke="#7C3AED" stroke-width="1"/>
  <rect x="220" y="225" width="35" height="30" rx="4" fill="#C4B5FD" stroke="#7C3AED" stroke-width="1"/>
  
  <text x="209" y="300" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#7C3AED">記憶の欠片 (Potongan Memori)</text>
  <text x="209" y="316" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#6B7280">虚線 = 記憶が消えている</text>
  
  <!-- Types of Dementia -->
  <rect x="40" y="330" width="338" height="76" rx="8" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="1"/>
  <text x="209" y="350" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#374151">認知症の種類</text>
  <text x="100" y="370" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#6B7280">アルツハイマー</text>
  <text x="100" y="386" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#6B7280">60-70%</text>
  <text x="209" y="370" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#6B7280">血管性</text>
  <text x="209" y="386" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#6B7280">15-20%</text>
  <text x="318" y="370" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#6B7280">其他</text>
  <text x="318" y="386" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#6B7280">10-15%</text>
  
  <!-- Right: Communication Tips -->
  <rect x="406" y="72" width="370" height="180" rx="12" fill="#FFF" filter="url(#shadow-md)"/>
  <rect x="406" y="72" width="370" height="44" rx="12" fill="#F5F3FF"/>
  <rect x="406" y="104" width="370" height="12" fill="#F5F3FF"/>
  <text x="591" y="100" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#7C3AED">コミュニケーションTips</text>
  
  <rect x="422" y="120" width="338" height="30" rx="6" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
  <text x="434" y="140" font-family="system-ui,sans-serif" font-size="10" fill="#16A34A">✓ 短い文で話す</text>
  
  <rect x="422" y="156" width="338" height="30" rx="6" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
  <text x="434" y="176" font-family="system-ui,sans-serif" font-size="10" fill="#16A34A">✓ 1つのことだけお願いする</text>
  
  <rect x="422" y="192" width="338" height="30" rx="6" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
  <text x="434" y="212" font-family="system-ui,sans-serif" font-size="10" fill="#16A34A">✓ 否定しない・責めない</text>
  
  <rect x="422" y="228" width="338" height="30" rx="6" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
  <text x="434" y="248" font-family="system-ui,sans-serif" font-size="10" fill="#DC2626">✗ 「覚えてる？」と聞かない</text>
  
  <!-- Right: BPSD -->
  <rect x="406" y="264" width="370" height="158" rx="12" fill="#FFF" filter="url(#shadow-md)"/>
  <rect x="406" y="264" width="370" height="44" rx="12" fill="#F5F3FF"/>
  <rect x="406" y="296" width="370" height="12" fill="#F5F3FF"/>
  <text x="591" y="292" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#7C3AED">BPSD (行動・心理症状)</text>
  
  <rect x="422" y="316" width="100" height="48" rx="6" fill="#FFF" stroke="#FECACA" stroke-width="1"/>
  <text x="472" y="336" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#DC2626">徘徊</text>
  <text x="472" y="352" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#6B7280">Berkeliling</text>
  
  <rect x="534" y="316" width="100" height="48" rx="6" fill="#FFF" stroke="#FEF3C7" stroke-width="1"/>
  <text x="584" y="336" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#D97706">妄想</text>
  <text x="584" y="352" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#6B7280">Waham</text>
  
  <rect x="646" y="316" width="100" height="48" rx="6" fill="#FFF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="696" y="336" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#2563EB">不穏</text>
  <text x="696" y="352" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#6B7280">Tidak Tenang</text>
  
  <rect x="422" y="372" width="100" height="40" rx="6" fill="#FFF" stroke="#E9D5FF" stroke-width="1"/>
  <text x="472" y="392" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#7C3AED">興奮</text>
  <text x="472" y="406" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#6B7280">Gelisah</text>
  
  <rect x="534" y="372" width="100" height="40" rx="6" fill="#FFF" stroke="#D1FAE5" stroke-width="1"/>
  <text x="584" y="392" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#16A34A">介護</text>
  <text x="584" y="406" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#6B7280">Perawatan</text>
</svg>
