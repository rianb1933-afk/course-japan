<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350">
  <defs>
    <linearGradient id="bg-dem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5F3FF"/>
      <stop offset="100%" stop-color="#FFF"/>
    </linearGradient>
  </defs>
  <rect width="600" height="350" fill="url(#bg-dem)" rx="12"/>
  
  <rect x="0" y="0" width="600" height="40" fill="#7C3AED" rx="12"/>
  <rect x="0" y="28" width="600" height="12" fill="#7C3AED"/>
  <text x="300" y="26" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#FFF">認知症ケア · Perawatan Demensia · Dementia Care</text>
  
  <!-- Left: Brain with missing pieces -->
  <rect x="20" y="52" width="260" height="180" rx="10" fill="#FFF" stroke="#E9D5FF" stroke-width="1"/>
  <text x="150" y="72" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#374151">認知症の理解</text>
  
  <!-- Brain outline -->
  <ellipse cx="150" cy="140" rx="80" ry="60" fill="#F3E8FF" stroke="#7C3AED" stroke-width="2"/>
  <!-- Puzzle pieces (some missing) -->
  <rect x="100" y="100" width="30" height="25" rx="4" fill="#C4B5FD" stroke="#7C3AED" stroke-width="1"/>
  <rect x="135" y="100" width="30" height="25" rx="4" fill="#C4B5FD" stroke="#7C3AED" stroke-width="1"/>
  <rect x="170" y="100" width="30" height="25" rx="4" fill="#DDD6FE" stroke="#7C3AED" stroke-width="1" stroke-dasharray="4,2"/>
  <rect x="100" y="130" width="30" height="25" rx="4" fill="#C4B5FD" stroke="#7C3AED" stroke-width="1"/>
  <rect x="135" y="130" width="30" height="25" rx="4" fill="#DDD6FE" stroke="#7C3AED" stroke-width="1" stroke-dasharray="4,2"/>
  <rect x="170" y="130" width="30" height="25" rx="4" fill="#C4B5FD" stroke="#7C3AED" stroke-width="1"/>
  
  <text x="150" y="180" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#7C3AED">記憶の欠片 (Potongan Memori)</text>
  <text x="150" y="196" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#6B7280">虚線 = 記憶が消えている</text>
  
  <!-- Right: Communication Tips -->
  <rect x="310" y="52" width="270" height="180" rx="10" fill="#FFF" stroke="#E9D5FF" stroke-width="1"/>
  <text x="445" y="72" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#374151">コミュニケーションTips</text>
  
  <rect x="325" y="82" width="240" height="28" rx="6" fill="#F0FDF4" stroke="#BBF7D0"/>
  <text x="337" y="100" font-family="system-ui,sans-serif" font-size="9" fill="#16A34A">✓ 短い文で話す</text>
  
  <rect x="325" y="115" width="240" height="28" rx="6" fill="#F0FDF4" stroke="#BBF7D0"/>
  <text x="337" y="133" font-family="system-ui,sans-serif" font-size="9" fill="#16A34A">✓ 1つのことだけお願いする</text>
  
  <rect x="325" y="148" width="240" height="28" rx="6" fill="#F0FDF4" stroke="#BBF7D0"/>
  <text x="337" y="166" font-family="system-ui,sans-serif" font-size="9" fill="#16A34A">✓ 否定しない・責めない</text>
  
  <rect x="325" y="181" width="240" height="28" rx="6" fill="#FEF2F2" stroke="#FECACA"/>
  <text x="337" y="199" font-family="system-ui,sans-serif" font-size="9" fill="#DC2626">✗ 「覚えてる？」と聞かない</text>
  
  <rect x="325" y="214" width="240" height="28" rx="6" fill="#FEF2F2" stroke="#FECACA"/>
  <text x="337" y="232" font-family="system-ui,sans-serif" font-size="9" fill="#DC2626">✗ 「違うよ」と訂正しない</text>
  
  <!-- Bottom: BPSD -->
  <rect x="20" y="250" width="560" height="85" rx="10" fill="#FFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="300" y="272" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#374151">BPSD (行動・心理症状)</text>
  
  <rect x="40" y="282" width="100" height="42" rx="6" fill="#FFF" stroke="#FECACA"/>
  <text x="90" y="300" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="600" fill="#DC2626">徘徊</text>
  <text x="90" y="316" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#6B7280">Berkeliling</text>
  
  <rect x="155" y="282" width="100" height="42" rx="6" fill="#FFF" stroke="#FEF3C7"/>
  <text x="205" y="300" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="600" fill="#D97706">妄想</text>
  <text x="205" y="316" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#6B7280">Waham</text>
  
  <rect x="270" y="282" width="100" height="42" rx="6" fill="#FFF" stroke="#BFDBFE"/>
  <text x="320" y="300" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="600" fill="#2563EB">不穏</text>
  <text x="320" y="316" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#6B7280">Tidak Tenang</text>
  
  <rect x="385" y="282" width="100" height="42" rx="6" fill="#FFF" stroke="#E9D5FF"/>
  <text x="435" y="300" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="600" fill="#7C3AED">興奮</text>
  <text x="435" y="316" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#6B7280">Gelisah</text>
  
  <rect x="500" y="282" width="70" height="42" rx="6" fill="#FFF" stroke="#D1FAE5"/>
  <text x="535" y="300" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="600" fill="#16A34A">介護</text>
  <text x="535" y="316" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#6B7280">Perawatan</text>
</svg>