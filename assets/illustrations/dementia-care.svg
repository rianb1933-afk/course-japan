<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350">
  <rect width="600" height="350" fill="#FFF"/>
  
  <!-- Title -->
  <rect x="0" y="0" width="600" height="36" fill="#D97706"/>
  <text x="300" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#FFF">認知症ケア · Dementia Care</text>
  
  <!-- Brain -->
  <path d="M120 80 C90 80, 60 100, 60 135 C60 170, 80 190, 110 200 C100 185, 95 165, 100 145 C105 125, 120 115, 130 115 C140 115, 155 125, 160 145 C165 165, 160 185, 150 200 C180 190, 200 170, 200 135 C200 100, 170 80, 140 80Z" fill="#FFF" stroke="#D97706" stroke-width="1.5"/>
  
  <!-- Memory gaps -->
  <rect x="90" y="110" width="12" height="12" rx="2" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="2,2"/>
  <rect x="108" y="110" width="12" height="12" rx="2" fill="#FEF3C7"/>
  <rect x="126" y="110" width="12" height="12" rx="2" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="2,2"/>
  <rect x="90" y="128" width="12" height="12" rx="2" fill="#FEF3C7"/>
  <rect x="108" y="128" width="12" height="12" rx="2" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="2,2"/>
  <rect x="126" y="128" width="12" height="12" rx="2" fill="#FEF3C7"/>
  
  <text x="130" y="160" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#92400E">記憶の欠落</text>
  
  <!-- Communication tips -->
  <rect x="220" y="52" width="160" height="140" rx="6" fill="#F9FAFB" stroke="#E5E7EB"/>
  <text x="300" y="74" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#0369A1">声かけのコツ</text>
  
  <text x="236" y="98" font-family="system-ui, sans-serif" font-size="8" fill="#16A34A">✓ 短く・ゆっくり</text>
  <text x="236" y="114" font-family="system-ui, sans-serif" font-size="8" fill="#16A34A">✓ 一度に一つ</text>
  <text x="236" y="130" font-family="system-ui, sans-serif" font-size="8" fill="#16A34A">✓ 肯定から始める</text>
  <text x="236" y="146" font-family="system-ui, sans-serif" font-size="8" fill="#16A34A">✓ 感情を受け止める</text>
  <text x="236" y="162" font-family="system-ui, sans-serif" font-size="8" fill="#DC2626">✗ 質問責めしない</text>
  <text x="236" y="178" font-family="system-ui, sans-serif" font-size="8" fill="#DC2626">✗ 否定しない</text>
  
  <!-- BPSD -->
  <rect x="396" y="52" width="180" height="140" rx="6" fill="#F9FAFB" stroke="#E5E7EB"/>
  <text x="486" y="74" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#7C3AED">BPSD対応</text>
  
  <text x="412" y="98" font-family="system-ui, sans-serif" font-size="8" fill="#374155">• 焦燥感 → 安全確保</text>
  <text x="412" y="114" font-family="system-ui, sans-serif" font-size="8" fill="#374155">• 徘徊 → 環境整備</text>
  <text x="412" y="130" font-family="system-ui, sans-serif" font-size="8" fill="#374155">• 妄想 → 否定しない</text>
  <text x="412" y="146" font-family="system-ui, sans-serif" font-size="8" fill="#374155">• 夜間不安 → 安らかな環境</text>
  <text x="412" y="162" font-family="system-ui, sans-serif" font-size="8" fill="#374155">• 攻撃 → 危険回避</text>
  <text x="412" y="178" font-family="system-ui, sans-serif" font-size="8" fill="#374155">• 失禁 → 経口摂取確認</text>
  
  <!-- Stages -->
  <rect x="24" y="210" width="560" height="120" rx="6" fill="#F9FAFB" stroke="#E5E7EB"/>
  <text x="304" y="232" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#D97706">認知症の進行と対応</text>
  
  <rect x="40" y="244" width="168" height="66" rx="4" fill="#FEF3C7"/>
  <text x="124" y="264" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#92400E">初期 (軽度)</text>
  <text x="124" y="280" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#6B7280">物忘れ・同じ質問</text>
  <text x="124" y="296" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#16A34A">→ 日課を維持</text>
  
  <rect x="220" y="244" width="168" height="66" rx="4" fill="#FED7AA"/>
  <text x="304" y="264" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#9A3412">中期 (中等度)</text>
  <text x="304" y="280" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#6B7280">見当識障害・BPSD</text>
  <text x="304" y="296" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#16A34A">→ 安全環境整備</text>
  
  <rect x="400" y="244" width="168" height="66" rx="4" fill="#FECACA"/>
  <text x="484" y="264" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#991B1B">末期 (重度)</text>
  <text x="484" y="280" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#6B7280">嚥下困難・寝たきり</text>
  <text x="484" y="296" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#16A34A">→ ターミナルケア</text>
</svg>
