<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350">
  <rect width="600" height="350" rx="12" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1"/>
  
  <!-- Title -->
  <rect x="0" y="0" width="600" height="40" rx="12" fill="#D97706"/>
  <rect x="0" y="20" width="600" height="20" fill="#D97706"/>
  <text x="300" y="27" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFF">認知症ケア · Dementia Care · Perawatan Demensia</text>
  
  <!-- Brain (simple) -->
  <path d="M150 80 C120 80, 90 100, 90 140 C90 180, 110 200, 140 210 C130 195, 125 175, 130 155 C135 135, 150 125, 160 125 C170 125, 185 135, 190 155 C195 175, 190 195, 180 210 C210 200, 230 180, 230 140 C230 100, 200 80, 170 80Z" fill="#FFF" stroke="#D97706" stroke-width="1.5"/>
  
  <!-- Memory gaps -->
  <rect x="115" y="110" width="15" height="15" rx="2" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="2,2"/>
  <rect x="135" y="110" width="15" height="15" rx="2" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
  <rect x="155" y="110" width="15" height="15" rx="2" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="2,2"/>
  <rect x="115" y="130" width="15" height="15" rx="2" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
  <rect x="135" y="130" width="15" height="15" rx="2" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="2,2"/>
  <rect x="155" y="130" width="15" height="15" rx="2" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
  
  <text x="160" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#92400E">記憶の欠落</text>
  
  <!-- Communication tips -->
  <rect x="250" y="55" width="160" height="140" rx="8" fill="#FFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="330" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0369A1">声かけのコツ</text>
  <line x1="260" y1="82" x2="400" y2="82" stroke="#E5E7EB" stroke-width="1"/>
  
  <text x="265" y="102" font-family="Arial, sans-serif" font-size="9" fill="#16A34A">✓ 短く・ゆっくり</text>
  <text x="265" y="118" font-family="Arial, sans-serif" font-size="9" fill="#16A34A">✓ 一度に一つ</text>
  <text x="265" y="134" font-family="Arial, sans-serif" font-size="9" fill="#16A34A">✓ 肯定から始める</text>
  <text x="265" y="150" font-family="Arial, sans-serif" font-size="9" fill="#16A34A">✓ 感情を受け止める</text>
  <text x="265" y="166" font-family="Arial, sans-serif" font-size="9" fill="#DC2626">✗ 質問責めしない</text>
  <text x="265" y="182" font-family="Arial, sans-serif" font-size="9" fill="#DC2626">✗ 否定しない</text>
  
  <!-- BPSD -->
  <rect x="425" y="55" width="155" height="140" rx="8" fill="#FFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="502" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#7C3AED">BPSD対応</text>
  <line x1="435" y1="82" x2="570" y2="82" stroke="#E5E7EB" stroke-width="1"/>
  
  <text x="440" y="102" font-family="Arial, sans-serif" font-size="9" fill="#374151">• 焦燥感 → 安全確保</text>
  <text x="440" y="118" font-family="Arial, sans-serif" font-size="9" fill="#374151">• 徘徊 → 環境整備</text>
  <text x="440" y="134" font-family="Arial, sans-serif" font-size="9" fill="#374151">• 妄想 → 否定しない</text>
  <text x="440" y="150" font-family="Arial, sans-serif" font-size="9" fill="#374151">• 夜間不安 → 安らかな環境</text>
  <text x="440" y="166" font-family="Arial, sans-serif" font-size="9" fill="#374151">• 攻撃 → 危険回避</text>
  <text x="440" y="182" font-family="Arial, sans-serif" font-size="9" fill="#374151">• 失禁 → 経口摂取確認</text>
  
  <!-- Stages -->
  <rect x="20" y="210" width="560" height="120" rx="8" fill="#FFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="300" y="232" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#D97706">認知症の進行と対応</text>
  <line x1="30" y1="240" x2="570" y2="240" stroke="#E5E7EB" stroke-width="1"/>
  
  <rect x="40" y="250" width="160" height="60" rx="6" fill="#FEF3C7"/>
  <text x="120" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#92400E">初期 (軽度)</text>
  <text x="120" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#6B7280">物忘れ・同じ質問</text>
  <text x="120" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#6B7280">→ 日課を維持</text>
  
  <rect x="220" y="250" width="160" height="60" rx="6" fill="#FED7AA"/>
  <text x="300" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#9A3412">中期 (中等度)</text>
  <text x="300" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#6B7280">見当識障害・BPSD</text>
  <text x="300" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#6B7280">→ 安全環境整備</text>
  
  <rect x="400" y="250" width="160" height="60" rx="6" fill="#FECACA"/>
  <text x="480" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#991B1B">末期 (重度)</text>
  <text x="480" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#6B7280">嚥下困難・寝たきり</text>
  <text x="480" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#6B7280">→ ターミナルケア</text>
</svg>
