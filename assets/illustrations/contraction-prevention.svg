<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg-contr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8F5E9"/>
      <stop offset="100%" stop-color="#C8E6C9"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg-contr)"/>
  
  <!-- Joint / Bone illustration -->
  <ellipse cx="180" cy="120" rx="30" ry="15" fill="#FFF" stroke="#4CAF50" stroke-width="2"/>
  <ellipse cx="220" cy="120" rx="30" ry="15" fill="#FFF" stroke="#4CAF50" stroke-width="2"/>
  <circle cx="200" cy="120" r="8" fill="#C8E6C9" stroke="#4CAF50" stroke-width="2"/>
  
  <!-- ROM arrow -->
  <path d="M170 100 Q200 70 230 100" fill="none" stroke="#4CAF50" stroke-width="2" marker-end="url(#arrow-contr)"/>
  <defs><marker id="arrow-contr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4CAF50"/></marker></defs>
  
  <!-- Exercise types -->
  <circle cx="80" cy="200" r="25" fill="#FFF" stroke="#4CAF50" stroke-width="2"/>
  <text x="80" y="195" text-anchor="middle" font-size="16">🤲</text>
  <text x="80" y="215" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#333">自動運動</text>
  
  <circle cx="160" cy="200" r="25" fill="#FFF" stroke="#4CAF50" stroke-width="2"/>
  <text x="160" y="195" text-anchor="middle" font-size="16">🤝</text>
  <text x="160" y="215" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#333">他動運動</text>
  
  <circle cx="240" cy="200" r="25" fill="#FFF" stroke="#4CAF50" stroke-width="2"/>
  <text x="240" y="195" text-anchor="middle" font-size="16">🏋️</text>
  <text x="240" y="215" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#333">抵抗運動</text>
  
  <circle cx="320" cy="200" r="25" fill="#FFF" stroke="#4CAF50" stroke-width="2"/>
  <text x="320" y="195" text-anchor="middle" font-size="16">🧘</text>
  <text x="320" y="215" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#333">ストレッチ</text>
  
  <text x="200" y="260" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1B5E20">拘縮予防 (Contraction Prevention)</text>
</svg>
