<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350">
  <defs>
    <linearGradient id="bg-pk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FEF2F2"/>
      <stop offset="100%" stop-color="#FFF"/>
    </linearGradient>
  </defs>
  <rect width="600" height="350" fill="url(#bg-pk)" rx="12"/>
  <rect x="0" y="0" width="600" height="40" fill="#DC2626" rx="12"/>
  <rect x="0" y="28" width="600" height="12" fill="#DC2626"/>
  <text x="300" y="26" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#FFF">パーキンソンケア · Parkinson Care</text>
  <rect x="20" y="52" width="260" height="180" rx="10" fill="#FFF" stroke="#FECACA" stroke-width="1"/>
  <text x="150" y="72" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#374151">症状の理解</text>
  <text x="40" y="100" font-family="system-ui,sans-serif" font-size="10" fill="#6B7280">● 振戦 (tremor)</text>
  <text x="40" y="118" font-family="system-ui,sans-serif" font-size="10" fill="#6B7280">● 筋固縮 (rigiditas)</text>
  <text x="40" y="136" font-family="system-ui,sans-serif" font-size="10" fill="#6B7280">● 動作緩慢 (Bradykinesia)</text>
  <text x="40" y="154" font-family="system-ui,sans-serif" font-size="10" fill="#6B7280">● 姿勢反射障害</text>
  <text x="40" y="172" font-family="system-ui,sans-serif" font-size="10" fill="#6B7280">● 歩行障害</text>
  <text x="40" y="190" font-family="system-ui,sans-serif" font-size="10" fill="#6B7280">● 言語障害</text>
  <text x="40" y="208" font-family="system-ui,sans-serif" font-size="10" fill="#6B7280">● 自律神経障害</text>
  <rect x="310" y="52" width="270" height="180" rx="10" fill="#FFF" stroke="#FECACA" stroke-width="1"/>
  <text x="445" y="72" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#374151">ケアのポイント</text>
  <text x="325" y="100" font-family="system-ui,sans-serif" font-size="10" fill="#374151">● 転倒予防</text>
  <text x="325" y="118" font-family="system-ui,sans-serif" font-size="10" fill="#374151">● 安全な移動</text>
  <text x="325" y="136" font-family="system-ui,sans-serif" font-size="10" fill="#374151">● 薬の管理</text>
  <text x="325" y="154" font-family="system-ui,sans-serif" font-size="10" fill="#374151">● 運動療法</text>
  <text x="325" y="172" font-family="system-ui,sans-serif" font-size="10" fill="#374151">● 栄養管理</text>
  <text x="325" y="190" font-family="system-ui,sans-serif" font-size="10" fill="#374151">● 認知対策</text>
  <text x="325" y="208" font-family="system-ui,sans-serif" font-size="10" fill="#374151">● 家族教育</text>
  <rect x="20" y="250" width="560" height="85" rx="10" fill="#FFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="300" y="272" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#374151">ポイント</text>
  <text x="300" y="300" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#6B7280">● 転倒に注意 ● 薬の効果時間を確認 ● 無理をさせない</text>
</svg>