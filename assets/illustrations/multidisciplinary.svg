<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg-team" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E0F7FA"/>
      <stop offset="100%" stop-color="#B2EBF2"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg-team)"/>
  
  <!-- Team members around table -->
  <rect x="120" y="120" width="160" height="60" rx="10" fill="#FFF" stroke="#00838F" stroke-width="2"/>
  
  <!-- People -->
  <circle cx="100" cy="100" r="18" fill="#FFCCBC" stroke="#00838F" stroke-width="2"/>
  <text x="100" y="104" text-anchor="middle" font-size="10" fill="#333">PT</text>
  
  <circle cx="200" cy="80" r="18" fill="#FFCCBC" stroke="#00838F" stroke-width="2"/>
  <text x="200" y="84" text-anchor="middle" font-size="10" fill="#333">OT</text>
  
  <circle cx="300" cy="100" r="18" fill="#FFCCBC" stroke="#00838F" stroke-width="2"/>
  <text x="300" y="104" text-anchor="middle" font-size="10" fill="#333">ST</text>
  
  <circle cx="100" cy="200" r="18" fill="#FFCCBC" stroke="#00838F" stroke-width="2"/>
  <text x="100" y="204" text-anchor="middle" font-size="10" fill="#333">護</text>
  
  <circle cx="300" cy="200" r="18" fill="#FFCCBC" stroke="#00838F" stroke-width="2"/>
  <text x="300" y="204" text-anchor="middle" font-size="10" fill="#333">医</text>
  
  <!-- Connection lines to center -->
  <line x1="118" y1="100" x2="180" y2="130" stroke="#00BCD4" stroke-width="1.5"/>
  <line x1="200" y1="98" x2="200" y2="120" stroke="#00BCD4" stroke-width="1.5"/>
  <line x1="282" y1="100" x2="220" y2="130" stroke="#00BCD4" stroke-width="1.5"/>
  <line x1="118" y1="200" x2="180" y2="170" stroke="#00BCD4" stroke-width="1.5"/>
  <line x1="282" y1="200" x2="220" y2="170" stroke="#00BCD4" stroke-width="1.5"/>
  
  <!-- Center patient -->
  <circle cx="200" cy="150" r="15" fill="#E0F7FA" stroke="#00838F" stroke-width="2"/>
  <text x="200" y="154" text-anchor="middle" font-size="12">🧑</text>
  
  <text x="200" y="260" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#006064">多職種連携 (Team Care)</text>
  <text x="200" y="280" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#00838F">PT・OT・ST・介護・医師</text>
</svg>
