<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350">
  <rect width="600" height="350" rx="12" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1"/>
  
  <!-- Title -->
  <rect x="0" y="0" width="600" height="40" rx="12" fill="#B45309"/>
  <rect x="0" y="20" width="600" height="20" fill="#B45309"/>
  <text x="300" y="27" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFF">バイタルサイン · Vital Signs · Tanda Vital</text>
  
  <!-- Heart Rate -->
  <rect x="20" y="55" width="130" height="90" rx="8" fill="#FFF" stroke="#E5E7EB" stroke-width="1"/>
  <circle cx="45" cy="80" r="12" fill="#FEE2E2"/>
  <text x="45" y="84" text-anchor="middle" font-size="12" fill="#DC2626">♥</text>
  <text x="75" y="80" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#DC2626">72</text>
  <text x="105" y="80" font-family="Arial, sans-serif" font-size="10" fill="#9CA3AF">bpm</text>
  <line x1="30" y1="95" x2="140" y2="95" stroke="#E5E7EB" stroke-width="1"/>
  <text x="85" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6B7280">脈拍 (60-100)</text>
  <text x="85" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#9CA3AF">Heart Rate</text>
  
  <!-- Blood Pressure -->
  <rect x="165" y="55" width="130" height="90" rx="8" fill="#FFF" stroke="#E5E7EB" stroke-width="1"/>
  <circle cx="190" cy="80" r="12" fill="#DBEAFE"/>
  <text x="190" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#2563EB">BP</text>
  <text x="220" y="80" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2563EB">120</text>
  <text x="265" y="80" font-family="Arial, sans-serif" font-size="14" fill="#9CA3AF">/ 80</text>
  <line x1="175" y1="95" x2="285" y2="95" stroke="#E5E7EB" stroke-width="1"/>
  <text x="230" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6B7280">血圧 (90-140)</text>
  <text x="230" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#9CA3AF">Blood Pressure</text>
  
  <!-- Temperature -->
  <rect x="310" y="55" width="130" height="90" rx="8" fill="#FFF" stroke="#E5E7EB" stroke-width="1"/>
  <circle cx="335" cy="80" r="12" fill="#FEF3C7"/>
  <text x="335" y="84" text-anchor="middle" font-size="12" fill="#D97706">🌡</text>
  <text x="365" y="80" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#D97706">36.5</text>
  <text x="415" y="80" font-family="Arial, sans-serif" font-size="10" fill="#9CA3AF">°C</text>
  <line x1="320" y1="95" x2="430" y2="95" stroke="#E5E7EB" stroke-width="1"/>
  <text x="375" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6B7280">体温 (36-37.5)</text>
  <text x="375" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#9CA3AF">Temperature</text>
  
  <!-- SpO2 -->
  <rect x="455" y="55" width="130" height="90" rx="8" fill="#FFF" stroke="#E5E7EB" stroke-width="1"/>
  <circle cx="480" cy="80" r="12" fill="#D1FAE5"/>
  <text x="480" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#059669">O₂</text>
  <text x="510" y="80" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#059669">98</text>
  <text x="540" y="80" font-family="Arial, sans-serif" font-size="10" fill="#9CA3AF">%</text>
  <line x1="465" y1="95" x2="575" y2="95" stroke="#E5E7EB" stroke-width="1"/>
  <text x="520" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6B7280">酸素飽和度 (95-100)</text>
  <text x="520" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#9CA3AF">SpO₂</text>
  
  <!-- Respiration -->
  <rect x="20" y="160" width="130" height="90" rx="8" fill="#FFF" stroke="#E5E7EB" stroke-width="1"/>
  <circle cx="45" cy="185" r="12" fill="#EDE9FE"/>
  <text x="45" y="189" text-anchor="middle" font-size="12" fill="#7C3AED">🫁</text>
  <text x="75" y="185" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#7C3AED">16</text>
  <text x="100" y="185" font-family="Arial, sans-serif" font-size="10" fill="#9CA3AF">回/分</text>
  <line x1="30" y1="200" x2="140" y2="200" stroke="#E5E7EB" stroke-width="1"/>
  <text x="85" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6B7280">呼吸数 (12-20)</text>
  <text x="85" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#9CA3AF">Respiration</text>
  
  <!-- Pain Scale -->
  <rect x="165" y="160" width="130" height="90" rx="8" fill="#FFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="230" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#F59E0B">NRS 3</text>
  <line x1="175" y1="200" x2="285" y2="200" stroke="#E5E7EB" stroke-width="1"/>
  <text x="230" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6B7280">痛み (0-10)</text>
  <text x="230" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#9CA3AF">Pain Scale</text>
  
  <!-- Bottom: measurement notes -->
  <rect x="310" y="160" width="275" height="90" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="447" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#374151">測定のポイント</text>
  <text x="325" y="202" font-family="Arial, sans-serif" font-size="9" fill="#6B7280">• 安静時(寝たまま)で測る</text>
  <text x="325" y="217" font-family="Arial, sans-serif" font-size="9" fill="#6B7280">• 食事・入浴後は避ける</text>
  <text x="325" y="232" font-family="Arial, sans-serif" font-size="9" fill="#6B7280">• 異常値は記録・報告</text>
  <text x="325" y="247" font-family="Arial, sans-serif" font-size="9" fill="#6B7280">• 毎日同じ時間に測定</text>
  
  <!-- Footer -->
  <rect x="20" y="270" width="565" height="60" rx="8" fill="#FFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="300" y="292" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#374151">異常値の目安</text>
  <text x="80" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#DC2626">脈拍 &lt;50 or &gt;120</text>
  <text x="230" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#DC2626">血圧 &lt;90 or &gt;180</text>
  <text x="390" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#DC2626">体温 &lt;35 or &gt;38</text>
  <text x="530" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#DC2626">SpO₂ &lt;90</text>
</svg>
