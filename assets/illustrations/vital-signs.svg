<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF3E0"/>
      <stop offset="100%" stop-color="#FFE0B2"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg3)"/>
  
  <!-- Vital Signs Grid -->
  <!-- Heart Rate -->
  <circle cx="100" cy="80" r="35" fill="#FFF" stroke="#E53935" stroke-width="2"/>
  <text x="100" y="75" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#E53935">♥</text>
  <text x="100" y="95" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333">72 bpm</text>
  
  <!-- Blood Pressure -->
  <circle cx="200" cy="80" r="35" fill="#FFF" stroke="#1565C0" stroke-width="2"/>
  <text x="200" y="75" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1565C0">120</text>
  <text x="200" y="95" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333">/ 80</text>
  
  <!-- Temperature -->
  <circle cx="300" cy="80" r="35" fill="#FFF" stroke="#FF9800" stroke-width="2"/>
  <text x="300" y="75" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FF9800">36.5°</text>
  <text x="300" y="95" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333">体温</text>
  
  <!-- SpO2 -->
  <circle cx="100" cy="180" r="35" fill="#FFF" stroke="#4CAF50" stroke-width="2"/>
  <text x="100" y="175" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#4CAF50">98%</text>
  <text x="100" y="195" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333">SpO₂</text>
  
  <!-- Respiration -->
  <circle cx="200" cy="180" r="35" fill="#FFF" stroke="#7B1FA2" stroke-width="2"/>
  <text x="200" y="175" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#7B1FA2">16</text>
  <text x="200" y="195" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333">回/分</text>
  
  <!-- Pain Scale -->
  <circle cx="300" cy="180" r="35" fill="#FFF" stroke="#F57C00" stroke-width="2"/>
  <text x="300" y="175" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#F57C00">NRS</text>
  <text x="300" y="195" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333">痛み</text>
  
  <!-- Labels -->
  <text x="100" y="130" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#666">脈拍</text>
  <text x="200" y="130" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#666">血圧</text>
  <text x="300" y="130" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#666">体温</text>
  
  <text x="200" y="260" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#E65100">バイタルサイン (Vital Signs)</text>
