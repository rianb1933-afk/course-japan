<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg-vs" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#FEF2F2"/>
    </linearGradient>
    <filter id="shadow-card" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.12"/>
    </filter>
  </defs>
  
  <rect width="800" height="450" fill="url(#bg-vs)" rx="16"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="800" height="56" fill="#DC2626" rx="16"/>
  <rect x="0" y="40" width="800" height="16" fill="#DC2626"/>
  <circle cx="40" cy="28" r="18" fill="rgba(255,255,255,0.15)"/>
  <text x="40" y="33" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16">📊</text>
  <text x="70" y="34" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#FFF">バイタルサイン · Tanda Vital · Vital Signs</text>
  
  <!-- Row 1: Pulse -->
  <rect x="24" y="72" width="245" height="100" rx="12" fill="#FFF" filter="url(#shadow-card)"/>
  <rect x="24" y="72" width="245" height="36" rx="12" fill="#FEF2F2"/>
  <rect x="24" y="96" width="245" height="12" fill="#FEF2F2"/>
  <circle cx="48" cy="90" r="12" fill="#FEE2E2"/>
  <text x="48" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12">❤️</text>
  <text x="68" y="94" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#DC2626">脈拍 (Myakuhaku)</text>
  <text x="36" y="140" font-family="system-ui,sans-serif" font-size="36" font-weight="800" fill="#DC2626">60–100</text>
  <text x="210" y="140" font-family="system-ui,sans-serif" font-size="14" fill="#6B7280">回/分</text>
  <text x="36" y="160" font-family="system-ui,sans-serif" font-size="9" fill="#16A34A">● 安静時 · 正常範囲</text>
  
  <!-- Row 1: Blood Pressure -->
  <rect x="281" y="72" width="245" height="100" rx="12" fill="#FFF" filter="url(#shadow-card)"/>
  <rect x="281" y="72" width="245" height="36" rx="12" fill="#EFF6FF"/>
  <rect x="281" y="96" width="245" height="12" fill="#EFF6FF"/>
  <circle cx="305" cy="90" r="12" fill="#DBEAFE"/>
  <text x="305" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12">🩺</text>
  <text x="325" y="94" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#2563EB">血圧 (Ketsuatsu)</text>
  <text x="293" y="140" font-family="system-ui,sans-serif" font-size="36" font-weight="800" fill="#2563EB">120/80</text>
  <text x="450" y="140" font-family="system-ui,sans-serif" font-size="14" fill="#6B7280">mmHg</text>
  <text x="293" y="160" font-family="system-ui,sans-serif" font-size="9" fill="#16A34A">● 収縮期/拡張期</text>
  
  <!-- Row 1: Temperature -->
  <rect x="538" y="72" width="245" height="100" rx="12" fill="#FFF" filter="url(#shadow-card)"/>
  <rect x="538" y="72" width="245" height="36" rx="12" fill="#FFF7ED"/>
  <rect x="538" y="96" width="245" height="12" fill="#FFF7ED"/>
  <circle cx="562" cy="90" r="12" fill="#FED7AA"/>
  <text x="562" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12">🌡️</text>
  <text x="582" y="94" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#EA580C">体温 (Taion)</text>
  <text x="550" y="140" font-family="system-ui,sans-serif" font-size="36" font-weight="800" fill="#EA580C">36.5</text>
  <text x="640" y="140" font-family="system-ui,sans-serif" font-size="14" fill="#6B7280">°C</text>
  <text x="550" y="160" font-family="system-ui,sans-serif" font-size="9" fill="#16A34A">● 腋窩測定</text>
  
  <!-- Row 2: SpO2 -->
  <rect x="24" y="184" width="245" height="100" rx="12" fill="#FFF" filter="url(#shadow-card)"/>
  <rect x="24" y="184" width="245" height="36" rx="12" fill="#F0FDF4"/>
  <rect x="24" y="208" width="245" height="12" fill="#F0FDF4"/>
  <circle cx="48" cy="202" r="12" fill="#D1FAE5"/>
  <text x="48" y="206" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12">💧</text>
  <text x="68" y="206" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#16A34A">酸素飽和度 (SpO₂)</text>
  <text x="36" y="252" font-family="system-ui,sans-serif" font-size="36" font-weight="800" fill="#16A34A">95–100</text>
  <text x="210" y="252" font-family="system-ui,sans-serif" font-size="14" fill="#6B7280">%</text>
  <text x="36" y="272" font-family="system-ui,sans-serif" font-size="9" fill="#16A34A">● 指先パルスオキシメータ</text>
  
  <!-- Row 2: Respiratory Rate -->
  <rect x="281" y="184" width="245" height="100" rx="12" fill="#FFF" filter="url(#shadow-card)"/>
  <rect x="281" y="184" width="245" height="36" rx="12" fill="#F5F3FF"/>
  <rect x="281" y="208" width="245" height="12" fill="#F5F3FF"/>
  <circle cx="305" cy="202" r="12" fill="#E9D5FF"/>
  <text x="305" y="206" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12">🫁</text>
  <text x="325" y="206" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#7C3AED">呼吸数 (Kokyūsū)</text>
  <text x="293" y="252" font-family="system-ui,sans-serif" font-size="36" font-weight="800" fill="#7C3AED">12–20</text>
  <text x="400" y="252" font-family="system-ui,sans-serif" font-size="14" fill="#6B7280">回/分</text>
  <text x="293" y="272" font-family="system-ui,sans-serif" font-size="9" fill="#16A34A">● 安静時 1分間</text>
  
  <!-- Row 2: Pain Scale -->
  <rect x="538" y="184" width="245" height="100" rx="12" fill="#FFF" filter="url(#shadow-card)"/>
  <rect x="538" y="184" width="245" height="36" rx="12" fill="#FEF9C3"/>
  <rect x="538" y="208" width="245" height="12" fill="#FEF9C3"/>
  <circle cx="562" cy="202" r="12" fill="#FEF3C7"/>
  <text x="562" y="206" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12">😫</text>
  <text x="582" y="206" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#D97706">疼痛 (Tsūkai)</text>
  <text x="550" y="252" font-family="system-ui,sans-serif" font-size="36" font-weight="800" fill="#D97706">0–10</text>
  <text x="630" y="252" font-family="system-ui,sans-serif" font-size="14" fill="#6B7280">点 (NRS)</text>
  <text x="550" y="272" font-family="system-ui,sans-serif" font-size="9" fill="#16A34A">● 面痛基準 (NRS)</text>
  
  <!-- Bottom: Measurement Tips -->
  <rect x="24" y="296" width="758" height="136" rx="12" fill="#FFF" filter="url(#shadow-card)"/>
  <rect x="24" y="296" width="758" height="40" rx="12" fill="#F8FAFC"/>
  <rect x="24" y="324" width="758" height="12" fill="#F8FAFC"/>
  <text x="403" y="322" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#374151">📋 測定時の注意点 (Tips Pengukuran)</text>
  
  <rect x="40" y="344" width="340" height="76" rx="8" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="1"/>
  <text x="52" y="364" font-family="system-ui,sans-serif" font-size="10" fill="#374151">✓ 安静時に測定 (15分以上安静)</text>
  <text x="52" y="380" font-family="system-ui,sans-serif" font-size="10" fill="#374151">✓ 食後30分～1時間を空ける</text>
  <text x="52" y="396" font-family="system-ui,sans-serif" font-size="10" fill="#374151">✓ 仰臥位で測定</text>
  <text x="52" y="412" font-family="system-ui,sans-serif" font-size="10" fill="#374151">✓ 同じ体位で前回と比較</text>
  
  <rect x="400" y="344" width="366" height="76" rx="8" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="1"/>
  <text x="412" y="364" font-family="system-ui,sans-serif" font-size="10" fill="#374151">✓ 記録は必ず日時をつける</text>
  <text x="412" y="380" font-family="system-ui,sans-serif" font-size="10" fill="#374151">✓ 異常値はすぐに報告</text>
  <text x="412" y="396" font-family="system-ui,sans-serif" font-size="10" fill="#374151">✓ 利用者の状態も同時に観察</text>
  <text x="412" y="412" font-family="system-ui,sans-serif" font-size="10" fill="#374151">✓ 機械のエラーを確認</text>
</svg>
