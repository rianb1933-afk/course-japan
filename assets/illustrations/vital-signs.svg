<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350">
  <rect width="600" height="350" fill="#FFF"/>
  
  <!-- Title -->
  <rect x="0" y="0" width="600" height="36" fill="#B45309"/>
  <text x="300" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#FFF">バイタルサイン · Vital Signs</text>
  
  <!-- Row 1: 4 cards -->
  <!-- HR -->
  <rect x="24" y="52" width="130" height="80" rx="6" fill="#FEE2E2"/>
  <text x="44" y="76" font-family="system-ui, sans-serif" font-size="10" fill="#991B1B">♥ 脈拍</text>
  <text x="44" y="104" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#DC2626">72</text>
  <text x="100" y="104" font-family="system-ui, sans-serif" font-size="11" fill="#DC2626">bpm</text>
  <text x="89" y="124" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#9CA3AF">60-100</text>
  
  <!-- BP -->
  <rect x="168" y="52" width="130" height="80" rx="6" fill="#DBEAFE"/>
  <text x="188" y="76" font-family="system-ui, sans-serif" font-size="10" fill="#1E40AF">BP 血圧</text>
  <text x="188" y="104" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#2563EB">120</text>
  <text x="252" y="104" font-family="system-ui, sans-serif" font-size="14" fill="#9CA3AF">/ 80</text>
  <text x="233" y="124" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#9CA3AF">90-140</text>
  
  <!-- Temp -->
  <rect x="312" y="52" width="130" height="80" rx="6" fill="#FEF3C7"/>
  <text x="332" y="76" font-family="system-ui, sans-serif" font-size="10" fill="#92400E">🌡 体温</text>
  <text x="332" y="104" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#D97706">36.5</text>
  <text x="400" y="104" font-family="system-ui, sans-serif" font-size="11" fill="#D97706">°C</text>
  <text x="377" y="124" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#9CA3AF">36-37.5</text>
  
  <!-- SpO2 -->
  <rect x="456" y="52" width="130" height="80" rx="6" fill="#D1FAE5"/>
  <text x="476" y="76" font-family="system-ui, sans-serif" font-size="10" fill="#065F46">O₂ 酸素</text>
  <text x="476" y="104" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#059669">98</text>
  <text x="520" y="104" font-family="system-ui, sans-serif" font-size="11" fill="#059669">%</text>
  <text x="521" y="124" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#9CA3AF">95-100</text>
  
  <!-- Row 2: 2 cards + notes -->
  <!-- Resp -->
  <rect x="24" y="148" width="130" height="70" rx="6" fill="#EDE9FE"/>
  <text x="44" y="172" font-family="system-ui, sans-serif" font-size="10" fill="#5B21B6">🫁 呼吸</text>
  <text x="44" y="200" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#7C3AED">16</text>
  <text x="80" y="200" font-family="system-ui, sans-serif" font-size="11" fill="#7C3AED">回/分</text>
  <text x="89" y="212" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#9CA3AF">12-20</text>
  
  <!-- Pain -->
  <rect x="168" y="148" width="130" height="70" rx="6" fill="#FEF3C7"/>
  <text x="188" y="172" font-family="system-ui, sans-serif" font-size="10" fill="#92400E">😫 痛み</text>
  <text x="188" y="200" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#D97706">NRS 3</text>
  <text x="233" y="212" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#9CA3AF">0-10</text>
  
  <!-- Notes -->
  <rect x="312" y="148" width="274" height="70" rx="6" fill="#F9FAFB" stroke="#E5E7EB"/>
  <text x="449" y="170" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#374155">測定のポイント</text>
  <text x="327" y="190" font-family="system-ui, sans-serif" font-size="8" fill="#6B7280">• 安静時(寝たまま)で測る</text>
  <text x="327" y="204" font-family="system-ui, sans-serif" font-size="8" fill="#6B7280">• 異常値は記録・報告</text>
  <text x="327" y="218" font-family="system-ui, sans-serif" font-size="8" fill="#6B7280">• 毎日同じ時間に</text>
  
  <!-- Bottom: Alert values -->
  <rect x="24" y="240" width="560" height="90" rx="6" fill="#FEF2F2" stroke="#FECACA"/>
  <text x="304" y="262" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#991B1B">⚠ 異常値の目安</text>
  
  <text x="60" y="290" font-family="system-ui, sans-serif" font-size="9" fill="#DC2626">脈拍 &lt;50 or &gt;120</text>
  <text x="210" y="290" font-family="system-ui, sans-serif" font-size="9" fill="#DC2626">血圧 &lt;90 or &gt;180</text>
  <text x="360" y="290" font-family="system-ui, sans-serif" font-size="9" fill="#DC2626">体温 &lt;35 or &gt;38</text>
  <text x="510" y="290" font-family="system-ui, sans-serif" font-size="9" fill="#DC2626">SpO₂ &lt;90</text>
  
  <text x="304" y="320" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#9CA3AF">いずれか該当する場合 → 直ちに報告</text>
</svg>
