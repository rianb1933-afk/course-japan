<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF7ED"/>
      <stop offset="100%" stop-color="#FFEDD5"/>
    </linearGradient>
    <filter id="sh3" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>
  <rect width="600" height="400" rx="20" fill="url(#bg3)"/>
  
  <!-- Patient bed -->
  <rect x="50" y="220" width="200" height="10" rx="3" fill="#D1D5DB"/>
  <rect x="50" y="230" width="5" height="60" fill="#9CA3AF"/>
  <rect x="245" y="230" width="5" height="60" fill="#9CA3AF"/>
  
  <!-- Patient lying -->
  <circle cx="80" cy="200" r="18" fill="#FDE68A" stroke="#D97706" stroke-width="1.5"/>
  <rect x="95" y="195" width="130" height="25" rx="6" fill="#BFDBFE" stroke="#3B82F6" stroke-width="1.5"/>
  
  <!-- Pulse oximeter on finger -->
  <rect x="230" y="195" width="15" height="10" rx="3" fill="#22C55E" stroke="#16A34A" stroke-width="1"/>
  <text x="237" y="235" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#16A34A">SpO₂</text>
  
  <!-- BP cuff on arm -->
  <rect x="120" y="190" width="20" height="30" rx="4" fill="#93C5FD" stroke="#2563EB" stroke-width="1.5"/>
  
  <!-- IV stand -->
  <line x1="200" y1="100" x2="200" y2="250" stroke="#9CA3AF" stroke-width="2"/>
  <rect x="185" y="90" width="30" height="25" rx="4" fill="#E0E7FF" stroke="#6366F1" stroke-width="1.5"/>
  <text x="200" y="107" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#4F46E5">点滴</text>
  
  <!-- Monitor -->
  <rect x="320" y="60" width="240" height="180" rx="14" fill="#1E293B" filter="url(#sh3)"/>
  <rect x="330" y="70" width="220" height="100" rx="8" fill="#0F172A"/>
  
  <!-- ECG wave on monitor -->
  <path d="M340 120 L370 120 L380 100 L390 140 L400 110 L410 120 L450 120 L460 100 L470 140 L480 110 L490 120 L530 120 L540 100 L550 140" fill="none" stroke="#22C55E" stroke-width="2"/>
  
  <!-- Monitor readings -->
  <text x="345" y="190" font-family="monospace" font-size="14" font-weight="bold" fill="#EF4444">72 bpm</text>
  <text x="420" y="190" font-family="monospace" font-size="14" font-weight="bold" fill="#3B82F6">120/80</text>
  <text x="510" y="190" font-family="monospace" font-size="14" font-weight="bold" fill="#F59E0B">36.5°C</text>
  
  <!-- Vital sign cards -->
  <!-- Heart Rate -->
  <rect x="30" y="30" width="110" height="80" rx="12" fill="#FFF" filter="url(#sh3)"/>
  <circle cx="60" cy="55" r="14" fill="#FEE2E2"/>
  <text x="60" y="60" text-anchor="middle" font-size="14">♥</text>
  <text x="85" y="52" font-family="sans-serif" font-size="14" font-weight="bold" fill="#DC2626">72</text>
  <text x="85" y="67" font-family="sans-serif" font-size="9" fill="#94A3B8">bpm</text>
  <text x="60" y="100" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#64748B">脈拍 (60-100)</text>
  
  <!-- Blood Pressure -->
  <rect x="155" y="30" width="110" height="80" rx="12" fill="#FFF" filter="url(#sh3)"/>
  <circle cx="185" cy="55" r="14" fill="#DBEAFE"/>
  <text x="185" y="60" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#2563EB">BP</text>
  <text x="210" y="52" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2563EB">120</text>
  <text x="210" y="67" font-family="sans-serif" font-size="9" fill="#94A3B8">/ 80</text>
  <text x="185" y="100" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#64748B">血圧 (90-140)</text>
  
  <!-- Temperature -->
  <rect x="30" y="270" width="110" height="80" rx="12" fill="#FFF" filter="url(#sh3)"/>
  <circle cx="60" cy="295" r="14" fill="#FEF3C7"/>
  <text x="60" y="300" text-anchor="middle" font-size="14">🌡</text>
  <text x="85" y="295" font-family="sans-serif" font-size="14" font-weight="bold" fill="#D97706">36.5</text>
  <text x="85" y="310" font-family="sans-serif" font-size="9" fill="#94A3B8">°C</text>
  <text x="60" y="340" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#64748B">体温 (36-37.5)</text>
  
  <!-- SpO2 -->
  <rect x="155" y="270" width="110" height="80" rx="12" fill="#FFF" filter="url(#sh3)"/>
  <circle cx="185" cy="295" r="14" fill="#D1FAE5"/>
  <text x="185" y="300" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#059669">O₂</text>
  <text x="210" y="295" font-family="sans-serif" font-size="14" font-weight="bold" fill="#059669">98</text>
  <text x="210" y="310" font-family="sans-serif" font-size="9" fill="#94A3B8">%</text>
  <text x="185" y="340" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#64748B">酸素飽和度 (95-100)</text>
  
  <!-- Respiration -->
  <rect x="440" y="270" width="130" height="80" rx="12" fill="#FFF" filter="url(#sh3)"/>
  <circle cx="470" cy="295" r="14" fill="#EDE9FE"/>
  <text x="470" y="300" text-anchor="middle" font-size="14">🫁</text>
  <text x="495" y="295" font-family="sans-serif" font-size="14" font-weight="bold" fill="#7C3AED">16</text>
  <text x="495" y="310" font-family="sans-serif" font-size="9" fill="#94A3B8">回/分</text>
  <text x="505" y="340" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#64748B">呼吸数 (12-20)</text>
</svg>
