<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350">
  <defs>
    <linearGradient id="bg-vs" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FEF2F2"/>
      <stop offset="100%" stop-color="#FFF"/>
    </linearGradient>
  </defs>
  <rect width="600" height="350" fill="url(#bg-vs)" rx="12"/>
  
  <!-- Title Bar -->
  <rect x="0" y="0" width="600" height="40" fill="#DC2626" rx="12"/>
  <rect x="0" y="28" width="600" height="12" fill="#DC2626"/>
  <text x="300" y="26" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#FFF">バイタルサイン · Tanda Vital · Vital Signs</text>
  
  <!-- Vital Sign Cards - Row 1 -->
  <!-- Pulse -->
  <rect x="20" y="52" width="170" height="80" rx="10" fill="#FFF" stroke="#FECACA" stroke-width="1.5"/>
  <text x="32" y="72" font-family="system-ui,sans-serif" font-size="10" fill="#9CA3AF">脈拍 (Myakuhaku)</text>
  <text x="32" y="100" font-family="system-ui,sans-serif" font-size="28" font-weight="800" fill="#DC2626">60–100</text>
  <text x="140" y="100" font-family="system-ui,sans-serif" font-size="12" fill="#6B7280">回/分</text>
  <text x="32" y="120" font-family="system-ui,sans-serif" font-size="9" fill="#16A34A">● 正常範囲</text>
  
  <!-- Blood Pressure -->
  <rect x="215" y="52" width="170" height="80" rx="10" fill="#FFF" stroke="#BFDBFE" stroke-width="1.5"/>
  <text x="227" y="72" font-family="system-ui,sans-serif" font-size="10" fill="#9CA3AF">血圧 (Ketsuatsu)</text>
  <text x="227" y="100" font-family="system-ui,sans-serif" font-size="28" font-weight="800" fill="#2563EB">120/80</text>
  <text x="340" y="100" font-family="system-ui,sans-serif" font-size="12" fill="#6B7280">mmHg</text>
  <text x="227" y="120" font-family="system-ui,sans-serif" font-size="9" fill="#16A34A">● 正常範囲</text>
  
  <!-- Temperature -->
  <rect x="410" y="52" width="170" height="80" rx="10" fill="#FFF" stroke="#FEF3C7" stroke-width="1.5"/>
  <text x="422" y="72" font-family="system-ui,sans-serif" font-size="10" fill="#9CA3AF">体温 (Taion)</text>
  <text x="422" y="100" font-family="system-ui,sans-serif" font-size="28" font-weight="800" fill="#D97706">36.5</text>
  <text x="490" y="100" font-family="system-ui,sans-serif" font-size="12" fill="#6B7280">°C</text>
  <text x="422" y="120" font-family="system-ui,sans-serif" font-size="9" fill="#16A34A">● 正常範囲</text>
  
  <!-- Vital Sign Cards - Row 2 -->
  <!-- SpO2 -->
  <rect x="20" y="142" width="170" height="80" rx="10" fill="#FFF" stroke="#D1FAE5" stroke-width="1.5"/>
  <text x="32" y="162" font-family="system-ui,sans-serif" font-size="10" fill="#9CA3AF">酸素飽和度 (SpO₂)</text>
  <text x="32" y="190" font-family="system-ui,sans-serif" font-size="28" font-weight="800" fill="#16A34A">95–100</text>
  <text x="150" y="190" font-family="system-ui,sans-serif" font-size="12" fill="#6B7280">%</text>
  <text x="32" y="210" font-family="system-ui,sans-serif" font-size="9" fill="#16A34A">● 正常範囲</text>
  
  <!-- Respiratory Rate -->
  <rect x="215" y="142" width="170" height="80" rx="10" fill="#FFF" stroke="#E9D5FF" stroke-width="1.5"/>
  <text x="227" y="162" font-family="system-ui,sans-serif" font-size="10" fill="#9CA3AF">呼吸数 (Kokyūsū)</text>
  <text x="227" y="190" font-family="system-ui,sans-serif" font-size="28" font-weight="800" fill="#7C3AED">12–20</text>
  <text x="310" y="190" font-family="system-ui,sans-serif" font-size="12" fill="#6B7280">回/分</text>
  <text x="227" y="210" font-family="system-ui,sans-serif" font-size="9" fill="#16A34A">● 正常範囲</text>
  
  <!-- Pain Scale -->
  <rect x="410" y="142" width="170" height="80" rx="10" fill="#FFF" stroke="#FED7AA" stroke-width="1.5"/>
  <text x="422" y="162" font-family="system-ui,sans-serif" font-size="10" fill="#9CA3AF">疼痛 (Tsūkai)</text>
  <text x="422" y="190" font-family="system-ui,sans-serif" font-size="28" font-weight="800" fill="#EA580C">0–10</text>
  <text x="480" y="190" font-family="system-ui,sans-serif" font-size="12" fill="#6B7280">点</text>
  <text x="422" y="210" font-family="system-ui,sans-serif" font-size="9" fill="#16A34A">● NRSスケール</text>
  
  <!-- Bottom: Measurement Tips -->
  <rect x="20" y="235" width="560" height="100" rx="10" fill="#FFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="300" y="258" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#374151">測定時の注意点 (Tips Pengukuran)</text>
  
  <text x="40" y="282" font-family="system-ui,sans-serif" font-size="10" fill="#6B7280">● 安静時 · 食後30分後 · 仰臥位で測定</text>
  <text x="40" y="300" font-family="system-ui,sans-serif" font-size="10" fill="#6B7280">● 記録は必ず日時をつけて (記録に日時をつける)</text>
  <text x="40" y="318" font-family="system-ui,sans-serif" font-size="10" fill="#6B7280">● 異常値はすぐに上司に報告 (異常値は報告)</text>
  
  <text x="340" y="282" font-family="system-ui,sans-serif" font-size="10" fill="#6B7280">● 前回との比較が重要 (前回との比較)</text>
  <text x="340" y="300" font-family="system-ui,sans-serif" font-size="10" fill="#6B7280">● 機械のエラーを確認 (機械の確認)</text>
  <text x="340" y="318" font-family="system-ui,sans-serif" font-size="10" fill="#6B7280">● 利用者の状態も同時に観察 (状態観察)</text>
</svg>