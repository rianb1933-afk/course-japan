<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350">
  <defs>
    <linearGradient id="bg-cp2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#FFF"/>
    </linearGradient>
  </defs>
  <rect width="600" height="350" fill="url(#bg-cp2)" rx="12"/>
  <rect x="0" y="0" width="600" height="40" fill="#16A34A" rx="12"/>
  <rect x="0" y="28" width="600" height="12" fill="#16A34A"/>
  <text x="300" y="26" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#FFF">介護過程 · Proses Perawatan · Care Process</text>
  
  <!-- Process Flow -->
  <rect x="20" y="52" width="560" height="280" rx="10" fill="#FFF" stroke="#D1FAE5" stroke-width="1"/>
  <text x="300" y="72" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#374151">介護過程のステップ</text>
  
  <!-- Step 1 -->
  <rect x="40" y="85" width="150" height="60" rx="8" fill="#FEF2F2" stroke="#FECACA"/>
  <text x="115" y="105" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#DC2626">① 情報収集</text>
  <text x="115" y="120" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#6B7280">アセスメント</text>
  <text x="115" y="135" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#6B7280">Pengumpulan Data</text>
  
  <!-- Arrow -->
  <text x="200" y="120" font-family="system-ui,sans-serif" font-size="16" fill="#16A34A">→</text>
  
  <!-- Step 2 -->
  <rect x="215" y="85" width="150" height="60" rx="8" fill="#FFF7ED" stroke="#FED7AA"/>
  <text x="290" y="105" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#EA580C">② 問題把握</text>
  <text x="290" y="120" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#6B7280">ニーズ分析</text>
  <text x="290" y="135" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#6B7280">Identifikasi Masalah</text>
  
  <!-- Arrow -->
  <text x="375" y="120" font-family="system-ui,sans-serif" font-size="16" fill="#16A34A">→</text>
  
  <!-- Step 3 -->
  <rect x="390" y="85" width="170" height="60" rx="8" fill="#F0FDF4" stroke="#BBF7D0"/>
  <text x="475" y="105" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#16A34A">③ 計画立案</text>
  <text x="475" y="120" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#6B7280">ケアプラン作成</text>
  <text x="475" y="135" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#6B7280">Perencanaan</text>
  
  <!-- Arrow Down -->
  <text x="475" y="160" font-family="system-ui,sans-serif" font-size="16" fill="#16A34A">↓</text>
  
  <!-- Step 4 -->
  <rect x="390" y="170" width="170" height="60" rx="8" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="475" y="190" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#2563EB">④ 実施</text>
  <text x="475" y="205" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#6B7280">ケア実行</text>
  <text x="475" y="220" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#6B7280">Pelaksanaan</text>
  
  <!-- Arrow Left -->
  <text x="375" y="200" font-family="system-ui,sans-serif" font-size="16" fill="#16A34A">←</text>
  
  <!-- Step 5 -->
  <rect x="215" y="170" width="150" height="60" rx="8" fill="#F5F3FF" stroke="#E9D5FF"/>
  <text x="290" y="190" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#7C3AED">⑤ 評価</text>
  <text x="290" y="205" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#6B7280">結果確認</text>
  <text x="290" y="220" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#6B7280">Evaluasi</text>
  
  <!-- Arrow Left -->
  <text x="200" y="200" font-family="system-ui,sans-serif" font-size="16" fill="#16A34A">←</text>
  
  <!-- Step 6 -->
  <rect x="40" y="170" width="150" height="60" rx="8" fill="#FEF9C3" stroke="#FEF3C7"/>
  <text x="115" y="190" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#D97706">⑥ 記録</text>
  <text x="115" y="205" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#6B7280">文書化</text>
  <text x="115" y="220" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#6B7280">Dokumentasi</text>
  
  <!-- Bottom Note -->
  <rect x="40" y="250" width="520" height="60" rx="8" fill="#F0FDF4" stroke="#BBF7D0"/>
  <text x="300" y="275" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#16A34A">PDCA サイクル</text>
  <text x="300" y="295" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#6B7280">Plan → Do → Check → Act → 繰り返し改善</text>
</svg>
