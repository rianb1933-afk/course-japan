<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg-proc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8EAF6"/>
      <stop offset="100%" stop-color="#C5CAE9"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg-proc)"/>
  
  <!-- Circular process -->
  <circle cx="200" cy="140" r="80" fill="none" stroke="#3F51B5" stroke-width="2" stroke-dasharray="8,4"/>
  
  <!-- Process steps -->
  <circle cx="200" cy="60" r="25" fill="#FFF" stroke="#3F51B5" stroke-width="2"/>
  <text x="200" y="55" text-anchor="middle" font-size="14">📋</text>
  <text x="200" y="75" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#333">アセスメント</text>
  
  <circle cx="280" cy="140" r="25" fill="#FFF" stroke="#3F51B5" stroke-width="2"/>
  <text x="280" y="135" text-anchor="middle" font-size="14">📝</text>
  <text x="280" y="155" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#333">計画</text>
  
  <circle cx="200" cy="220" r="25" fill="#FFF" stroke="#3F51B5" stroke-width="2"/>
  <text x="200" y="215" text-anchor="middle" font-size="14">🤝</text>
  <text x="200" y="235" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#333">実施</text>
  
  <circle cx="120" cy="140" r="25" fill="#FFF" stroke="#3F51B5" stroke-width="2"/>
  <text x="120" y="135" text-anchor="middle" font-size="14">📊</text>
  <text x="120" y="155" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#333">評価</text>
  
  <!-- Arrows -->
  <path d="M225 70 L255 120" fill="none" stroke="#3F51B5" stroke-width="2" marker-end="url(#arrow-proc)"/>
  <path d="M270 165 L225 205" fill="none" stroke="#3F51B5" stroke-width="2" marker-end="url(#arrow-proc)"/>
  <path d="M175 215 L145 165" fill="none" stroke="#3F51B5" stroke-width="2" marker-end="url(#arrow-proc)"/>
  <path d="M140 120 L175 75" fill="none" stroke="#3F51B5" stroke-width="2" marker-end="url(#arrow-proc)"/>
  <defs><marker id="arrow-proc" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3F51B5"/></marker></defs>
  
  <text x="200" y="275" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1A237E">介護過程 (Care Process)</text>
</svg>
