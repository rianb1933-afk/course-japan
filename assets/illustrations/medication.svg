<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350">
  <defs>
    <linearGradient id="bg-med" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF7ED"/>
      <stop offset="100%" stop-color="#FFF"/>
    </linearGradient>
  </defs>
  <rect width="600" height="350" fill="url(#bg-med)" rx="12"/>
  
  <rect x="0" y="0" width="600" height="40" fill="#EA580C" rx="12"/>
  <rect x="0" y="28" width="600" height="12" fill="#EA580C"/>
  <text x="300" y="26" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#FFF">服薬管理 · Manajemen Obat · Medication Safety</text>
  
  <!-- Left: Five Rights -->
  <rect x="20" y="52" width="260" height="180" rx="10" fill="#FFF" stroke="#FED7AA" stroke-width="1"/>
  <text x="150" y="72" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#374151">5つの正しい (5 Benar)</text>
  
  <rect x="35" y="82" width="230" height="24" rx="5" fill="#FFF7ED" stroke="#FED7AA"/>
  <text x="47" y="98" font-family="system-ui,sans-serif" font-size="10" fill="#EA580C">① 正しい利用者 (Orang yang benar)</text>
  
  <rect x="35" y="110" width="230" height="24" rx="5" fill="#FFF7ED" stroke="#FED7AA"/>
  <text x="47" y="126" font-family="system-ui,sans-serif" font-size="10" fill="#EA580C">② 正しい薬 (Obat yang benar)</text>
  
  <rect x="35" y="138" width="230" height="24" rx="5" fill="#FFF7ED" stroke="#FED7AA"/>
  <text x="47" y="154" font-family="system-ui,sans-serif" font-size="10" fill="#EA580C">③ 正しい量 (Dosis yang benar)</text>
  
  <rect x="35" y="166" width="230" height="24" rx="5" fill="#FFF7ED" stroke="#FED7AA"/>
  <text x="47" y="182" font-family="system-ui,sans-serif" font-size="10" fill="#EA580C">④ 正しい時間 (Waktu yang benar)</text>
  
  <rect x="35" y="194" width="230" height="24" rx="5" fill="#FFF7ED" stroke="#FED7AA"/>
  <text x="47" y="210" font-family="system-ui,sans-serif" font-size="10" fill="#EA580C">⑤ 正しい方法 (Cara yang benar)</text>
  
  <!-- Right: Medication Schedule -->
  <rect x="310" y="52" width="270" height="180" rx="10" fill="#FFF" stroke="#FED7AA" stroke-width="1"/>
  <text x="445" y="72" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#374151">服薬スケジュール (Jadwal Minum)</text>
  
  <rect x="325" y="82" width="240" height="30" rx="6" fill="#FEF2F2" stroke="#FECACA"/>
  <text x="337" y="101" font-family="system-ui,sans-serif" font-size="10" fill="#DC2626">朝 (Pagi) · 7:00</text>
  <text x="530" y="101" text-anchor="end" font-family="system-ui,sans-serif" font-size="10" fill="#374151">3錠</text>
  
  <rect x="325" y="117" width="240" height="30" rx="6" fill="#FFF7ED" stroke="#FED7AA"/>
  <text x="337" y="136" font-family="system-ui,sans-serif" font-size="10" fill="#D97706">昼 (Siang) · 12:00</text>
  <text x="530" y="136" text-anchor="end" font-family="system-ui,sans-serif" font-size="10" fill="#374151">2錠</text>
  
  <rect x="325" y="152" width="240" height="30" rx="6" fill="#F0FDF4" stroke="#BBF7D0"/>
  <text x="337" y="171" font-family="system-ui,sans-serif" font-size="10" fill="#16A34A">夕 (Malam) · 18:00</text>
  <text x="530" y="171" text-anchor="end" font-family="system-ui,sans-serif" font-size="10" fill="#374151">2錠</text>
  
  <rect x="325" y="187" width="240" height="30" rx="6" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="337" y="206" font-family="system-ui,sans-serif" font-size="10" fill="#2563EB">就寝前 (Sebelum Tidur) · 22:00</text>
  <text x="530" y="206" text-anchor="end" font-family="system-ui,sans-serif" font-size="10" fill="#374151">1錠</text>
  
  <!-- Bottom: Safety Points -->
  <rect x="20" y="250" width="560" height="85" rx="10" fill="#FFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="300" y="272" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#374151">注意事項 (Hal Penting)</text>
  
  <text x="40" y="296" font-family="system-ui,sans-serif" font-size="10" fill="#6B7280">● 二重投薬を確認</text>
  <text x="40" y="314" font-family="system-ui,sans-serif" font-size="10" fill="#6B7280">● 副作用の観察</text>
  <text x="200" y="296" font-family="system-ui,sans-serif" font-size="10" fill="#6B7280">● 残薬の確認</text>
  <text x="200" y="314" font-family="system-ui,sans-serif" font-size="10" fill="#6B7280">● 飲み忘れ防止</text>
  <text x="360" y="296" font-family="system-ui,sans-serif" font-size="10" fill="#6B7280">● 記録の確認</text>
  <text x="360" y="314" font-family="system-ui,sans-serif" font-size="10" fill="#6B7280">● 上司への報告</text>
</svg>