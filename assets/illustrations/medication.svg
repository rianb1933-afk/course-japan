<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg8" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EEF2FF"/>
      <stop offset="100%" stop-color="#E0E7FF"/>
    </linearGradient>
    <filter id="sh8" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>
  <rect width="600" height="400" rx="20" fill="url(#bg8)"/>
  
  <!-- Pill bottles -->
  <rect x="50" y="80" width="60" height="100" rx="8" fill="#FFF" stroke="#6366F1" stroke-width="2"/>
  <rect x="55" y="70" width="50" height="18" rx="4" fill="#C7D2FE" stroke="#6366F1" stroke-width="1.5"/>
