<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350">
  <rect width="600" height="350" rx="12" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1"/>
  
  <!-- Title -->
  <rect x="0" y="0" width="600" height="40" rx="12" fill="#6366F1"/>
  <rect x="0" y="20" width="600" height="20" fill="#6366F1"/>
  <text x="300" y="27" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFF">服薬支援 · Medication Support · Dukungan Pemberian Obat</text>
  
  <!-- Pill bottles -->
  <rect x="40" y="70" width="50" height="80" rx="6" fill="#FFF" stroke="#6366F1" stroke-width="1.5"/>
  <rect x="44" y="62" width="42" height="14" rx="3" fill="#C7D2FE"/>
  <text x="65" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#4338CA">朝</text>
  <rect x="47" y="100" width="36" height="12" rx="2" fill="#FEE2E2"/>
  <rect x="47" y="116" width="36" height="12" rx="2" fill="#D1FAE5"/>
  
  <rect x="105" y="70" width="50" height="80" rx="6" fill="#FFF" stroke="#6366F1" stroke-width="1.5"/>
  <rect x="109" y="62" width="42" height="14" rx="3" fill="#C7D2FE"/>
  <text x="130" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#4338CA">昼</text>
  <rect x="112" y="100" width="36" height="12" rx="2" fill="#FEF3C7"/>
  
  <rect x="170" y="70" width="50" height="80" rx="6" fill="#FFF" stroke="#6366F1" stroke-width="1.5"/>
  <rect x="174" y="62" width="42" height="14" rx="3" fill="#C7D2FE"/>
  <text x="195" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#4338CA">夕</text>
  <rect x="177" y="100" width="36" height="12" rx="2" fill="#DBEAFE"/>
  <rect x="177" y="116" width="36" height="12" rx="2" fill="#FCE7F3"/>
  
  <!-- Water glass -->
  <path d="M250 100 L250 145 Q250 155 260 155 L285 155 Q295 155 295 145 L295 100Z" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
  
  <!-- Schedule -->
  <rect x="310" y="55" width="270" height="100" rx="10" fill="#FFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="445" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#4338CA">服薬スケジュール</text>
  <line x1="320" y1="82" x2="570" y2="82" stroke="#E5E7EB" stroke-width="1"/>
  
  <rect x="325" y="90" width="240" height="22" rx="4" fill="#FEF3C7"/>
  <text x="335" y="105" font-family="Arial, sans-serif" font-size="9" fill="#92400E">☀️ 朝食後 8:00 → ✓ 済</text>
  
  <rect x="325" y="115" width="240" height="22" rx="4" fill="#F0FDF4"/>
  <text x="335" y="130" font-family="Arial, sans-serif" font-size="9" fill="#166534">🌤️ 昼食後 12:30 → ✓ 済</text>
  
  <rect x="325" y="140" width="240" height="10" rx="4" fill="#EFF6FF"/>
  
  <!-- Safety rules -->
  <rect x="20" y="170" width="280" height="160" rx="10" fill="#FFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="160" y="192" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#DC2626">服薬管理のポイント</text>
  <line x1="30" y1="200" x2="290" y2="200" stroke="#E5E7EB" stroke-width="1"/>
  
  <text x="35" y="218" font-family="Arial, sans-serif" font-size="9" fill="#16A34A">✓ お薬手帳を持参</text>
  <text x="35" y="236" font-family="Arial, sans-serif" font-size="9" fill="#16A34A">✓ 剤量・服用時間を厳守</text>
  <text x="35" y="254" font-family="Arial, sans-serif" font-size="9" fill="#16A34A">✓ 副作用の観察</text>
  <text x="35" y="272" font-family="Arial, sans-serif" font-size="9" fill="#DC2626">✗ 自分で量を増減しない</text>
  <text x="35" y="290" font-family="Arial, sans-serif" font-size="9" fill="#DC2626">✗ 他のお薬と共用しない</text>
  <text x="35" y="308" font-family="Arial, sans-serif" font-size="9" fill="#DC2626">✗ 中途半端にやめない</text>
  
  <!-- Confirmation checklist -->
  <rect x="315" y="170" width="265" height="160" rx="10" fill="#FFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="447" y="192" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#4338CA">確認事項</text>
  <line x1="325" y1="200" x2="570" y2="200" stroke="#E5E7EB" stroke-width="1"/>
  
  <text x="330" y="220" font-family="Arial, sans-serif" font-size="9" fill="#374151">名前 → 薬の名前か？</text>
  <text x="330" y="240" font-family="Arial, sans-serif" font-size="9" fill="#374151">時間 → 今の時間か？</text>
  <text x="330" y="260" font-family="Arial, sans-serif" font-size="9" fill="#374151">量 → 正しい量か？</text>
  <text x="330" y="280" font-family="Arial, sans-serif" font-size="9" fill="#374151">飲み方 → 水で飲むか？</text>
  <text x="330" y="300" font-family="Arial, sans-serif" font-size="9" fill="#374151">外观 → 変化はないか？</text>
  <text x="330" y="320" font-family="Arial, sans-serif" font-size="9" fill="#0369A1">→ 全てOK then 服用</text>
