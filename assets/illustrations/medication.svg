<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg9" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8EAF6"/>
      <stop offset="100%" stop-color="#C5CAE9"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg9)"/>
  
  <!-- Pill bottle -->
  <rect x="140" y="80" width="50" height="80" rx="6" fill="#FFF" stroke="#3F51B5" stroke-width="2"/>
  <rect x="145" y="85" width="40" height="20" rx="3" fill="#E8EAF6"/>
  <text x="165" y="100" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#3F51B5">薬</text>
  <rect x="148" y="130" width="34" height="12" rx="2" fill="#FFCDD2"/>
  <rect x="148" y="145" width="34" height="8" rx="2" fill="#C8E6C9"/>
  
  <!-- Dosage schedule -->
  <rect x="220" y="80" width="120" height="80" rx="8" fill="#FFF" stroke="#3F51B5" stroke-width="2"/>
  <text x="280" y="100" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#3F51B5">服薬時間</text>
  <text x="250" y="120" font-family="sans-serif" font-size="9" fill="#333">☀️ 朝食後</text>
  <text x="250" y="135" font-family="sans-serif" font-size="9" fill="#333">🌤️ 昼食後</text>
  <text x="250" y="150" font-family="sans-serif" font-size="9" fill="#333">🌙 夕食後</text>
  
  <!-- Water glass -->
  <path d="M100 180 L100 230 Q100 240 110 240 L130 240 Q140 240 140 230 L140 180Z" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
  <path d="M105 200 Q120 195 135 200" fill="none" stroke="#1565C0" stroke-width="1"/>
  
  <!-- Check marks -->
  <circle cx="170" cy="210" r="12" fill="#4CAF50"/>
  <text x="170" y="215" text-anchor="middle" font-size="14" fill="#FFF">✓</text>
  <circle cx="200" cy="210" r="12" fill="#4CAF50"/>
  <text x="200" y="215" text-anchor="middle" font-size="14" fill="#FFF">✓</text>
  <circle cx="230" cy="210" r="12" fill="#FFC107"/>
  <text x="230" y="215" text-anchor="middle" font-size="14" fill="#FFF">?</text>
  
  <text x="200" y="275" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1A237E">服薬支援 (Medication Support)</text>
</svg>
