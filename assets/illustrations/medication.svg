<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg-med" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#FFF7ED"/>
    </linearGradient>
    <filter id="shadow-md" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.12"/>
    </filter>
  </defs>
  
  <rect width="800" height="450" fill="url(#bg-med)" rx="16"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="800" height="56" fill="#EA580C" rx="16"/>
  <rect x="0" y="40" width="800" height="16" fill="#EA580C"/>
  <circle cx="40" cy="28" r="18" fill="rgba(255,255,255,0.15)"/>
  <text x="40" y="33" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16">💊</text>
  <text x="70" y="34" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#FFF">服薬管理 · Manajemen Obat · Medication Safety</text>
  
  <!-- Left: Five Rights -->
  <rect x="24" y="72" width="370" height="350" rx="12" fill="#FFF" filter="url(#shadow-md)"/>
  <rect x="24" y="72" width="370" height="44" rx="12" fill="#FFF7ED"/>
  <rect x="24" y="104" width="370" height="12" fill="#FFF7ED"/>
  <text x="209" y="100" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#EA580C">5つの正しい (5 Benar)</text>
  
  <!-- Right 1 -->
  <rect x="40" y="120" width="338" height="44" rx="8" fill="#FFF" stroke="#FED7AA" stroke-width="1.5"/>
  <circle cx="64" cy="142" r="12" fill="#EA580C"/>
  <text x="64" y="146" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="800" fill="#FFF">1</text>
  <text x="86" y="138" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#EA580C">正しい利用者</text>
  <text x="86" y="152" font-family="system-ui,sans-serif" font-size="8" fill="#6B7280">Orang yang benar</text>
  
  <!-- Right 2 -->
  <rect x="40" y="172" width="338" height="44" rx="8" fill="#FFF" stroke="#FED7AA" stroke-width="1.5"/>
  <circle cx="64" cy="194" r="12" fill="#EA580C"/>
  <text x="64" y="198" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="800" fill="#FFF">2</text>
  <text x="86" y="190" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#EA580C">正しい薬</text>
  <text x="86" y="204" font-family="system-ui,sans-serif" font-size="8" fill="#6B7280">Obat yang benar</text>
  
  <!-- Right 3 -->
  <rect x="40" y="224" width="338" height="44" rx="8" fill="#FFF" stroke="#FED7AA" stroke-width="1.5"/>
  <circle cx="64" cy="246" r="12" fill="#EA580C"/>
  <text x="64" y="250" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="800" fill="#FFF">3</text>
  <text x="86" y="242" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#EA580C">正しい量</text>
  <text x="86" y="256" font-family="system-ui,sans-serif" font-size="8" fill="#6B7280">Dosis yang benar</text>
  
  <!-- Right 4 -->
  <rect x="40" y="276" width="338" height="44" rx="8" fill="#FFF" stroke="#FED7AA" stroke-width="1.5"/>
  <circle cx="64" cy="298" r="12" fill="#EA580C"/>
  <text x="64" y="302" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="800" fill="#FFF">4</text>
  <text x="86" y="294" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#EA580C">正しい時間</text>
  <text x="86" y="308" font-family="system-ui,sans-serif" font-size="8" fill="#6B7280">Waktu yang benar</text>
  
  <!-- Right 5 -->
  <rect x="40" y="328" width="338" height="44" rx="8" fill="#FFF" stroke="#FED7AA" stroke-width="1.5"/>
  <circle cx="64" cy="350" r="12" fill="#EA580C"/>
  <text x="64" y="354" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="800" fill="#FFF">5</text>
  <text x="86" y="346" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#EA580C">正しい方法</text>
  <text x="86" y="360" font-family="system-ui,sans-serif" font-size="8" fill="#6B7280">Cara yang benar</text>
  
  <!-- Right: Medication Schedule -->
  <rect x="406" y="72" width="370" height="180" rx="12" fill="#FFF" filter="url(#shadow-md)"/>
  <rect x="406" y="72" width="370" height="44" rx="12" fill="#FFF7ED"/>
  <rect x="406" y="104" width="370" height="12" fill="#FFF7ED"/>
  <text x="591" y="100" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#EA580C">服薬スケジュール (Jadwal)</text>
  
  <rect x="422" y="120" width="338" height="32" rx="6" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
  <text x="434" y="140" font-family="system-ui,sans-serif" font-size="10" fill="#DC2626">🌅 朝 (Pagi) · 7:00 — 3錠</text>
  
  <rect x="422" y="158" width="338" height="32" rx="6" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1"/>
  <text x="434" y="178" font-family="system-ui,sans-serif" font-size="10" fill="#EA580C">☀️ 昼 (Siang) · 12:00 — 2錠</text>
  
  <rect x="422" y="196" width="338" height="32" rx="6" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
  <text x="434" y="216" font-family="system-ui,sans-serif" font-size="10" fill="#16A34A">🌙 夕 (Malam) · 18:00 — 2錠</text>
  
  <rect x="422" y="234" width="338" height="32" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="434" y="254" font-family="system-ui,sans-serif" font-size="10" fill="#2563EB">🌑 就寝前 (Sebelum Tidur) · 22:00 — 1錠</text>
  
  <!-- Right: Safety Points -->
  <rect x="406" y="264" width="370" height="158" rx="12" fill="#FFF" filter="url(#shadow-md)"/>
  <rect x="406" y="264" width="370" height="44" rx="12" fill="#FFF7ED"/>
  <rect x="406" y="296" width="370" height="12" fill="#FFF7ED"/>
  <text x="591" y="292" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#EA580C">注意事項 (Hal Penting)</text>
  
  <text x="422" y="324" font-family="system-ui,sans-serif" font-size="10" fill="#374151">✓ 二重投薬を確認</text>
  <text x="422" y="344" font-family="system-ui,sans-serif" font-size="10" fill="#374151">✓ 副作用の観察</text>
  <text x="422" y="364" font-family="system-ui,sans-serif" font-size="10" fill="#374151">✓ 残薬の確認</text>
  <text x="422" y="384" font-family="system-ui,sans-serif" font-size="10" fill="#374151">✓ 飲み忘れ防止</text>
  <text x="590" y="324" font-family="system-ui,sans-serif" font-size="10" fill="#374151">✓ 記録の確認</text>
  <text x="590" y="344" font-family="system-ui,sans-serif" font-size="10" fill="#374151">✓ 上司への報告</text>
  <text x="590" y="364" font-family="system-ui,sans-serif" font-size="10" fill="#374151">✓ 利用者への説明</text>
  <text x="590" y="384" font-family="system-ui,sans-serif" font-size="10" fill="#374151">✓ 保管管理</text>
</svg>
