  <rect x="58" y="120" width="44" height="15" rx="3" fill="#FEE2E2"/>
  <rect x="58" y="140" width="44" height="15" rx="3" fill="#D1FAE5"/>
  
  <rect x="130" y="80" width="60" height="100" rx="8" fill="#FFF" stroke="#6366F1" stroke-width="2"/>
  <rect x="135" y="70" width="50" height="18" rx="4" fill="#C7D2FE" stroke="#6366F1" stroke-width="1.5"/>
  <text x="160" y="105" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#4338CA">昼</text>
  <rect x="138" y="120" width="44" height="15" rx="3" fill="#FEF3C7"/>
  
  <rect x="210" y="80" width="60" height="100" rx="8" fill="#FFF" stroke="#6366F1" stroke-width="2"/>
  <rect x="215" y="70" width="50" height="18" rx="4" fill="#C7D2FE" stroke="#6366F1" stroke-width="1.5"/>
  <text x="240" y="105" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#4338CA">夕</text>
  <rect x="218" y="120" width="44" height="15" rx="3" fill="#DBEAFE"/>
  <rect x="218" y="140" width="44" height="15" rx="3" fill="#FCE7F3"/>
  
  <!-- Water glass -->
  <path d="M290 120 L290 175 Q290 185 300 185 L330 185 Q340 185 340 175 L340 120Z" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  <path d="M295 140 Q315 135 335 140" fill="none" stroke="#93C5FD" stroke-width="1.5"/>
  
  <!-- Schedule card -->
  <rect x="360" y="40" width="210" height="200" rx="14" fill="#FFF" filter="url(#sh8)"/>
  <text x="465" y="68" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#4338CA">服薬スケジュール</text>
  
  <!-- Schedule rows -->
  <rect x="375" y="80" width="180" height="30" rx="6" fill="#FEF3C7"/>
  <text x="385" y="100" font-family="sans-serif" font-size="10" fill="#92400E">☀️ 朝食後 8:00</text>
  <text x="530" y="100" text-anchor="end" font-family="sans-serif" font-size="10" fill="#16A34A">✓ 済</text>
  
  <rect x="375" y="115" width="180" height="30" rx="6" fill="#F0FDF4"/>
  <text x="385" y="135" font-family="sans-serif" font-size="10" fill="#166534">🌤️ 昼食後 12:30</text>
  <text x="530" y="135" text-anchor="end" font-family="sans-serif" font-size="10" fill="#16A34A">✓ 済</text>
  
  <rect x="375" y="150" width="180" height="30" rx="6" fill="#EFF6FF"/>
  <text x="385" y="170" font-family="sans-serif" font-size="10" fill="#1E40AF">🌙 夕食後 18:00</text>
  <text x="530" y="170" text-anchor="end" font-family="sans-serif" font-size="10" fill="#F59E0B">○ 未</text>
  
  <rect x="375" y="185" width="180" height="30" rx="6" fill="#FDF2F8"/>
  <text x="385" y="205" font-family="sans-serif" font-size="10" fill="#9D174D">🛏️ 就寝前 21:00</text>
  <text x="530" y="205" text-anchor="end" font-family="sans-serif" font-size="10" fill="#F59E0B">○ 未</text>
  
  <!-- Safety checks -->
  <rect x="30" y="220" width="310" height="150" rx="14" fill="#FFF" filter="url(#sh8)"/>
  <text x="185" y="248" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#DC2626">服薬管理のポイント</text>
  
  <text x="50" y="275" font-family="sans-serif" font-size="10" fill="#334155">✓ 三回z cinco (三hsafdg) 五確認</text>
  <text x="50" y="293" font-family="sans-serif" font-size="10" fill="#334155">✓ お薬手帳を持参する</text>
  <text x="50" y="311" font-family="sans-serif" font-size="10" fill="#334155">✓ 剤量・服用時間を厳守</text>
  <text x="50" y="329" font-family="sans-serif" font-size="10" fill="#334155">✓ 副作用の観察（めまい・発疹等）</text>
  <text x="50" y="347" font-family="sans-serif" font-size="10" fill="#DC2626" font-weight="bold">✗ 自分で量を増減しない</text>
  <text x="50" y="365" font-family="sans-serif" font-size="10" fill="#DC2626" font-weight="bold">✗ 他のお薬と共用しない</text>
  
  <!-- Checkmarks -->
  <rect x="360" y="260" width="210" height="110" rx="14" fill="#FFF" filter="url(#sh8)"/>
  <text x="465" y="288" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#4338CA">確認事項</text>
  <text x="380" y="310" font-family="sans-serif" font-size="10" fill="#334155">名前 → 薬の名前か？</text>
  <text x="380" y="328" font-family="sans-serif" font-size="10" fill="#334155">時間 → 今の時間か？</text>
  <text x="380" y="346" font-family="sans-serif" font-size="10" fill="#334155">量 → 正しい量か？</text>
  <text x="380" y="364" font-family="sans-serif" font-size="10" fill="#334155">飲み方 → 水で飲むか？</text>
