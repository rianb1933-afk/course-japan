  <text x="316" y="246" font-family="system-ui, sans-serif" font-size="8" fill="#374155">飲み方 → 水で飲むか？</text>
  <text x="316" y="262" font-family="system-ui, sans-serif" font-size="8" fill="#374155">外观 → 変化はないか？</text>
  <text x="316" y="286" font-family="system-ui, sans-serif" font-size="9" fill="#0369A1" font-weight="600">→ 全てOK → 服用</text>
