<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg8" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFEBEE"/>
      <stop offset="100%" stop-color="#FFCDD2"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg8)"/>
  
  <!-- Fire -->
  <path d="M180 180 C180 140, 200 100, 200 80 C200 100, 220 120, 220 140 C220 120, 240 100, 230 80 C250 100, 240 140, 240 160 C240 200, 200 220, 200 220 C200 220, 180 200, 180 180Z" fill="#FF6D00" opacity="0.8"/>
  <path d="M195 180 C195 160, 210 140, 210 130 C210 140, 225 150, 225 160 C225 150, 235 140, 230 130 C240 140, 235 160, 235 170 C235 190, 210 200, 210 200 C210 200, 195 190, 195 180Z" fill="#FFAB00"/>
  
  <!-- Building -->
  <rect x="60" y="100" width="60" height="120" fill="#FFF" stroke="#999" stroke-width="2"/>
  <rect x="70" y="115" width="15" height="15" fill="#BBDEFB" stroke="#999" stroke-width="1"/>
  <rect x="95" y="115" width="15" height="15" fill="#BBDEFB" stroke="#999" stroke-width="1"/>
  <rect x="70" y="145" width="15" height="15" fill="#BBDEFB" stroke="#999" stroke-width="1"/>
  <rect x="95" y="145" width="15" height="15" fill="#BBDEFB" stroke="#999" stroke-width="1"/>
  <rect x="70" y="175" width="15" height="15" fill="#BBDEFB" stroke="#999" stroke-width="1"/>
  <rect x="95" y="175" width="15" height="15" fill="#BBDEFB" stroke="#999" stroke-width="1"/>
  
  <!-- Exit sign -->
  <rect x="280" y="100" width="60" height="30" rx="4" fill="#4CAF50"/>
  <text x="310" y="120" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFF">EXIT</text>
  
  <!-- Fire extinguisher -->
  <rect x="290" y="160" width="20" height="40" rx="4" fill="#F44336"/>
  <rect x="295" y="155" width="10" height="8" rx="2" fill="#333"/>
  <text x="300" y="185" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#FFF">消火器</text>
  
  <!-- People evacuating -->
  <circle cx="310" cy="230" r="8" fill="#FFCCBC"/>
  <line x1="310" y1="238" x2="310" y2="260" stroke="#333" stroke-width="2"/>
  <line x1="310" y1="245" x2="325" y2="255" stroke="#333" stroke-width="2"/>
  <circle cx="340" cy="235" r="8" fill="#FFCCBC"/>
  <line x1="340" y1="243" x2="340" y2="265" stroke="#333" stroke-width="2"/>
  
  <text x="200" y="285" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#B71C1C">火災・避難 (Fire & Evacuation)</text>
</svg>
