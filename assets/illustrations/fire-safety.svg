<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg-fire" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#FEF9C3"/>
    </linearGradient>
    <filter id="shadow-md" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.12"/>
    </filter>
  </defs>
  
  <rect width="800" height="450" fill="url(#bg-fire)" rx="16"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="800" height="56" fill="#D97706" rx="16"/>
  <rect x="0" y="40" width="800" height="16" fill="#D97706"/>
  <circle cx="40" cy="28" r="18" fill="rgba(255,255,255,0.15)"/>
  <text x="40" y="33" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16">🔥</text>
  <text x="70" y="34" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#FFF">火災時の対応 · Keselamatan Kebakaran · Fire Safety</text>
  
  <!-- Left: Building with evacuation -->
  <rect x="24" y="72" width="370" height="350" rx="12" fill="#FFF" filter="url(#shadow-md)"/>
  <rect x="24" y="72" width="370" height="44" rx="12" fill="#FEF9C3"/>
  <rect x="24" y="104" width="370" height="12" fill="#FEF9C3"/>
  <text x="209" y="100" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#D97706">避難マップ (Evakuasi)</text>
  
  <!-- Building -->
  <rect x="80" y="130" width="120" height="180" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/>
  <!-- Windows -->
  <rect x="95" y="145" width="30" height="25" rx="3" fill="#BFDBFE" stroke="#60A5FA" stroke-width="1"/>
  <rect x="155" y="145" width="30" height="25" rx="3" fill="#BFDBFE" stroke="#60A5FA" stroke-width="1"/>
  <rect x="95" y="180" width="30" height="25" rx="3" fill="#FECACA" stroke="#EF4444" stroke-width="1"/>
  <rect x="155" y="180" width="30" height="25" rx="3" fill="#BFDBFE" stroke="#60A5FA" stroke-width="1"/>
  <rect x="95" y="215" width="30" height="25" rx="3" fill="#BFDBFE" stroke="#60A5FA" stroke-width="1"/>
  <rect x="155" y="215" width="30" height="25" rx="3" fill="#BFDBFE" stroke="#60A5FA" stroke-width="1"/>
  <rect x="95" y="250" width="30" height="25" rx="3" fill="#BFDBFE" stroke="#60A5FA" stroke-width="1"/>
  <rect x="155" y="250" width="30" height="25" rx="3" fill="#BFDBFE" stroke="#60A5FA" stroke-width="1"/>
  <!-- Door -->
  <rect x="125" y="280" width="30" height="30" rx="2" fill="#16A34A" stroke="#15803D" stroke-width="1.5"/>
  <text x="140" y="298" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" font-weight="700" fill="#FFF">出口</text>
  
  <!-- Fire symbol -->
  <text x="190" y="195" font-family="system-ui,sans-serif" font-size="28">🔥</text>
  
  <!-- Evacuation arrow -->
  <path d="M170 290 L220 290 L220 270 L250 295 L220 320 L220 300 L170 300" fill="#16A34A" stroke="#16A34A" stroke-width="1.5"/>
  
  <!-- Labels -->
  <text x="209" y="340" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#374151">避難経路を確認</text>
  <text x="209" y="356" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#6B7280">Pastikan jalur evakuasi</text>
  
  <!-- Right: Evacuation Steps -->
  <rect x="406" y="72" width="370" height="350" rx="12" fill="#FFF" filter="url(#shadow-md)"/>
  <rect x="406" y="72" width="370" height="44" rx="12" fill="#FEF9C3"/>
  <rect x="406" y="104" width="370" height="12" fill="#FEF9C3"/>
  <text x="591" y="100" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#D97706">火災時の手順 (Langkah)</text>
  
  <!-- Step 1 -->
  <rect x="422" y="120" width="338" height="52" rx="8" fill="#FFF" stroke="#FEE2E2" stroke-width="1.5"/>
  <circle cx="446" cy="146" r="14" fill="#DC2626"/>
  <text x="446" y="150" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="800" fill="#FFF">1</text>
  <text x="470" y="140" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#DC2626">① 発見 → 通報 (Houkoku)</text>
  <text x="470" y="156" font-family="system-ui,sans-serif" font-size="8" fill="#6B7280">119番通報・上司に報告</text>
  
  <!-- Step 2 -->
  <rect x="422" y="180" width="338" height="52" rx="8" fill="#FFF" stroke="#FFF7ED" stroke-width="1.5"/>
  <circle cx="446" cy="206" r="14" fill="#EA580C"/>
  <text x="446" y="210" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="800" fill="#FFF">2</text>
  <text x="470" y="200" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#EA580C">② 消火 (Shouka)</text>
  <text x="470" y="216" font-family="system-ui,sans-serif" font-size="8" fill="#6B7280">消火器で初期消火</text>
  
  <!-- Step 3 -->
  <rect x="422" y="240" width="338" height="52" rx="8" fill="#FFF" stroke="#FEF3C7" stroke-width="1.5"/>
  <circle cx="446" cy="266" r="14" fill="#D97706"/>
  <text x="446" y="270" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="800" fill="#FFF">3</text>
  <text x="470" y="260" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#D97706">③ 避難 (Hinan)</text>
  <text x="470" y="276" font-family="system-ui,sans-serif" font-size="8" fill="#6B7280">利用者を安全な場所へ</text>
  
  <!-- Step 4 -->
  <rect x="422" y="300" width="338" height="52" rx="8" fill="#FFF" stroke="#D1FAE5" stroke-width="1.5"/>
  <circle cx="446" cy="326" r="14" fill="#16A34A"/>
  <text x="446" y="330" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="800" fill="#FFF">4</text>
  <text x="470" y="320" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#16A34A">④ 安否確認 (Anpi)</text>
  <text x="470" y="336" font-family="system-ui,sans-serif" font-size="8" fill="#6B7280">全員の安否を確認</text>
  
  <!-- Step 5 -->
  <rect x="422" y="360" width="338" height="52" rx="8" fill="#FFF" stroke="#BFDBFE" stroke-width="1.5"/>
  <circle cx="446" cy="386" r="14" fill="#2563EB"/>
  <text x="446" y="390" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="800" fill="#FFF">5</text>
  <text x="470" y="380" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#2563EB">⑤ 集合 (Shuugou)</text>
  <text x="470" y="396" font-family="system-ui,sans-serif" font-size="8" fill="#6B7280">指定の集合場所へ</text>
</svg>
