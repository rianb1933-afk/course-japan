<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg7" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FEF2F2"/>
      <stop offset="100%" stop-color="#FEE2E2"/>
    </linearGradient>
    <filter id="sh7" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>
  <rect width="600" height="400" rx="20" fill="url(#bg7)"/>
  
  <!-- Building -->
  <rect x="60" y="80" width="180" height="200" rx="4" fill="#FFF" stroke="#94A3B8" stroke-width="2"/>
  <!-- Windows -->
  <rect x="75" y="100" width="35" height="25" rx="2" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1"/>
  <rect x="125" y="100" width="35" height="25" rx="2" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1"/>
  <rect x="175" y="100" width="35" height="25" rx="2" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1"/>
  <rect x="75" y="140" width="35" height="25" rx="2" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="1"/>
  <rect x="125" y="140" width="35" height="25" rx="2" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1"/>
  <rect x="175" y="140" width="35" height="25" rx="2" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1"/>
  <rect x="75" y="180" width="35" height="25" rx="2" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1"/>
  <rect x="125" y="180" width="35" height="25" rx="2" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1"/>
  <rect x="175" y="180" width="35" height="25" rx="2" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1"/>
  
  <!-- Fire in window -->
  <path d="M82 130 C82 120, 90 115, 90 125 C90 118, 97 115, 95 125 C95 120, 102 118, 98 128 C98 125, 105 122, 100 132" fill="#EF4444" opacity="0.8"/>
  
  <!-- Fire alarm -->
  <circle cx="150" cy="70" r="10" fill="#EF4444"/>
  <text x="150" y="74" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="bold" fill="#FFF">119</text>
  
  <!-- Exit signs -->
  <rect x="100" y="260" width="50" height="20" rx="3" fill="#22C55E"/>
  <text x="125" y="274" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#FFF">EXIT</text>
  
  <!-- Fire extinguisher -->
  <rect x="260" y="100" width="25" height="60" rx="4" fill="#EF4444" stroke="#DC2626" stroke-width="1.5"/>
  <rect x="265" y="90" width="15" height="12" rx="3" fill="#64748B"/>
  <text x="272" y="135" text-anchor="middle" font-family="sans-serif" font-size="7" font-weight="bold" fill="#FFF">消火器</text>
  
  <!-- Evacuation steps -->
  <rect x="310" y="40" width="260" height="320" rx="14" fill="#FFF" filter="url(#sh7)"/>
  <text x="440" y="68" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#DC2626">避難手順</text>
  
  <!-- Step 1 -->
  <circle cx="340" cy="100" r="15" fill="#FEF2F2" stroke="#EF4444" stroke-width="2"/>
  <text x="340" y="105" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#DC2626">1</text>
  <text x="365" y="100" font-family="sans-serif" font-size="11" fill="#334155">火の始末（ガス・コンセント）</text>
  <text x="365" y="115" font-family="sans-serif" font-size="9" fill="#64748B">火元を確認して消す</text>
  
  <!-- Step 2 -->
  <circle cx="340" cy="145" r="15" fill="#FEF2F2" stroke="#EF4444" stroke-width="2"/>
  <text x="340" y="150" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#DC2626">2</text>
  <text x="365" y="145" font-family="sans-serif" font-size="11" fill="#334155">119番通報</text>
  <text x="365" y="160" font-family="sans-serif" font-size="9" fill="#64748B">住所・火災の状況を伝える</text>
  
  <!-- Step 3 -->
  <circle cx="340" cy="190" r="15" fill="#FEF2F2" stroke="#EF4444" stroke-width="2"/>
  <text x="340" y="195" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#DC2626">3</text>
  <text x="365" y="190" font-family="sans-serif" font-size="11" fill="#334155">利用者の誘導</text>
  <text x="365" y="205" font-family="sans-serif" font-size="9" fill="#64748B">声をかけ、安全に連れていく</text>
  
  <!-- Step 4 -->
  <circle cx="340" cy="235" r="15" fill="#FEF2F2" stroke="#EF4444" stroke-width="2"/>
  <text x="340" y="240" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#DC2626">4</text>
  <text x="365" y="235" font-family="sans-serif" font-size="11" fill="#334155">避難経路の確保</text>
  <text x="365" y="250" font-family="sans-serif" font-size="9" fill="#64748B">煙が少ない場所を選んで移動</text>
  
  <!-- Step 5 -->
  <circle cx="340" cy="280" r="15" fill="#FEF2F2" stroke="#EF4444" stroke-width="2"/>
  <text x="340" y="285" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#DC2626">5</text>
  <text x="365" y="280" font-family="sans-serif" font-size="11" fill="#334155">集合場所で人数確認</text>
  <text x="365" y="295" font-family="sans-serif" font-size="9" fill="#64748B">全員無事か確認、救急隊へ報告</text>
  
  <!-- Key points -->
  <rect x="325" y="310" width="230" height="40" rx="8" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
  <text x="440" y="335" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#DC2626">⚠️ 貴重品より人命を最優先に！</text>
  
  <!-- People evacuating -->
  <circle cx="60" cy="320" r="10" fill="#FDE68A" stroke="#D97706" stroke-width="1"/>
  <line x1="60" y1="330" x2="60" y2="350" stroke="#64748B" stroke-width="1.5"/>
  <circle cx="85" cy="325" r="10" fill="#FDE68A" stroke="#D97706" stroke-width="1"/>
  <line x1="85" y1="335" x2="85" y2="355" stroke="#64748B" stroke-width="1.5"/>
  <path d="M95 340 L115 340" fill="none" stroke="#22C55E" stroke-width="2" marker-end="url(#arrow-exit)"/>
  <defs>
    <marker id="arrow-exit" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10Z" fill="#22C55E"/>
    </marker>
  </defs>
  <text x="130" y="345" font-family="sans-serif" font-size="10" font-weight="bold" fill="#22C55E">安全な場所へ</text>
</svg>
