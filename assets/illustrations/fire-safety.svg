<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350">
  <rect width="600" height="350" fill="#FFF"/>
  
  <!-- Title -->
  <rect x="0" y="0" width="600" height="36" fill="#DC2626"/>
  <text x="300" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#FFF">火災・避難 · Fire Safety</text>
  
  <!-- Building -->
  <rect x="40" y="60" width="120" height="160" rx="2" fill="#FFF" stroke="#9CA3AF" stroke-width="1.5"/>
  <rect x="55" y="75" width="20" height="14" rx="1" fill="#DBEAFE"/>
  <rect x="85" y="75" width="20" height="14" rx="1" fill="#DBEAFE"/>
  <rect x="115" y="75" width="20" height="14" rx="1" fill="#DBEAFE"/>
  <rect x="55" y="100" width="20" height="14" rx="1" fill="#FEE2E2"/>
  <rect x="85" y="100" width="20" height="14" rx="1" fill="#DBEAFE"/>
  <rect x="115" y="100" width="20" height="14" rx="1" fill="#DBEAFE"/>
  <rect x="55" y="125" width="20" height="14" rx="1" fill="#DBEAFE"/>
  <rect x="85" y="125" width="20" height="14" rx="1" fill="#DBEAFE"/>
  <rect x="115" y="125" width="20" height="14" rx="1" fill="#DBEAFE"/>
  
  <!-- Alarm -->
  <circle cx="100" cy="50" r="7" fill="#EF4444"/>
  <text x="100" y="53" text-anchor="middle" font-family="system-ui, sans-serif" font-size="6" font-weight="600" fill="#FFF">119</text>
  
  <!-- Exit -->
  <rect x="80" y="205" width="40" height="12" rx="2" fill="#22C55E"/>
  <text x="100" y="214" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" font-weight="600" fill="#FFF">EXIT</text>
  
  <!-- Steps -->
  <rect x="180" y="52" width="200" height="170" rx="6" fill="#F9FAFB" stroke="#E5E7EB"/>
  <text x="280" y="74" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#DC2626">避難手順</text>
  
  <text x="196" y="98" font-family="system-ui, sans-serif" font-size="9" fill="#374155">① 火の始末（ガス・電気）</text>
  <text x="196" y="116" font-family="system-ui, sans-serif" font-size="9" fill="#374155">② 119番通報</text>
  <text x="196" y="134" font-family="system-ui, sans-serif" font-size="9" fill="#374155">③ 利用者の誘導</text>
  <text x="196" y="152" font-family="system-ui, sans-serif" font-size="9" fill="#374155">④ 避難経路の確保</text>
  <text x="196" y="170" font-family="system-ui, sans-serif" font-size="9" fill="#374155">⑤ 集合場所で人数確認</text>
  
  <rect x="196" y="182" width="168" height="24" rx="4" fill="#FEF2F2" stroke="#FECACA"/>
  <text x="280" y="198" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#DC2626">⚠ 貴重品より人命を最優先</text>
  
  <!-- Extinguisher -->
  <rect x="400" y="60" width="20" height="50" rx="3" fill="#EF4444" stroke="#DC2626" stroke-width="1.5"/>
  <rect x="405" y="52" width="10" height="8" rx="2" fill="#64748B"/>
  <text x="410" y="95" text-anchor="middle" font-family="system-ui, sans-serif" font-size="5" font-weight="600" fill="#FFF">消火器</text>
  
  <!-- Extinguisher steps -->
  <rect x="400" y="120" width="176" height="100" rx="6" fill="#F9FAFB" stroke="#E5E7EB"/>
  <text x="488" y="142" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#DC2626">消火器の使い方</text>
  
  <text x="416" y="166" font-family="system-ui, sans-serif" font-size="8" fill="#374155">① 安全栓を抜く</text>
  <text x="416" y="182" font-family="system-ui, sans-serif" font-size="8" fill="#374155">② ホースをのばす</text>
  <text x="416" y="198" font-family="system-ui, sans-serif" font-size="8" fill="#374155">③ ハンドルを握る</text>
  <text x="416" y="214" font-family="system-ui, sans-serif" font-size="8" fill="#374155">④ 炎の根元に向かって噴射</text>
  
  <!-- People evacuating -->
  <circle cx="60" cy="260" r="8" fill="#FDE68A" stroke="#D97706" stroke-width="1"/>
  <line x1="60" y1="268" x2="60" y2="285" stroke="#64748B" stroke-width="1.5"/>
  <circle cx="80" cy="262" r="8" fill="#FDE68A" stroke="#D97706" stroke-width="1"/>
  <line x1="80" y1="270" x2="80" y2="287" stroke="#64748B" stroke-width="1.5"/>
  <text x="100" y="275" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#22C55E">→ 安全な場所へ</text>
</svg>
