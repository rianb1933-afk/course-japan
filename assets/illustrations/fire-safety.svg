<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350">
  <rect width="600" height="350" rx="12" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1"/>
  
  <!-- Title -->
  <rect x="0" y="0" width="600" height="40" rx="12" fill="#DC2626"/>
  <rect x="0" y="20" width="600" height="20" fill="#DC2626"/>
  <text x="300" y="27" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFF">火災・避難 · Fire Safety · Kebakaran & Evakuasi</text>
  
  <!-- Building -->
  <rect x="40" y="70" width="140" height="180" rx="3" fill="#FFF" stroke="#9CA3AF" stroke-width="1.5"/>
  <!-- Windows -->
  <rect x="55" y="85" width="25" height="18" rx="1" fill="#DBEAFE"/>
  <rect x="90" y="85" width="25" height="18" rx="1" fill="#DBEAFE"/>
  <rect x="125" y="85" width="25" height="18" rx="1" fill="#DBEAFE"/>
  <rect x="55" y="115" width="25" height="18" rx="1" fill="#FEE2E2"/>
  <rect x="90" y="115" width="25" height="18" rx="1" fill="#DBEAFE"/>
  <rect x="125" y="115" width="25" height="18" rx="1" fill="#DBEAFE"/>
  <rect x="55" y="145" width="25" height="18" rx="1" fill="#DBEAFE"/>
  <rect x="90" y="145" width="25" height="18" rx="1" fill="#DBEAFE"/>
  <rect x="125" y="145" width="25" height="18" rx="1" fill="#DBEAFE"/>
  
  <!-- Fire in window -->
  <path d="M58 108 C58 102, 65 98, 65 104 C65 100, 70 98, 68 106" fill="#EF4444" opacity="0.8"/>
  
  <!-- Fire alarm -->
  <circle cx="110" cy="60" r="8" fill="#EF4444"/>
  <text x="110" y="64" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="#FFF">119</text>
  
  <!-- Exit sign -->
  <rect x="85" y="235" width="40" height="15" rx="2" fill="#22C55E"/>
  <text x="105" y="246" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#FFF">EXIT</text>
  
  <!-- Evacuation steps -->
  <rect x="200" y="55" width="200" height="200" rx="10" fill="#FFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="300" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#DC2626">避難手順</text>
  <line x1="210" y1="85" x2="390" y2="85" stroke="#E5E7EB" stroke-width="1"/>
  
  <text x="215" y="108" font-family="Arial, sans-serif" font-size="10" fill="#374151">① 火の始末（ガス・電気）</text>
  <text x="215" y="130" font-family="Arial, sans-serif" font-size="10" fill="#374151">② 119番通報</text>
  <text x="215" y="152" font-family="Arial, sans-serif" font-size="10" fill="#374151">③ 利用者の誘導</text>
  <text x="215" y="174" font-family="Arial, sans-serif" font-size="10" fill="#374151">④ 避難経路の確保</text>
  <text x="215" y="196" font-family="Arial, sans-serif" font-size="10" fill="#374151">⑤ 集合場所で人数確認</text>
  
  <rect x="215" y="205" width="170" height="30" rx="5" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
  <text x="300" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#DC2626">⚠️ 貴重品より人命を最優先</text>
  
  <!-- Fire extinguisher -->
  <rect x="420" y="70" width="25" height="55" rx="4" fill="#EF4444" stroke="#DC2626" stroke-width="1.5"/>
  <rect x="425" y="62" width="15" height="10" rx="3" fill="#64748B"/>
  <text x="432" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" font-weight="bold" fill="#FFF">消火器</text>
  
  <!-- Key points -->
  <rect x="420" y="140" width="160" height="115" rx="8" fill="#FFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="500" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#DC2626">消火器の使い方</text>
  <line x1="430" y1="168" x2="570" y2="168" stroke="#E5E7EB" stroke-width="1"/>
  
  <text x="435" y="188" font-family="Arial, sans-serif" font-size="9" fill="#374151">① 安全栓を抜く</text>
  <text x="435" y="205" font-family="Arial, sans-serif" font-size="9" fill="#374151">② ホースをのばす</text>
  <text x="435" y="222" font-family="Arial, sans-serif" font-size="9" fill="#374151">③ ハンドルを握る</text>
  <text x="435" y="239" font-family="Arial, sans-serif" font-size="9" fill="#374151">④ 炎の根元に向かって噴射</text>
  
  <!-- People evacuating -->
  <circle cx="60" cy="290" r="10" fill="#FDE68A" stroke="#D97706" stroke-width="1"/>
  <line x1="60" y1="300" x2="60" y2="320" stroke="#64748B" stroke-width="1.5"/>
  <circle cx="85" cy="295" r="10" fill="#FDE68A" stroke="#D97706" stroke-width="1"/>
  <line x1="85" y1="305" x2="85" y2="325" stroke="#64748B" stroke-width="1.5"/>
  <text x="110" y="310" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#22C55E">→ 安全な場所へ</text>
</svg>
