<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg-social" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCE4EC"/>
      <stop offset="100%" stop-color="#F8BBD0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg-social)"/>
  
  <!-- Community circle -->
  <circle cx="200" cy="140" r="70" fill="none" stroke="#E91E63" stroke-width="2"/>
  
  <!-- People around -->
  <circle cx="200" cy="70" r="15" fill="#FFCCBC" stroke="#E91E63" stroke-width="2"/>
  <text x="200" y="74" text-anchor="middle" font-size="12">👴</text>
  
  <circle cx="260" cy="110" r="15" fill="#FFCCBC" stroke="#E91E63" stroke-width="2"/>
  <text x="260" y="114" text-anchor="middle" font-size="12">👩</text>
  
  <circle cx="260" cy="170" r="15" fill="#FFCCBC" stroke="#E91E63" stroke-width="2"/>
  <text x="260" y="174" text-anchor="middle" font-size="12">👨</text>
  
  <circle cx="200" cy="210" r="15" fill="#FFCCBC" stroke="#E91E63" stroke-width="2"/>
  <text x="200" y="214" text-anchor="middle" font-size="12">👧</text>
  
  <circle cx="140" cy="170" r="15" fill="#FFCCBC" stroke="#E91E63" stroke-width="2"/>
  <text x="140" y="174" text-anchor="middle" font-size="12">👦</text>
  
  <circle cx="140" cy="110" r="15" fill="#FFCCBC" stroke="#E91E63" stroke-width="2"/>
  <text x="140" y="114" text-anchor="middle" font-size="12">👵</text>
  
  <!-- Center heart -->
  <text x="200" y="145" text-anchor="middle" font-size="24">❤️</text>
  
  <!-- Welfare icons -->
  <text x="50" y="140" font-size="18">🏛️</text>
  <text x="340" y="140" font-size="18">💰</text>
  
  <text x="200" y="260" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#880E4F">社会福祉 (Social Welfare)</text>
  <text x="200" y="280" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#AD1457">地域包括ケアシステム</text>
</svg>
