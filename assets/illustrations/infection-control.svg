<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <filter id="sh5" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>
  <rect width="600" height="400" rx="20" fill="url(#bg5)"/>
  
  <!-- Hand washing steps -->
  <rect x="30" y="30" width="260" height="340" rx="14" fill="#FFF" filter="url(#sh5)"/>
  <text x="160" y="58" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1E40AF">手洗いの手順 (7つのステップ)</text>
  
  <!-- Hand with water -->
  <ellipse cx="80" cy="110" rx="30" ry="22" fill="#FDE68A" stroke="#D97706" stroke-width="1.5"/>
  <path d="M60 95 Q65 80 70 95" fill="none" stroke="#60A5FA" stroke-width="1.5"/>
  <path d="M80 90 Q85 75 90 90" fill="none" stroke="#60A5FA" stroke-width="1.5"/>
  <circle cx="70" cy="85" r="2" fill="#93C5FD"/>
  <circle cx="85" cy="80" r="2.5" fill="#93C5FD"/>
  <circle cx="75" cy="78" r="1.5" fill="#93C5FD"/>
  
  <!-- Soap bubbles -->
  <circle cx="95" cy="105" r="4" fill="#FFF" stroke="#93C5FD" stroke-width="0.5" opacity="0.7"/>
  <circle cx="100" cy="115" r="3" fill="#FFF" stroke="#93C5FD" stroke-width="0.5" opacity="0.6"/>
  <circle cx="88" cy="120" r="3.5" fill="#FFF" stroke="#93C5FD" stroke-width="0.5" opacity="0.7"/>
  
  <text x="160" y="100" font-family="sans-serif" font-size="10" fill="#334155">① 手を濡らす</text>
  <text x="160" y="115" font-family="sans-serif" font-size="10" fill="#334155">② 石鹸を泡立てる</text>
  <text x="160" y="130" font-family="sans-serif" font-size="10" fill="#334155">③ 手のひらを洗う</text>
  <text x="160" y="145" font-family="sans-serif" font-size="10" fill="#334155">④ 指の間を洗う</text>
  <text x="160" y="160" font-family="sans-serif" font-size="10" fill="#334155">⑤ 指先・爪を洗う</text>
  <text x="160" y="175" font-family="sans-serif" font-size="10" fill="#334155">⑥ 手首を洗う</text>
  <text x="160" y="190" font-family="sans-serif" font-size="10" fill="#1E40AF" font-weight="bold">⑦ 水で流し、乾燥</text>
  
  <!-- Timer -->
  <rect x="60" y="205" width="200" height="40" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
  <text x="160" y="222" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1E40AF">⏱ 20秒以上洗う</text>
  <text x="160" y="237" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#64748B">Mencuci minimal 20 detik</text>
  
  <!-- Key points -->
  <rect x="60" y="260" width="200" height="90" rx="8" fill="#FEF2F2"/>
  <text x="80" y="282" font-family="sans-serif" font-size="10" fill="#DC2626">❌ 指輪・ネイルは外す</text>
  <text x="80" y="300" font-family="sans-serif" font-size="10" fill="#DC2626">❌ 手拭きは共用しない</text>
  <text x="80" y="318" font-family="sans-serif" font-size="10" fill="#16A34A">✓ アルコール消毒も有効</text>
  <text x="80" y="336" font-family="sans-serif" font-size="10" fill="#16A34A">✓ 石鹸が最優先</text>
  
  <!-- PPE section -->
  <rect x="310" y="30" width="260" height="160" rx="14" fill="#FFF" filter="url(#sh5)"/>
  <text x="440" y="58" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1E40AF">保護具 (PPE)</text>
  
  <!-- Mask -->
  <rect x="330" y="70" width="70" height="50" rx="10" fill="#F0F9FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="365" y="92" text-anchor="middle" font-size="22">😷</text>
  <text x="365" y="112" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#334155">マスク</text>
  
  <!-- Gloves -->
  <rect x="415" y="70" width="70" height="50" rx="10" fill="#F0F9FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="450" y="92" text-anchor="middle" font-size="22">🧤</text>
  <text x="450" y="112" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#334155">手袋</text>
  
  <!-- Gown -->
  <rect x="500" y="70" width="70" height="50" rx="10" fill="#F0F9FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="535" y="92" text-anchor="middle" font-size="22">🥼</text>
  <text x="535" y="112" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#334155">ガウン</text>
  
  <!-- When to use -->
  <rect x="330" y="130" width="240" height="45" rx="8" fill="#EFF6FF"/>
  <text x="450" y="148" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1E40AF">接触隔離・飛沫隔離時に着用</text>
  <text x="450" y="165" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#64748B">接触・飛沫伝播予防のため</text>
  
  <!-- Microorganisms -->
  <rect x="310" y="210" width="260" height="160" rx="14" fill="#FFF" filter="url(#sh5)"/>
  <text x="440" y="238" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1E40AF">感染経路</text>
  
  <!-- Three routes -->
  <circle cx="365" cy="290" r="25" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="365" y="286" text-anchor="middle" font-size="14">💨</text>
  <text x="365" y="300" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#DC2626">飛沫</text>
  
  <circle cx="440" cy="290" r="25" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="440" y="286" text-anchor="middle" font-size="14">🤚</text>
  <text x="440" y="300" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#DC2626">接触</text>
  
  <circle cx="515" cy="290" r="25" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="515" y="286" text-anchor="middle" font-size="14">🫁</text>
  <text x="515" y="300" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#DC2626">空気</text>
  
  <text x="440" y="340" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748B">飛沫 → マスク | 接触 → 手洗い</text>
  <text x="440" y="355" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748B">空気 → N95マスク・個室</text>
</svg>
