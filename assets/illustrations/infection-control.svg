<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg-ic" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#FEF9C3"/>
    </linearGradient>
    <filter id="shadow-md" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.12"/>
    </filter>
  </defs>
  
  <rect width="800" height="450" fill="url(#bg-ic)" rx="16"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="800" height="56" fill="#D97706" rx="16"/>
  <rect x="0" y="40" width="800" height="16" fill="#D97706"/>
  <circle cx="40" cy="28" r="18" fill="rgba(255,255,255,0.15)"/>
  <text x="40" y="33" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16">🛡️</text>
  <text x="70" y="34" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#FFF">感染対策 · Pencegahan Infeksi · Infection Control</text>
  
  <!-- Left: Handwashing 7 Steps -->
  <rect x="24" y="72" width="380" height="350" rx="12" fill="#FFF" filter="url(#shadow-md)"/>
  <rect x="24" y="72" width="380" height="44" rx="12" fill="#FEF9C3"/>
  <rect x="24" y="104" width="380" height="12" fill="#FEF9C3"/>
  <text x="214" y="100" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#D97706">手洗い7つのステップ (7 Langkah)</text>
  
  <!-- Step 1 -->
  <rect x="40" y="128" width="160" height="50" rx="8" fill="#FFF" stroke="#FEF3C7" stroke-width="1.5"/>
  <circle cx="58" cy="153" r="12" fill="#D97706"/>
  <text x="58" y="157" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="#FFF">1</text>
  <text x="80" y="148" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#374151">手掌を洗う</text>
  <text x="80" y="162" font-family="system-ui,sans-serif" font-size="8" fill="#6B7280">手掌 (Telapak Tangan)</text>
  
  <!-- Step 2 -->
  <rect x="210" y="128" width="160" height="50" rx="8" fill="#FFF" stroke="#FEF3C7" stroke-width="1.5"/>
  <circle cx="228" cy="153" r="12" fill="#D97706"/>
  <text x="228" y="157" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="#FFF">2</text>
  <text x="250" y="148" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#374151">手の甲を洗う</text>
  <text x="250" y="162" font-family="system-ui,sans-serif" font-size="8" fill="#6B7280">手の甲 (Punggung Tangan)</text>
  
  <!-- Step 3 -->
  <rect x="40" y="186" width="160" height="50" rx="8" fill="#FFF" stroke="#FEF3C7" stroke-width="1.5"/>
  <circle cx="58" cy="211" r="12" fill="#D97706"/>
  <text x="58" y="215" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="#FFF">3</text>
  <text x="80" y="206" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#374151">指の間を洗う</text>
  <text x="80" y="220" font-family="system-ui,sans-serif" font-size="8" fill="#6B7280">指の間 (Sela Jari)</text>
  
  <!-- Step 4 -->
  <rect x="210" y="186" width="160" height="50" rx="8" fill="#FFF" stroke="#FEF3C7" stroke-width="1.5"/>
  <circle cx="228" cy="211" r="12" fill="#D97706"/>
  <text x="228" y="215" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="#FFF">4</text>
  <text x="250" y="206" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#374151">指先を洗う</text>
  <text x="250" y="220" font-family="system-ui,sans-serif" font-size="8" fill="#6B7280">指先 (Ujung Jari)</text>
  
  <!-- Step 5 -->
  <rect x="40" y="244" width="160" height="50" rx="8" fill="#FFF" stroke="#FEF3C7" stroke-width="1.5"/>
  <circle cx="58" cy="269" r="12" fill="#D97706"/>
  <text x="58" y="273" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="#FFF">5</text>
  <text x="80" y="264" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#374151">親指を洗う</text>
  <text x="80" y="278" font-family="system-ui,sans-serif" font-size="8" fill="#6B7280">親指 (Ibu Jari)</text>
  
  <!-- Step 6 -->
  <rect x="210" y="244" width="160" height="50" rx="8" fill="#FFF" stroke="#FEF3C7" stroke-width="1.5"/>
  <circle cx="228" cy="269" r="12" fill="#D97706"/>
  <text x="228" y="273" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="#FFF">6</text>
  <text x="250" y="264" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#374151">爪先を洗う</text>
  <text x="250" y="278" font-family="system-ui,sans-serif" font-size="8" fill="#6B7280">爪先 (Kuku Jari)</text>
  
  <!-- Step 7 -->
  <rect x="40" y="302" width="330" height="50" rx="8" fill="#FFF" stroke="#FEF3C7" stroke-width="1.5"/>
  <circle cx="58" cy="327" r="12" fill="#D97706"/>
  <text x="58" y="331" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="#FFF">7</text>
  <text x="80" y="322" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#374151">手首を洗う</text>
  <text x="80" y="336" font-family="system-ui,sans-serif" font-size="8" fill="#6B7280">手首 (Pergelangan Tangan)</text>
  
  <!-- Time -->
  <rect x="40" y="362" width="330" height="50" rx="8" fill="#FFFBEB" stroke="#FEF3C7" stroke-width="1"/>
  <text x="205" y="384" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#D97706">⏱ 目安: 30秒以上 (Minimal 30 detik)</text>
  <text x="205" y="400" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#6B7280">石鹸を使用し、流水でしっかりすすぐ</text>
  
  <!-- Right: Infection Routes -->
  <rect x="416" y="72" width="360" height="180" rx="12" fill="#FFF" filter="url(#shadow-md)"/>
  <rect x="416" y="72" width="360" height="44" rx="12" fill="#FEF9C3"/>
  <rect x="416" y="104" width="360" height="12" fill="#FEF9C3"/>
  <text x="596" y="100" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#D97706">感染経路 (Jalur Penularan)</text>
  
  <rect x="432" y="128" width="328" height="40" rx="6" fill="#FEF2F2" stroke="#FECACA"/>
  <text x="444" y="148" font-family="system-ui,sans-serif" font-size="10" fill="#DC2626">💧 飛沫感染 (Droplet) — 咳・くしゃみ</text>
  
  <rect x="432" y="176" width="328" height="40" rx="6" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="444" y="196" font-family="system-ui,sans-serif" font-size="10" fill="#2563EB">🌫️ 空気感染 (Airborne) — 結核など</text>
  
  <rect x="432" y="224" width="328" height="40" rx="6" fill="#F0FDF4" stroke="#BBF7D0"/>
  <text x="444" y="244" font-family="system-ui,sans-serif" font-size="10" fill="#16A34A">🤝 接触感染 (Contact) — 触れた物</text>
  
  <!-- Right: PPE -->
  <rect x="416" y="264" width="360" height="158" rx="12" fill="#FFF" filter="url(#shadow-md)"/>
  <rect x="416" y="264" width="360" height="44" rx="12" fill="#FEF9C3"/>
  <rect x="416" y="296" width="360" height="12" fill="#FEF9C3"/>
  <text x="596" y="292" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#D97706">個人防護具 (PPE)</text>
  
  <rect x="432" y="316" width="154" height="44" rx="6" fill="#FFF" stroke="#E5E7EB"/>
  <text x="509" y="332" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#374151">🧤 グローブ</text>
  <text x="509" y="348" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#6B7280">手袋</text>
  
  <rect x="598" y="316" width="164" height="44" rx="6" fill="#FFF" stroke="#E5E7EB"/>
  <text x="680" y="332" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#374151">😷 マスク</text>
  <text x="680" y="348" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#6B7280">マスク</text>
  
  <rect x="432" y="368" width="154" height="44" rx="6" fill="#FFF" stroke="#E5E7EB"/>
  <text x="509" y="384" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#374151">🥽 ゴーグル</text>
  <text x="509" y="400" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#6B7280">ゴーグル</text>
  
  <rect x="598" y="368" width="164" height="44" rx="6" fill="#FFF" stroke="#E5E7EB"/>
  <text x="680" y="384" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#374151">👕 ギウン</text>
  <text x="680" y="400" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#6B7280">ギウン</text>
</svg>
