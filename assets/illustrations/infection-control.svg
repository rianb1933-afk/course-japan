<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E3F2FD"/>
      <stop offset="100%" stop-color="#BBDEFB"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg6)"/>
  
  <!-- Hand washing -->
  <circle cx="100" cy="100" r="35" fill="#FFF" stroke="#1565C0" stroke-width="2"/>
  <text x="100" y="95" text-anchor="middle" font-size="24">🧼</text>
  <text x="100" y="120" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">手洗い</text>
  
  <!-- Mask -->
  <circle cx="200" cy="100" r="35" fill="#FFF" stroke="#1565C0" stroke-width="2"/>
  <text x="200" y="95" text-anchor="middle" font-size="24">😷</text>
  <text x="200" y="120" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">マスク</text>
  
  <!-- PPE -->
  <circle cx="300" cy="100" r="35" fill="#FFF" stroke="#1565C0" stroke-width="2"/>
  <text x="300" y="95" text-anchor="middle" font-size="24">🥼</text>
  <text x="300" y="120" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">保護具</text>
  
  <!-- Germ representation -->
  <circle cx="150" cy="200" r="15" fill="#F44336" opacity="0.7"/>
  <circle cx="180" cy="210" r="10" fill="#F44336" opacity="0.5"/>
  <circle cx="220" cy="200" r="12" fill="#F44336" opacity="0.6"/>
  <circle cx="250" cy="210" r="8" fill="#F44336" opacity="0.4"/>
  
  <!-- X marks over germs -->
  <line x1="140" y1="190" x2="160" y2="210" stroke="#4CAF50" stroke-width="3"/>
  <line x1="160" y1="190" x2="140" y2="210" stroke="#4CAF50" stroke-width="3"/>
  <line x1="170" y1="200" x2="190" y2="220" stroke="#4CAF50" stroke-width="3"/>
  <line x1="190" y1="200" x2="170" y2="220" stroke="#4CAF50" stroke-width="3"/>
  
  <!-- Shield -->
  <path d="M200 160 L160 180 L160 220 L200 240 L240 220 L240 180 Z" fill="none" stroke="#4CAF50" stroke-width="3"/>
  
  <text x="200" y="275" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0D47A1">感染防止 (Infection Control)</text>
</svg>
