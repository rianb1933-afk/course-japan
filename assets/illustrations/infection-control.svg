<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350">
  <defs>
    <linearGradient id="bg-ic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FEF9C3"/>
      <stop offset="100%" stop-color="#FFF"/>
    </linearGradient>
  </defs>
  <rect width="600" height="350" fill="url(#bg-ic)" rx="12"/>
  
  <rect x="0" y="0" width="600" height="40" fill="#D97706" rx="12"/>
  <rect x="0" y="28" width="600" height="12" fill="#D97706"/>
  <text x="300" y="26" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#FFF">感染対策 · Pencegahan Infeksi · Infection Control</text>
  
  <!-- Left: Handwashing Steps -->
  <rect x="20" y="52" width="270" height="130" rx="10" fill="#FFF" stroke="#FEF3C7" stroke-width="1"/>
  <text x="155" y="72" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#374151">手洗い7つのステップ</text>
  
  <circle cx="50" cy="100" r="14" fill="#D97706"/><text x="50" y="104" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#FFF">1</text>
  <text x="50" y="125" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#6B7280">手掌</text>
  
  <circle cx="100" cy="100" r="14" fill="#D97706"/><text x="100" y="104" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#FFF">2</text>
  <text x="100" y="125" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#6B7280">手の甲</text>
  
  <circle cx="150" cy="100" r="14" fill="#D97706"/><text x="150" y="104" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#FFF">3</text>
  <text x="150" y="125" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#6B7280">指の間</text>
  
  <circle cx="200" cy="100" r="14" fill="#D97706"/><text x="200" y="104" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#FFF">4</text>
  <text x="200" y="125" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#6B7280">指先</text>
  
  <circle cx="250" cy="100" r="14" fill="#D97706"/><text x="250" y="104" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#FFF">5</text>
  <text x="250" y="125" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#6B7280">親指</text>
  
  <circle cx="75" cy="150" r="14" fill="#D97706"/><text x="75" y="154" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#FFF">6</text>
  <text x="75" y="172" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#6B7280">爪先</text>
  
  <circle cx="150" cy="150" r="14" fill="#D97706"/><text x="150" y="154" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#FFF">7</text>
  <text x="150" y="172" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#6B7280">手首</text>
  
  <!-- Right: PPE -->
  <rect x="310" y="52" width="270" height="130" rx="10" fill="#FFF" stroke="#FEF3C7" stroke-width="1"/>
  <text x="445" y="72" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#374151">個人防護具 (PPE)</text>
  
  <text x="340" y="100" font-family="system-ui,sans-serif" font-size="10" fill="#374151">🧤 グローブ → 手袋</text>
  <text x="340" y="118" font-family="system-ui,sans-serif" font-size="10" fill="#374151">😷 マスク → マスク</text>
  <text x="340" y="136" font-family="system-ui,sans-serif" font-size="10" fill="#374151">🥽 ゴーグル → ゴーグル</text>
  <text x="340" y="154" font-family="system-ui,sans-serif" font-size="10" fill="#374151">👕 ギウン → ギウン</text>
  <text x="340" y="172" font-family="system-ui,sans-serif" font-size="10" fill="#374151">👢 シューズ → シューズ</text>
  
  <!-- Bottom: Infection Routes -->
  <rect x="20" y="195" width="560" height="140" rx="10" fill="#FFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="300" y="218" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#374151">感染経路 (Jalur Penularan)</text>
  
  <rect x="40" y="228" width="150" height="95" rx="8" fill="#FFF" stroke="#FECACA"/>
  <text x="115" y="248" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18">💧</text>
  <text x="115" y="268" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#DC2626">飛沫感染</text>
  <text x="115" y="284" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#6B7280">Droplet</text>
  <text x="115" y="300" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#6B7280">咳・くしゃみ</text>
  
  <rect x="210" y="228" width="150" height="95" rx="8" fill="#FFF" stroke="#BFDBFE"/>
  <text x="285" y="248" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18">🌫️</text>
  <text x="285" y="268" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#2563EB">空気感染</text>
  <text x="285" y="284" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#6B7280">Airborne</text>
  <text x="285" y="300" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#6B7280">結核など</text>
  
  <rect x="380" y="228" width="150" height="95" rx="8" fill="#FFF" stroke="#D1FAE5"/>
  <text x="455" y="248" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18">🤝</text>
  <text x="455" y="268" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#16A34A">接触感染</text>
  <text x="455" y="284" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#6B7280">Contact</text>
  <text x="455" y="300" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#6B7280">触れた物</text>
</svg>