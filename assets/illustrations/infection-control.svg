<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350">
  <rect width="600" height="350" fill="#FFF"/>
  
  <!-- Title -->
  <rect x="0" y="0" width="600" height="36" fill="#0369A1"/>
  <text x="300" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#FFF">感染防止 · Infection Control</text>
  
  <!-- Hand washing -->
  <rect x="24" y="52" width="260" height="278" rx="6" fill="#F9FAFB" stroke="#E5E7EB"/>
  <text x="154" y="74" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0369A1">手洗い 7ステップ</text>
  
  <text x="40" y="100" font-family="system-ui, sans-serif" font-size="9" fill="#374155">① 手を濡らす</text>
  <text x="40" y="118" font-family="system-ui, sans-serif" font-size="9" fill="#374155">② 石鹸を泡立てる</text>
  <text x="40" y="136" font-family="system-ui, sans-serif" font-size="9" fill="#374155">③ 手のひらを洗う</text>
  <text x="40" y="154" font-family="system-ui, sans-serif" font-size="9" fill="#374155">④ 指の間を洗う</text>
  <text x="40" y="172" font-family="system-ui, sans-serif" font-size="9" fill="#374155">⑤ 指先・爪を洗う</text>
  <text x="40" y="190" font-family="system-ui, sans-serif" font-size="9" fill="#374155">⑥ 手首を洗う</text>
  <text x="40" y="208" font-family="system-ui, sans-serif" font-size="9" fill="#0369A1" font-weight="600">⑦ 水で流し、乾燥</text>
  
  <rect x="40" y="222" width="228" height="28" rx="4" fill="#DBEAFE"/>
  <text x="154" y="240" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#0369A1">⏱ 20秒以上 · 石鹸が最優先</text>
  
  <text x="40" y="268" font-family="system-ui, sans-serif" font-size="8" fill="#DC2626">✗ 指輪・ネイルは外す</text>
  <text x="40" y="284" font-family="system-ui, sans-serif" font-size="8" fill="#DC2626">✗ 手拭きは共用しない</text>
  <text x="40" y="300" font-family="system-ui, sans-serif" font-size="8" fill="#16A34A">✓ アルコール消毒も有効</text>
  
  <!-- PPE -->
  <rect x="300" y="52" width="130" height="100" rx="6" fill="#F9FAFB" stroke="#E5E7EB"/>
  <text x="365" y="74" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#0369A1">保護具 (PPE)</text>
  
  <rect x="315" y="82" width="50" height="36" rx="4" fill="#F0F9FF"/>
  <text x="340" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#0369A1">😷 マスク</text>
  
  <rect x="375" y="82" width="40" height="36" rx="4" fill="#F0F9FF"/>
  <text x="395" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#0369A1">🧤 手袋</text>
  
  <text x="365" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#6B7280">接触・飛沫隔離時に着用</text>
  
  <!-- Routes -->
  <rect x="444" y="52" width="132" height="100" rx="6" fill="#F9FAFB" stroke="#E5E7EB"/>
  <text x="510" y="74" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#0369A1">感染経路</text>
  
  <rect x="456" y="84" width="36" height="28" rx="4" fill="#FEE2E2"/>
  <text x="474" y="102" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#DC2626">💨 飛沫</text>
  
  <rect x="500" y="84" width="36" height="28" rx="4" fill="#FEE2E2"/>
  <text x="518" y="102" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#DC2626">🤚 接触</text>
  
  <rect x="544" y="84" width="24" height="28" rx="4" fill="#FEE2E2"/>
  <text x="556" y="102" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#DC2626">🫁</text>
  
  <text x="510" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#6B7280">飛沫→マスク</text>
  <text x="510" y="144" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#6B7280">接触→手洗い</text>
  
  <!-- Bottom: Key point -->
  <rect x="300" y="168" width="276" height="162" rx="6" fill="#F9FAFB" stroke="#E5E7EB"/>
  <text x="438" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#0369A1">感染防止の基本</text>
  
  <text x="316" y="216" font-family="system-ui, sans-serif" font-size="9" fill="#374155">① 手洗い (最も重要)</text>
  <text x="316" y="234" font-family="system-ui, sans-serif" font-size="9" fill="#374155">② マスク着用</text>
  <text x="316" y="252" font-family="system-ui, sans-serif" font-size="9" fill="#374155">③ 適切な隔離</text>
  <text x="316" y="270" font-family="system-ui, sans-serif" font-size="9" fill="#374155">④ 環境清掃</text>
  <text x="316" y="288" font-family="system-ui, sans-serif" font-size="9" fill="#374155">⑤ 健康管理</text>
  <text x="316" y="306" font-family="system-ui, sans-serif" font-size="9" fill="#374155">⑥ ワクチン接種</text>
</svg>
