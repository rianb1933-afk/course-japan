<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350">
  <rect width="600" height="350" rx="12" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1"/>
  
  <!-- Title -->
  <rect x="0" y="0" width="600" height="40" rx="12" fill="#0369A1"/>
  <rect x="0" y="20" width="600" height="20" fill="#0369A1"/>
  <text x="300" y="27" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFF">感染防止 · Infection Control · Pencegahan Infeksi</text>
  
  <!-- Hand washing steps -->
  <rect x="20" y="55" width="280" height="270" rx="10" fill="#FFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="160" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0369A1">手洗い 7ステップ</text>
  <line x1="30" y1="85" x2="290" y2="85" stroke="#E5E7EB" stroke-width="1"/>
  
  <!-- Steps -->
  <text x="40" y="108" font-family="Arial, sans-serif" font-size="10" fill="#374151">① 手を濡らす</text>
  <text x="40" y="128" font-family="Arial, sans-serif" font-size="10" fill="#374151">② 石鹸を泡立てる</text>
  <text x="40" y="148" font-family="Arial, sans-serif" font-size="10" fill="#374151">③ 手のひらを洗う</text>
  <text x="40" y="168" font-family="Arial, sans-serif" font-size="10" fill="#374151">④ 指の間を洗う</text>
  <text x="40" y="188" font-family="Arial, sans-serif" font-size="10" fill="#374151">⑤ 指先・爪を洗う</text>
  <text x="40" y="208" font-family="Arial, sans-serif" font-size="10" fill="#374151">⑥ 手首を洗う</text>
  <text x="40" y="228" font-family="Arial, sans-serif" font-size="10" fill="#0369A1" font-weight="bold">⑦ 水で流し、乾燥</text>
  
  <rect x="40" y="240" width="240" height="30" rx="6" fill="#EFF6FF"/>
  <text x="160" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#0369A1">⏱ 20秒以上 · 石鹸が最優先</text>
  
  <text x="40" y="290" font-family="Arial, sans-serif" font-size="9" fill="#DC2626">✗ 指輪・ネイルは外す</text>
  <text x="40" y="305" font-family="Arial, sans-serif" font-size="9" fill="#DC2626">✗ 手拭きは共用しない</text>
  <text x="160" y="290" font-family="Arial, sans-serif" font-size="9" fill="#16A34A">✓ アルコール消毒も有効</text>
  
  <!-- PPE section -->
  <rect x="315" y="55" width="265" height="120" rx="10" fill="#FFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="447" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0369A1">保護具 (PPE)</text>
  <line x1="325" y1="85" x2="570" y2="85" stroke="#E5E7EB" stroke-width="1"/>
  
  <rect x="330" y="95" width="75" height="55" rx="6" fill="#F0F9FF"/>
  <text x="367" y="118" text-anchor="middle" font-size="18">😷</text>
  <text x="367" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#374151">マスク</text>
  
  <rect x="415" y="95" width="75" height="55" rx="6" fill="#F0F9FF"/>
  <text x="452" y="118" text-anchor="middle" font-size="18">🧤</text>
  <text x="452" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#374151">手袋</text>
  
  <text x="447" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#6B7280">接触隔離・飛沫隔離時に着用</text>
  
  <!-- Infection routes -->
  <rect x="315" y="190" width="265" height="135" rx="10" fill="#FFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="447" y="213" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0369A1">感染経路</text>
  <line x1="325" y1="220" x2="570" y2="220" stroke="#E5E7EB" stroke-width="1"/>
  
  <rect x="330" y="230" width="70" height="50" rx="6" fill="#FEF2F2"/>
  <text x="365" y="252" text-anchor="middle" font-size="14">💨</text>
  <text x="365" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#DC2626">飛沫</text>
  
  <rect x="410" y="230" width="70" height="50" rx="6" fill="#FEF2F2"/>
  <text x="445" y="252" text-anchor="middle" font-size="14">🤚</text>
  <text x="445" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#DC2626">接触</text>
  
  <rect x="490" y="230" width="70" height="50" rx="6" fill="#FEF2F2"/>
  <text x="525" y="252" text-anchor="middle" font-size="14">🫁</text>
  <text x="525" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#DC2626">空気</text>
  
  <text x="447" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#6B7280">飛沫 → マスク | 接触 → 手洗い</text>
  <text x="447" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#6B7280">空気 → N95・個室隔離</text>
</svg>
