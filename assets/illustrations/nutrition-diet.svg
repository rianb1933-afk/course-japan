<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg-nutri" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF3E0"/>
      <stop offset="100%" stop-color="#FFE0B2"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg-nutri)"/>
  
  <!-- Food groups -->
  <circle cx="100" cy="100" r="35" fill="#FFF" stroke="#FF9800" stroke-width="2"/>
  <text x="100" y="90" text-anchor="middle" font-size="24">🍚</text>
  <text x="100" y="115" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">炭水化物</text>
  
  <circle cx="200" cy="80" r="35" fill="#FFF" stroke="#FF9800" stroke-width="2"/>
  <text x="200" y="70" text-anchor="middle" font-size="24">🥩</text>
  <text x="200" y="95" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">タンパク質</text>
  
  <circle cx="300" cy="100" r="35" fill="#FFF" stroke="#FF9800" stroke-width="2"/>
  <text x="300" y="90" text-anchor="middle" font-size="24">🥬</text>
  <text x="300" y="115" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">ビタミン</text>
  
  <!-- Meal tray -->
  <rect x="100" y="160" width="200" height="80" rx="10" fill="#FFF" stroke="#FF9800" stroke-width="2"/>
  <text x="200" y="195" text-anchor="middle" font-size="30">🍱</text>
  <text x="200" y="225" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#E65100">バランスの取れた食事</text>
  
  <text x="200" y="275" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#E65100">栄養・食事 (Nutrition & Diet)</text>
</svg>
