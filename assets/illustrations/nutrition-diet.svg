<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350">
  <defs>
    <linearGradient id="bg-nutri" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF7ED"/>
      <stop offset="100%" stop-color="#FFF"/>
    </linearGradient>
  </defs>
  <rect width="600" height="350" fill="url(#bg-nutri)" rx="12"/>
  <rect x="0" y="0" width="600" height="40" fill="#EA580C" rx="12"/>
  <rect x="0" y="28" width="600" height="12" fill="#EA580C"/>
  <text x="300" y="26" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#FFF">栄養管理 · Nutrisi · Nutrition Management</text>
  
  <!-- Left: Food Groups -->
  <rect x="20" y="52" width="260" height="180" rx="10" fill="#FFF" stroke="#FED7AA" stroke-width="1"/>
  <text x="150" y="72" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#374151">食事のバランス</text>
  
  <rect x="35" y="82" width="110" height="55" rx="6" fill="#FFF7ED" stroke="#FED7AA"/>
  <text x="90" y="100" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#EA580C">主食 (Carbs)</text>
  <text x="90" y="118" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#6B7280">ご飯・パン・麺</text>
  
  <rect x="155" y="82" width="110" height="55" rx="6" fill="#FEF2F2" stroke="#FECACA"/>
  <text x="210" y="100" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#DC2626">主菜 (Protein)</text>
  <text x="210" y="118" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#6B7280">肉・魚・卵・大豆</text>
  
  <rect x="35" y="145" width="110" height="55" rx="6" fill="#F0FDF4" stroke="#BBF7D0"/>
  <text x="90" y="163" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#16A34A">副菜 (Veggies)</text>
  <text x="90" y="181" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#6B7280">野菜・海藻</text>
  
  <rect x="155" y="145" width="110" height="55" rx="6" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="210" y="163" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#2563EB">乳製品 (Dairy)</text>
  <text x="210" y="181" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#6B7280">牛乳・ヨーグルト</text>
  
  <!-- Right: Meal Schedule -->
  <rect x="310" y="52" width="270" height="180" rx="10" fill="#FFF" stroke="#FED7AA" stroke-width="1"/>
  <text x="445" y="72" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#374151">食事スケジュール</text>
  
  <rect x="325" y="82" width="240" height="28" rx="6" fill="#FEF2F2" stroke="#FECACA"/>
  <text x="337" y="100" font-family="system-ui,sans-serif" font-size="10" fill="#DC2626">朝食 (Pagi) · 7:00-8:00</text>
  
  <rect x="325" y="115" width="240" height="28" rx="6" fill="#FFF7ED" stroke="#FED7AA"/>
  <text x="337" y="133" font-family="system-ui,sans-serif" font-size="10" fill="#EA580C">昼食 (Siang) · 12:00</text>
  
  <rect x="325" y="148" width="240" height="28" rx="6" fill="#F0FDF4" stroke="#BBF7D0"/>
  <text x="337" y="166" font-family="system-ui,sans-serif" font-size="10" fill="#16A34A">間食 (Snack) · 15:00</text>
  
  <rect x="325" y="181" width="240" height="28" rx="6" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="337" y="199" font-family="system-ui,sans-serif" font-size="10" fill="#2563EB">夕食 (Malam) · 18:00</text>
  
  <rect x="325" y="214" width="240" height="28" rx="6" fill="#F5F3FF" stroke="#E9D5FF"/>
  <text x="337" y="232" font-family="system-ui,sans-serif" font-size="10" fill="#7C3AED">間食 (Snack) · 21:00</text>
  
  <!-- Bottom: Nutrition Tips -->
  <rect x="20" y="250" width="560" height="85" rx="10" fill="#FFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="300" y="272" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#374151">栄養管理のポイント</text>
  <text x="300" y="300" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#6B7280">● バランスの取れた食事 ● 嚥下に合わせた食形態 ● 水分補給 ● 記録</text>
</svg>
