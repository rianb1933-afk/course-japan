<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350">
  <defs>
    <linearGradient id="bg-ae" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#FFF"/>
    </linearGradient>
  </defs>
  <rect width="600" height="350" fill="url(#bg-ae)" rx="12"/>
  <rect x="0" y="0" width="600" height="40" fill="#16A34A" rx="12"/>
  <rect x="0" y="28" width="600" height="12" fill="#16A34A"/>
  <text x="300" y="26" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#FFF">福祉用具 · Alat Bantu · Assistive Equipment</text>
  
  <!-- Left: Equipment Types -->
  <rect x="20" y="52" width="260" height="180" rx="10" fill="#FFF" stroke="#D1FAE5" stroke-width="1"/>
  <text x="150" y="72" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#374151">福祉用具の種類</text>
  
  <rect x="35" y="82" width="110" height="55" rx="6" fill="#F0FDF4" stroke="#BBF7D0"/>
  <text x="90" y="100" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#16A34A">車椅子</text>
  <text x="90" y="118" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#6B7280">移動支援</text>
  
  <rect x="155" y="82" width="110" height="55" rx="6" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="210" y="100" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#2563EB">ベッド</text>
  <text x="210" y="118" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#6B7280">特殊寝台</text>
  
  <rect x="35" y="145" width="110" height="55" rx="6" fill="#FFF7ED" stroke="#FED7AA"/>
  <text x="90" y="163" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#EA580C">杖</text>
  <text x="90" y="181" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#6B7280">歩行支援</text>
  
  <rect x="155" y="145" width="110" height="55" rx="6" fill="#F5F3FF" stroke="#E9D5FF"/>
  <text x="210" y="163" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#7C3AED">入浴台</text>
  <text x="210" y="181" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#6B7280">入浴支援</text>
  
  <!-- Right: Selection Points -->
  <rect x="310" y="52" width="270" height="180" rx="10" fill="#FFF" stroke="#D1FAE5" stroke-width="1"/>
  <text x="445" y="72" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#374151">選び方のポイント</text>
  
  <text x="325" y="100" font-family="system-ui,sans-serif" font-size="10" fill="#374151">1. 利用者の状態を確認</text>
  <text x="325" y="118" font-family="system-ui,sans-serif" font-size="10" fill="#374151">2. 介護者の負担を考慮</text>
  <text x="325" y="136" font-family="system-ui,sans-serif" font-size="10" fill="#374151">3. 居住環境を確認</text>
  <text x="325" y="154" font-family="system-ui,sans-serif" font-size="10" fill="#374151">4. 使用目的を明確に</text>
  <text x="325" y="172" font-family="system-ui,sans-serif" font-size="10" fill="#374151">5. 安全性を確認</text>
  <text x="325" y="190" font-family="system-ui,sans-serif" font-size="10" fill="#374151">6. 継続使用を検討</text>
  <text x="325" y="208" font-family="system-ui,sans-serif" font-size="10" fill="#374151">7. 定期点検を実施</text>
  
  <!-- Bottom: Rental Points -->
  <rect x="20" y="250" width="560" height="85" rx="10" fill="#FFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="300" y="272" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#374151">レンタル vs 購入</text>
  <text x="300" y="300" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#6B7280">● 特殊寝台・車椅子 → レンタル ● 腰掛け便座・入浴台 → 購入可能</text>
</svg>
