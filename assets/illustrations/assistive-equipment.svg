<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg-equip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E0F7FA"/>
      <stop offset="100%" stop-color="#B2EBF2"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg-equip)"/>
  
  <!-- Wheelchair -->
  <circle cx="100" cy="180" r="25" fill="none" stroke="#00838F" stroke-width="2"/>
  <path d="M100 180 L100 130 L140 130 L140 160" fill="none" stroke="#00838F" stroke-width="2"/>
  <circle cx="160" cy="190" r="10" fill="none" stroke="#00838F" stroke-width="2"/>
  
  <!-- Walker -->
  <line x1="200" y1="120" x2="200" y2="200" stroke="#00838F" stroke-width="3"/>
  <line x1="240" y1="120" x2="240" y2="200" stroke="#00838F" stroke-width="3"/>
  <line x1="195" y1="130" x2="245" y2="130" stroke="#00838F" stroke-width="3"/>
  <line x1="195" y1="200" x2="210" y2="200" stroke="#00838F" stroke-width="2"/>
  <line x1="230" y1="200" x2="245" y2="200" stroke="#00838F" stroke-width="2"/>
  
  <!-- Bed -->
  <rect x="280" y="140" width="80" height="50" rx="6" fill="#FFF" stroke="#00838F" stroke-width="2"/>
  <rect x="275" y="130" width="15" height="60" rx="4" fill="#FFF" stroke="#00838F" stroke-width="2"/>
  
  <!-- Labels -->
  <text x="100" y="230" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#333">車椅子</text>
  <text x="220" y="230" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#333">歩行器</text>
  <text x="320" y="230" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#333">ベッド</text>
  
  <text x="200" y="270" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#006064">福祉用具 (Assistive Equipment)</text>
</svg>
