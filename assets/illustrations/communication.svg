<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg-comm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F5F3FF"/>
    </linearGradient>
    <filter id="shadow-md" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.12"/>
    </filter>
  </defs>
  
  <rect width="800" height="450" fill="url(#bg-comm)" rx="16"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="800" height="56" fill="#7C3AED" rx="16"/>
  <rect x="0" y="40" width="800" height="16" fill="#7C3AED"/>
  <circle cx="40" cy="28" r="18" fill="rgba(255,255,255,0.15)"/>
  <text x="40" y="33" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16">💬</text>
  <text x="70" y="34" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#FFF">コミュニケーション · Komunikasi · Communication</text>
  
  <!-- Left: Communication Skills -->
  <rect x="24" y="72" width="370" height="350" rx="12" fill="#FFF" filter="url(#shadow-md)"/>
  <rect x="24" y="72" width="370" height="44" rx="12" fill="#F5F3FF"/>
  <rect x="24" y="104" width="370" height="12" fill="#F5F3FF"/>
  <text x="209" y="100" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#7C3AED">コミュニケーションスキル</text>
  
  <rect x="40" y="120" width="338" height="40" rx="8" fill="#FFF" stroke="#E9D5FF" stroke-width="1.5"/>
  <text x="52" y="145" font-family="system-ui,sans-serif" font-size="10" fill="#374151">👂 アクティブリスニング — 相手の話を最後まで聞く</text>
  
  <rect x="40" y="168" width="338" height="40" rx="8" fill="#FFF" stroke="#E9D5FF" stroke-width="1.5"/>
  <text x="52" y="193" font-family="system-ui,sans-serif" font-size="10" fill="#374151">🤝 共感的理解 — 相手の気持ちを受け止める</text>
  
  <rect x="40" y="216" width="338" height="40" rx="8" fill="#FFF" stroke="#E9D5FF" stroke-width="1.5"/>
  <text x="52" y="241" font-family="system-ui,sans-serif" font-size="10" fill="#374151">👁️ 非言語コミュニケーション — 表情・ジェスチャー</text>
  
  <rect x="40" y="264" width="338" height="40" rx="8" fill="#FFF" stroke="#E9D5FF" stroke-width="1.5"/>
  <text x="52" y="289" font-family="system-ui,sans-serif" font-size="10" fill="#374151">💬 明確な表現 — わかりやすく伝える</text>
  
  <rect x="40" y="312" width="338" height="40" rx="8" fill="#FFF" stroke="#E9D5FF" stroke-width="1.5"/>
  <text x="52" y="337" font-family="system-ui,sans-serif" font-size="10" fill="#374151">⏰ 相手のペースに合わせる — 焦らず待つ</text>
  
  <rect x="40" y="360" width="338" height="40" rx="8" fill="#FFF" stroke="#E9D5FF" stroke-width="1.5"/>
  <text x="52" y="385" font-family="system-ui,sans-serif" font-size="10" fill="#374151">😊 ポジティブな姿勢 — 笑顔で接する</text>
  
  <!-- Right: Practice Scenarios -->
  <rect x="406" y="72" width="370" height="180" rx="12" fill="#FFF" filter="url(#shadow-md)"/>
  <rect x="406" y="72" width="370" height="44" rx="12" fill="#F5F3FF"/>
  <rect x="406" y="104" width="370" height="12" fill="#F5F3FF"/>
  <text x="591" y="100" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#7C3AED">練習シナリオ</text>
  
  <rect x="422" y="120" width="338" height="32" rx="6" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
  <text x="434" y="140" font-family="system-ui,sans-serif" font-size="10" fill="#DC2626">👋 自己紹介 — 名前・所属・挨拶</text>
  
  <rect x="422" y="158" width="338" height="32" rx="6" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1"/>
  <text x="434" y="178" font-family="system-ui,sans-serif" font-size="10" fill="#EA580C">🏥 利用者への挨拶 — 丁寧な言葉遣い</text>
  
  <rect x="422" y="196" width="338" height="32" rx="6" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
  <text x="434" y="216" font-family="system-ui,sans-serif" font-size="10" fill="#16A34A">👨‍👩‍👦 家族への説明 — わかりやすく伝える</text>
  
  <rect x="422" y="234" width="338" height="32" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="434" y="254" font-family="system-ui,sans-serif" font-size="10" fill="#2563EB">📋 上司への報告 — 結論から先に</text>
  
  <!-- Right: Key Points -->
  <rect x="406" y="264" width="370" height="158" rx="12" fill="#FFF" filter="url(#shadow-md)"/>
  <rect x="406" y="264" width="370" height="44" rx="12" fill="#F5F3FF"/>
  <rect x="406" y="296" width="370" height="12" fill="#F5F3FF"/>
  <text x="591" y="292" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#7C3AED">ポイント</text>
  
  <text x="422" y="324" font-family="system-ui,sans-serif" font-size="10" fill="#374151">✓ 聞くことから始める</text>
  <text x="422" y="344" font-family="system-ui,sans-serif" font-size="10" fill="#374151">✓ 相手の目を見る</text>
  <text x="422" y="364" font-family="system-ui,sans-serif" font-size="10" fill="#374151">✓ わかりやすく話す</text>
  <text x="422" y="384" font-family="system-ui,sans-serif" font-size="10" fill="#374151">✓ 記録をつける</text>
  
  <text x="590" y="324" font-family="system-ui,sans-serif" font-size="10" fill="#374151">✓ チームと連携</text>
  <text x="590" y="344" font-family="system-ui,sans-serif" font-size="10" fill="#374151">✓ 困ったら相談</text>
  <text x="590" y="364" font-family="system-ui,sans-serif" font-size="10" fill="#374151">✓ 定期的な研修</text>
  <text x="590" y="384" font-family="system-ui,sans-serif" font-size="10" fill="#374151">✓ 継続的な改善</text>
</svg>
