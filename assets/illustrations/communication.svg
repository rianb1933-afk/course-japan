<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg-comm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8F5E9"/>
      <stop offset="100%" stop-color="#C8E6C9"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg-comm)"/>
  
  <!-- Two people talking -->
  <circle cx="120" cy="100" r="25" fill="#FFCCBC" stroke="#D84315" stroke-width="2"/>
  <line x1="120" y1="125" x2="120" y2="170" stroke="#333" stroke-width="2"/>
  <line x1="120" y1="140" x2="100" y2="160" stroke="#333" stroke-width="2"/>
  <line x1="120" y1="140" x2="140" y2="155" stroke="#333" stroke-width="2"/>
  
  <circle cx="280" cy="100" r="25" fill="#FFCCBC" stroke="#D84315" stroke-width="2"/>
  <line x1="280" y1="125" x2="280" y2="170" stroke="#333" stroke-width="2"/>
  <line x1="280" y1="140" x2="260" y2="155" stroke="#333" stroke-width="2"/>
  <line x1="280" y1="140" x2="300" y2="160" stroke="#333" stroke-width="2"/>
  
  <!-- Speech lines -->
  <path d="M150 80 Q200 60 250 80" fill="none" stroke="#4CAF50" stroke-width="2" stroke-dasharray="5,3"/>
  <path d="M150 95 Q200 75 250 95" fill="none" stroke="#4CAF50" stroke-width="2" stroke-dasharray="5,3"/>
  
  <!-- Connection heart -->
  <path d="M205 75 C205 68, 215 60, 220 68 C225 60, 235 68, 235 75 C235 90, 220 100, 220 100 C220 100, 205 90, 205 75Z" fill="#E53935" opacity="0.7" transform="translate(-20, 0)"/>
  
  <!-- Communication methods -->
  <rect x="60" y="190" width="80" height="40" rx="8" fill="#FFF" stroke="#4CAF50" stroke-width="2"/>
  <text x="100" y="210" text-anchor="middle" font-size="16">🗣️</text>
  <text x="100" y="225" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#333">対面</text>
  
  <rect x="160" y="190" width="80" height="40" rx="8" fill="#FFF" stroke="#4CAF50" stroke-width="2"/>
  <text x="200" y="210" text-anchor="middle" font-size="16">📝</text>
  <text x="200" y="225" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#333">記録</text>
  
  <rect x="260" y="190" width="80" height="40" rx="8" fill="#FFF" stroke="#4CAF50" stroke-width="2"/>
  <text x="300" y="210" text-anchor="middle" font-size="16">📱</text>
  <text x="300" y="225" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#333">連絡</text>
  
  <text x="200" y="270" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1B5E20">コミュニケーション (Communication)</text>
</svg>
