<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350">
  <rect width="600" height="350" fill="#FFF"/>
  
  <!-- Title -->
  <rect x="0" y="0" width="600" height="36" fill="#16A34A"/>
  <text x="300" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#FFF">リハビリテーション · Rehabilitation</text>
  
  <!-- Timeline -->
  <line x1="60" y1="100" x2="540" y2="100" stroke="#86EFAC" stroke-width="3"/>
  
  <!-- Nodes -->
  <circle cx="120" cy="100" r="16" fill="#FFF" stroke="#16A34A" stroke-width="2"/>
  <text x="120" y="104" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#16A34A">1</text>
  <text x="120" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#374155">急性期</text>
  <text x="120" y="142" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#9CA3AF">発症直後</text>
  
  <circle cx="240" cy="100" r="16" fill="#FFF" stroke="#16A34A" stroke-width="2"/>
  <text x="240" y="104" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#16A34A">2</text>
  <text x="240" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#374155">回復期</text>
  <text x="240" y="142" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#9CA3AF">集中的訓練</text>
  
  <circle cx="360" cy="100" r="16" fill="#FFF" stroke="#16A34A" stroke-width="2"/>
  <text x="360" y="104" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#16A34A">3</text>
  <text x="360" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#374155">維持期</text>
  <text x="360" y="142" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#9CA3AF">機能維持</text>
  
  <circle cx="480" cy="100" r="16" fill="#22C55E"/>
  <text x="480" y="104" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#FFF">✓</text>
  <text x="480" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#374155">生活期</text>
  <text x="480" y="142" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#9CA3AF">自立支援</text>
  
  <!-- Therapy types -->
  <rect x="24" y="160" width="180" height="170" rx="6" fill="#F9FAFB" stroke="#E5E7EB"/>
  <text x="114" y="182" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#16A34A">リハビリの種類</text>
  
  <text x="36" y="206" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#1E40AF">PT 理学療法士</text>
  <text x="36" y="220" font-family="system-ui, sans-serif" font-size="8" fill="#6B7280">歩行・筋力・関節可動域</text>
  
  <text x="36" y="244" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#7C3AED">OT 作業療法士</text>
  <text x="36" y="258" font-family="system-ui, sans-serif" font-size="8" fill="#6B7280">ADL・手の機能・認知</text>
  
  <text x="36" y="282" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#0369A1">ST 言語聴覚士</text>
  <text x="36" y="296" font-family="system-ui, sans-serif" font-size="8" fill="#6B7280">嚥下・言語・高次脳</text>
  
  <!-- Concepts -->
  <rect x="220" y="160" width="180" height="170" rx="6" fill="#F9FAFB" stroke="#E5E7EB"/>
  <text x="310" y="182" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#16A34A">重要概念</text>
  
  <text x="232" y="206" font-family="system-ui, sans-serif" font-size="9" fill="#374155">• ADL 自立支援</text>
  <text x="232" y="224" font-family="system-ui, sans-serif" font-size="9" fill="#374155">• 残存機能の活用</text>
  <text x="232" y="242" font-family="system-ui, sans-serif" font-size="9" fill="#374155">• 廃用症候群予防</text>
  <text x="232" y="260" font-family="system-ui, sans-serif" font-size="9" fill="#374155">• 生活リハビリ</text>
  <text x="232" y="278" font-family="system-ui, sans-serif" font-size="9" fill="#374155">• 多職種連携</text>
  
  <!-- 3 aspects -->
  <rect x="416" y="160" width="160" height="170" rx="6" fill="#F9FAFB" stroke="#E5E7EB"/>
  <text x="496" y="182" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#16A34A">3つの側面</text>
  
  <rect x="432" y="196" width="42" height="28" rx="4" fill="#DCFCE7"/>
  <text x="453" y="214" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#166534">身体的</text>
  
  <rect x="482" y="196" width="42" height="28" rx="4" fill="#DBEAFE"/>
  <text x="503" y="214" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#1E40AF">心理的</text>
  
  <rect x="532" y="196" width="30" height="28" rx="4" fill="#FCE7F3"/>
  <text x="547" y="214" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#9D174D">社会的</text>
  
  <text x="496" y="250" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#6B7280">全人的なアプローチ</text>
</svg>
