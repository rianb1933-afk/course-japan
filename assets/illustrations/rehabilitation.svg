<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#DCFCE7"/>
    </linearGradient>
    <filter id="sh4" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>
  <rect width="600" height="400" rx="20" fill="url(#bg4)"/>
  
  <!-- Progress timeline -->
  <line x1="80" y1="180" x2="520" y2="180" stroke="#86EFAC" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Stage 1: Bed -->
  <circle cx="120" cy="180" r="20" fill="#FFF" stroke="#16A34A" stroke-width="2.5" filter="url(#sh4)"/>
  <rect x="105" y="175" width="30" height="8" rx="2" fill="#BBF7D0" stroke="#16A34A" stroke-width="1.5"/>
  <text x="120" y="215" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#166534">急性期</text>
  <text x="120" y="228" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#64748B">Akut</text>
  
  <!-- Stage 2: Sitting -->
  <circle cx="220" cy="180" r="20" fill="#FFF" stroke="#16A34A" stroke-width="2.5" filter="url(#sh4)"/>
  <circle cx="220" cy="168" r="6" fill="#FDE68A" stroke="#D97706" stroke-width="1"/>
  <rect x="212" y="174" width="16" height="12" rx="2" fill="#BFDBFE" stroke="#3B82F6" stroke-width="1"/>
  <text x="220" y="215" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#166534">回復期</text>
  <text x="220" y="228" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#64748B">Pemulihan</text>
  
  <!-- Stage 3: Standing with support -->
  <circle cx="320" cy="180" r="20" fill="#FFF" stroke="#16A34A" stroke-width="2.5" filter="url(#sh4)"/>
  <circle cx="320" cy="162" r="6" fill="#FDE68A" stroke="#D97706" stroke-width="1"/>
  <line x1="320" y1="168" x2="320" y2="185" stroke="#64748B" stroke-width="2"/>
  <line x1="315" y1="175" x2="310" y2="185" stroke="#64748B" stroke-width="1.5"/>
  <line x1="325" y1="175" x2="335" y2="170" stroke="#64748B" stroke-width="1.5"/>
  <text x="320" y="215" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#166534">維持期</text>
  <text x="320" y="228" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#64748B">Pemeliharaan</text>
  
  <!-- Stage 4: Walking independently -->
  <circle cx="420" cy="180" r="20" fill="#FFF" stroke="#16A34A" stroke-width="2.5" filter="url(#sh4)"/>
  <circle cx="420" cy="162" r="6" fill="#FDE68A" stroke="#D97706" stroke-width="1"/>
  <line x1="420" y1="168" x2="420" y2="185" stroke="#64748B" stroke-width="2"/>
  <line x1="415" y1="175" x2="410" y2="180" stroke="#64748B" stroke-width="1.5"/>
  <line x1="425" y1="175" x2="430" y2="180" stroke="#64748B" stroke-width="1.5"/>
  <text x="420" y="215" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#166534">生活期</text>
  <text x="420" y="228" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#64748B">Kehidupan</text>
  
  <!-- Stage 5: Active -->
  <circle cx="500" cy="180" r="20" fill="#22C55E"/>
  <text x="500" y="185" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#FFF">✓</text>
  <text x="500" y="215" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#166534">目標</text>
  <text x="500" y="228" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#64748B">Tujuan</text>
  
  <!-- Therapy tools -->
  <rect x="40" y="40" width="150" height="110" rx="12" fill="#FFF" filter="url(#sh4)"/>
  <text x="115" y="65" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#166534">リハビリ種類</text>
  
  <rect x="55" y="75" width="55" height="30" rx="6" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
  <text x="82" y="94" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#166534">PT 理学療法</text>
  
  <rect x="120" y="75" width="55" height="30" rx="6" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
  <text x="147" y="94" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#166534">OT 作業療法</text>
  
  <rect x="55" y="110" width="55" height="30" rx="6" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
  <text x="82" y="129" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#166534">ST 言語療法</text>
  
  <!-- Key concepts -->
  <rect x="410" y="40" width="160" height="110" rx="12" fill="#FFF" filter="url(#sh4)"/>
  <text x="490" y="65" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#166534">重要概念</text>
  <text x="425" y="88" font-family="sans-serif" font-size="10" fill="#334155">• ADL 自立支援</text>
  <text x="425" y="106" font-family="sans-serif" font-size="10" fill="#334155">• 残存機能の活用</text>
  <text x="425" y="124" font-family="sans-serif" font-size="10" fill="#334155">• 廃用症候群予防</text>
  <text x="425" y="142" font-family="sans-serif" font-size="10" fill="#334155">• 生活リハビリ</text>
  
  <!-- Bottom info -->
  <rect x="40" y="260" width="520" height="110" rx="12" fill="#FFF" filter="url(#sh4)"/>
  <text x="60" y="290" font-family="sans-serif" font-size="12" font-weight="bold" fill="#166534">リハビリの3つの側面</text>
  <rect x="60" y="300" width="100" height="55" rx="8" fill="#F0FDF4"/>
  <text x="110" y="320" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#166534">身体的</text>
  <text x="110" y="338" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#64748B">Fisik</text>
  <rect x="180" y="300" width="100" height="55" rx="8" fill="#EFF6FF"/>
  <text x="230" y="320" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#1D4ED8">心理的</text>
  <text x="230" y="338" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#64748B">Psikologis</text>
  <rect x="300" y="300" width="100" height="55" rx="8" fill="#FDF2F8"/>
  <text x="350" y="320" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#BE185D">社会的</text>
  <text x="350" y="338" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#64748B">Sosial</text>
</svg>
