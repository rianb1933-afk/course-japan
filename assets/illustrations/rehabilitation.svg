<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350">
  <rect width="600" height="350" rx="12" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1"/>
  
  <!-- Title -->
  <rect x="0" y="0" width="600" height="40" rx="12" fill="#16A34A"/>
  <rect x="0" y="20" width="600" height="20" fill="#16A34A"/>
  <text x="300" y="27" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFF">リハビリテーション · Rehabilitation · Rehabilitasi</text>
  
  <!-- Timeline -->
  <line x1="60" y1="120" x2="540" y2="120" stroke="#86EFAC" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Stage 1 -->
  <circle cx="120" cy="120" r="18" fill="#FFF" stroke="#16A34A" stroke-width="2"/>
  <text x="120" y="124" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#16A34A">1</text>
  <text x="120" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#374151">急性期</text>
  <text x="120" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#9CA3AF">発症直後</text>
  
  <!-- Stage 2 -->
  <circle cx="240" cy="120" r="18" fill="#FFF" stroke="#16A34A" stroke-width="2"/>
  <text x="240" y="124" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#16A34A">2</text>
  <text x="240" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#374151">回復期</text>
  <text x="240" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#9CA3AF">集中的訓練</text>
  
  <!-- Stage 3 -->
  <circle cx="360" cy="120" r="18" fill="#FFF" stroke="#16A34A" stroke-width="2"/>
  <text x="360" y="124" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#16A34A">3</text>
  <text x="360" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#374151">維持期</text>
  <text x="360" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#9CA3AF">機能維持</text>
  
  <!-- Stage 4 -->
  <circle cx="480" cy="120" r="18" fill="#22C55E"/>
  <text x="480" y="124" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#FFF">✓</text>
  <text x="480" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#374151">生活期</text>
  <text x="480" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#9CA3AF">自立支援</text>
  
  <!-- Therapy types -->
  <rect x="20" y="190" width="175" height="140" rx="8" fill="#FFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="107" y="212" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#16A34A">リハビリの種類</text>
  <line x1="30" y1="220" x2="185" y2="220" stroke="#E5E7EB" stroke-width="1"/>
  
  <text x="35" y="240" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#1E40AF">PT 理学療法士</text>
  <text x="35" y="255" font-family="Arial, sans-serif" font-size="9" fill="#6B7280">歩行・筋力・関節可動域</text>
  
  <text x="35" y="275" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#7C3AED">OT 作業療法士</text>
  <text x="35" y="290" font-family="Arial, sans-serif" font-size="9" fill="#6B7280">ADL・手の機能・認知</text>
  
  <text x="35" y="310" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#0369A1">ST 言語聴覚士</text>
  <text x="35" y="325" font-family="Arial, sans-serif" font-size="9" fill="#6B7280">嚥下・言語・高次脳</text>
  
  <!-- Key concepts -->
  <rect x="210" y="190" width="180" height="140" rx="8" fill="#FFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="300" y="212" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#16A34A">重要概念</text>
  <line x1="220" y1="220" x2="380" y2="220" stroke="#E5E7EB" stroke-width="1"/>
  
  <text x="225" y="240" font-family="Arial, sans-serif" font-size="10" fill="#374151">• ADL 自立支援</text>
  <text x="225" y="258" font-family="Arial, sans-serif" font-size="10" fill="#374151">• 残存機能の活用</text>
  <text x="225" y="276" font-family="Arial, sans-serif" font-size="10" fill="#374151">• 廃用症候群予防</text>
  <text x="225" y="294" font-family="Arial, sans-serif" font-size="10" fill="#374151">• 生活リハビリ</text>
  <text x="225" y="312" font-family="Arial, sans-serif" font-size="10" fill="#374151">• 多職種連携</text>
  
  <!-- 3 aspects -->
  <rect x="405" y="190" width="175" height="140" rx="8" fill="#FFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="492" y="212" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#16A34A">3つの側面</text>
  <line x1="415" y1="220" x2="570" y2="220" stroke="#E5E7EB" stroke-width="1"/>
  
  <rect x="420" y="230" width="50" height="30" rx="4" fill="#F0FDF4"/>
  <text x="445" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#16A34A">身体的</text>
  
  <rect x="478" y="230" width="50" height="30" rx="4" fill="#EFF6FF"/>
  <text x="503" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#1D4ED8">心理的</text>
  
  <rect x="536" y="230" width="38" height="30" rx="4" fill="#FDF2F8"/>
  <text x="555" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#BE185D">社会的</text>
  
  <text x="492" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#6B7280">全人的なアプローチ</text>
  <text x="492" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#6B7280">が重要</text>
</svg>
