<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg-rehab" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F0FDF4"/>
    </linearGradient>
    <filter id="shadow-md" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.12"/>
    </filter>
  </defs>
  
  <rect width="800" height="450" fill="url(#bg-rehab)" rx="16"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="800" height="56" fill="#16A34A" rx="16"/>
  <rect x="0" y="40" width="800" height="16" fill="#16A34A"/>
  <circle cx="40" cy="28" r="18" fill="rgba(255,255,255,0.15)"/>
  <text x="40" y="33" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16">🏋️</text>
  <text x="70" y="34" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#FFF">リハビリテーション · Rehabilitasi · Rehabilitation</text>
  
  <!-- Timeline -->
  <rect x="24" y="72" width="752" height="180" rx="12" fill="#FFF" filter="url(#shadow-md)"/>
  <rect x="24" y="72" width="752" height="44" rx="12" fill="#F0FDF4"/>
  <rect x="24" y="104" width="752" height="12" fill="#F0FDF4"/>
  <text x="400" y="100" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#16A34A">回復のタイムライン (Timeline Pemulihan)</text>
  
  <!-- Timeline Line -->
  <line x1="80" y1="160" x2="720" y2="160" stroke="#D1FAE5" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Phase 1 -->
  <circle cx="140" cy="160" r="24" fill="#DC2626" stroke="#FFF" stroke-width="3"/>
  <text x="140" y="156" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="#FFF">急性期</text>
  <text x="140" y="168" text-anchor="middle" font-family="system-ui,sans-serif" font-size="7" fill="rgba(255,255,255,0.8)">0-2週</text>
  <rect x="100" y="192" width="80" height="44" rx="6" fill="#FFF" stroke="#FECACA" stroke-width="1"/>
  <text x="140" y="210" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#374151">安静・観察</text>
  <text x="140" y="224" text-anchor="middle" font-family="system-ui,sans-serif" font-size="7" fill="#6B7280">Akut</text>
  
  <!-- Phase 2 -->
  <circle cx="300" cy="160" r="24" fill="#D97706" stroke="#FFF" stroke-width="3"/>
  <text x="300" y="156" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="#FFF">回復期</text>
  <text x="300" y="168" text-anchor="middle" font-family="system-ui,sans-serif" font-size="7" fill="rgba(255,255,255,0.8)">2-12週</text>
  <rect x="260" y="192" width="80" height="44" rx="6" fill="#FFF" stroke="#FEF3C7" stroke-width="1"/>
  <text x="300" y="210" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#374151">運動療法</text>
  <text x="300" y="224" text-anchor="middle" font-family="system-ui,sans-serif" font-size="7" fill="#6B7280">Pemulihan</text>
  
  <!-- Phase 3 -->
  <circle cx="460" cy="160" r="24" fill="#2563EB" stroke="#FFF" stroke-width="3"/>
  <text x="460" y="156" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="#FFF">維持期</text>
  <text x="460" y="168" text-anchor="middle" font-family="system-ui,sans-serif" font-size="7" fill="rgba(255,255,255,0.8)">3-6月</text>
  <rect x="420" y="192" width="80" height="44" rx="6" fill="#FFF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="460" y="210" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#374151">自立支援</text>
  <text x="460" y="224" text-anchor="middle" font-family="system-ui,sans-serif" font-size="7" fill="#6B7280">Pemeliharaan</text>
  
  <!-- Phase 4 -->
  <circle cx="620" cy="160" r="24" fill="#16A34A" stroke="#FFF" stroke-width="3"/>
  <text x="620" y="152" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" font-weight="700" fill="#FFF">社会復帰</text>
  <text x="620" y="164" text-anchor="middle" font-family="system-ui,sans-serif" font-size="7" fill="rgba(255,255,255,0.8)">6月〜</text>
  <rect x="580" y="192" width="80" height="44" rx="6" fill="#FFF" stroke="#D1FAE5" stroke-width="1"/>
  <text x="620" y="210" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#374151">通所リハ</text>
  <text x="620" y="224" text-anchor="middle" font-family="system-ui,sans-serif" font-size="7" fill="#6B7280">Sosial</text>
  
  <!-- Bottom: Therapy Types -->
  <rect x="24" y="264" width="370" height="164" rx="12" fill="#FFF" filter="url(#shadow-md)"/>
  <rect x="24" y="264" width="370" height="44" rx="12" fill="#F0FDF4"/>
  <rect x="24" y="296" width="370" height="12" fill="#F0FDF4"/>
  <text x="209" y="292" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#16A34A">リハビリの種類 (Jenis Rehabilitasi)</text>
  
  <rect x="40" y="316" width="160" height="96" rx="8" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
  <text x="120" y="344" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24">🏋️</text>
  <text x="120" y="368" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#16A34A">運動療法</text>
  <text x="120" y="384" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#6B7280">Fisioterapi</text>
  <text x="120" y="400" text-anchor="middle" font-family="system-ui,sans-serif" font-size="7" fill="#6B7280">筋力・可動域</text>
  
  <rect x="214" y="316" width="160" height="96" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="294" y="344" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24">🛠️</text>
  <text x="294" y="368" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#2563EB">作業療法</text>
  <text x="294" y="384" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#6B7280">Terapis Okupasi</text>
  <text x="294" y="400" text-anchor="middle" font-family="system-ui,sans-serif" font-size="7" fill="#6B7280">ADL訓練</text>
  
  <!-- Right: Key Points -->
  <rect x="406" y="264" width="370" height="164" rx="12" fill="#FFF" filter="url(#shadow-md)"/>
  <rect x="406" y="264" width="370" height="44" rx="12" fill="#F0FDF4"/>
  <rect x="406" y="296" width="370" height="12" fill="#F0FDF4"/>
  <text x="591" y="292" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#16A34A">リハビリのポイント</text>
  
  <text x="422" y="324" font-family="system-ui,sans-serif" font-size="10" fill="#374151">✓ 早期開始が重要</text>
  <text x="422" y="344" font-family="system-ui,sans-serif" font-size="10" fill="#374151">✓ 利用者の意思を尊重</text>
  <text x="422" y="364" font-family="system-ui,sans-serif" font-size="10" fill="#374151">✓ 安全第一で実施</text>
  <text x="422" y="384" font-family="system-ui,sans-serif" font-size="10" fill="#374151">✓ 定期的に評価</text>
  <text x="422" y="404" font-family="system-ui,sans-serif" font-size="10" fill="#374151">✓ 記録をつける</text>
  
  <text x="590" y="324" font-family="system-ui,sans-serif" font-size="10" fill="#374151">✓ 目標を設定</text>
  <text x="590" y="344" font-family="system-ui,sans-serif" font-size="10" fill="#374151">✓ チーム連携</text>
  <text x="590" y="364" font-family="system-ui,sans-serif" font-size="10" fill="#374151">✓ 家族への指導</text>
  <text x="590" y="384" font-family="system-ui,sans-serif" font-size="10" fill="#374151">✓ 継続性を保つ</text>
  <text x="590" y="404" font-family="system-ui,sans-serif" font-size="10" fill="#374151">✓ 退院準備支援</text>
</svg>
