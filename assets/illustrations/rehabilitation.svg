<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8F5E9"/>
      <stop offset="100%" stop-color="#C8E6C9"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg5)"/>
  
  <!-- Person exercising -->
  <circle cx="200" cy="80" r="20" fill="#FFCCBC" stroke="#D84315" stroke-width="2"/>
  <line x1="200" y1="100" x2="200" y2="160" stroke="#333" stroke-width="3"/>
  <line x1="200" y1="120" x2="170" y2="150" stroke="#333" stroke-width="3"/>
  <line x1="200" y1="120" x2="230" y2="150" stroke="#333" stroke-width="3"/>
  <line x1="200" y1="160" x2="175" y2="200" stroke="#333" stroke-width="3"/>
  <line x1="200" y1="160" x2="225" y2="200" stroke="#333" stroke-width="3"/>
  
  <!-- Therapy tools -->
  <circle cx="100" cy="150" r="25" fill="#FFF" stroke="#4CAF50" stroke-width="2"/>
  <text x="100" y="145" text-anchor="middle" font-size="16">🏋️</text>
  <text x="100" y="165" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#333">筋力</text>
  
  <circle cx="300" cy="150" r="25" fill="#FFF" stroke="#4CAF50" stroke-width="2"/>
  <text x="300" y="145" text-anchor="middle" font-size="16">🦿</text>
  <text x="300" y="165" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#333">歩行</text>
  
  <!-- Progress arrows -->
  <path d="M80 220 L140 220 L160 200 L220 200 L240 180 L300 180 L320 160 L360 160" fill="none" stroke="#4CAF50" stroke-width="3" marker-end="url(#arrow2)"/>
  <defs><marker id="arrow2" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4CAF50"/></marker></defs>
  
  <!-- Labels on progress -->
  <text x="110" y="240" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">急性期</text>
  <text x="190" y="215" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">回復期</text>
  <text x="270" y="195" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">維持期</text>
  <text x="340" y="175" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">生活期</text>
  
  <text x="200" y="275" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1B5E20">リハビリテーション (Rehabilitasi)</text>
</svg>
