<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350">
  <defs>
    <linearGradient id="bg-rehab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#FFF"/>
    </linearGradient>
  </defs>
  <rect width="600" height="350" fill="url(#bg-rehab)" rx="12"/>
  
  <rect x="0" y="0" width="600" height="40" fill="#16A34A" rx="12"/>
  <rect x="0" y="28" width="600" height="12" fill="#16A34A"/>
  <text x="300" y="26" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#FFF">リハビリテーション · Rehabilitasi · Fase Pemulihan</text>
  
  <!-- Timeline -->
  <line x1="60" y1="100" x2="540" y2="100" stroke="#D1FAE5" stroke-width="4"/>
  
  <!-- Phase 1: Acute -->
  <circle cx="100" cy="100" r="20" fill="#DC2626"/>
  <text x="100" y="104" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#FFF">急性期</text>
  <text x="100" y="135" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#374151">Akut</text>
  <text x="100" y="150" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#6B7280">0–2週間</text>
  <rect x="40" y="160" width="120" height="50" rx="6" fill="#FFF" stroke="#FECACA"/>
  <text x="100" y="178" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#374151">· 安静に過ごす</text>
  <text x="100" y="194" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#374151">· バイタル確認</text>
  
  <!-- Phase 2: Subacute -->
  <circle cx="220" cy="100" r="20" fill="#D97706"/>
  <text x="220" y="104" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#FFF">回復期</text>
  <text x="220" y="135" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#374151">Pemulihan</text>
  <text x="220" y="150" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#6B7280">2–12週間</text>
  <rect x="160" y="160" width="120" height="50" rx="6" fill="#FFF" stroke="#FEF3C7"/>
  <text x="220" y="178" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#374151">· 運動療法開始</text>
  <text x="220" y="194" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#374151">· ADL訓練</text>
  
  <!-- Phase 3: Maintenance -->
  <circle cx="340" cy="100" r="20" fill="#2563EB"/>
  <text x="340" y="104" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#FFF">維持期</text>
  <text x="340" y="135" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#374151">Pemeliharaan</text>
  <text x="340" y="150" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#6B7280">3–6ヶ月</text>
  <rect x="280" y="160" width="120" height="50" rx="6" fill="#FFF" stroke="#BFDBFE"/>
  <text x="340" y="178" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#374151">· 自立支援</text>
  <text x="340" y="194" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#374151">· 退院準備</text>
  
  <!-- Phase 4: Social -->
  <circle cx="460" cy="100" r="20" fill="#16A34A"/>
  <text x="460" y="100" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#FFF">社会復帰</text>
  <text x="460" y="112" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#FFF">期</text>
  <text x="460" y="135" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#374151">Sosial</text>
  <text x="460" y="150" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#6B7280">6ヶ月〜</text>
  <rect x="400" y="160" width="120" height="50" rx="6" fill="#FFF" stroke="#D1FAE5"/>
  <text x="460" y="178" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#374151">· 通所リハ</text>
  <text x="460" y="194" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#374151">· 生活指導</text>
  
  <!-- Bottom: Therapy Types -->
  <rect x="20" y="225" width="560" height="110" rx="10" fill="#FFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="300" y="248" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#374151">リハビリの種類 (Jenis Rehabilitasi)</text>
  
  <rect x="40" y="258" width="120" height="65" rx="8" fill="#F0FDF4" stroke="#BBF7D0"/>
  <text x="100" y="278" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20">🏋️</text>
  <text x="100" y="296" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="600" fill="#16A34A">運動療法</text>
  <text x="100" y="312" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#6B7280">Fisioterapi</text>
  
  <rect x="170" y="258" width="120" height="65" rx="8" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="230" y="278" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20">🗣️</text>
  <text x="230" y="296" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="600" fill="#2563EB">作業療法</text>
  <text x="230" y="312" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#6B7280">Terapi Okupasi</text>
  
  <rect x="300" y="258" width="120" height="65" rx="8" fill="#FFF7ED" stroke="#FED7AA"/>
  <text x="360" y="278" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20">🗣️</text>
  <text x="360" y="296" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="600" fill="#EA580C">言語療法</text>
  <text x="360" y="312" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#6B7280">Terapi Wicara</text>
  
  <rect x="430" y="258" width="120" height="65" rx="8" fill="#FDF4FF" stroke="#E9D5FF"/>
  <text x="490" y="278" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20">🧠</text>
  <text x="490" y="296" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="600" fill="#7C3AED">認知療法</text>
  <text x="490" y="312" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#6B7280">Terapi Kognitif</text>
</svg>