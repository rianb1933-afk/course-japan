<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg10" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E0F7FA"/>
      <stop offset="100%" stop-color="#B2EBF2"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg10)"/>
  
  <!-- Wheelchair -->
  <circle cx="150" cy="200" r="25" fill="none" stroke="#00838F" stroke-width="3"/>
  <circle cx="150" cy="200" r="3" fill="#00838F"/>
  <circle cx="260" cy="210" r="12" fill="none" stroke="#00838F" stroke-width="2"/>
  <circle cx="260" cy="210" r="2" fill="#00838F"/>
  
  <!-- Chair frame -->
  <path d="M150 200 L150 140 L200 140 L200 170 L260 170" fill="none" stroke="#00838F" stroke-width="3"/>
  <path d="M150 170 L120 170" fill="none" stroke="#00838F" stroke-width="3"/>
  <path d="M150 140 L140 110" fill="none" stroke="#00838F" stroke-width="3"/>
  
  <!-- Person in wheelchair -->
  <circle cx="175" cy="100" r="15" fill="#FFCCBC" stroke="#D84315" stroke-width="2"/>
  <line x1="175" y1="115" x2="175" y2="145" stroke="#333" stroke-width="2"/>
  <line x1="175" y1="125" x2="160" y2="140" stroke="#333" stroke-width="2"/>
  <line x1="175" y1="125" x2="195" y2="135" stroke="#333" stroke-width="2"/>
  
  <!-- Safety labels -->
  <rect x="50" y="60" width="80" height="30" rx="6" fill="#FFF" stroke="#E53935" stroke-width="2"/>
  <text x="90" y="80" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#E53935">ブレーキ確認</text>
  
  <rect x="270" y="60" width="80" height="30" rx="6" fill="#FFF" stroke="#4CAF50" stroke-width="2"/>
  <text x="310" y="80" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#4CAF50">安全ベルト</text>
  
  <text x="200" y="260" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#006064">車椅子利用 (Wheelchair Use)</text>
  <text x="200" y="280" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#00838F">安全な移動と介助方法</text>
</svg>
