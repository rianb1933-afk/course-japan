<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350">
  <defs>
    <linearGradient id="bg-wc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#FFF"/>
    </linearGradient>
  </defs>
  <rect width="600" height="350" fill="url(#bg-wc)" rx="12"/>
  <rect x="0" y="0" width="600" height="40" fill="#16A34A" rx="12"/>
  <rect x="0" y="28" width="600" height="12" fill="#16A34A"/>
  <text x="300" y="26" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#FFF">車椅子 · Kursi Roda · Wheelchair Safety</text>
  <rect x="20" y="52" width="260" height="180" rx="10" fill="#FFF" stroke="#D1FAE5" stroke-width="1"/>
  <text x="150" y="72" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#374151">車椅子の安全</text>
  <text x="40" y="100" font-family="system-ui,sans-serif" font-size="10" fill="#6B7280">● ブレーキをかける</text>
  <text x="40" y="118" font-family="system-ui,sans-serif" font-size="10" fill="#6B7280">● フットレストを上げる</text>
  <text x="40" y="136" font-family="system-ui,sans-serif" font-size="10" fill="#6B7280">● 足元に物を置かない</text>
  <text x="40" y="154" font-family="system-ui,sans-serif" font-size="10" fill="#6B7280">● 坂道は後ろ向きに</text>
  <text x="40" y="172" font-family="system-ui,sans-serif" font-size="10" fill="#6B7280">● 階段はリフトを使用</text>
  <text x="40" y="190" font-family="system-ui,sans-serif" font-size="10" fill="#6B7280">● 安全ベルトを装着</text>
  <text x="40" y="208" font-family="system-ui,sans-serif" font-size="10" fill="#6B7280">● 定期点検を実施</text>
  <rect x="310" y="52" width="270" height="180" rx="10" fill="#FFF" stroke="#D1FAE5" stroke-width="1"/>
  <text x="445" y="72" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#374151">移乗手順</text>
  <text x="325" y="100" font-family="system-ui,sans-serif" font-size="10" fill="#374151">1. ブレーキをかける</text>
  <text x="325" y="118" font-family="system-ui,sans-serif" font-size="10" fill="#374151">2. フットレストを外す</text>
  <text x="325" y="136" font-family="system-ui,sans-serif" font-size="10" fill="#374151">3. 利用者の腰を支える</text>
  <text x="325" y="154" font-family="system-ui,sans-serif" font-size="10" fill="#374151">4. 「せーの」で立つ</text>
  <text x="325" y="172" font-family="system-ui,sans-serif" font-size="10" fill="#374151">5. ゆっくり座る</text>
  <text x="325" y="190" font-family="system-ui,sans-serif" font-size="10" fill="#374151">6. 姿勢を整える</text>
  <text x="325" y="208" font-family="system-ui,sans-serif" font-size="10" fill="#374151">7. 安全確認</text>
  <rect x="20" y="250" width="560" height="85" rx="10" fill="#FFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="300" y="272" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#374151">注意点 (Hal Penting)</text>
  <text x="300" y="300" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#6B7280">利用者の意思を尊重 · 安全第一 · 記録をつける</text>
  <text x="300" y="320" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#6B7280">Hormati keinginan pengguna · Utamakan keselamatan · Catat dengan baik</text>
</svg>