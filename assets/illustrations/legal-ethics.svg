<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg-law" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF8E1"/>
      <stop offset="100%" stop-color="#FFECB3"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg-law)"/>
  
  <!-- Scale of justice -->
  <line x1="200" y1="50" x2="200" y2="150" stroke="#F57F17" stroke-width="3"/>
  <line x1="130" y1="90" x2="270" y2="90" stroke="#F57F17" stroke-width="3"/>
  <circle cx="200" cy="50" r="8" fill="#F57F17"/>
  
  <!-- Left pan -->
  <path d="M100 90 L130 90 L120 130 L110 130Z" fill="#FFF" stroke="#F57F17" stroke-width="2"/>
  <line x1="110" y1="130" x2="130" y2="90" stroke="#F57F17" stroke-width="1"/>
  <text x="115" y="115" text-anchor="middle" font-size="14">⚖️</text>
  
  <!-- Right pan -->
  <path d="M270 90 L300 90 L290 130 L280 130Z" fill="#FFF" stroke="#F57F17" stroke-width="2"/>
  <line x1="280" y1="130" x2="300" y2="90" stroke="#F57F17" stroke-width="1"/>
  <text x="285" y="115" text-anchor="middle" font-size="14">📋</text>
  
  <!-- Law book -->
  <rect x="150" y="160" width="100" height="80" rx="6" fill="#FFF" stroke="#F57F17" stroke-width="2"/>
  <text x="200" y="190" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#E65100">民法</text>
  <text x="200" y="210" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#F57F17">第698条</text>
  <text x="200" y="225" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#666">緊急事務管理</text>
  
  <!-- Ethics symbols -->
  <text x="70" y="200" font-size="20">🤲</text>
  <text x="320" y="200" font-size="20">❤️</text>
  
  <text x="200" y="275" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#E65100">法律・倫理 (Law & Ethics)</text>
</svg>
