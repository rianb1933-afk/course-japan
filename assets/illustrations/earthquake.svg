<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350">
  <defs>
    <linearGradient id="bg-eq" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FEF9C3"/>
      <stop offset="100%" stop-color="#FFF"/>
    </linearGradient>
  </defs>
  <rect width="600" height="350" fill="url(#bg-eq)" rx="12"/>
  <rect x="0" y="0" width="600" height="40" fill="#D97706" rx="12"/>
  <rect x="0" y="28" width="600" height="12" fill="#D97706"/>
  <text x="300" y="26" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#FFF">地震対応 · Gempa Bumi · Earthquake Safety</text>
  <rect x="20" y="52" width="260" height="180" rx="10" fill="#FFF" stroke="#FEF3C7" stroke-width="1"/>
  <text x="150" y="72" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#374151">地震の備え</text>
  <text x="40" y="100" font-family="system-ui,sans-serif" font-size="10" fill="#6B7280">● 非常持出袋の準備</text>
  <text x="40" y="118" font-family="system-ui,sans-serif" font-size="10" fill="#6B7280">● 安全な場所を確認</text>
  <text x="40" y="136" font-family="system-ui,sans-serif" font-size="10" fill="#6B7280">● 家族との連絡方法</text>
  <text x="40" y="154" font-family="system-ui,sans-serif" font-size="10" fill="#6B7280">● 避難経路の確認</text>
  <text x="40" y="172" font-family="system-ui,sans-serif" font-size="10" fill="#6B7280">● 地震訓練に参加</text>
  <text x="40" y="190" font-family="system-ui,sans-serif" font-size="10" fill="#6B7280">● 利用者の避難支援</text>
  <text x="40" y="208" font-family="system-ui,sans-serif" font-size="10" fill="#6B7280">● 水と食料の備蓄</text>
  <rect x="310" y="52" width="270" height="180" rx="10" fill="#FFF" stroke="#FEF3C7" stroke-width="1"/>
  <text x="445" y="72" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#374151">地震時の行動</text>
  <text x="325" y="100" font-family="system-ui,sans-serif" font-size="10" fill="#374151">1. 机の下に隠れる</text>
  <text x="325" y="118" font-family="system-ui,sans-serif" font-size="10" fill="#374151">2. ドアを開ける</text>
  <text x="325" y="136" font-family="system-ui,sans-serif" font-size="10" fill="#374151">3. ガスの元栓を閉める</text>
  <text x="325" y="154" font-family="system-ui,sans-serif" font-size="10" fill="#374151">4. ブレーカーを落とす</text>
  <text x="325" y="172" font-family="system-ui,sans-serif" font-size="10" fill="#374151">5. 避難場所へ移動</text>
  <text x="325" y="190" font-family="system-ui,sans-serif" font-size="10" fill="#374151">6. 利用者の安否確認</text>
  <text x="325" y="208" font-family="system-ui,sans-serif" font-size="10" fill="#374151">7. 上司に報告</text>
  <rect x="20" y="250" width="560" height="85" rx="10" fill="#FFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="300" y="272" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#374151">Drop · Cover · Hold On</text>
  <text x="300" y="300" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#6B7280">伏せる · 守る · 支える</text>
  <text x="300" y="320" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#6B7280">Bongkok · Lindungi · Bertahan</text>
</svg>