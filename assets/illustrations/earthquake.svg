<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg11" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCE4EC"/>
      <stop offset="100%" stop-color="#F8BBD0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg11)"/>
  
  <!-- Seismic waves -->
  <path d="M50 150 Q75 130 100 150 Q125 170 150 150 Q175 130 200 150 Q225 170 250 150 Q275 130 300 150 Q325 170 350 150" fill="none" stroke="#E91E63" stroke-width="3"/>
  
  <!-- Person protecting head -->
  <circle cx="200" cy="80" r="15" fill="#FFCCBC" stroke="#D84315" stroke-width="2"/>
  <line x1="200" y1="95" x2="200" y2="130" stroke="#333" stroke-width="2"/>
  <line x1="200" y1="105" x2="180" y2="95" stroke="#333" stroke-width="2"/>
  <line x1="200" y1="105" x2="220" y2="95" stroke="#333" stroke-width="2"/>
  <!-- Hands over head -->
  <path d="M180 75 L200 65 L220 75" fill="none" stroke="#333" stroke-width="2"/>
  
  <!-- Protective action labels -->
  <rect x="60" y="180" width="100" height="40" rx="8" fill="#FFF" stroke="#E91E63" stroke-width="2"/>
  <text x="110" y="200" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#E91E63">頭を守る</text>
  <text x="110" y="212" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#666">机の下に隠れる</text>
  
  <rect x="170" y="180" width="100" height="40" rx="8" fill="#FFF" stroke="#E91E63" stroke-width="2"/>
  <text x="220" y="200" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#E91E63">火の始末</text>
  <text x="220" y="212" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#666">ガスを閉める</text>
  
  <rect x="280" y="180" width="100" height="40" rx="8" fill="#FFF" stroke="#E91E63" stroke-width="2"/>
  <text x="330" y="200" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#E91E63">避難行動</text>
  <text x="330" y="212" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#666">安全な場所へ</text>
  
  <text x="200" y="260" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#880E4F">地震災害 (Earthquake)</text>
  <text x="200" y="280" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#AD1457">安全確保と避難訓練</text>
</svg>
