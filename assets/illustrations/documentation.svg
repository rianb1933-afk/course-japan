  <rect x="422" y="360" width="338" height="40" rx="8" fill="#FFF" stroke="#BFDBFE" stroke-width="1.5"/>
  <text x="434" y="385" font-family="system-ui,sans-serif" font-size="10" fill="#374151">✓ 漏れなく記録 — 全ての出来事を記録</text>
