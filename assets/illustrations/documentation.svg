<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg-doc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F3E5F5"/>
      <stop offset="100%" stop-color="#E1BEE7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg-doc)"/>
  
  <!-- Clipboard -->
  <rect x="130" y="40" width="140" height="180" rx="8" fill="#FFF" stroke="#7B1FA2" stroke-width="2"/>
  <rect x="170" y="30" width="60" height="20" rx="4" fill="#CE93D8"/>
  
  <!-- Document lines -->
  <line x1="150" y1="80" x2="250" y2="80" stroke="#E1BEE7" stroke-width="2"/>
  <line x1="150" y1="100" x2="230" y2="100" stroke="#E1BEE7" stroke-width="2"/>
  <line x1="150" y1="120" x2="240" y2="120" stroke="#E1BEE7" stroke-width="2"/>
  <line x1="150" y1="140" x2="220" y2="140" stroke="#E1BEE7" stroke-width="2"/>
  <line x1="150" y1="160" x2="250" y2="160" stroke="#E1BEE7" stroke-width="2"/>
  <line x1="150" y1="180" x2="210" y2="180" stroke="#E1BEE7" stroke-width="2"/>
  
  <!-- Checkmarks -->
  <circle cx="140" cy="80" r="6" fill="#4CAF50"/>
  <text x="140" y="83" text-anchor="middle" font-size="8" fill="#FFF">✓</text>
  <circle cx="140" cy="100" r="6" fill="#4CAF50"/>
  <text x="140" y="103" text-anchor="middle" font-size="8" fill="#FFF">✓</text>
  <circle cx="140" cy="120" r="6" fill="#4CAF50"/>
  <text x="140" y="123" text-anchor="middle" font-size="8" fill="#FFF">✓</text>
  
  <!-- Pen -->
  <line x1="290" y1="60" x2="310" y2="180" stroke="#7B1FA2" stroke-width="3" stroke-linecap="round"/>
  <polygon points="310,180 315,195 305,195" fill="#333"/>
  
  <!-- Labels -->
  <text x="80" y="120" font-family="sans-serif" font-size="10" fill="#6A1B9A">介護過程</text>
  <text x="80" y="140" font-family="sans-serif" font-size="10" fill="#6A1B9A">アセスメント</text>
  <text x="80" y="160" font-family="sans-serif" font-size="10" fill="#6A1B9A">計画</text>
  
  <text x="320" y="120" font-family="sans-serif" font-size="10" fill="#6A1B9A">実施</text>
  <text x="320" y="140" font-family="sans-serif" font-size="10" fill="#6A1B9A">評価</text>
  
  <text x="200" y="270" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#4A148C">記録・文書 (Documentation)</text>
</svg>
