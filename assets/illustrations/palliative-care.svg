<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg-palli" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F3E5F5"/>
      <stop offset="100%" stop-color="#E1BEE7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg-palli)"/>
  
  <!-- Comforting hands -->
  <path d="M150 140 C130 120, 150 100, 170 110 C180 90, 210 90, 220 110 C240 100, 260 120, 240 140" fill="none" stroke="#CE93D8" stroke-width="3"/>
  <circle cx="165" cy="115" r="10" fill="#FFCCBC"/>
  <circle cx="225" cy="115" r="10" fill="#FFCCBC"/>
  
  <!-- Flower of life / comfort -->
  <circle cx="200" cy="120" r="8" fill="#E91E63" opacity="0.6"/>
  
  <!-- Care elements -->
  <circle cx="80" cy="200" r="25" fill="#FFF" stroke="#CE93D8" stroke-width="2"/>
  <text x="80" y="195" text-anchor="middle" font-size="16">🌸</text>
  <text x="80" y="215" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#333">苦痛軽減</text>
  
  <circle cx="160" cy="200" r="25" fill="#FFF" stroke="#CE93D8" stroke-width="2"/>
  <text x="160" y="195" text-anchor="middle" font-size="16">💊</text>
  <text x="160" y="215" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#333">症状管理</text>
  
  <circle cx="240" cy="200" r="25" fill="#FFF" stroke="#CE93D8" stroke-width="2"/>
  <text x="240" y="195" text-anchor="middle" font-size="16">💬</text>
  <text x="240" y="215" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#333">カウンセリング</text>
  
  <circle cx="320" cy="200" r="25" fill="#FFF" stroke="#CE93D8" stroke-width="2"/>
  <text x="320" y="195" text-anchor="middle" font-size="16">🕊️</text>
  <text x="320" y="215" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#333">尊厳</text>
  
  <text x="200" y="265" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#4A148C">緩和ケア (Palliative Care)</text>
</svg>
