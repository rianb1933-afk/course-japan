<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350">
  <defs>
    <linearGradient id="bg-hc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#FFF"/>
    </linearGradient>
  </defs>
  <rect width="600" height="350" fill="url(#bg-hc)" rx="12"/>
  <rect x="0" y="0" width="600" height="40" fill="#16A34A" rx="12"/>
  <rect x="0" y="28" width="600" height="12" fill="#16A34A"/>
  <text x="300" y="26" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#FFF">在宅ケア · Home Care · Perawatan di Rumah</text>
  
  <!-- Left: Home Care Services -->
  <rect x="20" y="52" width="260" height="180" rx="10" fill="#FFF" stroke="#D1FAE5" stroke-width="1"/>
  <text x="150" y="72" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#374151">在宅サービス</text>
  
  <text x="40" y="100" font-family="system-ui,sans-serif" font-size="10" fill="#6B7280">● 訪問介護 (ホームヘルプ)</text>
  <text x="40" y="118" font-family="system-ui,sans-serif" font-size="10" fill="#6B7280">● 訪問看護</text>
  <text x="40" y="136" font-family="system-ui,sans-serif" font-size="10" fill="#6B7280">● 通所介護 (デイサービス)</text>
  <text x="40" y="154" font-family="system-ui,sans-serif" font-size="10" fill="#6B7280">● 短期入所 (ショートステイ)</text>
  <text x="40" y="172" font-family="system-ui,sans-serif" font-size="10" fill="#6B7280">● 居宅介護支援</text>
  <text x="40" y="190" font-family="system-ui,sans-serif" font-size="10" fill="#6B7280">● 福祉用具貸与</text>
  <text x="40" y="208" font-family="system-ui,sans-serif" font-size="10" fill="#6B7280">● 住宅改修</text>
  
  <!-- Right: Care Plan -->
  <rect x="310" y="52" width="270" height="180" rx="10" fill="#FFF" stroke="#D1FAE5" stroke-width="1"/>
  <text x="445" y="72" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#374151">ケアプラン作成</text>
  
  <text x="325" y="100" font-family="system-ui,sans-serif" font-size="10" fill="#374151">1. アセスメント実施</text>
  <text x="325" y="118" font-family="system-ui,sans-serif" font-size="10" fill="#374151">2. 利用者の目標設定</text>
  <text x="325" y="136" font-family="system-ui,sans-serif" font-size="10" fill="#374151">3. サービス計画作成</text>
  <text x="325" y="154" font-family="system-ui,sans-serif" font-size="10" fill="#374151">4. 利用者・家族と確認</text>
  <text x="325" y="172" font-family="system-ui,sans-serif" font-size="10" fill="#374151">5. サービス開始</text>
  <text x="325" y="190" font-family="system-ui,sans-serif" font-size="10" fill="#374151">6. 定期評価・修正</text>
  <text x="325" y="208" font-family="system-ui,sans-serif" font-size="10" fill="#374151">7. 記録管理</text>
  
  <!-- Bottom: Key Points -->
  <rect x="20" y="250" width="560" height="85" rx="10" fill="#FFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="300" y="272" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#374151">在宅ケアのポイント</text>
  <text x="300" y="300" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#6B7280">● 利用者の自立支援 ● 家族の負担軽減 ● チーム連携 ● 安全管理</text>
</svg>
