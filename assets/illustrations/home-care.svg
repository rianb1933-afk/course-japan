<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg-home" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8F5E9"/>
      <stop offset="100%" stop-color="#C8E6C9"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg-home)"/>
  
  <!-- House -->
  <polygon points="200,40 120,100 280,100" fill="#FFF" stroke="#4CAF50" stroke-width="2"/>
  <rect x="140" y="100" width="120" height="80" fill="#FFF" stroke="#4CAF50" stroke-width="2"/>
  <rect x="180" y="130" width="40" height="50" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2"/>
  <rect x="155" y="115" width="25" height="20" fill="#BBDEFB" stroke="#4CAF50" stroke-width="1"/>
  <rect x="220" y="115" width="25" height="20" fill="#BBDEFB" stroke="#4CAF50" stroke-width="1"/>
  
  <!-- Care services around house -->
  <circle cx="70" cy="200" r="25" fill="#FFF" stroke="#4CAF50" stroke-width="2"/>
  <text x="70" y="195" text-anchor="middle" font-size="16">👩‍⚕️</text>
  <text x="70" y="215" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#333">訪問看護</text>
  
  <circle cx="160" cy="230" r="25" fill="#FFF" stroke="#4CAF50" stroke-width="2"/>
  <text x="160" y="225" text-anchor="middle" font-size="16">🍽️</text>
  <text x="160" y="245" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#333">配食</text>
  
  <circle cx="240" cy="230" r="25" fill="#FFF" stroke="#4CAF50" stroke-width="2"/>
  <text x="240" y="225" text-anchor="middle" font-size="16">🛁</text>
  <text x="240" y="245" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#333">入浴</text>
  
  <circle cx="330" cy="200" r="25" fill="#FFF" stroke="#4CAF50" stroke-width="2"/>
  <text x="330" y="195" text-anchor="middle" font-size="16">🚗</text>
  <text x="330" y="215" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#333">通所</text>
  
  <text x="200" y="280" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1B5E20">在宅ケア (Home Care)</text>
</svg>
