<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg-exam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8EAF6"/>
      <stop offset="100%" stop-color="#C5CAE9"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg-exam)"/>
  
  <!-- Book -->
  <rect x="120" y="50" width="160" height="120" rx="6" fill="#FFF" stroke="#3F51B5" stroke-width="2"/>
  <line x1="200" y1="50" x2="200" y2="170" stroke="#3F51B5" stroke-width="1"/>
  <text x="200" y="100" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1A237E">介護福祉士</text>
  <text x="200" y="120" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3F51B5">国家試験</text>
  <text x="200" y="140" text-anchor="middle" font-family="sans-serif" font-size="20">📚</text>
  
  <!-- Pencil -->
  <line x1="300" y1="60" x2="330" y2="150" stroke="#FFC107" stroke-width="4" stroke-linecap="round"/>
  <polygon points="330,150 335,165 325,165" fill="#333"/>
  
  <!-- Checklist -->
  <rect x="60" y="190" width="280" height="80" rx="8" fill="#FFF" stroke="#3F51B5" stroke-width="2"/>
  <text x="80" y="215" font-family="sans-serif" font-size="12" fill="#4CAF50">✓ 筆記試験 125問</text>
  <text x="80" y="235" font-family="sans-serif" font-size="12" fill="#4CAF50">✓ 実技試験</text>
  <text x="80" y="255" font-family="sans-serif" font-size="12" fill="#FF9800">○ 準備中...</text>
  
  <!-- Stars -->
  <text x="340" y="45" font-size="16">⭐</text>
  <text x="360" y="65" font-size="12">⭐</text>
  <text x="350" y="30" font-size="10">⭐</text>
  
  <text x="200" y="295" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1A237E">国家試験対策 (Exam Prep)</text>
</svg>
