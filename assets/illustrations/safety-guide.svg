  <text x="300" y="272" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#374151">安全の基本ルール</text>
  <text x="300" y="300" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#6B7280">● 定期点検 ● 安全教育 ● 事故報告 ● 改善活動</text>
