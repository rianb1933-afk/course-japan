<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg-safe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E3F2FD"/>
      <stop offset="100%" stop-color="#BBDEFB"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg-safe)"/>
  
  <!-- Shield -->
  <path d="M200 40 L120 70 L120 140 C120 190 200 220 200 220 C200 220 280 190 280 140 L280 70Z" fill="#FFF" stroke="#1565C0" stroke-width="3"/>
  <text x="200" y="140" text-anchor="middle" font-size="40">🛡️</text>
  
  <!-- Safety icons around shield -->
  <circle cx="60" cy="100" r="22" fill="#FFF" stroke="#1565C0" stroke-width="2"/>
  <text x="60" y="105" text-anchor="middle" font-size="16">🚨</text>
  
  <circle cx="340" cy="100" r="22" fill="#FFF" stroke="#1565C0" stroke-width="2"/>
  <text x="340" y="105" text-anchor="middle" font-size="16">🏥</text>
  
  <circle cx="60" cy="200" r="22" fill="#FFF" stroke="#1565C0" stroke-width="2"/>
  <text x="60" y="205" text-anchor="middle" font-size="16">📞</text>
  
  <circle cx="340" cy="200" r="22" fill="#FFF" stroke="#1565C0" stroke-width="2"/>
  <text x="340" y="205" text-anchor="middle" font-size="16">🦺</text>
  
  <text x="200" y="265" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0D47A1">安全ガイド (Safety Guide)</text>
  <text x="200" y="285" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1565C0">緊急時対応と安全確保</text>
</svg>
