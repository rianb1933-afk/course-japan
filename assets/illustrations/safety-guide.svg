  <text x="300" y="26" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#FFF">安全管理 · Keamanan · Safety Guide</text>
  
  <!-- Left: Safety Checklist -->
  <rect x="20" y="52" width="260" height="180" rx="10" fill="#FFF" stroke="#FEF3C7" stroke-width="1"/>
  <text x="150" y="72" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#374151">安全チェックリスト</text>
  
  <text x="40" y="100" font-family="system-ui,sans-serif" font-size="10" fill="#6B7280">☑ フロアの安全確認</text>
  <text x="40" y="118" font-family="system-ui,sans-serif" font-size="10" fill="#6B7280">☑ 照明の点検</text>
  <text x="40" y="136" font-family="system-ui,sans-serif" font-size="10" fill="#6B7280">☑ 滑り防止対策</text>
  <text x="40" y="154" font-family="system-ui,sans-serif" font-size="10" fill="#6B7280">☑ 手すりの確認</text>
  <text x="40" y="172" font-family="system-ui,sans-serif" font-size="10" fill="#6B7280">☑ 非常口の確認</text>
  <text x="40" y="190" font-family="system-ui,sans-serif" font-size="10" fill="#6B7280">☑ 消火器の確認</text>
  <text x="40" y="208" font-family="system-ui,sans-serif" font-size="10" fill="#6B7280">☑ 利用者の安全確認</text>
  
  <!-- Right: Hazard Prevention -->
  <rect x="310" y="52" width="270" height="180" rx="10" fill="#FFF" stroke="#FEF3C7" stroke-width="1"/>
  <text x="445" y="72" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#374151">事故予防</text>
  
  <rect x="325" y="82" width="240" height="28" rx="6" fill="#FEF2F2" stroke="#FECACA"/>
  <text x="337" y="100" font-family="system-ui,sans-serif" font-size="10" fill="#DC2626">転倒予防</text>
  
  <rect x="325" y="115" width="240" height="28" rx="6" fill="#FFF7ED" stroke="#FED7AA"/>
  <text x="337" y="133" font-family="system-ui,sans-serif" font-size="10" fill="#EA580C">褥瘡予防</text>
  
  <rect x="325" y="148" width="240" height="28" rx="6" fill="#F0FDF4" stroke="#BBF7D0"/>
  <text x="337" y="166" font-family="system-ui,sans-serif" font-size="10" fill="#16A34A">誤嚥予防</text>
  
  <rect x="325" y="181" width="240" height="28" rx="6" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="337" y="199" font-family="system-ui,sans-serif" font-size="10" fill="#2563EB">感染予防</text>
  
  <rect x="325" y="214" width="240" height="28" rx="6" fill="#F5F3FF" stroke="#E9D5FF"/>
