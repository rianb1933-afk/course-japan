<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350">
  <rect width="600" height="350" rx="12" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1"/>
  
  <!-- Title -->
  <rect x="0" y="0" width="600" height="40" rx="12" fill="#0369A1"/>
  <rect x="0" y="20" width="600" height="20" fill="#0369A1"/>
  <text x="300" y="27" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFF">AED · 自動体外式除細動器 · Defibrilator</text>
  
  <!-- Body outline -->
  <ellipse cx="300" cy="200" rx="80" ry="100" fill="none" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="4,3"/>
  <circle cx="300" cy="110" r="15" fill="#FDE68A" stroke="#D97706" stroke-width="1.5"/>
  
  <!-- Pad 1 (upper right) -->
  <rect x="310" y="140" width="40" height="25" rx="4" fill="#FFF" stroke="#DC2626" stroke-width="2"/>
  <text x="330" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#DC2626">PAD 1</text>
  <text x="330" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6B7280">右上胸</text>
  
  <!-- Pad 2 (left side) -->
  <rect x="230" y="190" width="40" height="25" rx="4" fill="#FFF" stroke="#DC2626" stroke-width="2"/>
  <text x="250" y="206" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#DC2626">PAD 2</text>
  <text x="250" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6B7280">左脇下</text>
  
  <!-- Wires -->
  <path d="M350 152 Q400 160 420 120" fill="none" stroke="#9CA3AF" stroke-width="1.5"/>
  <path d="M270 202 Q350 210 420 140" fill="none" stroke="#9CA3AF" stroke-width="1.5"/>
  
  <!-- AED device -->
  <rect x="420" y="80" width="140" height="100" rx="10" fill="#FFF" stroke="#0369A1" stroke-width="2"/>
  <rect x="435" y="95" width="110" height="40" rx="4" fill="#F0F9FF"/>
  <circle cx="490" cy="115" r="8" fill="#22C55E"/>
  <text x="490" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0369A1">AED</text>
  
  <!-- Steps (right side) -->
  <rect x="420" y="200" width="160" height="130" rx="8" fill="#FFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="500" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0369A1">手順 Steps</text>
  
  <text x="435" y="245" font-family="Arial, sans-serif" font-size="10" fill="#374151">① 電源ON</text>
  <text x="435" y="262" font-family="Arial, sans-serif" font-size="10" fill="#374151">② パッドを貼る</text>
  <text x="435" y="279" font-family="Arial, sans-serif" font-size="10" fill="#374151">③ 解析 → 離れる</text>
  <text x="435" y="296" font-family="Arial, sans-serif" font-size="10" fill="#DC2626" font-weight="bold">④ ショック → 放電</text>
  <text x="435" y="313" font-family="Arial, sans-serif" font-size="10" fill="#374151">⑤ 直ちにCPR再開</text>
  
  <!-- Warning -->
  <rect x="20" y="260" width="380" height="35" rx="6" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
  <text x="210" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#DC2626">⚠️ 解析・ショック時は誰も患者に触れない</text>
</svg>
