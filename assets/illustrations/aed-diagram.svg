<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
    <filter id="sh2" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>
  <rect width="600" height="400" rx="20" fill="url(#bg2)"/>
  
  <!-- Body outline for pad placement -->
  <ellipse cx="300" cy="300" rx="100" ry="50" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <ellipse cx="300" cy="180" rx="20" ry="22" fill="#FDE68A" stroke="#D97706" stroke-width="1.5"/>
  <line x1="300" y1="202" x2="300" y2="260" stroke="#94A3B8" stroke-width="2"/>
  <line x1="300" y1="220" x2="260" y2="250" stroke="#94A3B8" stroke-width="2"/>
  <line x1="300" y1="220" x2="340" y2="250" stroke="#94A3B8" stroke-width="2"/>
  
  <!-- AED device -->
  <rect x="400" y="60" width="160" height="110" rx="12" fill="#FFF" stroke="#0284C7" stroke-width="2.5" filter="url(#sh2)"/>
  <rect x="415" y="75" width="130" height="50" rx="6" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1.5"/>
  <circle cx="480" cy="100" r="10" fill="#22C55E"/>
  <text x="480" y="104" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="bold" fill="#FFF">ON</text>
  <text x="480" y="145" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0369A1">AED</text>
  <text x="480" y="160" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#64748B">自動体外式除細動器</text>
  
  <!-- Right pad (upper right chest) -->
  <ellipse cx="330" cy="240" rx="25" ry="18" fill="#FFF" stroke="#EF4444" stroke-width="2.5" filter="url(#sh2)"/>
  <text x="330" y="238" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#DC2626">PAD 1</text>
  <text x="330" y="250" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#64748B">右上</text>
  
  <!-- Left pad (left side, below armpit) -->
  <ellipse cx="250" cy="270" rx="25" ry="18" fill="#FFF" stroke="#EF4444" stroke-width="2.5" filter="url(#sh2)"/>
  <text x="250" y="268" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#DC2626">PAD 2</text>
  <text x="250" y="280" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#64748B">左下</text>
  
  <!-- Wires -->
  <path d="M400 120 Q370 130 350 220" fill="none" stroke="#94A3B8" stroke-width="2"/>
  <path d="M400 140 Q340 160 270 255" fill="none" stroke="#94A3B8" stroke-width="2"/>
  
  <!-- Lightning bolt -->
  <polygon points="475,125 485,125 480,140 490,140 475,160 480,145 470,145" fill="#FBBF24" stroke="#D97706" stroke-width="1"/>
  
  <!-- Steps -->
  <rect x="40" y="40" width="320" height="140" rx="12" fill="#FFF" filter="url(#sh2)"/>
  <text x="55" y="65" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0369A1">手順 (Steps):</text>
  
  <circle cx="60" cy="90" r="12" fill="#0284C7"/>
  <text x="60" y="94" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#FFF">1</text>
  <text x="80" y="94" font-family="sans-serif" font-size="11" fill="#334155">AEDの電源を入れる → 音声ガイドに従う</text>
  
  <circle cx="60" cy="115" r="12" fill="#0284C7"/>
  <text x="60" y="119" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#FFF">2</text>
  <text x="80" y="119" font-family="sans-serif" font-size="11" fill="#334155">パッドを.d胸に貼る (図の位置に)</text>
  
  <circle cx="60" cy="140" r="12" fill="#0284C7"/>
  <text x="60" y="144" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#FFF">3</text>
  <text x="80" y="144" font-family="sans-serif" font-size="11" fill="#334155">心電図解析 → 皆離れる</text>
  
  <circle cx="60" cy="165" r="12" fill="#DC2626"/>
  <text x="60" y="169" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#FFF">4</text>
  <text x="80" y="169" font-family="sans-serif" font-size="11" fill="#334155">ショック必要なら「離れて！」→ 放電ボタン</text>
  
  <!-- Warning -->
  <rect x="40" y="200" width="320" height="35" rx="8" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.5"/>
  <text x="170" y="222" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#DC2626">⚠️ 解析・ショック時は誰も触れないこと！</text>
</svg>
