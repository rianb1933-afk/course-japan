<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg-aed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#FEF2F2"/>
    </linearGradient>
    <filter id="shadow-md" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.12"/>
    </filter>
  </defs>
  
  <rect width="800" height="450" fill="url(#bg-aed)" rx="16"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="800" height="56" fill="#DC2626" rx="16"/>
  <rect x="0" y="40" width="800" height="16" fill="#DC2626"/>
  <circle cx="40" cy="28" r="18" fill="rgba(255,255,255,0.15)"/>
  <text x="40" y="33" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16">⚡</text>
  <text x="70" y="34" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#FFF">AED · 自動体外式除細動器 · Automated External Defibrillator</text>
  
  <!-- Left: AED Device -->
  <rect x="24" y="72" width="280" height="350" rx="12" fill="#FFF" filter="url(#shadow-md)"/>
  <rect x="24" y="72" width="280" height="44" rx="12" fill="#FEF2F2"/>
  <rect x="24" y="104" width="280" height="12" fill="#FEF2F2"/>
  <text x="164" y="100" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#DC2626">AED 構造 (Struktur)</text>
  
  <!-- AED Device -->
  <rect x="50" y="128" width="228" height="160" rx="12" fill="#FFF" stroke="#E5E7EB" stroke-width="2"/>
  <!-- Screen -->
  <rect x="68" y="144" width="192" height="60" rx="8" fill="#1E293B"/>
  <text x="164" y="168" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#4ADE80">AED Ready</text>
  <text x="164" y="188" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#FFF">⚡ SHOCK ADVISED</text>
  <!-- Buttons -->
  <circle cx="100" cy="230" r="14" fill="#DC2626"/>
  <text x="100" y="234" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="#FFF">ON</text>
  <circle cx="164" cy="230" r="14" fill="#16A34A"/>
  <text x="164" y="234" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#FFF">⚡</text>
  <circle cx="228" cy="230" r="14" fill="#2563EB"/>
  <text x="228" y="234" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="#FFF">i</text>
  <!-- Speaker -->
  <rect x="68" y="252" width="192" height="20" rx="4" fill="#F1F5F9"/>
  <text x="164" y="266" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#64748B">● ● ● Speaker ● ● ●</text>
  
  <!-- Pad Placement Diagram -->
  <rect x="50" y="300" width="228" height="110" rx="8" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="1"/>
  <text x="164" y="320" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#374151">パッド位置 (Posisi Pad)</text>
  <!-- Torso -->
  <ellipse cx="164" cy="370" rx="50" ry="35" fill="#FDE68A" stroke="#D97706" stroke-width="1.5"/>
  <!-- Pad 1 -->
  <rect x="130" y="345" width="35" height="22" rx="4" fill="#DC2626" stroke="#B91C1C" stroke-width="1.5"/>
  <text x="147" y="360" text-anchor="middle" font-family="system-ui,sans-serif" font-size="7" font-weight="700" fill="#FFF">右胸</text>
  <!-- Pad 2 -->
  <rect x="168" y="375" width="35" height="22" rx="4" fill="#2563EB" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="185" y="390" text-anchor="middle" font-family="system-ui,sans-serif" font-size="7" font-weight="700" fill="#FFF">左脇</text>
  
  <!-- Right: 5 Steps -->
  <rect x="316" y="72" width="460" height="350" rx="12" fill="#FFF" filter="url(#shadow-md)"/>
  <rect x="316" y="72" width="460" height="44" rx="12" fill="#FEF2F2"/>
  <rect x="316" y="104" width="460" height="12" fill="#FEF2F2"/>
  <text x="546" y="100" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#DC2626">AED 使用手順 (5 Langkah)</text>
  
  <!-- Step 1 -->
  <rect x="332" y="128" width="428" height="56" rx="8" fill="#FFF" stroke="#FEE2E2" stroke-width="1.5"/>
  <circle cx="356" cy="156" r="16" fill="#DC2626"/>
  <text x="356" y="160" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="800" fill="#FFF">1</text>
  <text x="384" y="148" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#DC2626">① 安全確認 → 電源ON</text>
  <text x="384" y="166" font-family="system-ui,sans-serif" font-size="9" fill="#6B7280">周囲の安全を確認し、AEDのカバーを開けて電源を入れる</text>
  
  <!-- Step 2 -->
  <rect x="332" y="192" width="428" height="56" rx="8" fill="#FFF" stroke="#DBEAFE" stroke-width="1.5"/>
  <circle cx="356" cy="220" r="16" fill="#2563EB"/>
  <text x="356" y="224" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="800" fill="#FFF">2</text>
  <text x="384" y="212" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#2563EB">② パッド貼付</text>
  <text x="384" y="230" font-family="system-ui,sans-serif" font-size="9" fill="#6B7280">右胸上部と左脇腹にパッドを貼る</text>
  
  <!-- Step 3 -->
  <rect x="332" y="256" width="428" height="56" rx="8" fill="#FFF" stroke="#D1FAE5" stroke-width="1.5"/>
  <circle cx="356" cy="284" r="16" fill="#16A34A"/>
  <text x="356" y="288" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="800" fill="#FFF">3</text>
  <text x="384" y="276" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#16A34A">③ 解析 → ショック指示</text>
  <text x="384" y="294" font-family="system-ui,sans-serif" font-size="9" fill="#6B7280">AEDが心臓のリズムを分析し、ショックが必要と判断</text>
  
  <!-- Step 4 -->
  <rect x="332" y="320" width="428" height="56" rx="8" fill="#FFF" stroke="#FEF3C7" stroke-width="1.5"/>
  <circle cx="356" cy="348" r="16" fill="#D97706"/>
  <text x="356" y="352" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="800" fill="#FFF">4</text>
  <text x="384" y="340" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#D97706">④ ショック実施</text>
  <text x="384" y="358" font-family="system-ui,sans-serif" font-size="9" fill="#6B7280">「離れて」と叫び、ボタンを押してショックを与える</text>
  
  <!-- Step 5 -->
  <rect x="332" y="384" width="428" height="32" rx="8" fill="#FFF" stroke="#F5F3FF" stroke-width="1.5"/>
  <circle cx="356" cy="400" r="12" fill="#7C3AED"/>
  <text x="356" y="404" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="800" fill="#FFF">5</text>
  <text x="384" y="396" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#7C3AED">⑤ 直ちにCPR再開</text>
  <text x="384" y="408" font-family="system-ui,sans-serif" font-size="9" fill="#6B7280">ショック後すぐに胸圧迫を再開</text>
</svg>
