<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350">
  <defs>
    <linearGradient id="bg-aed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FEF2F2"/>
      <stop offset="100%" stop-color="#FFF"/>
    </linearGradient>
  </defs>
  <rect width="600" height="350" fill="url(#bg-aed)" rx="12"/>
  
  <!-- Title Bar -->
  <rect x="0" y="0" width="600" height="40" fill="#DC2626" rx="12"/>
  <rect x="0" y="28" width="600" height="12" fill="#DC2626"/>
  <text x="300" y="26" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#FFF">AED · 自動体外式除細動器 · Alat Kejut Jantung</text>
  
  <!-- Left: AED Device -->
  <rect x="40" y="60" width="180" height="140" rx="12" fill="#FFF" stroke="#E5E7EB" stroke-width="2"/>
  <rect x="50" y="70" width="160" height="80" rx="8" fill="#1F2937"/>
  <text x="130" y="100" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#4ADE80">AED Ready</text>
  <text x="130" y="120" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#FFF">⚡ SHOCK</text>
  <text x="130" y="140" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#9CA3AF">按下して除細動</text>
  <!-- Buttons -->
  <circle cx="90" cy="170" r="10" fill="#DC2626"/>
  <text x="90" y="174" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" font-weight="700" fill="#FFF">ON</text>
  <circle cx="130" cy="170" r="10" fill="#16A34A"/>
  <text x="130" y="174" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" font-weight="700" fill="#FFF">⚡</text>
  <circle cx="170" cy="170" r="10" fill="#D97706"/>
  <text x="170" y="174" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" font-weight="700" fill="#FFF">i</text>
  
  <!-- Right: Pad Placement -->
  <rect x="260" y="60" width="310" height="190" rx="10" fill="#FFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="415" y="82" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#374151">パッド位置 (Pad Placement)</text>
  
  <!-- Torso outline -->
  <ellipse cx="415" cy="160" rx="60" ry="75" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  
  <!-- Pad 1: Right chest -->
  <rect x="370" y="100" width="40" height="30" rx="6" fill="#DC2626" stroke="#B91C1C" stroke-width="1.5"/>
  <text x="390" y="118" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" font-weight="700" fill="#FFF">Pad 1</text>
  <text x="390" y="145" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#374151">右胸上部</text>
  
  <!-- Pad 2: Left side -->
  <rect x="415" y="155" width="40" height="30" rx="6" fill="#2563EB" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="435" y="173" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" font-weight="700" fill="#FFF">Pad 2</text>
  <text x="435" y="200" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#374151">左脇腹</text>
  
  <!-- Arrows -->
  <path d="M390 130 L390 140" stroke="#DC2626" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M435 150 L435 155" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Bottom: 5 Steps -->
  <rect x="20" y="265" width="560" height="75" rx="10" fill="#FFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="300" y="285" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#374151">AED 使用手順 (Langkah Penggunaan AED)</text>
  
  <!-- Step circles -->
  <circle cx="80" cy="315" r="16" fill="#DC2626"/><text x="80" y="319" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="800" fill="#FFF">1</text>
  <text x="80" y="345" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#6B7280">電源ON</text>
  
  <circle cx="180" cy="315" r="16" fill="#DC2626"/><text x="180" y="319" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="800" fill="#FFF">2</text>
  <text x="180" y="345" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#6B7280">パッド貼付</text>
  
  <circle cx="280" cy="315" r="16" fill="#DC2626"/><text x="280" y="319" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="800" fill="#FFF">3</text>
  <text x="280" y="345" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#6B7280">解析</text>
  
  <circle cx="380" cy="315" r="16" fill="#DC2626"/><text x="380" y="319" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="800" fill="#FFF">4</text>
  <text x="380" y="345" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#6B7280">ショック</text>
  
  <circle cx="480" cy="315" r="16" fill="#16A34A"/><text x="480" y="319" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="800" fill="#FFF">5</text>
  <text x="480" y="345" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#6B7280">再開</text>
  
  <!-- Connecting arrows -->
  <line x1="96" y1="315" x2="164" y2="315" stroke="#D1D5DB" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="196" y1="315" x2="264" y2="315" stroke="#D1D5DB" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="296" y1="315" x2="364" y2="315" stroke="#D1D5DB" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="396" y1="315" x2="464" y2="315" stroke="#D1D5DB" stroke-width="1" stroke-dasharray="3,3"/>
</svg>