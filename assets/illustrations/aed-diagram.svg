<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350">
  <rect width="600" height="350" fill="#FFF"/>
  
  <!-- Title -->
  <rect x="0" y="0" width="600" height="36" fill="#0369A1"/>
  <text x="300" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#FFF">AED · 自動体外式除細動器</text>
  
  <!-- Body outline -->
  <ellipse cx="300" cy="200" rx="70" ry="90" fill="none" stroke="#D1D5DB" stroke-width="1.5" stroke-dasharray="4,3"/>
  <circle cx="300" cy="120" r="14" fill="#FDE68A" stroke="#D97706" stroke-width="1.5"/>
  
  <!-- Pad 1 -->
  <rect x="315" y="150" width="36" height="22" rx="4" fill="#FFF" stroke="#DC2626" stroke-width="2"/>
  <text x="333" y="164" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#DC2626">PAD 1</text>
  <text x="333" y="184" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#6B7280">右上胸</text>
  
  <!-- Pad 2 -->
  <rect x="249" y="195" width="36" height="22" rx="4" fill="#FFF" stroke="#DC2626" stroke-width="2"/>
  <text x="267" y="209" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#DC2626">PAD 2</text>
  <text x="267" y="229" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#6B7280">左脇下</text>
  
  <!-- Wires -->
  <path d="M351 161 Q390 165 410 130" fill="none" stroke="#9CA3AF" stroke-width="1.5"/>
  <path d="M285 206 Q340 215 410 150" fill="none" stroke="#9CA3AF" stroke-width="1.5"/>
  
  <!-- AED device -->
  <rect x="420" y="90" width="130" height="90" rx="8" fill="#FFF" stroke="#0369A1" stroke-width="2"/>
  <rect x="435" y="105" width="100" height="35" rx="4" fill="#F0F9FF"/>
  <circle cx="485" cy="122" r="7" fill="#22C55E"/>
  <text x="485" y="165" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0369A1">AED</text>
  
  <!-- Steps -->
  <rect x="420" y="200" width="160" height="130" rx="6" fill="#F9FAFB" stroke="#E5E7EB"/>
  <text x="500" y="220" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#0369A1">手順</text>
  
  <text x="435" y="242" font-family="system-ui, sans-serif" font-size="9" fill="#374155">① 電源ON</text>
  <text x="435" y="258" font-family="system-ui, sans-serif" font-size="9" fill="#374155">② パッドを貼る</text>
  <text x="435" y="274" font-family="system-ui, sans-serif" font-size="9" fill="#374155">③ 解析 → 離れる</text>
  <text x="435" y="290" font-family="system-ui, sans-serif" font-size="9" fill="#DC2626" font-weight="600">④ ショック → 放電</text>
  <text x="435" y="306" font-family="system-ui, sans-serif" font-size="9" fill="#374155">⑤ CPR再開</text>
  
  <!-- Warning -->
  <rect x="24" y="260" width="370" height="30" rx="4" fill="#FEF2F2" stroke="#FECACA"/>
  <text x="209" y="280" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#DC2626">⚠ 解析・ショック時は誰も触れない</text>
</svg>
