<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E3F2FD"/>
      <stop offset="100%" stop-color="#BBDEFB"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg2)"/>
  
  <!-- AED Device -->
  <rect x="130" y="60" width="140" height="100" rx="12" fill="#FFF" stroke="#1565C0" stroke-width="3"/>
  <rect x="150" y="80" width="100" height="40" rx="6" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
  <circle cx="200" cy="100" r="8" fill="#4CAF50"/>
  <text x="200" y="135" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1565C0">AED</text>
  
  <!-- Pads -->
  <ellipse cx="120" cy="200" rx="30" ry="20" fill="#FFF" stroke="#E53935" stroke-width="2"/>
  <text x="120" y="205" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#E53935">右上</text>
  <ellipse cx="280" cy="200" rx="30" ry="20" fill="#FFF" stroke="#E53935" stroke-width="2"/>
  <text x="280" y="205" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#E53935">左下</text>
  
  <!-- Wire -->
  <path d="M150 160 Q120 180 120 185" fill="none" stroke="#666" stroke-width="2"/>
  <path d="M250 160 Q280 180 280 185" fill="none" stroke="#666" stroke-width="2"/>
  
  <!-- Lightning bolt -->
  <polygon points="195,155 205,155 200,170 210,170 195,190 200,175 190,175" fill="#FFC107" stroke="#FF8F00" stroke-width="1"/>
  
  <!-- Body outline -->
  <ellipse cx="200" cy="240" rx="60" ry="35" fill="none" stroke="#90A4AE" stroke-width="2" stroke-dasharray="6,3"/>
  
  <text x="200" y="290" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1565C0">自動体外式除細動器 (AED)</text>
</svg>
