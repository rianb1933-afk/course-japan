<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg-speak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E0F7FA"/>
      <stop offset="100%" stop-color="#B2EBF2"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg-speak)"/>
  
  <!-- Speech bubbles -->
  <rect x="40" y="60" width="140" height="60" rx="12" fill="#FFF" stroke="#00838F" stroke-width="2"/>
  <polygon points="100,120 110,135 120,120" fill="#FFF" stroke="#00838F" stroke-width="2"/>
  <text x="110" y="85" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#006064">お元気ですか？</text>
  <text x="110" y="100" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#00838F">Apa kabar?</text>
  
  <rect x="220" y="80" width="140" height="60" rx="12" fill="#FFF" stroke="#00838F" stroke-width="2"/>
  <polygon points="280,140 290,155 300,140" fill="#FFF" stroke="#00838F" stroke-width="2"/>
  <text x="290" y="105" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#006064">はい、元気です</text>
  <text x="290" y="120" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#00838F">Ya, baik</text>
  
  <!-- Microphone -->
  <circle cx="200" cy="200" r="30" fill="#FFF" stroke="#00838F" stroke-width="2"/>
  <rect x="190" y="175" width="20" height="30" rx="10" fill="#00838F"/>
  <line x1="200" y1="210" x2="200" y2="230" stroke="#00838F" stroke-width="3"/>
  <line x1="185" y1="230" x2="215" y2="230" stroke="#00838F" stroke-width="3"/>
  
  <!-- Sound waves -->
  <path d="M240 195 Q255 200 240 205" fill="none" stroke="#00BCD4" stroke-width="2"/>
  <path d="M250 188 Q270 200 250 212" fill="none" stroke="#00BCD4" stroke-width="2"/>
  <path d="M260 182 Q285 200 260 218" fill="none" stroke="#00BCD4" stroke-width="2"/>
  
  <text x="200" y="265" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#006064">会話練習 (Speaking Practice)</text>
</svg>
