  <path d="M205 115 C205 108, 215 100, 220 108 C225 100, 235 108, 235 115 C235 130, 220 140, 220 140 C220 140, 205 130, 205 115Z" fill="#E91E63" opacity="0.8" transform="translate(-15, 0)"/>
  
