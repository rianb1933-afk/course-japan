<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" width="400" height="350">
  <defs><style>
    .bg{fill:#fef2f2}.body{fill:#ffeaea;stroke:#be3428;stroke-width:2.5}
    .ear-outer{fill:#ffd0d0;stroke:#be3428;stroke-width:2}.ear-inner{fill:#ffb0b0}
    .head{fill:#fff5f5;stroke:#be3428;stroke-width:2}.eye-white{fill:white;stroke:#be3428;stroke-width:1}
    .eye-dark{fill:#1a0a0a}.nose{fill:#ff7777}.cheek{fill:#ffcdd2;opacity:0.6}
    .bow{fill:#be3428}.bow-center{fill:#ff5555}.whisker{stroke:#9e9e9e;stroke-width:1.2;fill:none}
    .hat{fill:#be3428;stroke:#8b0000;stroke-width:1.5}.hat-band{fill:#ff8888}
    .book{fill:#fafafa;stroke:#be3428;stroke-width:1.5}.book-lines{stroke:#e0e0e0;stroke-width:1;fill:none}
    .text-jp{font-family:"Noto Serif JP",serif;font-size:13px;font-weight:bold;fill:#be3428}
    .text-sm{font-family:Arial,sans-serif;font-size:10px;fill:#888}
    .paw{fill:#ffeaea;stroke:#be3428;stroke-width:1.5}
  </style></defs>

  <!-- Background circle -->
  <circle cx="200" cy="175" r="155" fill="#fef2f2" opacity="0.5"/>

  <!-- Graduation hat -->
  <rect x="148" y="62" width="104" height="14" rx="3" class="hat"/>
  <polygon points="200,48 148,70 252,70" class="hat"/>
  <rect x="247" y="64" width="3" height="20" fill="#be3428"/>
  <circle cx="249" cy="86" r="5" class="bow-center"/>
  <rect x="180" y="56" width="40" height="5" rx="2" class="hat-band"/>

  <!-- Ears -->
  <polygon points="155,100 140,68 178,95" class="ear-outer"/>
  <polygon points="157,98 147,75 172,94" class="ear-inner"/>
  <polygon points="245,100 260,68 222,95" class="ear-outer"/>
  <polygon points="243,98 253,75 228,94" class="ear-inner"/>

  <!-- Head -->
  <circle cx="200" cy="148" r="68" class="head"/>

  <!-- Cheeks -->
  <ellipse cx="168" cy="158" rx="16" ry="10" class="cheek"/>
  <ellipse cx="232" cy="158" rx="16" ry="10" class="cheek"/>

  <!-- Eyes -->
  <ellipse cx="181" cy="138" rx="12" ry="13" class="eye-white"/>
  <ellipse cx="219" cy="138" rx="12" ry="13" class="eye-white"/>
  <ellipse cx="182" cy="139" rx="8" ry="9" class="eye-dark"/>
  <ellipse cx="220" cy="139" rx="8" ry="9" class="eye-dark"/>
  <circle cx="185" cy="136" r="3" fill="white"/>
  <circle cx="223" cy="136" r="3" fill="white"/>

  <!-- Nose -->
  <ellipse cx="200" cy="155" rx="6" ry="4.5" class="nose"/>
  <!-- Mouth -->
  <path d="M194,160 Q200,166 206,160" stroke="#cc4444" stroke-width="1.8" fill="none"/>

  <!-- Whiskers -->
  <line x1="148" y1="152" x2="183" y2="155" class="whisker"/>
  <line x1="148" y1="158" x2="183" y2="157" class="whisker"/>
  <line x1="148" y1="164" x2="183" y2="160" class="whisker"/>
  <line x1="217" y1="155" x2="252" y2="152" class="whisker"/>
  <line x1="217" y1="157" x2="252" y2="158" class="whisker"/>
  <line x1="217" y1="160" x2="252" y2="164" class="whisker"/>

  <!-- Body -->
  <ellipse cx="200" cy="256" rx="72" ry="60" class="body"/>

  <!-- Bow on chest -->
  <path d="M182,220 L195,228 L182,236 Z" class="bow"/>
  <path d="M218,220 L205,228 L218,236 Z" class="bow"/>
  <circle cx="200" cy="228" r="6" class="bow-center"/>

  <!-- Book -->
  <rect x="130" y="240" width="55" height="44" rx="4" class="book"/>
  <line x1="157" y1="240" x2="157" y2="284" class="book-lines"/>
  <line x1="137" y1="252" x2="153" y2="252" class="book-lines"/>
  <line x1="137" y1="258" x2="153" y2="258" class="book-lines"/>
  <line x1="137" y1="264" x2="153" y2="264" class="book-lines"/>
  <text x="163" y="258" class="text-jp">日本語</text>
  <text x="163" y="272" style="font-family:Arial;font-size:9px;fill:#be3428">N5→N1</text>

  <!-- Paws -->
  <ellipse cx="158" cy="302" rx="22" ry="14" class="paw"/>
  <ellipse cx="242" cy="302" rx="22" ry="14" class="paw"/>

  <!-- Floating kanji hint -->
  <text x="298" y="130" class="text-jp" font-size="16">夢</text>
  <text x="290" y="147" class="text-sm">(yume)</text>
  <text x="289" y="159" class="text-sm">= mimpi</text>
</svg>