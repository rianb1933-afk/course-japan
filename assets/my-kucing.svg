<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="46%" r="60%">
      <stop offset="0%" stop-color="#FDECEA"/>
      <stop offset="55%" stop-color="#FDECEA" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FDECEA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8534A"/>
      <stop offset="100%" stop-color="#C0392B"/>
    </linearGradient>
    <radialGradient id="bodyGrad" cx="42%" cy="28%" r="80%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFEDE9"/>
    </radialGradient>
    <linearGradient id="tailGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1EE"/>
      <stop offset="100%" stop-color="#FFDAD3"/>
    </linearGradient>
    <linearGradient id="bowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8534A"/>
      <stop offset="100%" stop-color="#C0392B"/>
    </linearGradient>
    <radialGradient id="eyeGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#3A2420"/>
      <stop offset="100%" stop-color="#180C0A"/>
    </radialGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#C0392B" flood-opacity="0.16"/>
    </filter>
    <style>
      .eyes { transform-box: fill-box; transform-origin: center; animation: catBlink 5s ease-in-out infinite; }
      .tail { transform-box: fill-box; transform-origin: 90% 90%; animation: tailSway 3.2s ease-in-out infinite; }
      .sparkle { transform-box: fill-box; transform-origin: center; animation: sparkleTwinkle 2.4s ease-in-out infinite; }
      .sparkle-2 { animation-delay: .5s; }
      .sparkle-3 { animation-delay: 1.1s; }
      .sparkle-4 { animation-delay: 1.7s; }
      @keyframes catBlink {
        0%, 88%, 100% { transform: scaleY(1); }
        91%, 95% { transform: scaleY(0.08); }
      }
      @keyframes tailSway {
        0%, 100% { transform: rotate(-4deg); }
        50% { transform: rotate(4deg); }
      }
      @keyframes sparkleTwinkle {
        0%, 100% { opacity: 0.85; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.75); }
      }
      @media (prefers-reduced-motion: reduce) {
        .eyes, .tail, .sparkle { animation: none; }
      }
    </style>
  </defs>

  <!-- Soft halo backdrop -->
  <ellipse cx="200" cy="270" rx="195" ry="230" fill="url(#bgGlow)"/>

  <!-- Sparkles -->
  <g fill="#D4A042">
    <path class="sparkle sparkle-1" d="M60,130 l4,10 10,4 -10,4 -4,10 -4,-10 -10,-4 10,-4 Z" opacity="0.85"/>
    <path class="sparkle sparkle-3" d="M338,370 l3,7 7,3 -7,3 -3,7 -3,-7 -7,-3 7,-3 Z" opacity="0.7"/>
    <circle class="sparkle sparkle-2" cx="50" cy="270" r="4" opacity="0.6"/>
    <circle class="sparkle sparkle-4" cx="350" cy="240" r="3.5" opacity="0.55"/>
  </g>

  <!-- Floating kanji hint, right-aligned so it never runs off-canvas -->
  <g text-anchor="end">
    <text x="384" y="118" font-family="'Noto Serif JP',serif" font-size="28" font-weight="700" fill="#C0392B">夢</text>
    <text x="384" y="140" font-family="Arial,sans-serif" font-size="12" fill="#9A9AA2">(yume)</text>
    <text x="384" y="156" font-family="Arial,sans-serif" font-size="12" fill="#9A9AA2">= mimpi</text>
  </g>

  <g filter="url(#softShadow)">

    <!-- Tail: drawn BEHIND the main silhouette so it visibly emerges from the body, no floating seam -->
    <path class="tail" d="M270,369
             C 316,367 348,341 344,309
             C 341,287 320,271 296,273
             C 314,281 326,296 324,312
             C 322,333 300,348 268,349
             Z"
          fill="url(#tailGrad)" stroke="#C0392B" stroke-width="3"/>

    <!-- ═══ ONE continuous silhouette: ears + head + waist + body + paw bumps ═══ -->
    <path d="
      M 152,90
      C 122,90 100,112 98,148
      C 96,172 108,192 128,204
      C 108,219 96,240 92,267
      C 86,303 86,334 98,362
      C 106,379 122,389 148,393
      C 164,395 176,389 182,382
      C 188,389 200,394 200,394
      C 200,394 212,389 218,382
      C 224,389 236,395 252,393
      C 278,389 294,379 302,362
      C 314,334 314,303 308,267
      C 304,240 292,219 272,204
      C 292,192 304,172 302,148
      C 300,112 278,90 248,90
      C 232,90 222,102 218,118
      C 214,132 210,140 200,140
      C 190,140 186,132 182,118
      C 178,102 168,90 152,90
      Z
    " fill="url(#bodyGrad)" stroke="#C0392B" stroke-width="3"/>

    <!-- Inner ears -->
    <path d="M120,150 C 122,130 132,112 148,104 C 138,124 134,144 138,164 Z" fill="#FF9E92"/>
    <path d="M280,150 C 278,130 268,112 252,104 C 262,124 266,144 262,164 Z" fill="#FF9E92"/>

    <!-- Graduation cap: valley patch first so no background peeks through between the ears -->
    <g>
      <path d="M178,100 Q200,146 222,100 Z" fill="url(#capGrad)"/>
      <path d="M166,108 C 166,100 182,94 200,94 C 218,94 234,100 234,108 C 234,116 218,122 200,122 C 182,122 166,116 166,108 Z" fill="url(#capGrad)"/>
      <polygon points="200,72 132,108 200,128 268,108" fill="url(#capGrad)"/>
      <rect x="195" y="120" width="10" height="7" rx="2.5" fill="#8B2318"/>
      <path d="M252,104 C 270,108 282,120 280,136" stroke="#8B2318" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle cx="280" cy="144" r="7.5" fill="#D4A042"/>
      <rect x="180" y="101" width="40" height="7" rx="3.5" fill="#FF9E92" opacity="0.85"/>
    </g>

    <!-- Cheeks -->
    <ellipse cx="150" cy="182" rx="17" ry="11" fill="#FFB4AC" opacity="0.55"/>
    <ellipse cx="250" cy="182" rx="17" ry="11" fill="#FFB4AC" opacity="0.55"/>

    <!-- Whiskers -->
    <g stroke="#C9C4C0" stroke-width="1.5" stroke-linecap="round" fill="none">
      <path d="M100,178 Q128,180 156,184"/>
      <path d="M98,190 Q126,190 156,191"/>
      <path d="M102,202 Q128,198 156,197"/>
      <path d="M300,178 Q272,180 244,184"/>
      <path d="M302,190 Q274,190 244,191"/>
      <path d="M298,202 Q272,198 244,197"/>
    </g>

    <!-- Eyes -->
    <g class="eyes">
      <ellipse cx="172" cy="168" rx="15" ry="16.5" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.4"/>
      <ellipse cx="228" cy="168" rx="15" ry="16.5" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.4"/>
      <ellipse cx="173.5" cy="170" rx="9.7" ry="11" fill="url(#eyeGrad)"/>
      <ellipse cx="229.5" cy="170" rx="9.7" ry="11" fill="url(#eyeGrad)"/>
      <circle cx="177.5" cy="163" r="3.5" fill="#FFFFFF"/>
      <circle cx="233.5" cy="163" r="3.5" fill="#FFFFFF"/>
      <circle cx="169.5" cy="176" r="1.7" fill="#FFFFFF" opacity="0.85"/>
      <circle cx="225.5" cy="176" r="1.7" fill="#FFFFFF" opacity="0.85"/>
    </g>

    <!-- Nose & mouth -->
    <path d="M200,186 L207,194 Q200,199 193,194 Z" fill="#E8534A"/>
    <path d="M186,200 Q200,210 214,200" stroke="#C0392B" stroke-width="1.8" fill="none" stroke-linecap="round"/>

    <!-- Chest bow -->
    <path d="M178,246 L198,256 L178,266 Q171,256 178,246 Z" fill="url(#bowGrad)"/>
    <path d="M222,246 L202,256 L222,266 Q229,256 222,246 Z" fill="url(#bowGrad)"/>
    <circle cx="200" cy="256" r="7.5" fill="#D4A042"/>

    <!-- Book -->
    <g>
      <rect x="140" y="270" width="76" height="60" rx="5" fill="#FFFDFB" stroke="#C0392B" stroke-width="2"/>
      <line x1="178" y1="270" x2="178" y2="330" stroke="#F0DFDC" stroke-width="1.5"/>
      <line x1="149" y1="287" x2="171" y2="287" stroke="#F0DFDC" stroke-width="1.5"/>
      <line x1="149" y1="297" x2="171" y2="297" stroke="#F0DFDC" stroke-width="1.5"/>
      <line x1="149" y1="307" x2="171" y2="307" stroke="#F0DFDC" stroke-width="1.5"/>
      <text x="185" y="298" font-family="'Noto Serif JP',serif" font-size="16" font-weight="700" fill="#C0392B">日本語</text>
      <text x="185" y="317" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#E8534A">N5→N1</text>
      <path d="M195,270 L195,259 L205,264.5 L215,259 L215,270 Z" fill="#D4A042"/>
    </g>

    <!-- Paw pad marks on the built-in bottom bumps -->
    <path d="M138,450 q10,7 20,0" stroke="#E8B4AC" stroke-width="1.6" fill="none" opacity="0.75"/>
    <path d="M242,450 q10,7 20,0" stroke="#E8B4AC" stroke-width="1.6" fill="none" opacity="0.75"/>
  </g>
</svg>
