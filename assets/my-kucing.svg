<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="46%" r="60%">
      <stop offset="0%" stop-color="#FDECEA"/>
      <stop offset="55%" stop-color="#FDECEA" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FDECEA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8534A"/>
      <stop offset="100%" stop-color="#C0392B"/>
    </linearGradient>
    <linearGradient id="earOuterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD9D4"/>
      <stop offset="100%" stop-color="#FFC2BA"/>
    </linearGradient>
    <radialGradient id="headGrad" cx="42%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF1EE"/>
    </radialGradient>
    <radialGradient id="bodyGrad" cx="40%" cy="22%" r="85%">
      <stop offset="0%" stop-color="#FFFDFC"/>
      <stop offset="100%" stop-color="#FFEDE9"/>
    </radialGradient>
    <linearGradient id="tailGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1EE"/>
      <stop offset="100%" stop-color="#FFDAD3"/>
    </linearGradient>
    <linearGradient id="bowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8534A"/>
      <stop offset="100%" stop-color="#C0392B"/>
    </linearGradient>
    <radialGradient id="eyeGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#3A2420"/>
      <stop offset="100%" stop-color="#180C0A"/>
    </radialGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#C0392B" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Soft halo backdrop -->
  <ellipse cx="200" cy="250" rx="195" ry="235" fill="url(#bgGlow)"/>

  <!-- Sparkles -->
  <g fill="#D4A042">
    <path d="M62,120 l4,10 10,4 -10,4 -4,10 -4,-10 -10,-4 10,-4 Z" opacity="0.85"/>
    <path d="M340,360 l3,7 7,3 -7,3 -3,7 -3,-7 -7,-3 7,-3 Z" opacity="0.7"/>
    <circle cx="52" cy="260" r="4" opacity="0.6"/>
    <circle cx="352" cy="230" r="3.5" opacity="0.55"/>
  </g>

  <!-- Floating kanji hint, right-aligned so it never runs off-canvas -->
  <g text-anchor="end">
    <text x="384" y="118" font-family="'Noto Serif JP',serif" font-size="28" font-weight="700" fill="#C0392B">夢</text>
    <text x="384" y="140" font-family="Arial,sans-serif" font-size="12" fill="#9A9AA2">(yume)</text>
    <text x="384" y="156" font-family="Arial,sans-serif" font-size="12" fill="#9A9AA2">= mimpi</text>
  </g>

  <!-- ═══ CAT (shadow-grouped) ═══ -->
  <g filter="url(#softShadow)">

    <!-- Tail: curled comma-shape tucked behind the body's right side -->
    <path d="M272,392
             C 316,388 344,352 338,310
             C 334,282 312,264 290,268
             C 308,278 320,298 318,320
             C 316,346 296,364 268,368
             Z"
          fill="url(#tailGrad)" stroke="#C0392B" stroke-width="2.5"/>

    <!-- Ears -->
    <path d="M152,158 C 122,116 106,76 114,56 C 136,68 164,102 180,138 Z" fill="url(#earOuterGrad)" stroke="#C0392B" stroke-width="2.5"/>
    <path d="M150,142 C 132,116 124,90 128,74 C 144,86 158,108 166,130 Z" fill="#FF9E92"/>
    <path d="M248,158 C 278,116 294,76 286,56 C 264,68 236,102 220,138 Z" fill="url(#earOuterGrad)" stroke="#C0392B" stroke-width="2.5"/>
    <path d="M250,142 C 268,116 276,90 272,74 C 256,86 242,108 234,130 Z" fill="#FF9E92"/>

    <!-- Graduation cap -->
    <g>
      <path d="M162,104 C 162,95 179,88 200,88 C 221,88 238,95 238,104 C 238,113 221,120 200,120 C 179,120 162,113 162,104 Z" fill="url(#capGrad)"/>
      <polygon points="200,64 124,104 200,124 276,104" fill="url(#capGrad)"/>
      <rect x="195" y="117" width="10" height="7" rx="2.5" fill="#8B2318"/>
      <path d="M258,100 C 276,104 288,116 286,132" stroke="#8B2318" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle cx="286" cy="140" r="7.5" fill="#D4A042"/>
      <rect x="178" y="97" width="44" height="7.5" rx="3.75" fill="#FF9E92" opacity="0.85"/>
    </g>

    <!-- Head -->
    <circle cx="200" cy="192" r="86" fill="url(#headGrad)" stroke="#C0392B" stroke-width="2.5"/>

    <!-- Cheeks -->
    <ellipse cx="156" cy="212" rx="19" ry="12" fill="#FFB4AC" opacity="0.55"/>
    <ellipse cx="244" cy="212" rx="19" ry="12" fill="#FFB4AC" opacity="0.55"/>

    <!-- Whiskers (kept clear below the eyes) -->
    <g stroke="#C9C4C0" stroke-width="1.5" stroke-linecap="round" fill="none">
      <path d="M112,208 Q140,210 166,214"/>
      <path d="M110,220 Q138,220 166,221"/>
      <path d="M114,232 Q140,228 166,227"/>
      <path d="M288,208 Q260,210 234,214"/>
      <path d="M290,220 Q262,220 234,221"/>
      <path d="M286,232 Q260,228 234,227"/>
    </g>

    <!-- Eyes -->
    <ellipse cx="174" cy="184" rx="15.5" ry="17" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.4"/>
    <ellipse cx="226" cy="184" rx="15.5" ry="17" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.4"/>
    <ellipse cx="175.5" cy="186" rx="10" ry="11.5" fill="url(#eyeGrad)"/>
    <ellipse cx="227.5" cy="186" rx="10" ry="11.5" fill="url(#eyeGrad)"/>
    <circle cx="179.5" cy="179" r="3.6" fill="#FFFFFF"/>
    <circle cx="231.5" cy="179" r="3.6" fill="#FFFFFF"/>
    <circle cx="171.5" cy="192" r="1.7" fill="#FFFFFF" opacity="0.85"/>
    <circle cx="223.5" cy="192" r="1.7" fill="#FFFFFF" opacity="0.85"/>

    <!-- Nose & mouth -->
    <path d="M200,202 L207,210 Q200,215 193,210 Z" fill="#E8534A"/>
    <path d="M186,216 Q200,226 214,216" stroke="#C0392B" stroke-width="1.8" fill="none" stroke-linecap="round"/>

    <!-- Body -->
    <ellipse cx="200" cy="356" rx="94" ry="80" fill="url(#bodyGrad)" stroke="#C0392B" stroke-width="2.5"/>

    <!-- Bow on chest -->
    <path d="M176,300 L196,311 L176,322 Q169,311 176,300 Z" fill="url(#bowGrad)"/>
    <path d="M224,300 L204,311 L224,322 Q231,311 224,300 Z" fill="url(#bowGrad)"/>
    <circle cx="200" cy="311" r="8" fill="#D4A042"/>

    <!-- Book -->
    <g>
      <rect x="138" y="332" width="78" height="62" rx="5" fill="#FFFDFB" stroke="#C0392B" stroke-width="2"/>
      <line x1="177" y1="332" x2="177" y2="394" stroke="#F0DFDC" stroke-width="1.5"/>
      <line x1="148" y1="349" x2="170" y2="349" stroke="#F0DFDC" stroke-width="1.5"/>
      <line x1="148" y1="359" x2="170" y2="359" stroke="#F0DFDC" stroke-width="1.5"/>
      <line x1="148" y1="369" x2="170" y2="369" stroke="#F0DFDC" stroke-width="1.5"/>
      <text x="185" y="360" font-family="'Noto Serif JP',serif" font-size="16" font-weight="700" fill="#C0392B">日本語</text>
      <text x="185" y="379" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#E8534A">N5→N1</text>
      <path d="M194,332 L194,321 L204,326.5 L214,321 L214,332 Z" fill="#D4A042"/>
    </g>

    <!-- Paws -->
    <ellipse cx="150" cy="410" rx="27" ry="17" fill="url(#bodyGrad)" stroke="#C0392B" stroke-width="2.2"/>
    <ellipse cx="250" cy="410" rx="27" ry="17" fill="url(#bodyGrad)" stroke="#C0392B" stroke-width="2.2"/>
    <path d="M141,406 q9,7 18,0 M232,406 q9,7 18,0" stroke="#E8B4AC" stroke-width="1.5" fill="none" opacity="0.7"/>
  </g>
</svg>
