# ── Halaman usang -- digantikan fitur yang lebih baru ──────────────────
# GENUINELY DITAMBAHKAN (Fase Audit Website Putaran Kelima, Fase U):
# Progress.html dikonfirmasi genuinely orphan (tidak ditautkan dari
# manapun di seluruh proyek) dan genuinely halaman statis usang --
# hanya kartu deskriptif tanpa logic data nyata (XP/streak/analitik),
# digantikan sepenuhnya oleh Dashboard/Dashboard.html yang jauh lebih
# fungsional. Redirect 301 (bukan hapus file) untuk mengamankan
# bookmark/link eksternal yang mungkin masih mengarah ke URL lama.
[[redirects]]
  from   = "/Progress.html"
  to     = "/Dashboard/Dashboard.html"
  status = 301

# GENUINELY DITAMBAHKAN (Fase BB, Audit Kebersihan Konten): Verify.html
# dikonfirmasi genuinely orphan total (0 link masuk dari manapun di
# seluruh proyek), digantikan Certificate-Verify.html yang genuinely
# aktif dipakai sistem sertifikat (ditautkan dari Certificate-Pro.html
# sebagai URL verifikasi resmi publik "nihongopro.id/verify"). Judul
# halaman genuinely identik ("Verifikasi Sertifikat — Nihongo Pro
# Academy") mengonfirmasi kedua halaman genuinely fungsi yang sama,
# dengan Certificate-Verify.html genuinely lebih lengkap (214 vs 102
# baris). Redirect 301 mengamankan bookmark/link eksternal lama.
[[redirects]]
  from   = "/Verify.html"
  to     = "/Certificate-Verify.html"
  status = 301

# ── 404 Fallback ──────────────────────────────────────────────────────
[[redirects]]
  from   = "/*"
  to     = "/404.html"
  status = 404
