<script>
// Tanggal ujian JLPT resmi (Juli & Desember setiap tahun)
const JLPT_DATES = [
  { name: 'JLPT Sesi Juli', date: '2026-07-05' },
  { name: 'JLPT Sesi Desember', date: '2026-12-06' },
];

function daysUntil(dateStr){
  const target = new Date(dateStr);
  const now = new Date();
  return Math.ceil((target - now) / 86400000);
}

function renderExams(){
  const grid = document.getElementById('examGrid');
  // GENUINELY DIPERBAIKI (Fase Audit Website, Fase B): dikonfirmasi via
  // pengujian interaktif genuine bahwa sesi JLPT yang sudah LEWAT
  // (`daysUntil` negatif) genuinely tetap ditampilkan sebagai kartu
  // PERTAMA (urutan sort ascending menempatkan angka paling negatif
  // duluan), meski badge "TERDEKAT" genuinely jatuh ke sesi masa depan
  // yang benar. Dibuktikan konkret: "JLPT Sesi Juli" (sudah lewat)
  // genuinely muncul sebelum "JLPT Sesi Desember" (111 hari lagi) --
  // membingungkan pengguna yang melihat sesi kadaluarsa duluan di
  // halaman jadwal. Diperbaiki dengan memfilter sesi yang genuinely
  // sudah lewat SEBELUM sorting, mengingat sesi kadaluarsa genuinely
  // tidak berguna ditampilkan sebagai kartu aktif di halaman ini.
  const upcoming = JLPT_DATES.filter(e => daysUntil(e.date) >= 0);
  if (!upcoming.length) {
    grid.innerHTML = '<div class="empty-state">Jadwal JLPT terbaru sedang diperbarui. Cek kembali nanti!</div>';
    return;
  }
  const sorted = [...upcoming].sort((a,b)=>daysUntil(a.date)-daysUntil(b.date));
  let firstFuture = true;
  grid.innerHTML = sorted.map(e => {
    const days = daysUntil(e.date);
    const isNext = days > 0 && firstFuture;
    if (days > 0) firstFuture = false;
    const d = new Date(e.date);
    const dateLabel = d.toLocaleDateString('id-ID', { day:'numeric', month:'long', year:'numeric' });
    return `<div class="exam-card ${isNext?'next':''}">
      ${isNext?'<span class="exam-badge">TERDEKAT</span>':''}
      <div class="exam-date">${dateLabel}</div>
      <div class="exam-name">${e.name}</div>
      <div class="exam-countdown">${days > 0 ? `⏳ ${days} hari lagi` : days === 0 ? '🎯 Hari ini!' : 'Sudah lewat'}</div>
      <a href="JLPT-CBT.html" class="exam-link">Mulai latihan CBT →</a>
    </div>`;
  }).join('');
}

const LIVE_CLASSES = [
  { day: 'Sen', num: 17, title: 'Grammar Workshop N4', time: '19:00–20:30 WIB' },
  { day: 'Rab', num: 19, title: 'Kaiwa Practice — Topik Kaigo', time: '20:00–21:00 WIB' },
  { day: 'Jum', num: 21, title: 'JLPT Mock Test N3', time: '14:00–16:00 WIB' },
  { day: 'Min', num: 23, title: 'Kanji Marathon N5–N4', time: '10:00–11:30 WIB' },
];

function renderClasses(){
  document.getElementById('classList').innerHTML = LIVE_CLASSES.map(c => `
    <div class="class-item">
      <div class="class-day">
        <div class="class-day-name">${c.day}</div>
        <div class="class-day-num">${c.num}</div>
      </div>
      <div class="class-info">
        <div class="class-title">${c.title}</div>
        <div class="class-time">${c.time}</div>
      </div>
      <a href="Kelas-Online.html" class="class-join">Gabung</a>
    </div>`).join('');
}

// Reminder
function getReminders(){ return JSON.parse(localStorage.getItem('np_reminders')||'[]'); }
function saveReminders(r){ localStorage.setItem('np_reminders', JSON.stringify(r)); }

function addReminder(){
  const text = document.getElementById('reminderText').value.trim();
  const date = document.getElementById('reminderDate').value;
  if(!text){ return; }
  const list = getReminders();
  list.push({ id: Date.now(), text, date: date || null, done: false });
  saveReminders(list);
  document.getElementById('reminderText').value = '';
  document.getElementById('reminderDate').value = '';
  renderReminders();
}

function toggleReminder(id){
  const list = getReminders();
  const r = list.find(x=>x.id===id);
  if(r) r.done = !r.done;
  saveReminders(list);
  renderReminders();
}

function deleteReminder(id){
  saveReminders(getReminders().filter(r=>r.id!==id));
  renderReminders();
}

function renderReminders(){
  const list = getReminders().sort((a,b)=>(a.done-b.done) || (new Date(a.date||0) - new Date(b.date||0)));
  const el = document.getElementById('reminderList');
  if(!list.length){
    el.innerHTML = '<div class="empty-state">Belum ada reminder. Tambahkan target belajar di atas!</div>';
    return;
  }
  el.innerHTML = list.map(r => `
    <div class="reminder-item">
      <div class="r-check ${r.done?'done':''}" onclick="toggleReminder(${r.id})"></div>
      <div class="r-text ${r.done?'done':''}">${r.text.replace(/</g,'&lt;')}</div>
      <div class="r-date">${r.date ? new Date(r.date).toLocaleDateString('id-ID',{day:'numeric',month:'short'}) : ''}</div>
      <button aria-label="Deletereminder" class="r-del" onclick="deleteReminder(${r.id})">✕</button>
    </div>`).join('');
}

document.addEventListener('DOMContentLoaded', () => {
  renderExams();
  renderClasses();
  renderReminders();
  // Default tanggal reminder = besok
  const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate()+1);
  document.getElementById('reminderDate').value = tomorrow.toISOString().slice(0,10);
});
</script>
