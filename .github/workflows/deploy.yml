name: Deploy to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-and-deploy:
    name: Validate then deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: node scripts/tests/run-all.js

      # Validation gate — deploy is blocked if this fails
      - name: Run site validator
        run: python3 scripts/validate.py

      # Buang file non-publik (skema DB, CHANGELOG, script build, seed SQL)
      # dari checkout runner sebelum diunggah. publish-dir '.' mengirim SEMUA
      # isi direktori ke CDN, jadi pemangkasan harus terjadi di sini — bukan
      # di [build] netlify.toml, yang tidak dijalankan pada jalur deploy ini.
      # Disalin ke /tmp agar bash tidak kehilangan file saat scripts/ terhapus.
      - name: Prune non-public files
        run: |
          cp scripts/prune-publish.sh /tmp/prune-publish.sh
          bash /tmp/prune-publish.sh

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: '.'
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from GitHub Actions: ${{ github.sha }}"
          enable-pull-request-comment: false
          enable-commit-comment: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 5
