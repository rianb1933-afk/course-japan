name: Merge follow-up reminders

# Pengingat otomatis untuk perubahan yang butuh tindakan manual SETELAH
# merge — hal-hal yang tidak bisa diterapkan CI dan tidak bisa diverifikasi
# dari luar:
#
#   * supabase-schema.sql — harus dijalankan ulang di Supabase SQL Editor
#   * netlify.toml — variabel environment (seksi *.environment] ATAU
#     deklarasi var di komentar kepala) harus diisi manual di
#     Netlify → Site settings → Environment variables; deploy yang jalan
#     tanpa env baru akan memakai nilai lama (atau gagal lewat gerbang
#     "NOT_CONFIGURED" yang memang disengaja di beberapa function)
#
# Sengaja BUKAN gerbang merge: kedua tindakan itu hanya bisa dilakukan
# manusia dengan akses dashboard. Job ini selalu sukses; ia hanya memberi
# tahu lewat komentar PR yang diperbarui (bukan ditumpuk).
#
# TRIGGER: pull_request dengan paths filter; workflow_dispatch untuk
# sanity check manual dari tab Actions.

on:
  pull_request:
    paths:
      - 'supabase-schema.sql'
      - 'netlify.toml'
      - '.github/workflows/schema-reminder.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write   # butuh izin menulis untuk posting komentar PR
  issues: write          # komentar PR dianggap issue oleh API

jobs:
  remind:
    name: Remind about manual post-merge steps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history, butuh base ref untuk diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect what changed vs merge base
        id: diff
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.sha }}"
          # workflow_dispatch tidak punya PR: pakai diff HEAD~1 saja
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="${HEAD}~1"
          fi
          echo "Diff ${BASE}..${HEAD}:"

          if git diff --quiet "${BASE}" "${HEAD}" -- supabase-schema.sql; then
            echo "schema_changed=false" >> "$GITHUB_OUTPUT"
            echo "  supabase-schema.sql : tidak berubah"
          else
            echo "schema_changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat "${BASE}" "${HEAD}" -- supabase-schema.sql | sed 's/^/  /'
          fi

          # ── netlify.toml: deteksi env berbasis KONTEN, bukan parsing diff ──
          # 1) Bandingkan isi semua seksi `*.environment]` antara base dan
          #    head — menangkap var baru/dihapus/nilai berubah/blok baru.
          #    Parsing diff rentan: dengan -U0, header seksi yang tidak
          #    berubah tidak ikut tampil sehingga var yang ditambahkan di
          #    tengah blok TERLEWAT; dengan context default, nilai `sec`
          #    bisa bocor antar-hunk. Perbandingan konten kebal semua itu.
          # 2) Repo ini juga mendokumentasikan env sebagai komentar kepala
          #    netlify.toml (konvensi env_variable_consistency), jadi var
          #    yang BARU dideklarasikan di baris komentar pun memicu
          #    pengingat — itulah momen "var baru wajib diisi di dashboard".
          # [[redirects]] / [[headers]] tidak menyentuh keduanya, sehingga
          # perubahan redirect/CSP tidak pernah memicu pengingat env.
          env_of() {
            git show "$1:netlify.toml" 2>/dev/null | awk '
              /^[ \t]*\[/ { inenv = ($0 ~ /\.environment\]/) ? "y" : "n" }
              inenv == "y" { print }
            '
          }
          ENV_BEFORE="$(env_of "$BASE")"
          ENV_AFTER="$(env_of "$HEAD")"
          NEW_ENV_DOCS="$(git diff -U0 "${BASE}" "${HEAD}" -- netlify.toml \
            | grep -E '^\+[ \t]*#' | grep -oE '[A-Z][A-Z0-9_]{2,}[ \t]*=' \
            | LC_ALL=C sort -u)"
          if [ "$ENV_BEFORE" != "$ENV_AFTER" ]; then
            echo "env_changed=true" >> "$GITHUB_OUTPUT"
            echo "  netlify.toml : isi seksi environment berubah:"
            diff <(printf '%s\n' "$ENV_BEFORE") <(printf '%s\n' "$ENV_AFTER") \
              | sed -n 's/^> /    + /p; s/^< /    - /p'
          elif [ -n "$NEW_ENV_DOCS" ]; then
            echo "env_changed=true" >> "$GITHUB_OUTPUT"
            echo "  netlify.toml : var baru dideklarasikan di komentar:"
            printf '%s\n' "$NEW_ENV_DOCS" | sed 's/^/    /'
          else
            echo "env_changed=false" >> "$GITHUB_OUTPUT"
            echo "  netlify.toml : tidak ada perubahan env (redirects/header tidak masuk pengingat)"
          fi

      - name: Post reminder comment
        # Posting kalau SALAH SATU berubah. github-script butuh context.issue:
        # hanya ada di event pull_request — dispatch hanya menyimpan summary.
        if: (steps.diff.outputs.schema_changed == 'true' || steps.diff.outputs.env_changed == 'true') && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- merge-followup-reminder -->';
            const schema = context.payload.steps?.diff?.outputs?.schema_changed === 'true'
              || '${{ steps.diff.outputs.schema_changed }}' === 'true';
            const env = '${{ steps.diff.outputs.env_changed }}' === 'true';

            const sections = [];
            if (schema) {
              sections.push([
                '## ⚠️ `supabase-schema.sql` berubah di PR ini',
                '',
                'Mengubah file ini **tidak** otomatis menerapkannya ke database hidup.',
                'Setelah merge, jalankan ulang **seluruh** `supabase-schema.sql` di Supabase → SQL Editor.',
                'File tersebut idempoten (aman di-run berulang tanpa dobel).',
                '',
                '**Verifikasi setelah menjalankan:**',
                '```sql',
                "SELECT count(*), SUM(xp_earned) FROM user_xp_log WHERE xp_applied = false;",
                '```',
                '- `count = 0` → semua log XP sudah diterapkan, tidak ada backlog',
                '- `count > 0` → jalankan ulang file skema; backfill mengambil baris-baris itu tanpa menghitung dobel',
              ].join('\n'));
            }
            if (env) {
              sections.push([
                '## ⚙️ Variabel environment Netlify berubah di PR ini',
                '',
                'Mengubah seksi `[*.environment]` **atau mendeklarasikan var baru di blok komentar** `netlify.toml` **tidak** mengisi nilai di dashboard.',
                'Setelah merge (sebelum/saat deploy), set nilainya di Netlify → Site settings → Environment variables — lalu **trigger deploy ulang** agar nilai baru terpasang (env dibaca saat build/deploy, bukan saat file berubah).',
                '',
                'Cek daftar kunci & sifatnya (publik vs server-side) di komentar kepala `netlify.toml` dan `docs/SETUP-KUNCI-API.md` sebelum mengisi.',
              ].join('\n'));
            }

            const body = [
              marker,
              ...sections,
              '',
              '<sub>🤖 Komentar otomatis dari workflow Merge follow-up reminders. Tidak relevan lagi? Komentar ini bisa dihapus.</sub>',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (existing) {
              // Perbarui komentar lama alih-alih menumpuk satu per push.
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              console.log('Komentar pengingat diperbarui (#' + existing.id + ')');
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
              console.log('Komentar pengingat diposting baru');
            }

      - name: Job summary
        run: |
          S="${{ steps.diff.outputs.schema_changed }}"
          E="${{ steps.diff.outputs.env_changed }}"
          if [ "$S" = "true" ] && [ "$E" = "true" ]; then
            echo "### ⚠️ Schema + env Netlify berubah — pengingat diposting" >> "$GITHUB_STEP_SUMMARY"
            echo "- Jalankan ulang \`supabase-schema.sql\` di SQL Editor setelah merge" >> "$GITHUB_STEP_SUMMARY"
            echo "- Isi env baru di Netlify → Environment variables, lalu redeploy" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$S" = "true" ]; then
            echo "### ⚠️ Schema berubah — pengingat diposting di PR" >> "$GITHUB_STEP_SUMMARY"
            echo "Jangan lupa: jalankan ulang \`supabase-schema.sql\` di SQL Editor **setelah merge**." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$E" = "true" ]; then
            echo "### ⚙️ Env Netlify berubah — pengingat diposting di PR" >> "$GITHUB_STEP_SUMMARY"
            echo "Jangan lupa: isi env baru di Netlify → Environment variables **setelah merge, sebelum/bersama deploy**." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ✅ Tidak ada perubahan schema/env — tidak ada pengingat" >> "$GITHUB_STEP_SUMMARY"
          fi
