    var el=document.getElementById('ctimer');
    if(el){el.textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;el.className='ctm'+(tLeft<=60?' warn':'');}
    if(tLeft<=0){clearInterval(tInt);submitTest();}},1000);}
function renderNav(){var nav=document.getElementById('qnav');if(!nav)return;nav.innerHTML='';
  qs.forEach(function(q,i){var d=document.createElement('div');d.className='qd'+(i===cur?' cur':flg[i]?' flg':ans2[i]!==undefined?' ans':'');
    d.textContent=i+1;d.onclick=(function(x){return function(){cur=x;showQ(x);}})(i);nav.appendChild(d);});}
function showQ(i){var q=qs[i];if(!q)return;
  var p=document.getElementById('cprog');if(p)p.textContent=(i+1)+'/25';
  var bx=document.getElementById('qbx');if(!bx)return;
  var fl=flg[i];
  bx.innerHTML='<div class="qm"><span class="qnum">Q'+(i+1)+'</span><span class="qcat">'+q.cat+'</span>'
    +'<button aria-label="Tombol" class="qfbtn'+(fl?' on':'')+'" id="fb">🚩</button></div>'
    +'<div class="qtxt">'+q.q+'</div><div class="qopts" id="qop"></div>';
  document.getElementById('fb').onclick=function(){flg[i]=!flg[i];showQ(i);};
  var op=document.getElementById('qop');
  q.opts.forEach(function(o,j){var b=document.createElement('button');b.className='qopt'+(ans2[i]===j?' sel':'');
    b.textContent=(j+1)+'. '+o;b.onclick=(function(qi,ai){return function(){selA(qi,ai);};})(i,j);op.appendChild(b);});
  var bn=document.getElementById('bnn'),bs=document.getElementById('bns');
  if(bn)bn.style.display=i<24?'block':'none';
  if(bs)bs.style.display=i===24?'block':'none';
  renderNav();}
function selA(qi,ai){ans2[qi]=ai;var op=document.getElementById('qop');
  if(op)op.querySelectorAll('.qopt').forEach(function(b,j){b.className='qopt'+(j===ai?' sel':'');});
  renderNav();}
function goQ(d){cur=Math.max(0,Math.min(24,cur+d));showQ(cur);}

// guard flag untuk mencegah submitTest() genuinely dieksekusi dua kali,
// mengikuti pola yang sudah terbukti di JLPT-CBT.html (Website v25) dan

var testMockSubmitted = false;
function submitTest(){if(testMockSubmitted)return;testMockSubmitted=true;clearInterval(tInt);var ok=0,ng=0,sk=0;
  qs.forEach(function(q,i){if(ans2[i]===undefined)sk++;else if(ans2[i]===q.a)ok++;else ng++;});
  var pct=Math.round(ok/25*100);
  document.getElementById('tv').style.display='none';document.getElementById('rv').style.display='block';
  document.getElementById('rsn').textContent=ok;document.getElementById('rok').textContent=ok;
  document.getElementById('rng').textContent=ng;document.getElementById('rsk').textContent=sk;
  document.getElementById('rpct').textContent=pct+'% ('+ok+'/25 benar)';
  var g,gc,msg;
  if(pct>=90){g='S — Luar Biasa!';gc='gs';msg='🏆 Siap ujian JLPT sungguhan!';}
  else if(pct>=75){g='A — Sangat Baik';gc='ga';msg='🎉 Hampir sempurna!';}
  else if(pct>=60){g='B — Lulus';gc='gb2';msg='✅ Lulus! Terus semangat!';}
  else{g='C — Belajar Lagi';gc='gc';msg='📚 Pelajari materi lagi!';}
  var rgb=document.getElementById('rgb');if(rgb){rgb.textContent=g;rgb.className='gb '+gc;}
  var rm=document.getElementById('rmsg');if(rm){rm.textContent=msg;rm.style.color=pct>=60?'#2e7d32':'var(--accent,#c62828)';}}
function showRev(){var s=document.getElementById('revs');if(!s)return;
  s.style.display=s.style.display==='none'?'block':'none';if(s.style.display==='none')return;
  var ral=document.getElementById('ral');if(!ral)return;ral.innerHTML='';
  qs.forEach(function(q,i){var ua=ans2[i],isOk=ua===q.a,isSkip=ua===undefined;
    var d=document.createElement('div');d.className='ai '+(isSkip?'':isOk?'ok':'ng');
    d.innerHTML='<div class="aq">Q'+(i+1)+'. ['+q.cat+'] '+q.q+'</div>'
      +'<div style="font-size:.78rem;color:#2e7d32;margin-bottom:2px">✅ '+q.opts[q.a]+'</div>'
      +(!isSkip&&!isOk?'<div style="font-size:.78rem;color:var(--accent,#c62828);margin-bottom:2px">❌ '+q.opts[ua]+'</div>':'')
      +(isSkip?'<div style="font-size:.78rem;color:#888">⏭️ Tidak dijawab</div>':'')
      +'<div class="ae">💡 '+q.e+'</div>';
    ral.appendChild(d);});}
function restartTest(){document.getElementById('rv').style.display='none';
  var rs=document.getElementById('revs');if(rs)rs.style.display='none';startTest();}
