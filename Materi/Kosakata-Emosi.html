<script>
var Q=[{"q": "「悔しい」の意味は？", "opts": ["嬉しい", "負けたり失敗した時の悔しさ・くやしさ", "悲しい", "怖い"], "a": 1, "e": "悔しい(くやしい)=menyesal; kesal gemas karena kalah/gagal. 「くやし涙」=air mata kesal. 怒りと悲しみが混じった感情。"}, {"q": "「切ない」の説明として正しいのは？", "opts": ["楽しい", "悲しくて美しい・胸が締め付けられる複雑な感情", "怖い", "怒り"], "a": 1, "e": "切ない(せつない)=pilu; mengharukan secara menyedihkan. 別れや懐かしさで胸が痛む感情。英語のbittersweet に近い。"}, {"q": "「安堵」の意味は？", "opts": ["不安", "心配が消えてほっとした感覚", "怒り", "驚き"], "a": 1, "e": "安堵(あんど)=lega setelah cemas. 無事だとわかり安堵した=merasa lega setelah tahu selamat. 安心 と似るが安堵の方が文語的。"}, {"q": "「もどかしい」の意味は？", "opts": ["満足", "うまくいかなくてイライラする・フラストレーション", "楽しい", "怖い"], "a": 1, "e": "もどかしい=frustrasi; tidak bisa mengungkapkan/melakukan seperti yang diinginkan. 言葉がうまく出てこなくてもどかしい=frustrasi tidak bisa berkata-kata."}, {"q": "「羨ましい」と「妬ましい」の違いは？", "opts": ["同じ", "羨ましい=iri positif(あの人みたいになりたい)、妬ましい=iri negatif(あの人が憎い)", "どちらも怒り", "どちらも悲しみ"], "a": 1, "e": "羨ましい=iri yang lebih positif(ingin seperti orang itu). 妬ましい(ねたましい)=iri yang lebih negatif/dengki. ニュアンスの差が重要。"}, {"q": "「戸惑い」の意味は？", "opts": ["喜び", "どうすべきか分からず困惑している状態", "確信", "安堵"], "a": 1, "e": "戸惑い(とまどい)=bingung tidak tahu harus berbuat apa. 急な変化に戸惑う=bingung menghadapi perubahan mendadak。"}],qi=0,ok=0,tot=0;
function rnd(){if(!Q.length)return;var q=Q[qi%Q.length],c=document.getElementById("qc");if(!c)return;var oo=document.createElement("div");oo.className="qopts";q.opts.forEach(function(o,i){var b=document.createElement("button");b.className="qopt";b.textContent=o;b.onclick=function(){ans(b,i,q.a,q.e);};oo.appendChild(b);});var bx=document.createElement("div");bx.className="qbox";var qq=document.createElement("div");qq.className="qq";qq.textContent=(qi%Q.length+1)+". "+q.q;var ex=document.createElement("div");ex.className="qexp";ex.id="qe";bx.appendChild(qq);bx.appendChild(oo);bx.appendChild(ex);c.innerHTML="";c.appendChild(bx);var s=document.getElementById("qs");if(s)s.textContent="Skor: "+ok+"/"+tot;}
function ans(b,c,a,e){var bs=document.querySelectorAll(".qopt");if(bs[a].dataset.d)return;bs[a].dataset.d="1";tot++;bs[a].classList.add("correct");if(c!==a)b.classList.add("wrong");else ok++;var ex=document.getElementById("qe");if(ex){ex.textContent="💡 "+e;ex.classList.add("show");}var s=document.getElementById("qs");if(s)s.textContent="Skor: "+ok+"/"+tot;}
function nQ(){qi=(qi+1)%Q.length;rnd();} function rQ(){qi=0;ok=0;tot=0;rnd();}
var ED=[{"jp": "嬉しい", "r": "うれしい", "id": "senang; gembira", "ex": "合格して嬉しい。", "cat": "ポジティブ"}, {"jp": "喜び", "r": "よろこび", "id": "kegembiraan; sukacita", "ex": "勝利の喜びを感じた。", "cat": "ポジティブ"}, {"jp": "誇り", "r": "ほこり", "id": "kebanggaan; rasa bangga", "ex": "仕事への誇りを持つ。", "cat": "ポジティブ"}, {"jp": "感謝", "r": "かんしゃ", "id": "rasa syukur; terima kasih", "ex": "助けてくれた人への感謝。", "cat": "ポジティブ"}, {"jp": "安堵", "r": "あんど", "id": "lega; rasa tenang setelah cemas", "ex": "無事だとわかり安堵した。", "cat": "ポジティブ"}, {"jp": "悔しい", "r": "くやしい", "id": "menyesal; kesal; gemas (karena kalah/gagal)", "ex": "負けて悔しい。", "cat": "ネガティブ"}, {"jp": "焦り", "r": "あせり", "id": "kepanikan; rasa terburu-buru", "ex": "締め切りに焦りを感じた。", "cat": "ネガティブ"}, {"jp": "憂鬱", "r": "ゆううつ", "id": "murung; depresi; suram", "ex": "天気が悪くて憂鬱だ。", "cat": "ネガティブ"}, {"jp": "虚しい", "r": "むなしい", "id": "hampa; sia-sia; kosong", "ex": "努力が報われず虚しい。", "cat": "ネガティブ"}, {"jp": "戸惑い", "r": "とまどい", "id": "bingung; tidak tahu harus berbuat apa", "ex": "急な変化に戸惑いを感じた。", "cat": "ネガティブ"}, {"jp": "切ない", "r": "せつない", "id": "pilu; pilu hati; mengharukan (sedih indah)", "ex": "別れの時は切ない気持ちになる。", "cat": "複雑"}, {"jp": "懐かしい", "r": "なつかしい", "id": "rindu; nostalgia", "ex": "故郷を懐かしく思う。", "cat": "複雑"}, {"jp": "複雑な気持ち", "r": "ふくざつなきもち", "id": "perasaan campur aduk; mixed feelings", "ex": "卒業式は複雑な気持ちだった。", "cat": "複雑"}, {"jp": "もどかしい", "r": "もどかしい", "id": "frustrasi; tidak bisa mengungkapkan", "ex": "うまく伝えられなくてもどかしい。", "cat": "複雑"}, {"jp": "後ろめたい", "r": "うしろめたい", "id": "merasa bersalah; tidak enak hati", "ex": "嘘をついて後ろめたい。", "cat": "複雑"}, {"jp": "羨ましい", "r": "うらやましい", "id": "iri hati; cemburu (tidak negatif)", "ex": "彼の才能が羨ましい。", "cat": "対人"}, {"jp": "恥ずかしい", "r": "はずかしい", "id": "malu", "ex": "大勢の前で恥ずかしい思いをした。", "cat": "対人"}, {"jp": "照れる", "r": "てれる", "id": "salah tingkah; malu-malu", "ex": "褒められて照れてしまった。", "cat": "対人"}];var ec='全部';

function setEC(c,btn){ec=c;document.querySelectorAll('#eCatRow button').forEach(function(b){b.style.background='#f5f5f5';b.style.color='#333';b.style.borderColor='#ddd';});btn.style.background='var(--primary,#880e4f)';btn.style.color='#fff';btn.style.borderColor='var(--primary,#880e4f)';renderE('');}
function renderE(s){var items=ec==='全部'?ED:ED.filter(function(v){return v.cat===ec;});if(s)items=items.filter(function(v){return v.jp.includes(s)||v.r.includes(s)||v.id.toLowerCase().includes(s);});var g=document.getElementById('eGrid');g.innerHTML='';items.forEach(function(v){var d=document.createElement('div');d.style.cssText='background:#fff;border:1px solid rgba(136,14,79,.12);border-radius:10px;padding:12px;cursor:pointer;transition:all .2s';d.onmouseover=function(){this.style.borderColor='var(--primary,#880e4f)';};d.onmouseout=function(){this.style.borderColor='rgba(136,14,79,.12)';};d.innerHTML='<span style="font-size:.7rem;background:#fce4ec;color:var(--primary,#880e4f);padding:2px 8px;border-radius:10px;display:inline-block;margin-bottom:4px">'+v.cat+'</span><div style="font-size:1rem;font-weight:700;color:var(--primary,#880e4f)">'+v.jp+'</div><div style="font-size:.75rem;color:#888;margin:2px 0">'+v.r+'</div><div style="font-size:.85rem;color:#333">🇮🇩 '+v.id+'</div><div style="display:none;margin-top:6px;font-size:.78rem;color:#666">📝 '+v.ex+'</div>';d.onclick=function(){var det=this.querySelector('div[style*="display:none"]');if(det)det.style.display='block';};g.appendChild(d);});};
function extraInit(){var cats=['全部',...new Set(ED.map(function(v){return v.cat;}))] ;var cr=document.getElementById('eCatRow');cats.forEach(function(c,i){var btn=document.createElement('button');btn.style.cssText='padding:5px 14px;border-radius:20px;border:1px solid '+(i===0?'var(--primary,#880e4f)':'#ddd')+';background:'+(i===0?'var(--primary,#880e4f)':'#f5f5f5')+';color:'+(i===0?'#fff':'#333')+';cursor:pointer;font-size:.82rem';btn.textContent=c;btn.onclick=function(){setEC(c,this);};cr.appendChild(btn);});renderE('');}
