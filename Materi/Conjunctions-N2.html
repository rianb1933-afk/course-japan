<script>
const CONJ=[
{main:'しかしながら',sub:'シカシナガラ — namun; akan tetapi (formal)',detail:'目標は達成した。しかしながら、課題が残っている。= Tujuan tercapai. Namun, masih ada tantangan tersisa.',cat:'Kontras'},
{main:'その一方で',sub:'ソノイッポウデ — di sisi lain',detail:'生産性は上がった。その一方で、コストも増えた。= Produktivitas meningkat. Di sisi lain, biaya pun naik.',cat:'Kontras'},
{main:'それにもかかわらず',sub:'ソレニモカカワラズ — meskipun demikian',detail:'失敗した。それにもかかわらず、諦めなかった。= Gagal. Meski demikian, tidak menyerah.',cat:'Kontras'},
{main:'むしろ',sub:'ムシロ — justru; lebih tepatnya',detail:'楽しいというより、むしろ辛かった。= Daripada menyenangkan, justru lebih menyakitkan.',cat:'Kontras'},
{main:'かえって',sub:'カエッテ — justru sebaliknya; malah',detail:'薬を飲んだら、かえって悪くなった。= Setelah minum obat, malah makin buruk.',cat:'Kontras'},
{main:'したがって',sub:'シタガッテ — oleh karena itu; sehingga (formal)',detail:'準備が足りなかった。したがって、失敗した。= Persiapannya kurang. Sehingga, gagal.',cat:'Sebab-Akibat'},
{main:'その結果',sub:'ソノケッカ — hasilnya; akibatnya',detail:'努力を続けた。その結果、合格できた。= Terus berusaha. Hasilnya, bisa lulus.',cat:'Sebab-Akibat'},
{main:'それゆえ',sub:'ソレユエ — oleh sebab itu (formal/sastra)',detail:'彼は努力した。それゆえ、成功した。= Dia berusaha. Oleh sebab itu, berhasil.',cat:'Sebab-Akibat'},
{main:'それに加えて',sub:'ソレニクワエテ — selain itu; ditambah',detail:'料金が安い。それに加えて、品質も高い。= Harganya murah. Selain itu, kualitasnya juga tinggi.',cat:'Penambahan'},
{main:'のみならず',sub:'ノミナラズ — tidak hanya; bukan saja',detail:'日本のみならず、世界中で有名だ。= Tidak hanya di Jepang, terkenal di seluruh dunia.',cat:'Penambahan'},
{main:'さらに',sub:'サラニ — lebih lagi; tambahan pula',detail:'試験に合格した。さらに、奨学金も取れた。= Lulus ujian. Lebih lagi, dapat beasiswa juga.',cat:'Penambahan'},
{main:'ところが',sub:'トコロガ — namun ternyata; tapi tidak terduga',detail:'準備したところが、試験は中止になった。= Sudah persiapan, namun ternyata ujian dibatalkan.',cat:'Kontras'},
{main:'というのも',sub:'トイウノモ — soalnya; karena',detail:'今日は行けない。というのも、体調が悪いから。= Hari ini tidak bisa pergi. Soalnya, badan tidak enak.',cat:'Alasan'},
{main:'なぜかといえば',sub:'ナゼカトイエバ — kalau ditanya kenapa',detail:'成功した。なぜかといえば、努力したからだ。= Berhasil. Kalau ditanya kenapa, karena berusaha keras.',cat:'Alasan'},
{main:'たとえば',sub:'タトエバ — misalnya; contohnya',detail:'色々な方法がある。たとえば、運動や食事制限など。= Ada berbagai cara. Misalnya, olahraga dan diet.',cat:'Contoh'},
{main:'言い換えれば',sub:'イイカエレバ — dengan kata lain',detail:'彼は諦めた。言い換えれば、もう挑戦しないということだ。= Dia menyerah. Dengan kata lain, tidak akan mencoba lagi.',cat:'Penjelasan'},
{main:'つまり',sub:'ツマリ — jadi; artinya; pendeknya',detail:'努力もしない。つまり、やる気がないということだ。= Tidak berusaha. Artinya, tidak ada motivasi.',cat:'Penjelasan'},
{main:'すなわち',sub:'スナワチ — yaitu; yakni (formal)',detail:'首都、すなわち東京に住んでいる。= Tinggal di ibu kota, yaitu Tokyo.',cat:'Penjelasan'},
{main:'確かに〜が',sub:'タシカニ〜ガ — memang ~, tapi',detail:'確かに難しい。しかし、不可能ではない。= Memang sulit. Tapi tidak mustahil.',cat:'Pengakuan'},
{main:'とはいえ',sub:'トハイエ — meskipun begitu; namun',detail:'疲れた。とはいえ、諦める気はない。= Capek. Meskipun begitu, tidak ada niat menyerah.',cat:'Kontras'},
];
const QUIZ=[
{q:'「したがって」の接続詞の用途は？',opts:['逆接','理由から結論へ','例を挙げる','言い換え'],ans:1,exp:'したがって=sehingga; oleh karena itu. 理由→結論の流れを作る。例:努力した。したがって、成功した。'},
{q:'「ところが」と「しかし」の違いは？',opts:['同じ','ところがは予想外の逆接','ところがは理由','しかしは予想外'],ans:1,exp:'ところが=namun ternyata (予想外の結果). しかし=tapi (予想内でも使える). 例:準備した。ところが、中止になった。'},
{q:'「のみならず」と同じ意味の表現は？',opts:['しかし','だけでなく','だから','ところで'],ans:1,exp:'のみならず=不只、不仅; だけでなく=tidak hanya. 例:日本のみならず世界中で有名だ。'},
{q:'「かえって」の意味は？',opts:['同じように','予想と逆に','だから','もっと'],ans:1,exp:'かえって=justru sebaliknya; malah. 例:薬を飲んだら、かえって悪化した。'},
{q:'「言い換えれば」の役割は？',opts:['逆接','同じことを別の言葉で言い直す','理由を示す','例を示す'],ans:1,exp:'言い換えれば=dengan kata lain; artinya sama. 同じ内容を別の表現で。'},
{q:'「というのも」の用法は？',opts:['例を示す','理由の説明','追加情報','逆接'],ans:1,exp:'というのも=soalnya; karena. 直前の内容の理由を説明する。例:行けない。というのも、体調が悪いから。'},
{q:'「さらに」の意味は？',opts:['逆に','もっと付け加えて','したがって','例えば'],ans:1,exp:'さらに=lebih lagi; tambahan pula; furthermore. 例:成功した。さらに、賞ももらった。'},
{q:'「確かに〜が」の文のパターンは？',opts:['確かに=完全に否定','確かに=認めつつ反論する','確かに=理由を示す','確かに=例を示す'],ans:1,exp:'確かに〜が=memang ~ tapi ~. 相手の意見を部分的に認めつつ反論する。'},
{q:'「むしろ」の意味は？',opts:['どちらかというと、こちらのほうが','絶対に','だから','しかし'],ans:0,exp:'むしろ=justru; lebih tepatnya. 例:楽しいというより、むしろ辛かった。'},
{q:'「それゆえ」はどんな文体で使う？',opts:['口語・くだけた','文語・書き言葉・フォーマル','どちらでも同じ','日常会話のみ'],ans:1,exp:'それゆえ=oleh sebab itu (formal/sastra). より文語的・フォーマルな表現。日常では「だから」のほうが自然。'},
];
let qIdx=0,ok=0,tot=0;
function renderContent(){
  document.getElementById('contentArea').innerHTML=CONJ.map(i=>`
    <div class="card" onclick="this.classList.toggle('revealed')">
      <span class="c-cat">${i.cat||''}</span>
      <div class="c-main">${i.main}</div>
      <div class="c-sub">${i.sub||''}</div>
      <div class="c-detail">${i.detail||''}</div>
    </div>`).join('');
}
function renderQ(){
  const q=QUIZ[qIdx%QUIZ.length];
  // GENUINELY DIPERBAIKI (Fase Audit Website Putaran Keempat, Fase N):
  // dikonfirmasi escaping manual sebelumnya (`.replace(/'/g,"\\'")`)
  // genuinely HANYA menangani kutip tunggal, TIDAK menangani karakter
  // backslash itu sendiri -- pola rapuh yang genuinely serupa dengan
  // kerapuhan encodeURIComponent yang ditemukan di Certificate-Pro.html
  // (Website v18). Data QUIZ saat ini genuinely hardcoded tanpa
  // backslash (tidak eksploitabel saat ini), namun diperbaiki sebagai
  // defense-in-depth -- backslash genuinely di-escape LEBIH DULU,
  // baru kutip tunggal (urutan penting agar escape backslash sendiri
  // tidak ikut ter-escape ganda).
  const escExp=q.exp.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
  document.getElementById('quizContainer').innerHTML=`<div class="quiz-box"><div class="quiz-q">${qIdx+1}. ${q.q}</div><div class="quiz-opts">${q.opts.map((o,i)=>`<button class="quiz-opt" onclick="ans(this,${i},${q.ans},'${escExp}')">${o}</button>`).join('')}</div><div class="quiz-exp" id="qExp"></div></div>`;
  document.getElementById('qScore').textContent='Skor: '+ok+'/'+tot;
}
function ans(btn,c,a,exp){if(document.querySelector('.quiz-opt.correct'))return;tot++;document.querySelectorAll('.quiz-opt')[a].classList.add('correct');if(c!==a)btn.classList.add('wrong');else ok++;const e=document.getElementById('qExp');e.textContent='💡 '+exp;e.classList.add('show');document.getElementById('qScore').textContent='Skor: '+ok+'/'+tot;}
function nextQ(){qIdx=(qIdx+1)%QUIZ.length;renderQ();}
function resetQ(){qIdx=0;ok=0;tot=0;renderQ();}

renderContent();renderQ();
</script>
