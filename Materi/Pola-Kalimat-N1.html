var Q=[{"q": "「〜ならではの」の意味は？", "opts": ["〜に限らない", "〜にしかない独自性", "〜のような", "〜に反する"], "a": 1, "e": "ならではの=khas ~; hanya ada pada ~. 日本ならではの文化=budaya yang hanya ada di Jepang. ポジティブな唯一性の表現。"}, {"q": "「〜ずにはおかない」は？", "opts": ["しなくてもいい", "強い必然・感情的圧力で〜せずにはいられない", "したい", "普通にする"], "a": 1, "e": "ずにはおかない=pasti akan ~; tidak bisa tidak ~. 感動させずにはおかない=pasti mengharukan. 強い必然性の表現。"}, {"q": "「〜てやまない」の用法は？", "opts": ["やめる", "感情が尽きることなく続く", "できない", "しなければならない"], "a": 1, "e": "てやまない=tidak berhenti ~ (感情継続). 願ってやまない=terus mendoakan tanpa henti. 願う・愛する・期待するなどと使う。"}, {"q": "「〜を皮切りに」の意味は？", "opts": ["最後に〜した", "〜を最初として始まる", "〜のために", "〜にもかかわらず"], "a": 1, "e": "を皮切りに=dengan ~ sebagai awal mula. 東京を皮切りに全国でコンサート=mulai dari Tokyo, konser di seluruh negeri. スタートの合図。"}, {"q": "「〜ばかりに」の用法は？", "opts": ["〜が原因でよい結果", "その一点だけが原因で悪い結果(後悔)", "〜ばかりやっている", "〜が好き"], "a": 1, "e": "ばかりに=justru gara-gara ~(一点). 余計なことを言ったばかりに=justru gara-gara berkata berlebihan(後悔・遺憾)。"}, {"q": "「〜に越したことはない」の意味は？", "opts": ["〜は最悪だ", "〜が一番良い(婉曲的推奨)", "〜は普通", "〜より悪い"], "a": 1, "e": "に越したことはない=tidak ada yang lebih baik dari ~. 早いに越したことはない=sebaiknya lebih cepat. 婉曲的なアドバイス。"}, {"q": "「〜をよそに」の意味は？", "opts": ["〜と一緒に", "〜を無視して・気にせず", "〜のために", "〜に従って"], "a": 1, "e": "をよそに=tidak peduli ~; mengabaikan ~. 心配をよそに=tidak peduli kekhawatiran. 無関心・無視のニュアンス。"}],qi=0,ok=0,tot=0;

 diperdebatkan.", "note": "〜に足る の否定形。その価値・資格がないことを示す。"}, {"p": "〜かたがた", "id": "sekalian ~; sambil sekaligus", "ex": "お礼かたがたお伺いします。= Sekalian berterima kasih, saya akan berkunjung.", "note": "二つの目的を一度に行う。丁寧・書き言葉的。"}, {"p": "〜を踏まえた上で", "id": "berdasarkan ~; mengacu pada ~", "ex": "先行研究を踏まえた上で論じる。= Membahas berdasarkan penelitian terdahulu.", "note": "先行情報・事実を基盤にした行動・判断を示す。"}, {"p": "〜に越したことはない", "id": "sebaiknya ~; tidak ada yang lebih baik dari ~", "ex": "健康に越したことはない。= Tidak ada yang lebih baik dari kesehatan.", "note": "〜が一番良い という婉曲的な推奨。"}];
function renderPK1(){

    var det='<div style="display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border-light);font-size:.82rem;color:var(--ink-mid)">📝 '+d.ex+'<br><small style="color:var(--matcha)">💡 '+d.note+'</small></div>';
    el.innerHTML='<div style="font-size:1.05rem;font-weight:700;color:var(--primary,#4a148c);margin-bottom:6px">'+d.p+'</div>'

}
