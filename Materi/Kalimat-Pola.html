<body>
<main id="main-content">
<div class="page-hero">
  <span class="badge">📝 N4 · N3 · N2 · N1</span>
  <h1>Pola Kalimat Penting N4→N1</h1>
</div>
<div class="wrap" style="padding-top:24px">

<div id="contentArea"></div>
<h2 class="section-title">🧠 Quiz</h2>
<div id="quizContainer"></div>
<div style="display:flex;gap:12px;margin-top:12px">
  <button onclick="nextQ()" style="flex:1;padding:12px;background:var(--kyoto-brown);color:#fff;border:none;border-radius:10px;cursor:pointer">Soal Berikutnya →</button>
  <button onclick="resetQ()" style="padding:12px 20px;background:var(--cream);border:1px solid var(--border-mid);border-radius:10px;cursor:pointer">Reset</button>
</div>
<p id="qScore" style="text-align:center;font-size:.85rem;color:var(--ink-mid);margin-top:8px">Skor: 0/0</p>
</div>
</main>
<script>
const POLA=[
{main:'〜てみる',sub:'Mencoba melakukan ~',detail:'食べてみた = Coba makan. 使ってみてください = Silakan dicoba pakai.',cat:'N4'},
{main:'〜てみたい',sub:'Ingin mencoba ~',detail:'日本に行ってみたい = Ingin coba pergi ke Jepang.',cat:'N4'},
{main:'〜てしまう',sub:'Terlanjur ~; menyesal ~',detail:'お金を使ってしまった = Terlanjur habiskan uang.',cat:'N4'},
{main:'〜ておく',sub:'Melakukan untuk persiapan ~',detail:'明日のために準備しておく = Mempersiapkan untuk besok.',cat:'N4'},
{main:'〜てある',sub:'Sudah ~ (kondisi hasilnya ada)',detail:'窓が開けてある = Jendelanya sudah dibuka (dan masih terbuka).',cat:'N4'},
{main:'〜てくれる',sub:'Melakukan ~ untuk saya (orang lain memberi)',detail:'友達が手伝ってくれた = Teman membantu saya.',cat:'N4'},
{main:'〜てもらう',sub:'Minta seseorang melakukan ~',detail:'先生に説明してもらった = Minta guru menjelaskan.',cat:'N4'},
{main:'〜てあげる',sub:'Melakukan ~ untuk orang lain',detail:'友達を手伝ってあげた = Membantu teman.',cat:'N4'},
{main:'〜ているところだ',sub:'Sedang dalam proses ~',detail:'今、報告書を書いているところです = Sekarang sedang menulis laporan.',cat:'N3'},
{main:'〜たところだ',sub:'Baru saja selesai ~',detail:'今、食事が終わったところです = Baru saja selesai makan.',cat:'N3'},
{main:'〜るところだった',sub:'Hampir ~; nyaris ~',detail:'危うく転ぶところだった = Hampir jatuh.',cat:'N3'},
{main:'〜ばよかった',sub:'Seandainya ~ (penyesalan)',detail:'もっと早く来ればよかった = Seandainya datang lebih cepat.',cat:'N3'},
{main:'〜ないでほしい',sub:'Tolong jangan ~',detail:'そこに触らないでほしい = Tolong jangan sentuh itu.',cat:'N3'},
{main:'〜ようにする',sub:'Berusaha untuk ~ (kebiasaan)',detail:'毎日運動するようにしている = Berusaha olahraga setiap hari.',cat:'N3'},
{main:'〜ようになる',sub:'Menjadi bisa ~; mulai ~',detail:'日本語が話せるようになった = Menjadi bisa berbicara Jepang.',cat:'N3'},
{main:'〜わけではない',sub:'Bukan berarti ~; tidak sepenuhnya benar',detail:'嫌いなわけではない = Bukan berarti tidak suka.',cat:'N3'},
{main:'〜ずにはいられない',sub:'Tidak bisa tidak ~; tidak tahan',detail:'笑わずにはいられない = Tidak bisa menahan tawa.',cat:'N2'},
{main:'〜得ない',sub:'Tidak mungkin ~; mustahil',detail:'信じ得ない話だ = Ini cerita yang tidak mungkin dipercaya.',cat:'N2'},
{main:'〜かねる',sub:'Tidak bisa ~ (dengan sopan)',detail:'お断りしかねます = Saya tidak bisa menolak (secara halus).',cat:'N2'},
{main:'〜わけにはいかない',sub:'Tidak bisa ~; tidak mungkin',detail:'約束を破るわけにはいかない = Tidak bisa mengingkari janji.',cat:'N2'},
{main:'〜を余儀なくされる',sub:'Terpaksa ~; tidak ada pilihan',detail:'延期を余儀なくされた = Terpaksa ditunda.',cat:'N2'},
{main:'〜にほかならない',sub:'Tidak lain adalah ~',detail:'これは努力の結果にほかならない = Ini tidak lain adalah hasil kerja keras.',cat:'N1'},
{main:'〜だに',sub:'Bahkan ~; hanya dengan ~',detail:'想像するだに恐ろしい = Hanya dengan membayangkan saja sudah menakutkan.',cat:'N1'},
{main:'〜たりとも',sub:'Sekalipun ~; bahkan ~',detail:'一秒たりとも無駄にできない = Bahkan satu detik pun tidak boleh disia-siakan.',cat:'N1'},
{main:'〜ならではの',sub:'Khas ~; hanya ada pada ~',detail:'日本ならではの文化 = Budaya yang khas Jepang.',cat:'N1'},
];
const QUIZ=[
{q:'「〜てみる」の意味は？',opts:['〜した','試しに〜する','〜できる','〜するつもり'],ans:1,exp:'てみる=mencoba melakukan ~. 例:食べてみた=coba makan dulu.'},
{q:'「〜ておく」の主な使い方は？',opts:['今すぐする','将来のための準備として〜する','もう終わった','やめる'],ans:1,exp:'ておく=melakukan untuk persiapan. 例:明日のために準備しておく。'},
{q:'「〜てある」と「〜ている」の違いは？',opts:['同じ意味','てあるは意図的行為の結果の状態','てあるは進行中','ているは完了'],ans:1,exp:'てある=結果の状態(kondisi hasil tindakan yang disengaja). 窓が開けてある=jendelanya sudah sengaja dibuka.'},
{q:'「〜わけではない」の意味は？',opts:['完全に〜だ','〜とは限らない・必ずしも〜でない','絶対に〜ではない','〜かもしれない'],ans:1,exp:'わけではない=bukan berarti ~. 例:嫌いなわけではない=bukan berarti tidak suka.'},
{q:'「〜ずにはいられない」の意味は？',opts:['〜しなくていい','〜せずにはいられない(感情的に)','〜できない','〜したくない'],ans:1,exp:'ずにはいられない=tidak bisa tidak ~ (karena dorongan emosi). 例:笑わずにはいられない=tidak tahan untuk tidak tertawa.'},
{q:'「〜ようになる」と「〜ようにする」の違いは？',opts:['同じ意味','なる=変化の結果、する=意識的努力','なる=意識的、する=自然な変化','どちらも同じ'],ans:1,exp:'〜ようになる=menjadi bisa ~ (natural change). 〜ようにする=berusaha untuk ~ (conscious effort).'},
{q:'「〜ておく」「〜てある」「〜ていた」の順序は？',opts:['ておく→てある→ていた','ていた→ておく→てある','ておく→ていた→てある','全部同じ'],ans:0,exp:'準備する(ておく)→状態になる(てある)→結果が続く(ていた/ていた).'},
{q:'「〜かねる」はどんな場面？',opts:['できる時','丁寧に断る時','命令する時','感謝する時'],ans:1,exp:'かねる=tidak bisa ~ (penolakan sopan). 例:ご要望にはお応えしかねます。'},
{q:'N1の「〜ならではの」の意味は？',opts:['〜ではない','〜にしかない・〜独特の','〜のようだ','〜と同じ'],ans:1,exp:'ならではの=khas ~; hanya ada pada ~. 例:日本ならではの文化=budaya yang hanya ada di Jepang.'},
{q:'「〜たりとも」の使い方は？',opts:['数量词+たりとも+否定文','形容词+たりとも','名词+たりとも+肯定文','動詞+たりとも'],ans:0,exp:'(数量)+たりとも+ない=sekalipun satu ~. 例:一秒たりとも無駄にできない=bahkan satu detik pun tidak bisa disia-siakan.'},
];
let qIdx=0,ok=0,tot=0;
function renderContent(){
  document.getElementById('contentArea').innerHTML=POLA.map(i=>`
    <div class="card" onclick="this.classList.toggle('revealed')">
      <span class="c-cat">${i.cat||''}</span>
      <div class="c-main">${i.main}</div>
      <div class="c-sub">${i.sub||''}</div>
      <div class="c-detail">${i.detail||''}</div>
    </div>`).join('');
}
function renderQ(){
  const q=QUIZ[qIdx%QUIZ.length];
  document.getElementById('quizContainer').innerHTML=`<div class="quiz-box"><div class="quiz-q">${qIdx+1}. ${q.q}</div><div class="quiz-opts">${q.opts.map((o,i)=>`<button class="quiz-opt" onclick="ans(this,${i},${q.ans},'${q.exp.replace(/\\/g,'\\\\').replace(/'/g,"\\'")}')">${o}</button>`).join('')}</div><div class="quiz-exp" id="qExp"></div></div>`;
  document.getElementById('qScore').textContent='Skor: '+ok+'/'+tot;
}
function ans(btn,c,a,exp){if(document.querySelector('.quiz-opt.correct'))return;tot++;document.querySelectorAll('.quiz-opt')[a].classList.add('correct');if(c!==a)btn.classList.add('wrong');else ok++;const e=document.getElementById('qExp');e.textContent='💡 '+exp;e.classList.add('show');document.getElementById('qScore').textContent='Skor: '+ok+'/'+tot;}
function nextQ(){qIdx=(qIdx+1)%QUIZ.length;renderQ();}
function resetQ(){qIdx=0;ok=0;tot=0;renderQ();}

renderContent();renderQ();
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('/sw.js').then(function(r){
      r.addEventListener('updatefound',function(){
        var w=r.installing;
        w.addEventListener('statechange',function(){
          if(w.state==='installed'&&navigator.serviceWorker.controller){
            if(confirm('Versi baru NihonggoPro tersedia! Muat ulang?'))location.reload();
          }
        });
      });
    }).catch(function(){});
  });
}
</script>
</body>
