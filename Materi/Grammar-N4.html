  if(!f.length){document.getElementById('grammarList').innerHTML='';nr.style.display='';return;}
  nr.style.display='none';
  const m=JSON.parse(localStorage.getItem(STOR_KEY)||'[]');
  document.getElementById('grammarList').innerHTML=f.map((c,i)=>`
    <div class="g-card" onclick="this.classList.toggle('open')">
      <div class="g-head">
        <div class="g-jp">${c.jp}</div>
        <div class="g-id">${c.id}</div>
        <span class="g-tag">${c.cat}</span>
      </div>
      <div class="g-body">
        <div class="g-pattern">📐 Pola: ${c.pattern}</div>
        <div class="g-example">
          <span class="g-ex-jp">${c.exJp}</span>
          <span class="g-ex-id">${c.exId}</span>
        </div>
        <div style="display:flex;gap:8px;margin-top:10px">
          <button class="g-audio" onclick="event.stopPropagation();speak('${c.exJp}')">🔊 Dengarkan</button>
          <button class="g-audio" onclick="event.stopPropagation();toggleMaster('${c.jp}',this,STOR_KEY)">${m.includes(c.jp)?'★ Dikuasai':'☆ Tandai'}</button>
        </div>
      </div>
    </div>`).join('');
}
document.getElementById('gSearch').addEventListener('input',render);
document.addEventListener('DOMContentLoaded',()=>{render();updateStats(STOR_KEY);});
</script><script>
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('/sw.js').then(function(r){
      r.addEventListener('updatefound',function(){
        var w=r.installing;
        w.addEventListener('statechange',function(){
          if(w.state==='installed'&&navigator.serviceWorker.controller){
            if(confirm('Versi baru NihonggoPro tersedia! Muat ulang?'))location.reload();
          }
        });
      });
    }).catch(function(){});
  });
}
</script>
