let currentCat = 'semua', searchTerm = '';
let qIdx = 0, correct = 0, total = 0;

function setCat(cat, btn) {
  currentCat = cat;
  document.querySelectorAll('.cat-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderIdioms();
}

function filterIdiom() {
  searchTerm = document.getElementById('searchBox').value.toLowerCase();
  renderIdioms();
}

function renderIdioms() {
  let items = IDIOMS;
  if (currentCat !== 'semua') items = items.filter(i => i.cat === currentCat);
  if (searchTerm) items = items.filter(i => 
    i.jp.toLowerCase().includes(searchTerm) || 
    i.id.toLowerCase().includes(searchTerm) ||
    i.read.toLowerCase().includes(searchTerm)
  );
  document.getElementById('idiomGrid').innerHTML = items.map(i => `
    <div class="idiom-card" onclick="this.classList.toggle('revealed')">
      <span class="id-cat">${getCatLabel(i.cat)}</span><span class="id-level">${i.lv}</span>
      <div class="id-jp">${i.jp}</div>
      <div class="id-read">${i.read}</div>
      <div class="id-id">🇮🇩 ${i.id}</div>
      <div class="id-ex">📝 ${i.ex}</div>
    </div>
  `).join('') || '<p style="color:var(--ink-mid);text-align:center;padding:20px">Tidak ada hasil.</p>';
}

function getCatLabel(cat) {
  const map={tubuh:'🫀 Tubuh',alam:'🌿 Alam',hati:'❤️ Hati',kerja:'💼 Kerja',kotowaza:'📜 Kotowaza',yoji:'四字 Yoji'};
  return map[cat]||cat;
}

function renderQuiz() {
  const q = QUIZ_DATA[qIdx % QUIZ_DATA.length];
  document.getElementById('quizContainer').innerHTML = `
    <div class="quiz-box">
      <div class="quiz-q">${qIdx+1}. ${q.q}</div>
      <div class="quiz-opts">
        ${q.opts.map((o,i)=>`<button class="quiz-opt" onclick="ans(this,${i},${q.ans},'${q.exp.replace(/\\/g,'\\\\').replace(/'/g,"\\'")}')">${o}</button>`).join('')}
      </div>
      <div class="quiz-exp" id="qExp"></div>
    </div>`;
  document.getElementById('quizScore').textContent = 'Skor: '+correct+'/'+total;
}

function ans(btn, chosen, correct_ans, exp) {
  if (document.querySelector('.quiz-opt.correct')) return;
  total++;
  document.querySelectorAll('.quiz-opt')[correct_ans].classList.add('correct');
  if (chosen !== correct_ans) btn.classList.add('wrong');
  else correct++;
  const el = document.getElementById('qExp');
  el.textContent = '💡 '+exp;
  el.classList.add('show');
  document.getElementById('quizScore').textContent = 'Skor: '+correct+'/'+total;
}

function nextQuiz() { qIdx=(qIdx+1)%QUIZ_DATA.length; renderQuiz(); }
function resetQuiz() { qIdx=0;correct=0;total=0;renderQuiz(); }

renderIdioms();
renderQuiz();
</script>
