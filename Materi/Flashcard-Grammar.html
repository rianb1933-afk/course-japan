<style>
.wrap{max-width:700px;margin:0 auto;padding:0 20px}
.hero{background:linear-gradient(135deg,#4a148c,#6a1b9a);color:#fff;padding:48px 20px 32px;text-align:center}
.hero h1{font-size:clamp(1.4rem,3vw,2rem);margin:0 0 8px}
.bdg{display:inline-block;background:rgba(255,255,255,.25);border-radius:20px;padding:4px 12px;font-size:.8rem;margin-bottom:12px}

.fc-level{font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:12px;margin-bottom:12px}
.lvN5{background:#e8f5e9;color:#2e7d32}
.lvN4{background:#e3f2fd;color:#1565c0}
.lvN3{background:#fff3e0;color:#e65100}
.lvN2{background:#fce4ec;color:#c62828}
.lvN1{background:#f3e5f5;color:#4a148c}
.fc-pattern{font-size:1.6rem;font-weight:700;color:#4a148c;margin:8px 0}
.fc-cat{font-size:.78rem;color:var(--ink-mid)}
.fc-id{font-size:1.2rem;font-weight:700;color:#fff;margin:8px 0}
.fc-ex{font-size:.88rem;color:rgba(255,255,255,.85);margin-top:8px}
.fc-hint{font-size:.78rem;color:var(--ink-mid);margin-top:12px}
.controls{display:flex;gap:10px;margin:16px 0;justify-content:center;flex-wrap:wrap}
.btn{padding:10px 20px;border:none;border-radius:10px;cursor:pointer;font-size:.9rem;font-weight:600;transition:all .2s}
.btn-flip{background:#4a148c;color:#fff}
.btn-know{background:#4caf50;color:#fff}
.btn-learn{background:#e91e63;color:#fff}
.btn-skip{background:var(--cream);color:var(--ink);border:1px solid var(--border-mid)}
.btn:hover{opacity:.85;transform:translateY(-1px)}

</div>

<div class="controls">

<script>
var ALL=[{"p": "〜は〜です", "id": "adalah ~", "ex": "私は学生です。= Saya adalah pelajar.", "lv": "N5", "cat": "基本"}, {"p": "〜が好きです", "id": "suka ~", "ex": "音楽が好きです。= Suka musik.", "lv": "N5", "cat": "感情"}, {"p": "〜てください", "id": "tolong ~; mohon ~", "ex": "ここに座ってください。= Tolong duduk di sini.", "lv": "N5", "cat": "依頼"}, {"p": "〜ませんか", "id": "maukah ~? (ajakan)", "ex": "一緒に行きませんか。= Maukah pergi bersama?", "lv": "N5", "cat": "勧誘"}, {"p": "〜ましょう", "id": "mari ~; ayo ~", "ex": "食べましょう。= Mari makan.", "lv": "N5", "cat": "勧誘"}, {"p": "〜てもいい", "id": "boleh ~", "ex": "帰ってもいいですか。= Boleh pulang?", "lv": "N4", "cat": "許可"}, {"p": "〜てはいけない", "id": "tidak boleh ~; dilarang ~", "ex": "ここで食べてはいけない。= Tidak boleh makan di sini.", "lv": "N4", "cat": "禁止"}, {"p": "〜なければならない", "id": "harus ~; wajib ~", "ex": "勉強しなければならない。= Harus belajar.", "lv": "N4", "cat": "義務"}, {"p": "〜かもしれない", "id": "mungkin ~", "ex": "雨が降るかもしれない。= Mungkin hujan.", "lv": "N4", "cat": "推測"}, {"p": "〜んです / のです", "id": "(penjelasan/konteks)", "ex": "頭が痛いんです。= (Soalnya) kepala saya sakit.", "lv": "N4", "cat": "説明"}, {"p": "〜すぎる", "id": "terlalu ~", "ex": "食べすぎた。= Terlalu banyak makan.", "lv": "N4", "cat": "程度"}, {"p": "〜やすい / にくい", "id": "mudah ~ / susah ~", "ex": "この本は読みやすい。= Buku ini mudah dibaca.", "lv": "N4", "cat": "性質"}, {"p": "〜はずだ", "id": "seharusnya ~; pasti ~", "ex": "彼は来るはずだ。= Seharusnya dia datang.", "lv": "N3", "cat": "推測"}, {"p": "〜ように", "id": "agar ~; supaya ~", "ex": "忘れないようにメモした。= Catat agar tidak lupa.", "lv": "N3", "cat": "目的"}, {"p": "〜わけではない", "id": "bukan berarti ~", "ex": "嫌いなわけではない。= Bukan berarti tidak suka.", "lv": "N3", "cat": "論理"}, {"p": "〜ために（目的）", "id": "untuk ~; demi ~", "ex": "合格するために勉強する。= Belajar untuk lulus.", "lv": "N3", "cat": "目的"}, {"p": "〜ものだ", "id": "seharusnya ~; memang ~", "ex": "子供は元気なものだ。= Anak-anak memang energetik.", "lv": "N3", "cat": "習慣"}, {"p": "〜ことにする", "id": "memutuskan untuk ~", "ex": "毎日運動することにした。= Memutuskan olahraga tiap hari.", "lv": "N3", "cat": "決定"}, {"p": "〜おかげで", "id": "berkat ~", "ex": "先生のおかげで合格した。= Berkat guru, bisa lulus.", "lv": "N3", "cat": "理由"}, {"p": "〜せいで", "id": "gara-gara ~", "ex": "雨のせいで遅れた。= Gara-gara hujan terlambat.", "lv": "N3", "cat": "理由"}, {"p": "〜にもかかわらず", "id": "meskipun ~; walaupun ~", "ex": "雨にもかかわらず試合は続いた。= Meskipun hujan, pertandingan lanjut.", "lv": "N2", "cat": "逆接"}, {"p": "〜かねない", "id": "bisa saja ~ (negatif)", "ex": "このまま放置すると大問題になりかねない。= Bisa jadi masalah besar.", "lv": "N2", "cat": "可能性"}, {"p": "〜ざるを得ない", "id": "terpaksa ~; tidak bisa tidak ~", "ex": "行かざるを得ない。= Terpaksa pergi.", "lv": "N2", "cat": "義務"}, {"p": "〜に反して", "id": "berlawanan dengan ~", "ex": "予想に反して簡単だった。= Berlawanan dengan dugaan, mudah.", "lv": "N2", "cat": "逆接"}, {"p": "〜をめぐって", "id": "seputar ~; mengenai ~", "ex": "予算をめぐって議論が続く。= Diskusi terus seputar anggaran.", "lv": "N2", "cat": "テーマ"}, {"p": "〜だけあって", "id": "pantas saja ~; wajar ~", "ex": "プロだけあって仕事が速い。= Pantas saja profesional, kerja cepat.", "lv": "N2", "cat": "当然"}, {"p": "〜に際して", "id": "pada saat ~; dalam rangka ~", "ex": "入学に際して手続きが必要だ。= Saat masuk perlu prosedur.", "lv": "N2", "cat": "時間"}, {"p": "〜からには", "id": "karena sudah ~; mengingat ~", "ex": "引き受けたからには最後までやる。= Karena sudah menerima, kerjakan sampai selesai.", "lv": "N2", "cat": "条件"}, {"p": "〜いかんによらず", "id": "terlepas dari ~", "ex": "結果いかんによらず最善を尽くす。= Terlepas dari hasil, lakukan yang terbaik.", "lv": "N1", "cat": "条件"}, {"p": "〜をおいて(他にない)", "id": "selain ~ tidak ada yang lain", "ex": "この仕事は彼をおいて他にいない。= Selain dia tidak ada yang cocok.", "lv": "N1", "cat": "強調"}, {"p": "〜に足る", "id": "layak ~; pantas ~", "ex": "信頼に足る人物だ。= Orang yang layak dipercaya.", "lv": "N1", "cat": "評価"}, {"p": "〜ずにはおかない", "id": "pasti akan ~; tidak bisa tidak ~", "ex": "その映画は感動させずにはおかない。= Film itu pasti mengharukan.", "lv": "N1", "cat": "必然"}, {"p": "〜もさることながら", "id": "tidak hanya ~, bahkan ~", "ex": "技術もさることながら経験も必要だ。= Tidak hanya skill, pengalaman juga perlu.", "lv": "N1", "cat": "強調"}];
var deck=[],cur=0,knowSet=new Set(),learnSet=new Set(),flipped=false,curLevel='semua';

function setLevel(lv,btn){
  curLevel=lv;
  document.querySelectorAll('.tab').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  resetDeck();
}

function resetDeck(){
  deck=curLevel==='semua'?ALL.slice():ALL.filter(function(c){return c.lv===curLevel;});
  // shuffle
  for(var i=deck.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=deck[i];deck[i]=deck[j];deck[j]=t;}
  cur=0;knowSet=new Set();learnSet=new Set();
  document.getElementById('completeBox').style.display='none';
  showCard();
  updateStats();
}

function showCard(){
  if(!deck.length)return;
  if(cur>=deck.length){showComplete();return;}
  var c=deck[cur];
  flipped=false;
  document.getElementById('flashcard').classList.remove('flipped');
  document.getElementById('fcLevel').textContent=c.lv;
  document.getElementById('fcLevel').className='fc-level lv'+c.lv;
  document.getElementById('fcPattern').textContent=c.p;
  document.getElementById('fcCat').textContent=c.cat;
  document.getElementById('fcLevelBack').textContent=c.lv;
  document.getElementById('fcId').textContent='🇮🇩 '+c.id;
  document.getElementById('fcEx').textContent='📝 '+c.ex;
  document.getElementById('cardCounter').textContent='Kartu '+(cur+1)+' / '+deck.length;
  var pct=Math.round((cur/deck.length)*100);
  document.getElementById('progressFill').style.width=pct+'%';
}

function flipCard(){
  flipped=!flipped;
  document.getElementById('flashcard').classList.toggle('flipped',flipped);
}

function markKnow(){try{if(window.NPXP){NPXP.recordVocab('grammar',1);NPXP.award('grammar',3);}}catch(e){}
  if(cur<deck.length){knowSet.add(cur);learnSet.delete(cur);}
  cur++;updateStats();showCard();
}

function markLearn(){try{if(window.NPXP){NPXP.recordVocab('grammar',1);NPXP.award('grammar',1);}}catch(e){}
  if(cur<deck.length){learnSet.add(cur);knowSet.delete(cur);}
  cur++;updateStats();showCard();
}

function nextCard(){cur++;showCard();updateStats();}

function updateStats(){
  document.getElementById('statTotal').textContent=deck.length;
  document.getElementById('statKnow').textContent=knowSet.size;
  document.getElementById('statLearn').textContent=learnSet.size;
}

function showComplete(){
  var box=document.getElementById('completeBox');
  box.style.display='block';
  document.getElementById('completeMsg').textContent=
    '✅ Hafal: '+knowSet.size+' kartu | 🔄 Perlu belajar: '+learnSet.size+' kartu dari '+deck.length+' total.';
  document.getElementById('flashcard').style.display='none';
  document.querySelector('.controls').style.display='none';
}

resetDeck();
</script><script>

          }
        });
      });

  });
}
</script>
