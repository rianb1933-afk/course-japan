": "予約したので、並ばずにすんだ。", "cat": "回避"}, {"p": "〜によっては", "id": "tergantung pada ~ (ada yang ~ ada yang tidak)", "ex": "場合によっては変更することもある。", "cat": "条件"}, {"p": "〜に関わらず", "id": "terlepas dari ~; tidak peduli ~", "ex": "経験に関わらず応募できます。", "cat": "条件"}, {"p": "〜をきっかけに", "id": "dengan ~ sebagai pemicu/awal mula", "ex": "その失敗をきっかけに、変わった。", "cat": "きっかけ"}, {"p": "〜ものとする", "id": "ditetapkan bahwa ~; diasumsikan ~", "ex": "未成年は参加不可とするものとする。", "cat": "規定"}, {"p": "〜の上では", "id": "secara ~ (di atas kertas/teori)", "ex": "規則の上では認められていない。", "cat": "範囲"}, {"p": "〜に即して", "id": "berdasarkan ~ (faktual); sesuai ~", "ex": "事実に即して話してください。", "cat": "基準"}, {"p": "〜を通じて", "id": "melalui ~; sepanjang ~", "ex": "SNSを通じて情報を発信する。", "cat": "手段"}, {"p": "〜はさておき", "id": "soal ~ nanti dulu; mengesampingkan ~", "ex": "冗談はさておき、本題に入ろう。", "cat": "留保"}];var curC='semua';
