<script>
var DLGS=[["朝の挨拶", "おはようございます。よく眠れましたか？", "Selamat pagi. Apakah tidurnya nyenyak?", "利用者", "おかげさまで、よく眠れました。", "Alhamdulillah, tidurnya nyenyak."], ["食事介助前", "〇〇様、お食事の時間です。今日はお好きなものが入っていますよ。", "~san, waktu makan. Hari ini ada makanan kesukaan Anda.", "利用者", "あら、そうですか。楽しみですね。", "Oh begitu? Senang sekali."], ["入浴の声かけ", "お風呂の準備ができました。温かいですよ。一緒に行きましょうか？", "Kamar mandi sudah siap. Hangat lho. Mari kita pergi bersama?", "利用者", "ありがとう。お願いします。", "Terima kasih. Tolong ya."], ["服薬介助", "〇〇様、お薬の時間です。今日は3種類あります。お水と一緒にどうぞ。", "~san, waktu minum obat. Hari ini ada 3 jenis. Silakan minum dengan air.", "利用者", "はい、ありがとう。全部飲めました。", "Ya, terima kasih. Sudah minum semua."], ["就寝前", "そろそろお休みになりますか？今日も一日お疲れさまでした。", "Apakah sudah mau istirahat? Selamat beristirahat, sudah bekerja keras seharian.", "利用者", "そうね。おやすみなさい。ありがとう。", "Ya. Selamat malam. Terima kasih."], ["体調確認", "今日の具合はいかがですか？何か気になることはありますか？", "Bagaimana kondisi hari ini? Ada yang dirasakan tidak nyaman?", "利用者", "少し腰が痛いです。", "Punggung saya agak sakit."]];
var PHRS=[["いかがですか？", "Bagaimana?"], ["〜のお時間です。", "Waktu untuk ~."], ["一緒に〜しましょうか？", "Apakah mau ~ bersama?"], ["お気をつけて。", "Hati-hati."], ["何かあればいつでも呼んでください。", "Jika ada apa-apa, panggil kapan saja."], ["よくできましたね。", "Anda melakukannya dengan baik."], ["無理しないでください。", "Jangan memaksakan diri."], ["ゆっくりでいいですよ。", "Pelan-pelan saja tidak apa-apa."], ["お疲れさまでした。", "Selamat beristirahat/terima kasih atas kerja kerasnya."], ["〜はいかがでしょうか？", "Bagaimana dengan ~?"]];
var Q=[{"q": "食事介助の声かけで大切なのは？", "opts": ["早く食べさせる", "名前を呼び、何を食べるか説明して楽しみを作る", "黙って介助する", "時間だけ伝える"], "a": 1, "e": "Poin penting dalam menyapa saat bantuan makan: memanggil nama (menghargai individu), menyampaikan isi menu (menimbulkan antisipasi), dan mengajak makan bersama secara hangat — bukan sekadar menyodorkan makanan tanpa kata-kata."}, {"q": "「いかがですか？」の代わりに使える丁寧な表現は？", "opts": ["どうですか？", "〜はいかがでしょうか？(より丁寧)", "OK?", "何？"], "a": 1, "e": "いかがでしょうか lebih sopan dibanding いかがですか. Contoh penggunaan: ご気分はいかがでしょうか (bagaimana perasaan Anda?), sering dipakai dalam konteks perawatan untuk menanyakan kondisi dengan lebih halus."}, {"q": "就寝前の声かけで必ず伝えることは？", "opts": ["何も言わない", "感謝・労い(お疲れさまでした)とおやすみの挨拶", "次の予定", "天気"], "a": 1, "e": "Sebelum tidur, ucapan yang wajib disampaikan: お疲れさまでした (mengapresiasi usaha hari itu) + おやすみなさい (selamat tidur) + tawaran bantuan jika ada yang dibutuhkan di malam hari — kombinasi ini menunjukkan perhatian menyeluruh."}, {"q": "利用者が「腰が痛い」と言った時の適切な対応は？", "opts": ["無視する", "詳しく痛みを聞いて看護師に報告し記録する", "痛み止めを渡す", "運動させる"], "a": 1, "e": "Menanggapi keluhan nyeri: pertama dengarkan dengan empati, lalu tanyakan detail (sejak kapan, seberapa parah, jenis nyerinya) sebelum melaporkan ke tenaga medis — jangan langsung mengabaikan atau menyimpulkan sendiri tanpa konfirmasi lebih lanjut."}];
var qi=0,ok=0,tot=0;
function renderDialogs(){
  var area=document.getElementById('dialogArea');if(!area)return;area.innerHTML='';
  DLGS.forEach(function(d){
    var box=document.createElement('div');box.className='dlbox';
    var title=document.createElement('div');title.className='dltitle';title.textContent=d[0];box.appendChild(title);
    var st=document.createElement('div');st.className='dl-st';
    var spk1=document.createElement('div');spk1.className='spk';spk1.textContent='介護士';
    var jp1=document.createElement('div');jp1.textContent=d[1];
    var id1=document.createElement('div');id1.className='dl-id';id1.textContent='🇮🇩 '+d[2];
    var btn=document.createElement('button');btn.className='tts';btn.textContent='🔊';
    var txt=d[1];btn.onclick=function(){if(window.speechSynthesis){var u=new SpeechSynthesisUtterance(txt);u.lang='ja-JP';u.rate=0.85;speechSynthesis.cancel();speechSynthesis.speak(u);}};
    st.appendChild(spk1);st.appendChild(jp1);st.appendChild(id1);st.appendChild(btn);box.appendChild(st);
    var pt=document.createElement('div');pt.className='dl-pt';
    var spk2=document.createElement('div');spk2.className='spk';spk2.textContent=d[3];
    var jp2=document.createElement('div');jp2.textContent=d[4];
    var id2=document.createElement('div');id2.className='dl-id';id2.textContent='🇮🇩 '+d[5];
    pt.appendChild(spk2);pt.appendChild(jp2);pt.appendChild(id2);box.appendChild(pt);
    area.appendChild(box);
  });
}
function renderPhrases(){
  var g=document.getElementById('phraseGrid');if(!g)return;g.innerHTML='';
  PHRS.forEach(function(p){
    var d=document.createElement('div');d.className='phr';
    d.innerHTML='<div class="pjp">'+p[0]+'</div><div class="pid">🇮🇩 '+p[1]+'</div>';
    var btn=document.createElement('button');btn.className='tts';btn.textContent='🔊';
    var txt=p[0];btn.onclick=function(){if(window.speechSynthesis){var u=new SpeechSynthesisUtterance(txt);u.lang='ja-JP';u.rate=0.85;speechSynthesis.cancel();speechSynthesis.speak(u);}};
    d.appendChild(btn);g.appendChild(d);
  });
}
function rnd(){if(!Q.length)return;var q=Q[qi%Q.length],c=document.getElementById('qc');if(!c)return;var oo=document.createElement('div');oo.className='qopts';q.opts.forEach(function(o,i){var b=document.createElement('button');b.className='qopt';b.textContent=o;b.onclick=function(){ans(b,i,q.a,q.e);};oo.appendChild(b);});var bx=document.createElement('div');bx.className='qbox';var qq=document.createElement('div');qq.className='qq';qq.textContent=(qi%Q.length+1)+'. '+q.q;var ex=document.createElement('div');ex.className='qexp';ex.id='qe';bx.appendChild(qq);bx.appendChild(oo);bx.appendChild(ex);c.innerHTML='';c.appendChild(bx);var s=document.getElementById('qs');if(s)s.textContent='Skor: '+ok+'/'+tot;}
function ans(b,c,a,e){var bs=document.querySelectorAll('.qopt');if(bs[a].dataset.d)return;bs[a].dataset.d='1';tot++;bs[a].classList.add('correct');if(c!==a)b.classList.add('wrong');else ok++;var ex=document.getElementById('qe');if(ex){ex.textContent='💡 '+e;ex.classList.add('show');}var s=document.getElementById('qs');if(s)s.textContent='Skor: '+ok+'/'+tot;}
function nQ(){qi=(qi+1)%Q.length;rnd();} function rQ(){qi=0;ok=0;tot=0;rnd();}
renderDialogs();renderPhrases();rnd();
</script><script>
