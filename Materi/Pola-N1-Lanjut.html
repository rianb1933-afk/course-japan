<script>
var Q=[{"q": "「結果いかんによらず」の意味は？", "opts": ["結果によって変わる", "結果に関係なく", "結果が良ければ", "結果が悪ければ"], "a": 1, "e": "いかんによらず=terlepas dari ~. 結果いかんによらず=terlepas dari hasilnya. フォーマルな表現。"}, {"q": "「彼女をおいて他にない」の意味は？", "opts": ["彼女を除いた", "彼女以外に適任者はいない", "彼女が去った", "彼女と一緒に"], "a": 1, "e": "をおいて(他に〜ない)=selain ~ tidak ada yang lain. 唯一性を強調する文語的表現。"}, {"q": "「努力なくして成功はない」の「なくして」は？", "opts": ["努力なしに(なければ成功できない)", "努力がなくなって", "努力せずに失敗した", "努力がいらない"], "a": 0, "e": "なくして(は)=tanpa ~. 必要条件を示す。努力なくして成功はない=tanpa usaha, tidak ada keberhasilan."}, {"q": "「専門家といえども」の意味は？", "opts": ["専門家だから当然", "専門家であっても(〜でさえ)", "専門家のようだ", "専門家になれば"], "a": 1, "e": "といえども=meskipun ~; bahkan ~ sekalipun. 逆接的な書き言葉表現。専門家でも間違える=bahkan ahli pun bisa salah."}, {"q": "「技術もさることながら」はどんな意味？", "opts": ["技術は重要でない", "技術はもちろん(として、さらに)", "技術だけが大切", "技術を除いて"], "a": 1, "e": "もさることながら=tidak hanya ~ (yang sudah jelas), bahkan ~. A当然だが、さらにBも強調する。"}, {"q": "「信頼に足る人物」の「に足る」は？", "opts": ["信頼するには不十分", "信頼するに値する(worthy)", "信頼できない", "信頼が足りない"], "a": 1, "e": "に足る=layak; worthy of ~. 信頼に足る=dapat dipercaya; layak dipercaya. 客観的な評価を示す。"}, {"q": "「ともなると」の使い方は？", "opts": ["N+ともなると=低い地位では", "N+ともなると=その立場・レベルになると", "V+ともなると", "Adj+ともなると"], "a": 1, "e": "N+ともなると=kalau sudah menjadi ~; begitu ~ (maka tanggung jawab pun berbeda). 部長ともなると=kalau sudah jadi manajer."}, {"q": "「失礼極まりない」の「極まりない」は？", "opts": ["少し失礼", "極めて(非常に)失礼", "失礼でない", "失礼に慣れた"], "a": 1, "e": "極まりない=sangat ~; luar biasa ~ (ekstrem). 主にネガティブな形容詞に使う。失礼極まりない=sangat tidak sopan."}],qi=0,ok=0,tot=0;
