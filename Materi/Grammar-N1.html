        <div class="g-pattern">📐 Pola: ${c.pattern}</div>
        <div class="g-example">
          <span class="g-ex-jp">${c.exJp}</span>
          <span class="g-ex-id">${c.exId}</span>
        </div>
        <div style="display:flex;gap:8px;margin-top:10px">
          <button class="g-audio" onclick="event.stopPropagation();speak('${c.exJp}')">🔊 Dengarkan</button>
          <button class="g-audio" onclick="event.stopPropagation();toggleMaster('${c.jp}',this,STOR_KEY)">${m.includes(c.jp)?'★ Dikuasai':'☆ Tandai'}</button>
        </div>
      </div>
    </div>`).join('');
}
document.getElementById('gSearch').addEventListener('input',render);
document.addEventListener('DOMContentLoaded',()=>{render();updateStats(STOR_KEY);});

if('serviceWorker' in navigator){

        var w=r.installing;
        w.addEventListener('statechange',function(){
          if(w.state==='installed'&&navigator.serviceWorker.controller){
            if(confirm('Versi baru NihonggoPro tersedia! Muat ulang?'))location.reload();
          }
        });
      });
    }).catch(function(){});
  });
}
