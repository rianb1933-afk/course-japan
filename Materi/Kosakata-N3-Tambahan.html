var Q=[{"q": "「影響」の読み方と意味は？", "opts": ["えいきょう=pengaruh/dampak", "かんけい=hubungan", "じょうきょう=situasi", "げんいん=sebab"], "a": 0, "e": "影響(えいきょう)=pengaruh; dampak. 環境が健康に影響する=lingkungan mempengaruhi kesehatan."}, {"q": "「手段」の意味は？", "opts": ["目的", "方法・やり方", "結果", "原因"], "a": 1, "e": "手段(しゅだん)=cara; metode; sarana. 目的のための手段=sarana untuk tujuan. 例:最善の手段を選ぶ=pilih cara terbaik."}, {"q": "「判断」の意味は？", "opts": ["実行する", "決めて評価すること", "質問する", "知る"], "a": 1, "e": "判断(はんだん)=penilaian; keputusan. 自分で判断する=memutuskan sendiri. 正しい判断=keputusan yang tepat."}, {"q": "「機会」の意味は？", "opts": ["危険", "チャンス・よい機会", "理由", "問題"], "a": 1, "e": "機会(きかい)=kesempatan; peluang. 良い機会=kesempatan baik. 機会があれば=kalau ada kesempatan."}, {"q": "「禁止」の意味は？", "opts": ["許可", "してはいけないこと", "要求", "規則"], "a": 1, "e": "禁止(きんし)=larangan; dilarang. 喫煙禁止=larangan merokok. 禁止する=melarang. 反対: 許可(きょか)=izin."}, {"q": "「解決」の意味は？", "opts": ["問題を複雑にする", "問題を解くこと・終わらせること", "問題を見つける", "問題を増やす"], "a": 1, "e": "解決(かいけつ)=penyelesaian; solusi. 問題を解決する=menyelesaikan masalah. 解決策=solusi. 未解決=belum terpecahkan."}],qi=0,ok=0,tot=0;
function rnd(){if(!Q.length)return;var q=Q[qi%Q.length],c=document.getElementById('qc');if(!c)return;var oo=document.createElement('div');oo.className='qopts';q.opts.forEach(function(o,i){var b=document.createElement('button');b.className='qopt';b.textContent=o;b.onclick=function(){ans(b,i,q.a,q.e);};oo.appendChild(b);});var bx=document.createElement('div');bx.className='qbox';var qq=document.createElement('div');qq.className='qq';qq.textContent=(qi%Q.length+1)+'. '+q.q;var ex=document.createElement('div');ex.className='qexp';ex.id='qe';bx.appendChild(qq);bx.appendChild(oo);bx.appendChild(ex);c.innerHTML='';c.appendChild(bx);var s=document.getElementById('qs');if(s)s.textContent='Skor: '+ok+'/'+tot;}
function ans(b,c,a,e){var bs=document.querySelectorAll('.qopt');if(bs[a].dataset.d)return;bs[a].dataset.d='1';tot++;bs[a].classList.add('correct');if(c!==a)b.classList.add('wrong');else ok++;var ex=document.getElementById('qe');if(ex){ex.textContent='💡 '+e;ex.classList.add('show');}var s=document.getElementById('qs');if(s)s.textContent='Skor: '+ok+'/'+tot;}

}, {"jp": "提供", "r": "ていきょう", "id": "penyediaan; penawaran", "ex": "サービスを提供する。"}, {"jp": "解決", "r": "かいけつ", "id": "penyelesaian; solusi", "ex": "問題を解決する方法。"}, {"jp": "判断", "r": "はんだん", "id": "penilaian; keputusan", "ex": "自分で判断する。"}];var vs='';
function filterVN3(){vs=document.getElementById('vsrch').value.toLowerCase();renderVN3();}
function renderVN3(){
  var items=vs?VN3.filter(function(v){return v.jp.includes(vs)||v.r.includes(vs)||v.id.toLowerCase().includes(vs);}):VN3;
  var g=document.getElementById('vn3Grid');if(!g)return;g.innerHTML='';
  items.forEach(function(v){
    var d=document.createElement('div');
    d.style.cssText='background:var(--white);border:1px solid var(--border-light);border-radius:10px;padding:12px;cursor:pointer;transition:all .2s';
    d.onmouseover=function(){this.style.borderColor='var(--primary,#e65100)';this.style.boxShadow='0 2px 8px rgba(230,81,0,.1)';}
    d.onmouseout=function(){this.style.borderColor='var(--border-light)';this.style.boxShadow='none';}
    d.innerHTML='<div style="font-size:1rem;font-weight:700;color:var(--primary,#e65100)">'+v.jp+'</div>'
      +'<div style="font-size:.75rem;color:var(--ink-mid);margin:2px 0">'+v.r+'</div>'
      +'<div style="font-size:.85rem;color:var(--ink)">🇮🇩 '+v.id+'</div>'
      +'<div style="display:none;margin-top:6px;font-size:.78rem;color:var(--ink-mid)">📝 '+v.ex+'</div>';
    d.onclick=function(){var det=this.querySelector('div[style*="display:none"],div[style*="display: none"]');if(det)det.style.display=det.style.display==='none'?'block':'none';};
    g.appendChild(d);
  });
}
function init(){renderVN3();}
