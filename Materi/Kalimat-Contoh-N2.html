<div class="tip">💡 Kalimat-kalimat ini menggunakan pola grammar N2-N1. Analisis struktur tiap kalimat — pola apa yang digunakan dan bagaimana cara penggunaannya.</div>
<input type="text" style="width:100%;padding:10px 14px;border:1px solid var(--border-mid);border-radius:10px;font-size:.9rem;margin-bottom:10px;box-sizing:border-box" id="ksrch" placeholder="🔍 Cari pola... (にもかかわらず、だけあって)" oninput="filterK()">

<script>
var Q=[{"q": "「〜にもかかわらず」の意味は？", "opts": ["〜だから", "〜にもかかわらず=meskipun ~ (逆接)", "〜のために", "〜によって"], "a": 1, "e": "にもかかわらず=meskipun ~; walaupun ~. 試験に合格したにもかかわらず喜んでいない=meskipun lulus tapi tidak gembira。"}, {"q": "「〜かねない」の意味は？", "opts": ["絶対に〜しない", "〜してしまうかもしれない(否定的可能性)", "〜したい", "〜できない"], "a": 1, "e": "かねない=bisa saja ~(negatif). 大問題になりかねない=bisa jadi masalah besar. 否定的な可能性を示す。"}, {"q": "「〜だけあって」の文は？", "opts": ["予想外", "〜だけの理由がある・当然そうだ", "〜できない", "失望した"], "a": 1, "e": "だけあって=pantas saja ~; ada alasannya. プロだけあって上手い=pantas saja profesional, memang bagus. 予想通りの結果。"}, {"q": "「〜を余儀なくされる」の意味は？", "opts": ["自分で選ぶ", "外部要因で強制的に〜させられる", "したくてする", "自由に決める"], "a": 1, "e": "余儀なくされる=terpaksa ~(外部要因). 台風で中止を余儀なくされた=akibat topan, terpaksa dibatalkan。"}, {"q": "「〜た上で」の使い方は？", "opts": ["〜する前に", "〜した後で・〜の結果を踏まえて", "〜しないで", "〜しながら"], "a": 1, "e": "〜た上で=setelah melakukan ~. 確認した上で返事する=setelah konfirmasi, baru balas. 順序を示す。"}, {"q": "「〜からには」の意味は？", "opts": ["〜する前に", "〜した以上は・〜だから当然(決意)", "〜しないために", "〜するかもしれない"], "a": 1, "e": "からには=karena sudah ~; mengingat ~(決意). 引き受けたからには最後までやる=karena sudah menerima, kerjakan sampai akhir。"}, {"q": "「〜どころか」の意味は？", "opts": ["〜だから", "〜はとんでもない・むしろ逆", "〜のために", "〜のように"], "a": 1, "e": "どころか=jauh dari ~; bukan ~, malah. 上手どころかまだ基本もできない=jauh dari mahir, dasar saja belum bisa。"}],qi=0,ok=0,tot=0;
function rnd(){if(!Q.length)return;var q=Q[qi%Q.length],c=document.getElementById('qc');if(!c)return;var oo=document.createElement('div');oo.className='qopts';q.opts.forEach(function(o,i){var b=document.createElement('button');b.className='qopt';b.textContent=o;b.onclick=function(){ans(b,i,q.a,q.e);};oo.appendChild(b);});var bx=document.createElement('div');bx.className='qbox';var qq=document.createElement('div');qq.className='qq';qq.textContent=(qi%Q.length+1)+'. '+q.q;var ex=document.createElement('div');ex.className='qexp';ex.id='qe';bx.appendChild(qq);bx.appendChild(oo);bx.appendChild(ex);c.innerHTML='';c.appendChild(bx);var s=document.getElementById('qs');if(s)s.textContent='Skor: '+ok+'/'+tot;}
function ans(b,c,a,e){var bs=document.querySelectorAll('.qopt');if(bs[a].dataset.d)return;bs[a].dataset.d='1';tot++;bs[a].classList.add('correct');if(c!==a)b.classList.add('wrong');else ok++;var ex=document.getElementById('qe');if(ex){ex.textContent='💡 '+e;ex.classList.add('show');}var s=document.getElementById('qs');if(s)s.textContent='Skor: '+ok+'/'+tot;}
function nQ(){qi=(qi+1)%Q.length;rnd();} function rQ(){qi=0;ok=0;tot=0;rnd();}
var KD=[{"jp": "彼女が試験に合格したにもかかわらず、あまり喜んでいないようだ。", "id": "Meskipun dia lulus ujian, tampaknya tidak terlalu gembira.", "pola": "〜にもかかわらず", "lv": "N2"}, {"jp": "このプロジェクトを成功させるためには、全員の協力なくしてはありえない。", "id": "Agar proyek ini berhasil, tidak mungkin tanpa kerjasama semua orang.", "pola": "〜なくして(は)", "lv": "N2"}, {"jp": "彼は専門家だけあって、複雑な問題も難なく解決した。", "id": "Pantas saja dia ahli — masalah kompleks pun diselesaikan dengan mudah.", "pola": "〜だけあって", "lv": "N2"}, {"jp": "予想に反して、その映画は大ヒットとなった。", "id": "Bertentangan dengan dugaan, film itu menjadi hits besar.", "pola": "〜に反して", "lv": "N2"}, {"jp": "引き受けたからには、最後まで責任を持ってやり遂げる。", "id": "Karena sudah menerima, akan menyelesaikannya dengan penuh tanggung jawab hingga akhir.", "pola": "〜からには", "lv": "N2"}, {"jp": "このままでは大問題になりかねないので、今すぐ対処すべきだ。", "id": "Kalau begini terus bisa jadi masalah besar, jadi harus ditangani sekarang.", "pola": "〜かねない", "lv": "N2"}, {"jp": "確認した上で、ご返答いたします。", "id": "Setelah konfirmasi, akan saya balas.", "pola": "〜た上で", "lv": "N2"}, {"jp": "彼の実力次第で、チームの結果が変わってくるだろう。", "id": "Tergantung kemampuannya, hasil tim mungkin akan berubah.", "pola": "〜次第で", "lv": "N2"}, {"jp": "経験はもとより、積極的な姿勢も評価の対象となります。", "id": "Sudah tentu pengalaman, tapi sikap proaktif juga menjadi bahan penilaian.", "pola": "〜はもとより", "lv": "N2"}, {"jp": "先生に何度も説明していただいたおかげで、ようやく理解できた。", "id": "Berkat guru menjelaskan berkali-kali, akhirnya bisa memahami.", "pola": "〜ていただく / おかげで", "lv": "N2"}, {"jp": "台風の影響で、イベントの中止を余儀なくされた。", "id": "Akibat pengaruh topan, terpaksa membatalkan event.", "pola": "〜を余儀なくされる", "lv": "N2"}, {"jp": "彼は批判されるたびに落ち込むどころか、より一層頑張るようになった。", "id": "Setiap kali dikritik, jauh dari patah semangat — malah semakin bersemangat.", "pola": "〜どころか", "lv": "N2"}, {"jp": "品質はもちろんのこと、納期の厳守も重要な条件です。", "id": "Sudah tentu kualitas, ketepatan waktu pengiriman juga syarat penting.", "pola": "〜はもちろんのこと", "lv": "N2"}, {"jp": "彼女の演技は感動させずにはおかない素晴らしいものだった。", "id": "Aktingnya sangat luar biasa — pasti bisa mengharukan.", "pola": "〜ずにはおかない", "lv": "N1"}, {"jp": "現代社会においては、デジタルリテラシーは必須のスキルだ。", "id": "Dalam masyarakat modern, literasi digital adalah keterampilan yang wajib dimiliki.", "pola": "〜においては", "lv": "N2"}];var ks='';
function filterK(){ks=document.getElementById('ksrch').value.toLowerCase();renderK();}
function renderK(){
  var items=ks?KD.filter(function(k){return k.jp.includes(ks)||k.id.toLowerCase().includes(ks)||k.pola.toLowerCase().includes(ks);}):KD;
  var g=document.getElementById('kGrid');if(!g)return;g.innerHTML='';
  items.forEach(function(k,i){
    var d=document.createElement('div');
    d.style.cssText='background:var(--white);border:1px solid var(--border-light);border-radius:12px;padding:16px;margin-bottom:12px';
    d.innerHTML='<span style="display:inline-block;font-size:.7rem;background:#fce4ec;color:var(--primary,#880e4f);padding:2px 8px;border-radius:10px;margin-bottom:8px;font-weight:600">'+k.lv+' / '+k.pola+'</span>'
      +'<div style="font-size:.95rem;font-weight:600;color:var(--ink);margin-bottom:8px;line-height:1.7">'+k.jp+'</div>'
      +'<div style="font-size:.85rem;color:var(--ink-mid)">🇮🇩 '+k.id+'</div>';
    g.appendChild(d);
  });
}
function init(){renderK();}
if(typeof init==='function')init(); rnd();
