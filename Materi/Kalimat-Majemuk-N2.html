var KM2D=[["彼女は仕事をしながら、大学院で勉強している。", "Dia bekerja sambil kuliah S2.", "〜ながら=sambil ~"], ["会議が終わり次第、すぐに連絡します。", "Segera setelah rapat selesai, saya akan menghubungi.", "〜次第=segera setelah ~"], ["この問題を解決するにあたって、専門家の意見が必要だ。", "Dalam mengatasi masalah ini, diperlukan pendapat ahli.", "〜にあたって=dalam rangka ~"], ["努力したにもかかわらず、結果が出なかった。", "Meskipun sudah berusaha, hasilnya tidak keluar.", "〜にもかかわらず=meskipun ~"], ["彼の提案を踏まえた上で、方針を決定する。", "Berdasarkan usulannya, kita menentukan kebijakan.", "〜を踏まえた上で=berdasarkan ~"], ["彼女は体調が悪い上に、仕事も忙しい。", "Kondisi tubuhnya tidak baik, ditambah lagi pekerjaannya sibuk.", "〜上に=ditambah lagi ~"], ["どんなに難しくても、諦めずに続けます。", "Betapapun sulitnya, saya terus tanpa menyerah.", "〜ても=meskipun ~"], ["その計画は実行に移すに当たって課題がある。", "Ada tantangan dalam mengeksekusi rencana itu.", "〜に当たって=pada saat ~"], ["彼は社長であるにもかかわらず、現場で働いている。", "Meskipun dia direktur, dia bekerja di lapangan.", "〜にもかかわらず(ulangi penekanan)"], ["長年の研究の末に、ついに結論に至った。", "Setelah penelitian bertahun-tahun, akhirnya mencapai kesimpulan.", "〜の末に=setelah panjang ~"]];
