<script>
var Q=[{"q": "「グローバル化が進む中」の意味は？", "opts": ["グローバル化が終わった", "グローバル化が進んでいる状況の中で", "グローバル化を進める", "グローバル化に反対する"], "a": 1, "e": "〜が進む中=di tengah ~ yang sedang berkembang. グローバル化が進む中=di tengah kemajuan globalisasi. 〜中(なか)=状況・背景を示す。"}, {"q": "「不可欠(ふかけつ)」の意味は？", "opts": ["少し大切", "欠かすことができない(必須)", "あまり重要でない", "将来必要"], "a": 1, "e": "不可欠=sangat penting; tidak bisa tanpa. 例:教育は不可欠だ=pendidikan sangat diperlukan. 不=否定+可欠=bisa dikurangi."}, {"q": "「実現する(じつげんする)」の意味は？", "opts": ["夢を見る", "現実のものにする", "諦める", "計画する"], "a": 1, "e": "実現する=mewujudkan; membuat menjadi nyata. 例:夢を実現する=mewujudkan impian. 反対:断念する=諦める。"}, {"q": "「〜に寄り添う(よりそう)」の意味は？", "opts": ["距離を置く", "相手の側に立ち支える", "批判する", "無視する"], "a": 1, "e": "寄り添う=mendampingi; bersimpati. 感情的サポートを示す表現。介護では「利用者に寄り添う」がよく使われる。"}, {"q": "「尊厳(そんげん)を守る」の意味は？", "opts": ["身体を守る", "人としての価値・誇りを守る", "財産を守る", "秘密を守る"], "a": 1, "e": "尊厳=martabat; harga diri sebagai manusia. 介護の根本原則。尊厳のある生活=kehidupan yang bermartabat."}],qi=0,ok=0,tot=0;
function rnd(){if(!Q.length)return;var q=Q[qi%Q.length],c=document.getElementById('qc');if(!c)return;var oo=document.createElement('div');oo.className='qopts';q.opts.forEach(function(o,i){var b=document.createElement('button');b.className='qopt';b.textContent=o;b.onclick=function(){ans(b,i,q.a,q.e);};oo.appendChild(b);});var bx=document.createElement('div');bx.className='qbox';var qq=document.createElement('div');qq.className='qq';qq.textContent=(qi%Q.length+1)+'. '+q.q;var ex=document.createElement('div');ex.className='qexp';ex.id='qe';bx.appendChild(qq);bx.appendChild(oo);bx.appendChild(ex);c.innerHTML='';c.appendChild(bx);var s=document.getElementById('qs');if(s)s.textContent='Skor: '+ok+'/'+tot;}
function ans(b,c,a,e){var bs=document.querySelectorAll('.qopt');if(bs[a].dataset.d)return;bs[a].dataset.d='1';tot++;bs[a].classList.add('correct');if(c!==a)b.classList.add('wrong');else ok++;var ex=document.getElementById('qe');if(ex){ex.textContent='💡 '+e;ex.classList.add('show');}var s=document.getElementById('qs');if(s)s.textContent='Skor: '+ok+'/'+tot;}
function nQ(){qi=(qi+1)%Q.length;rnd();} function rQ(){qi=0;ok=0;tot=0;rnd();}
var SD=[{"jp": "環境問題は現代社会が直面する最も深刻な課題のひとつです。", "rd": "kankyou mondai wa gendai shakai ga chokumen suru mottomo shinkoку na kadai no hitotsu desu", "id": "Masalah lingkungan adalah salah satu tantangan paling serius yang dihadapi masyarakat modern.", "cat": "社会"}, {"jp": "グローバル化が進む中、異文化理解の重要性はますます高まっています。", "rd": "gurооbaru-ka ga susumu naka, ibunka rikai no juuyousei wa masumasu takamatte imasu", "id": "Di tengah kemajuan globalisasi, pentingnya pemahaman lintas budaya semakin meningkat.", "cat": "社会"}, {"jp": "少子高齢化は日本が直面している最も重大な社会問題のひとつです。", "rd": "shoushi koureika wa nihon ga chokumen shite iru mottomo juudai na shakai mondai no hitotsu desu", "id": "Penurunan angka kelahiran dan penuaan populasi adalah salah satu masalah sosial paling serius yang dihadapi Jepang.", "cat": "社会"}, {"jp": "テクノロジーの発展により、私たちの生活は大きく変化しました。", "rd": "tekunorojii no hatten ni yori, watashitachi no seikatsu wa ooki ku henka shimashita", "id": "Berkat perkembangan teknologi, kehidupan kita telah berubah secara besar-besaran.", "cat": "技術"}, {"jp": "人工知能の普及は、雇用市場に大きな影響を与えると考えられています。", "rd": "jinkouchinou no fukyuu wa, koyou shijou ni ooki na eikyou wo ataeru to kangaerarete imasu", "id": "Penyebaran kecerdasan buatan dianggap akan memberikan dampak besar pada pasar kerja.", "cat": "技術"}, {"jp": "再生可能エネルギーへの転換は急務となっています。", "rd": "saisei kanou enerugii e no tenkan wa kyuumu to natte imasu", "id": "Transisi ke energi terbarukan telah menjadi kebutuhan mendesak.", "cat": "環境"}, {"jp": "持続可能な開発目標（SDGs）は、世界が共有するビジョンです。", "rd": "jizoku kanou na kaihatsu mokuhyou wa, sekai ga kyouyu suru bijon desu", "id": "Tujuan Pembangunan Berkelanjutan (SDGs) adalah visi bersama yang dibagi dunia.", "cat": "環境"}, {"jp": "多様性を尊重することで、より豊かな社会が実現できると信じています。", "rd": "tayousei wo sonchou suru koto de, yori yutaka na shakai ga jitsugen dekiru to shinjite imasu", "id": "Saya percaya bahwa dengan menghormati keberagaman, kita dapat mewujudkan masyarakat yang lebih kaya.", "cat": "社会"}, {"jp": "教育格差の是正は、公正な社会を実現するために不可欠です。", "rd": "kyouiku kakusa no zesei wa, kousei na shakai wo jitsugen suru tame ni fukaketsu desu", "id": "Perbaikan kesenjangan pendidikan sangat diperlukan untuk mewujudkan masyarakat yang adil.", "cat": "教育"}, {"jp": "批判的思考能力を身につけることは、現代を生き抜くために欠かせません。", "rd": "hihanteki shikou nouryoku wo mi ni tsukeru koto wa, gendai wo ikinuku tame ni kakasenmasen", "id": "Memiliki kemampuan berpikir kritis sangat penting untuk bertahan hidup di era modern.", "cat": "教育"}, {"jp": "インターネットの普及により、情報へのアクセスが民主化されました。", "rd": "intaanetto no fukyuu ni yori, jouhou e no akusesu ga minshuka saremashita", "id": "Berkat meluasnya internet, akses terhadap informasi telah menjadi lebih demokratis.", "cat": "技術"}, {"jp": "高齢者の生活の質を向上させることは、介護の根本的な目標です。", "rd": "koureisha no seikatsu no shitsu wo koujou saseru koto wa, kaigo no konponteki na mokuhyou desu", "id": "Meningkatkan kualitas hidup lansia adalah tujuan mendasar dari perawatan kaigo.", "cat": "介護"}, {"jp": "介護の現場では、利用者の尊厳を守ることが最優先されます。", "rd": "kaigo no genba dewa, riyousha no songen wo mamoru koto ga saiyuusen saremasu", "id": "Di lapangan kaigo, melindungi martabat pengguna layanan diprioritaskan di atas segalanya.", "cat": "介護"}, {"jp": "認知症ケアにおいては、本人の感情に寄り添うことが最も重要です。", "rd": "ninchishou kea ni oite wa, honnin no kanjou ni yorisou koto ga mottomo juuyou desu", "id": "Dalam perawatan demensia, hal paling penting adalah mendampingi perasaan penderita itu sendiri.", "cat": "介護"}, {"jp": "チームワークと多職種連携が、質の高い介護を実現する鍵です。", "rd": "chiimuwaaku to shashokushu renkei ga, shitsu no takai kaigo wo jitsugen suru kagi desu", "id": "Kerja tim dan kolaborasi multi-profesi adalah kunci untuk mewujudkan perawatan berkualitas tinggi.", "cat": "介護"}];
var curCat='semua';
function setC(c,btn){curCat=c;document.querySelectorAll('.tab').forEach(function(b){b.classList.remove('active');});btn.classList.add('active');renderSpeak();}
function renderSpeak(){
  var items=curCat==='semua'?SD:SD.filter(function(s){return s.cat===curCat;});
  var g=document.getElementById('speakGrid');if(!g)return;
  g.innerHTML='';
  items.forEach(function(s,i){
    var d=document.createElement('div');
    d.style.cssText='background:var(--white);border:1px solid var(--border-light);border-radius:12px;padding:16px;margin-bottom:10px;cursor:pointer;transition:all .2s';
    d.onmouseover=function(){this.style.boxShadow='0 2px 12px rgba(0,0,0,.1)';}
    d.onmouseout=function(){this.style.boxShadow='none';}
    var top=document.createElement('div');
    top.style.cssText='display:flex;justify-content:space-between;align-items:center;margin-bottom:8px';
    var catSpan=document.createElement('span');
    catSpan.style.cssText='font-size:.7rem;background:#e8f5e9;color:var(--primary,#1b5e20);padding:2px 8px;border-radius:10px;font-weight:600';
    catSpan.textContent=s.cat;
    var btn=document.createElement('button');
    btn.textContent='🔊 聞く';
    btn.style.cssText='border:none;background:var(--primary,#1b5e20);color:#fff;padding:4px 10px;border-radius:6px;cursor:pointer;font-size:.75rem';
    btn.onclick=function(e){e.stopPropagation();if(window.speechSynthesis){var u=new SpeechSynthesisUtterance(s.jp);u.lang='ja-JP';u.rate=0.8;speechSynthesis.cancel();speechSynthesis.speak(u);}};
    top.appendChild(catSpan);top.appendChild(btn);
    var jp=document.createElement('div');
    jp.style.cssText='font-size:1rem;font-weight:600;color:var(--ink);margin-bottom:6px;line-height:1.6';
    jp.textContent=s.jp;
    var det=document.createElement('div');
    det.style.display='none';
    var rd=document.createElement('div');
    rd.style.cssText='font-size:.78rem;color:var(--ink-mid);margin-bottom:6px;font-style:italic';
    rd.textContent=s.rd;
    var id=document.createElement('div');
    id.style.cssText='font-size:.88rem;color:var(--primary,#1b5e20);font-weight:500';
    id.textContent='🇮🇩 '+s.id;
    det.appendChild(rd);det.appendChild(id);
    d.appendChild(top);d.appendChild(jp);d.appendChild(det);
    d.onclick=function(){det.style.display=det.style.display==='none'?'block':'none';};
    g.appendChild(d);
  });
}
function init(){renderSpeak();}
if(typeof init==='function')init(); rnd();
