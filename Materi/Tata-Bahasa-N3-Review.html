<script>
var RD=[{"p": "〜てみる", "id": "mencoba ~", "ex": "食べてみた。", "lv": "N4", "cat": "行為"}, {"p": "〜てしまう", "id": "terlanjur ~; menyesal ~", "ex": "お金を使ってしまった。", "lv": "N4", "cat": "行為"}, {"p": "〜ておく", "id": "melakukan untuk persiapan", "ex": "明日のために準備しておく。", "lv": "N4", "cat": "行為"}, {"p": "〜てある", "id": "sudah ~ (kondisi ada)", "ex": "窓が開けてある。", "lv": "N4", "cat": "行為"}, {"p": "〜ようになる", "id": "menjadi bisa ~; mulai ~", "ex": "日本語が話せるようになった。", "lv": "N4", "cat": "変化"}, {"p": "〜ようにする", "id": "berusaha untuk ~", "ex": "毎日運動するようにしている。", "lv": "N4", "cat": "変化"}, {"p": "〜はずだ", "id": "seharusnya ~; tentu ~", "ex": "彼はもう着いているはずだ。", "lv": "N3", "cat": "推測"}, {"p": "〜らしい", "id": "sepertinya ~; katanya ~", "ex": "来週試験があるらしい。", "lv": "N3", "cat": "推測"}, {"p": "〜かもしれない", "id": "mungkin ~", "ex": "雨が降るかもしれない。", "lv": "N3", "cat": "推測"}, {"p": "〜でしょう", "id": "mungkin ~; ya kan ~", "ex": "明日は晴れるでしょう。", "lv": "N3", "cat": "推測"}, {"p": "〜のに", "id": "padahal ~; meskipun ~ (kekecewaan)", "ex": "頑張ったのに、落ちた。", "lv": "N3", "cat": "逆接"}, {"p": "〜くせに", "id": "padahal ~; meskipun ~ (kritis)", "ex": "知っているくせに、教えない。", "lv": "N3", "cat": "逆接"}, {"p": "〜ながら", "id": "sambil ~", "ex": "音楽を聞きながら勉強する。", "lv": "N4", "cat": "同時"}, {"p": "〜ついでに", "id": "sekalian ~", "ex": "買い物のついでに銀行に寄った。", "lv": "N3", "cat": "機会"}, {"p": "〜たびに", "id": "setiap kali ~", "ex": "彼に会うたびに喧嘩する。", "lv": "N3", "cat": "頻度"}, {"p": "〜おかげで", "id": "berkat ~; karena ~(positif)", "ex": "先生のおかげで合格できた。", "lv": "N3", "cat": "理由"}, {"p": "〜せいで", "id": "gara-gara ~; karena ~ (negatif)", "ex": "雨のせいで遅れた。", "lv": "N3", "cat": "理由"}, {"p": "〜ために（目的）", "id": "untuk ~; demi ~", "ex": "合格するために勉強する。", "lv": "N3", "cat": "目的"}, {"p": "〜ために（原因）", "id": "karena ~; akibat ~", "ex": "病気のために欠席した。", "lv": "N3", "cat": "理由"}, {"p": "〜ことにする", "id": "memutuskan untuk ~", "ex": "毎日運動することにした。", "lv": "N3", "cat": "決定"}, {"p": "〜ことになる", "id": "menjadi keputusan bahwa ~", "ex": "来月転勤することになった。", "lv": "N3", "cat": "決定"}, {"p": "〜ものだ", "id": "seharusnya ~; memang begitu ~", "ex": "困ったときは助け合うものだ。", "lv": "N3", "cat": "習慣"}, {"p": "〜わけだ", "id": "memang ~ (logis)", "ex": "毎日練習したわけだから上手いはずだ。", "lv": "N3", "cat": "論理"}, {"p": "〜わけがない", "id": "tidak mungkin ~", "ex": "彼がそんなことをするわけがない。", "lv": "N3", "cat": "論理"}, {"p": "〜わけではない", "id": "bukan berarti ~", "ex": "嫌いなわけではない。", "lv": "N3", "cat": "論理"}];
var RQ=[{"q": "「〜てしまう」と「〜てみる」の違いは？", "opts": ["同じ", "てしまう=完了/後悔、てみる=試み", "てみる=後悔、てしまう=試み", "どちらも試みを表す"], "a": 1, "e": "てしまう=terlanjur/selesai (sering ada nuansa penyesalan). てみる=mencoba. 食べてみた=coba makan. 食べてしまった=terlanjur makan."}, {"q": "「〜はずだ」と「〜かもしれない」の確信度の差は？", "opts": ["同じ", "はずだ>かもしれない(はずだの方が確信高い)", "かもしれない>はずだ", "確信度は関係ない"], "a": 1, "e": "はずだ=seharusnya (kepastian tinggi, ada dasar logis). かもしれない=mungkin (ketidakpastian). 彼は来るはずだ vs 来るかもしれない."}, {"q": "「頑張ったのに落ちた」の「のに」の意味は？", "opts": ["だから(順接)", "〜にもかかわらず(逆接・失望)", "もし〜なら", "〜するとき"], "a": 1, "e": "のに=meskipun; padahal (逆接+感情). 期待/努力に反する結果を表し、失望・不満の気持ちが含まれる。"}, {"q": "「おかげで」と「せいで」の違いは？", "opts": ["同じ意味", "おかげで=ポジティブ原因、せいで=ネガティブ原因", "せいで=ポジティブ", "どちらも中立"], "a": 1, "e": "おかげで=berkat ~ (結果良い). せいで=gara-gara ~ (結果悪い). 先生のおかげで合格(ポジ) vs 雨のせいで遅刻(ネガ)."}, {"q": "「ことにする」と「ことになる」の違いは？", "opts": ["同じ", "ことにする=自分の決定、ことになる=外部からの決定", "ことになる=自分で決める", "どちらも外部"], "a": 1, "e": "ことにする=自分で決める(自己決定). ことになる=外からの決定・成り行き(外部要因). 転勤することにした(自分) vs することになった(会社が決めた)."}, {"q": "「わけがない」の意味は？", "opts": ["多分〜する", "絶対に〜するはずがない", "〜かもしれない", "〜するべきだ"], "a": 1, "e": "わけがない=tidak mungkin ~; mustahil. 彼がそんなことをするわけがない=dia tidak mungkin melakukan hal seperti itu."}, {"q": "「らしい」と「そうだ(伝聞)」の違いは？", "opts": ["同じ", "らしい=話者の推測+情報、そうだ=直接聞いた情報", "そうだ=推測", "らしい=直接確認"], "a": 1, "e": "らしい=似ている+情報ベースの推測. そうだ(伝聞)=誰かから直接聞いた. 「来ないらしい」vs「来ないそうだ」は微妙だが、らしいは話者の判断も含む."}, {"q": "「〜ついでに」の意味は？", "opts": ["〜のために", "何かをする機会に、ついでに別のことも", "〜の代わりに", "〜した後で"], "a": 1, "e": "ついでに=sekalian; sambil lalu. 買い物のついでに銀行に寄った=sekalian belanja, mampir ke bank. 主な行動のついでに別の行動をする."}];
var curC='semua';
function setC(c,btn){curC=c;document.querySelectorAll('.tab').forEach(function(b){b.classList.remove('active');});btn.classList.add('active');render();}
function getCatColor(c){var m={'行為':'#e3f2fd','推測':'#f3e5f5','逆接':'#fff3e0','理由':'#e8f5e9','同時':'#fce4ec','機会':'#e0f2f1','頻度':'#fff8e1','習慣':'#f1f8e9','論理':'#e8eaf6','変化':'#e0f7fa','決定':'#fbe9e7'};return m[c]||'#f5f5f5';}
function getLvColor(l){return l==='N4'?'var(--accent,#1565c0)':l==='N3'?'var(--primary,#bf360c)':'var(--accent,#4a148c)';}
function render(){
  var items=curC==='semua'?RD:RD.filter(function(i){return i.cat===curC;});
  var g=document.getElementById('reviewGrid');g.innerHTML='';
  items.forEach(function(r){
    var d=document.createElement('div');
    d.style.cssText='background:var(--white);border:1px solid var(--border-light);border-radius:12px;padding:14px;margin-bottom:10px;transition:all .2s;cursor:pointer';
    d.onmouseover=function(){this.style.boxShadow='0 2px 8px rgba(0,0,0,.1)';}
    d.onmouseout=function(){this.style.boxShadow='none';}
    var top='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">';
    top+='<span style="display:inline-block;font-size:.7rem;background:'+getCatColor(r.cat)+';color:#333;padding:2px 8px;border-radius:10px">'+r.cat+'</span>';
    top+='<span style="font-size:.72rem;font-weight:700;color:'+getLvColor(r.lv)+'">'+r.lv+'</span>';
    top+='</div>';
    var main='<div style="font-size:1.05rem;font-weight:700;color:var(--primary,#bf360c)">'+r.p+'</div>';
    main+='<div style="font-size:.88rem;color:var(--ink-mid);margin:4px 0">🇮🇩 '+r.id+'</div>';
    var det='<div class="det" style="display:none;margin-top:8px;padding-top:8px;border-top:1px dashed var(--border-light);font-size:.83rem;color:var(--ink-mid)">📝 '+r.ex+'</div>';
    d.innerHTML=top+main+det;
    d.onclick=function(){var dt=this.querySelector('.det');dt.style.display=dt.style.display==='none'?'block':'none';};
    g.appendChild(d);
  });
}
var Q=RQ,qi=0,ok=0,tot=0;
function rnd(){if(!Q.length)return;var q=Q[qi%Q.length],c=document.getElementById('qc');if(!c)return;var oo=document.createElement('div');oo.className='qopts';q.opts.forEach(function(o,i){var b=document.createElement('button');b.className='qopt';b.textContent=o;b.onclick=function(){ans(b,i,q.a,q.e);};oo.appendChild(b);});var bx=document.createElement('div');bx.className='qbox';var qq=document.createElement('div');qq.className='qq';qq.textContent=(qi%Q.length+1)+'. '+q.q;var ex=document.createElement('div');ex.className='qexp';ex.id='qe';bx.appendChild(qq);bx.appendChild(oo);bx.appendChild(ex);c.innerHTML='';c.appendChild(bx);var s=document.getElementById('qs');if(s)s.textContent='Skor: '+ok+'/'+tot;}
function ans(b,c,a,e){var bs=document.querySelectorAll('.qopt');if(bs[a].dataset.d)return;bs[a].dataset.d='1';tot++;bs[a].classList.add('correct');if(c!==a)b.classList.add('wrong');else ok++;var ex=document.getElementById('qe');if(ex){ex.textContent='💡 '+e;ex.classList.add('show');}var s=document.getElementById('qs');if(s)s.textContent='Skor: '+ok+'/'+tot;}
function nQ(){qi=(qi+1)%Q.length;rnd();} function rQ(){qi=0;ok=0;tot=0;rnd();}
render();rnd();
</script><script>
