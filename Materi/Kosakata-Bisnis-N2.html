<script>
var Q=[{"q": "「稟議」の意味は？", "opts": ["一人で決める", "上位者の順に承認を回すプロセス", "拒否する", "提案する"], "a": 1, "e": "稟議(りんぎ)=persetujuan hierarki Jepang. 稟議書を回す=mengedarkan dokumen persetujuan berjenjang. 日本の会社文化の核心。"}, {"q": "「根回し」とは？", "opts": ["会議を開く", "正式決定前の非公式な事前調整", "報告する", "断る"], "a": 1, "e": "根回し(ねまわし)=lobi informal sebelum keputusan resmi. 日本のビジネスで非常に重要な文化的慣行。"}, {"q": "「打診する」の意味は？", "opts": ["決定する", "相手の意向を探る・可能性を確認する", "拒否する", "報告する"], "a": 1, "e": "打診(だしん)=menjajaki; menanyakan kemungkinan. 転職を打診された=ditanya kemungkinan pindah kerja."}, {"q": "「裁量に任せる」の意味は？", "opts": ["全部指示する", "自分で判断して決めていい", "禁止する", "相談する"], "a": 1, "e": "裁量(さいりょう)=diskresi; kewenangan memutuskan sendiri. 裁量に任せる=serahkan kebijakan padamu."}, {"q": "「周知する」の意味は？", "opts": ["秘密にする", "広く知らせる・全員に伝える", "一人に伝える", "削除する"], "a": 1, "e": "周知(しゅうち)=sosialisasi; memberitahu semua pihak. 社内に周知する=sosialisasikan ke seluruh perusahaan."}, {"q": "「懸案事項」の意味は？", "opts": ["解決済みの問題", "未解決のまま残っている課題", "新しい提案", "成功した案件"], "a": 1, "e": "懸案(けんあん)=pending issue; masalah yang belum terselesaikan. 懸案事項を解決する=menyelesaikan masalah yang tertunda."}],qi=0,ok=0,tot=0;
function rnd(){if(!Q.length)return;var q=Q[qi%Q.length],c=document.getElementById("qc");if(!c)return;var oo=document.createElement("div");oo.className="qopts";q.opts.forEach(function(o,i){var b=document.createElement("button");b.className="qopt";b.textContent=o;b.onclick=function(){ans(b,i,q.a,q.e);};oo.appendChild(b);});var bx=document.createElement("div");bx.className="qbox";var qq=document.createElement("div");qq.className="qq";qq.textContent=(qi%Q.length+1)+". "+q.q;var ex=document.createElement("div");ex.className="qexp";ex.id="qe";bx.appendChild(qq);bx.appendChild(oo);bx.appendChild(ex);c.innerHTML="";c.appendChild(bx);var s=document.getElementById("qs");if(s)s.textContent="Skor: "+ok+"/"+tot;}
function ans(b,c,a,e){var bs=document.querySelectorAll(".qopt");if(bs[a].dataset.d)return;bs[a].dataset.d="1";tot++;bs[a].classList.add("correct");if(c!==a)b.classList.add("wrong");else ok++;var ex=document.getElementById("qe");if(ex){ex.textContent="💡 "+e;ex.classList.add("show");}var s=document.getElementById("qs");if(s)s.textContent="Skor: "+ok+"/"+tot;}
function nQ(){qi=(qi+1)%Q.length;rnd();} function rQ(){qi=0;ok=0;tot=0;rnd();}
var KB2D=[{"jp": "稟議", "r": "りんぎ", "id": "persetujuan hierarki; approval berjenjang", "ex": "稟議書を回す。", "cat": "手続"}, {"jp": "根回し", "r": "ねまわし", "id": "lobi informal sebelum keputusan resmi", "ex": "会議前に根回しをする。", "cat": "交渉"}, {"jp": "折衝", "r": "せっしょう", "id": "negosiasi; perundingan", "ex": "価格について折衝する。", "cat": "交渉"}, {"jp": "調整", "r": "ちょうせい", "id": "koordinasi; penyesuaian", "ex": "スケジュールを調整する。", "cat": "管理"}, {"jp": "打診", "r": "だしん", "id": "menjajaki; menanyakan kemungkinan", "ex": "転職を打診された。", "cat": "交渉"}, {"jp": "差配", "r": "さはい", "id": "mengatur; memimpin (dengan otoritas)", "ex": "プロジェクトを差配する。", "cat": "管理"}, {"jp": "承認", "r": "しょうにん", "id": "persetujuan resmi; approval", "ex": "上司の承認を得る。", "cat": "手続"}, {"jp": "裁量", "r": "さいりょう", "id": "diskresi; kebijakan sendiri", "ex": "裁量に任せる。", "cat": "管理"}, {"jp": "策定", "r": "さくてい", "id": "merumuskan; menetapkan (kebijakan)", "ex": "新方針を策定する。", "cat": "戦略"}, {"jp": "施策", "r": "しさく", "id": "langkah kebijakan; measures", "ex": "具体的な施策を検討する。", "cat": "戦略"}, {"jp": "見積もり", "r": "みつもり", "id": "estimasi biaya; penawaran harga", "ex": "見積もりを提出する。", "cat": "財務"}, {"jp": "精査", "r": "せいさ", "id": "pemeriksaan teliti; due diligence", "ex": "データを精査する。", "cat": "分析"}, {"jp": "懸案", "r": "けんあん", "id": "masalah yang belum terselesaikan; pending issue", "ex": "懸案事項を解決する。", "cat": "問題"}, {"jp": "取りまとめ", "r": "とりまとめ", "id": "kompilasi; merangkum; koordinasi", "ex": "意見を取りまとめる。", "cat": "管理"}, {"jp": "周知", "r": "しゅうち", "id": "pemberitahuan ke semua pihak; sosialisasi", "ex": "社内に周知する。", "cat": "コミュニケーション"}];var kbs="";var kbc="全部";
function filterKB2(){kbs=document.getElementById("bsrch").value.toLowerCase();renderKB2();}
function setCat(c,btn){kbc=c;document.querySelectorAll("#catRow button").forEach(function(b){b.style.background="#f5f5f5";b.style.color="#333";});btn.style.background="#37474f";btn.style.color="#fff";renderKB2();}
function renderKB2(){
  var items=KB2D;
  if(kbc!=="全部")items=items.filter(function(v){return v.cat===kbc;});
  if(kbs)items=items.filter(function(v){return v.jp.includes(kbs)||v.r.includes(kbs)||v.id.toLowerCase().includes(kbs);});
  var g=document.getElementById("bGrid");if(!g)return;g.innerHTML="";
  items.forEach(function(v){
    var d=document.createElement("div");
    d.style.cssText="background:#fff;border:1px solid rgba(55,71,79,.12);border-radius:10px;padding:12px;cursor:pointer;transition:all .2s";
    d.onmouseover=function(){this.style.borderColor="#37474f";this.style.boxShadow="0 2px 8px rgba(55,71,79,.1)";};
    d.onmouseout=function(){this.style.borderColor="rgba(55,71,79,.12)";this.style.boxShadow="none";};
    d.innerHTML="<span style='font-size:.7rem;background:#eceff1;color:#37474f;padding:2px 8px;border-radius:10px;display:inline-block;margin-bottom:4px'>"+v.cat+"</span>"
      +"<div style='font-size:1rem;font-weight:700;color:#37474f'>"+v.jp+"</div>"
      +"<div style='font-size:.78rem;color:#888;margin:2px 0'>"+v.r+"</div>"
      +"<div style='font-size:.85rem;color:#333'>🇮🇩 "+v.id+"</div>"
      +"<div style='display:none;margin-top:6px;font-size:.78rem;color:#666'>📝 "+v.ex+"</div>";
    d.onclick=function(){var det=this.querySelector("div[style*='display:none']");if(det)det.style.display="block";};
    g.appendChild(d);
  });
}
function init(){
  var cats=["全部",...new Set(KB2D.map(function(v){return v.cat;}))]
  var cr=document.getElementById("catRow");cr.innerHTML="";
  cats.forEach(function(c,i){
    var btn=document.createElement("button");
    btn.style.cssText="padding:5px 14px;border-radius:20px;border:1px solid #ddd;background:"+(i===0?"#37474f":"#f5f5f5")+";color:"+(i===0?"#fff":"#333")+";cursor:pointer;font-size:.82rem;transition:all .2s";
    btn.textContent=c;
    btn.onclick=function(){setCat(c,this);};
    cr.appendChild(btn);
  });
  renderKB2();
}
if(typeof init==="function")init(); rnd();
