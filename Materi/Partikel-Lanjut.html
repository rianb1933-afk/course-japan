let cat='semua',src='',qIdx=0,ok=0,tot=0;
function setCat(c,btn){cat=c;document.querySelectorAll('.cat-tab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');render();}
function filterP(){src=document.getElementById('searchBox').value.toLowerCase();render();}
function render(){
  let items=PARTICLES;
  if(cat!=='semua')items=items.filter(i=>i.cat===cat);
  if(src)items=items.filter(i=>i.p.includes(src)||i.mean.toLowerCase().includes(src)||i.pattern.toLowerCase().includes(src));
  // Deduplicate
  const seen=new Set();
  items=items.filter(i=>{const k=i.p+i.mean;if(seen.has(k))return false;seen.add(k);return true;});
  document.getElementById('pGrid').innerHTML=items.map(i=>`
    <div class="p-card" onclick="this.classList.toggle('revealed')">
      <div class="p-particle">${i.p} <span class="p-level">${i.lv}</span></div>
      <div class="p-meaning">${i.mean}</div>
      <div class="p-detail">
        <div class="p-pattern">📐 ${i.pattern}</div>
        ${i.ex.map(e=>`<div class="p-ex">📝 ${e}</div>`).join('')}
        ${i.contrast?`<div class="p-contrast">⚖️ ${i.contrast}</div>`:''}
      </div>
    </div>`).join('')||'<p style="text-align:center;color:var(--ink-mid);padding:20px">Tidak ditemukan.</p>';
}
function renderQ(){
  const q=QUIZ[qIdx%QUIZ.length];
  document.getElementById('quizContainer').innerHTML=`<div class="quiz-box"><div class="quiz-q">${qIdx+1}. ${q.q}</div><div class="quiz-opts">${q.opts.map((o,i)=>`<button class="quiz-opt" onclick="ans(this,${i},${q.ans},'${q.exp.replace(/\\/g,'\\\\').replace(/'/g,"\\'")}')"> ${o}</button>`).join('')}</div><div class="quiz-exp" id="qExp"></div></div>`;
  document.getElementById('qScore').textContent='Skor: '+ok+'/'+tot;
}
function ans(btn,c,a,exp){if(document.querySelector('.quiz-opt.correct'))return;tot++;document.querySelectorAll('.quiz-opt')[a].classList.add('correct');if(c!==a)btn.classList.add('wrong');else ok++;const e=document.getElementById('qExp');e.textContent='💡 '+exp;e.classList.add('show');document.getElementById('qScore').textContent='Skor: '+ok+'/'+tot;}
function nextQ(){qIdx=(qIdx+1)%QUIZ.length;renderQ();}
function resetQ(){qIdx=0;ok=0;tot=0;renderQ();}
render();renderQ();
</script>
