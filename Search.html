let currentFilter = 'all';
let currentQuery  = '';

function setFilter(btn, cat) {
  document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentFilter = cat;
  doSearch();
}

function highlight(text, q) {
  if (!q) return text;
  const esc = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return text.replace(new RegExp(`(${esc})`, 'gi'), '<mark>$1</mark>');
}

function doSearch() {
  const q = currentQuery.trim().toLowerCase();
  const list = document.getElementById('resultList');
  const meta = document.getElementById('resultsMeta');

  // Filter
  let results = INDEX.filter(item => {
    const catOk = currentFilter === 'all' || item.cat === currentFilter;
    if (!catOk) return false;
    if (!q) return true;
    const haystack = (item.title + ' ' + item.desc + ' ' + item.tags).toLowerCase();
    return q.split(/\s+/).every(word => haystack.includes(word));
  });

  // Sort by relevance (title match > desc match > tags)
  if (q) {
    results.sort((a, b) => {
      const scoreOf = item => {
        let s = 0;
        if (item.title.toLowerCase().includes(q)) s += 10;
        if (item.desc.toLowerCase().includes(q))  s += 5;
        if (item.tags.toLowerCase().includes(q))  s += 2;
        return s;
      };
      return scoreOf(b) - scoreOf(a);
    });
  }

  meta.textContent = q
    ? `${results.length} hasil untuk "${currentQuery}"`
    : `${results.length} konten tersedia`;

  if (!results.length) {
    list.innerHTML = `<div class="no-results">
      <h3>Tidak ditemukan 😔</h3>
      <p>Coba kata kunci lain atau telusuri kategori di bawah.</p>
      <div class="popular-row" style="margin-top:16px">
        ${['kanji','partikel','grammar','jlpt','kaigo','keigo','kosakata','N5'].map(t =>
          `<button class="popular-tag" onclick="quickSearch('${t}')">${t}</button>`
        ).join('')}
      </div>
    </div>`;
    return;
  }

  list.innerHTML = results.map(item => `
    <a href="${item.url}" class="result-item">
      <div class="result-icon">${item.icon}</div>
      <div>
        <div class="result-cat">${{materi:'📚 Materi',jlpt:'🏆 JLPT',kaigo:'🏥 Kaigo',ai:'🤖 AI Tools',tools:'🛠️ Tools',blog:'📰 Info'}[item.cat] || item.cat}</div>
        <div class="result-title">${highlight(item.title, q)}</div>
        <div class="result-desc">${highlight(item.desc, q)}</div>
      </div>
    </a>`).join('');
}

function quickSearch(term) {
  document.getElementById('searchInput').value = term;
  currentQuery = term;
  doSearch();
  document.getElementById('searchInput').focus();
}

// Init
document.addEventListener('DOMContentLoaded', () => {
  const inp = document.getElementById('searchInput');

  // Restore from URL param
  const params = new URLSearchParams(location.search);
  const q = params.get('q') || '';
  if (q) { inp.value = q; currentQuery = q; }

  doSearch();

  inp.addEventListener('input', () => {
    currentQuery = inp.value;
    // Update URL without reload
    const url = new URL(location.href);
    if (currentQuery) url.searchParams.set('q', currentQuery);
    else url.searchParams.delete('q');
    history.replaceState(null, '', url);
    doSearch();
  });
});
</script>

if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('/sw.js').then(function(r){
      r.addEventListener('updatefound',function(){
        var w=r.installing;
        w.addEventListener('statechange',function(){
          if(w.state==='installed'&&navigator.serviceWorker.controller){
            if(confirm('Versi baru NihongoPro tersedia! Muat ulang?'))location.reload();
          }
        });
      });
    }).catch(function(){});
  });
}
</script>
