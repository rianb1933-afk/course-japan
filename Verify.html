<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<script src="assets/dark-mode-toggle.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verifikasi Sertifikat — Nihongo Pro Academy</title>
<meta name="description" content="Verifikasi keaslian sertifikat ujian Nihongo Pro Academy dengan memasukkan ID sertifikat.">
<meta name="robots" content="noindex">
<script type="application/ld+json">{"@context":"https://schema.org","@type":"WebPage","name":"Verifikasi Sertifikat","description":"Verifikasi keaslian sertifikat ujian Nihongo Pro Academy.","url":"https://nihongopro.id/Verify.html","inLanguage":"id","isPartOf":{"@type":"WebSite","name":"Nihongo Pro Academy","url":"https://nihongopro.id"}}</script>
<link rel="stylesheet" href="assets/kyoto-bundle.min.css">
<link rel="stylesheet" href="assets/kyoto-navbar.min.css?v=5">
<link rel="stylesheet" href="assets/kyoto-elevation.css">
<script src="assets/env.js"></script>
<script src="assets/supabase-client.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box}
body{font-family:'Outfit',sans-serif;background:var(--cream,#F8F3E9);color:var(--ink,#2d2d2d);margin:0;line-height:1.7}
.wrap{max-width:560px;margin:0 auto;padding:3rem 5vw 4rem}
h1{font-family:'Noto Serif JP',serif;font-size:26px;margin-bottom:.5rem;text-align:center}
.sub{text-align:center;color:var(--ink-soft,#6e6e6e);margin-bottom:2rem;font-size:14px}
.panel{background:#fff;border:.5px solid var(--border-mid,rgba(107,79,58,.15));border-radius:14px;padding:1.6rem;box-shadow:0 4px 16px rgba(107,79,58,.08)}
.row{display:flex;gap:.6rem}
input{flex:1;border:1.5px solid var(--border-mid,rgba(107,79,58,.2));border-radius:10px;padding:12px 14px;font:inherit;font-size:15px;background:var(--cream,#F8F3E9)}
button{border:none;background:#A63A3A;color:#fff;border-radius:10px;padding:12px 22px;font:inherit;font-weight:700;cursor:pointer}
button:hover{opacity:.9}
#result{margin-top:1.5rem;display:none}
.ok{background:#e6f0e6;border:1px solid #5B7C5B;border-radius:12px;padding:1.2rem;text-align:center}
.ok .icon{font-size:36px}
.ok h3{color:#5B7C5B;margin:.4rem 0}
.detail{margin-top:1rem;font-size:14px;text-align:left;background:var(--cream,#F8F3E9);border-radius:8px;padding:1rem}
.detail div{padding:4px 0;border-bottom:1px solid rgba(0,0,0,.06);display:flex;justify-content:space-between}
.no{background:#f7e6e6;border:1px solid #A63A3A;border-radius:12px;padding:1.2rem;text-align:center}
.no .icon{font-size:36px}
.no h3{color:#A63A3A;margin:.4rem 0}
.warn{background:#FBF4E3;border:1px solid #C89B3C;border-radius:12px;padding:1rem;text-align:center;font-size:13px;margin-top:1rem}
</style>
</head>
<body>
<main class="wrap">
  <h1>🔍 Verifikasi Sertifikat</h1>
  <p class="sub">Masukkan ID sertifikat (tercetak di bagian bawah sertifikat, atau hasil scan QR) untuk memeriksa keasliannya.</p>
  <div class="panel">
    <div class="row">
      <input id="certIdInput" placeholder="Contoh: UJIAN-LX3F9A2B" autocomplete="off">
      <button id="checkBtn">Cek</button>
    </div>
    <div id="result"></div>
  </div>
</main>

<script src="assets/kyoto-navbar.min.js?v=5" defer></script>
<script>
(function(){
  'use strict';
  function $(id){return document.getElementById(id);}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c];});}

  async function check(){
    var id = $('certIdInput').value.trim();
    var box = $('result');
    if(!id){ box.style.display='none'; return; }
    box.style.display='block';
    box.innerHTML = '<p style="text-align:center;color:var(--ink-soft,#6e6e6e)">Memeriksa…</p>';

    if(!window.EDUMA_ENV || !window.EDUMA_ENV.SUPABASE_URL){
      box.innerHTML = '<div class="warn">⚠️ Layanan verifikasi online belum aktif di situs ini (Supabase belum dikonfigurasi oleh admin). Hubungi penyelenggara untuk verifikasi manual.</div>';
      return;
    }
    try{
      var cert = await window.SupabaseClient.DB.getExamCertificate(id);
      if(!cert){
        box.innerHTML = '<div class="no"><div class="icon">❌</div><h3>Sertifikat Tidak Ditemukan</h3><p style="font-size:13px;color:#6e6e6e">ID <b>'+esc(id)+'</b> tidak cocok dengan catatan kami. Periksa kembali penulisan ID.</p></div>';
        return;
      }
      var examName = cert.exam_type==='kaigo' ? '介護福祉士 (Kaigo)' : 'JLPT (Bahasa Jepang)';
      var date = new Date(cert.issued_at).toLocaleDateString('id-ID',{year:'numeric',month:'long',day:'numeric'});
      box.innerHTML =
        '<div class="ok"><div class="icon">✅</div><h3>Sertifikat Valid</h3>'+
        '<div class="detail">'+
        '<div><span>Nama</span><b>'+esc(cert.recipient_name)+'</b></div>'+
        '<div><span>Jenis Ujian</span><b>'+esc(examName)+'</b></div>'+
        '<div><span>Skor</span><b>'+cert.score_pct+'% ('+cert.correct+'/'+cert.total+')</b></div>'+
        '<div><span>Tanggal Terbit</span><b>'+date+'</b></div>'+
        '<div><span>ID Sertifikat</span><b>'+esc(cert.cert_id)+'</b></div>'+
        '</div></div>';
    }catch(e){
      box.innerHTML = '<div class="warn">⚠️ Gagal memeriksa sertifikat saat ini. Coba lagi beberapa saat lagi.</div>';
    }
  }

  $('checkBtn').addEventListener('click', check);
  $('certIdInput').addEventListener('keydown', function(e){ if(e.key==='Enter') check(); });

  // Baca ?id= dari URL (dari scan QR) dan langsung cek
  var params = new URLSearchParams(location.search);
  var idFromUrl = params.get('id');
  if(idFromUrl){ $('certIdInput').value = idFromUrl; check(); }
})();
</script>
</body>
</html>
