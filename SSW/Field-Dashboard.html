<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--cream);color:var(--ink);font-size:15px;line-height:1.7}
a{text-decoration:none;color:inherit}
.ssw-shell{max-width:1200px;margin:0 auto;padding:1.6rem 5vw 4rem}
.ssw-panel{display:none}
.ssw-panel.active{display:block}
.ssw-empty{background:var(--white);border:1px dashed var(--border-mid);border-radius:12px;padding:26px;text-align:center;color:var(--ink-soft);font-size:14px}

<body>
<div id="knNavbar"></div>

<main class="ssw-shell">
  <div class="ssw-crumb" role="navigation" aria-label="Breadcrumb">
    <a href="/">Beranda</a><span class="sep">›</span>
    <a href="/SSW.html">SSW 特定技能</a><span class="sep">›</span>
    <span class="here" id="crumbField">…</span>
  </div>

  <header class="ssw-field-hero" id="fieldHero" data-kanji="特定技能">
    <h1 id="heroJp">Memuat…</h1>
    <div class="fh-id" id="heroId"></div>
    <div class="fh-progress">
      <div class="bar"><div class="fill" id="heroFill" style="width:0%"></div></div>
      <div class="lbl"><span id="heroPercent">0%</span><span id="heroDone">0 item selesai</span></div>
    </div>
  </header>

  <div class="ssw-tabs" id="fieldTabs" role="navigation" aria-label="Bagian bidang">
    <button class="ssw-tab active" type="button" data-panel="overview">Overview</button>
    <button class="ssw-tab" type="button" data-panel="materi">Materi</button>
    <a class="ssw-tab" href="/SSW/Vocabulary.html?field=kaigo" id="tabVocab">Vocabulary</a>
    <a class="ssw-tab" href="/SSW/Kanji.html" id="tabKanji">Kanji</a>
    <a class="ssw-tab" href="/SSW/Grammar.html" id="tabGrammar">Grammar</a>
    <a class="ssw-tab" href="/SSW/Listening.html" id="tabListening">Listening</a>
    <a class="ssw-tab" href="/SSW/Reading.html" id="tabReading">Reading</a>
    <a class="ssw-tab" href="/SSW/Quiz.html" id="tabQuiz">Quiz</a>
    <a class="ssw-tab" href="/SSW/Mock-Exam.html" id="tabMock">Practice / Mock Exam</a>
    <a class="ssw-tab" href="/SSW/Progress.html" id="tabProgress">Progress</a>
  </div>

  <!-- ── Overview ── -->
  <section class="ssw-panel active" id="panel-overview">
    <div class="ssw-over-grid" id="overGrid"></div>
    <p class="ssw-empty" id="overEmpty" hidden>Belum ada konten di bidang ini — konten ditambahkan lewat Admin Dashboard.</p>
  </section>

  <!-- ── Materi (modul & lesson) ── -->
  <section class="ssw-panel" id="panel-materi">
    <div id="materiList"></div>
    <p class="ssw-empty" id="materiEmpty" hidden>Belum ada modul. Admin dapat menambahkan modul &amp; lesson lewat Admin Dashboard → SSW CMS.</p>
  </section>
</main>

<div id="knFooter"></div>
<script src="/assets/kyoto-navbar.min.js?v=9" defer></script>
<script src="/assets/kyoto-bottom-nav.js" defer></script>
<script src="/assets/ssw-api.js?v=9"></script>
<script src="/assets/ssw-seed.js?v=9"></script>
<script>
(function () {
  'use strict';
  // Tab Overview/Materi: panel toggle in-page (bukan link #anchor — validator
  // menandai anchor tanpa elemen id tujuan di halaman statis)
  const tabBtns = document.querySelectorAll('#fieldTabs [data-panel]');
  tabBtns.forEach(btn => btn.addEventListener('click', () => {
    tabBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.ssw-panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + btn.dataset.panel));
  }));
  const params = new URLSearchParams(location.search);
  const slug = params.get('field') || 'kaigo';

  // Arahkan tab-tabel halaman lain membawa field yang sama.
  // Idempoten: pakai URL.searchParams supaya tidak jadi ?field=kaigo&field=kaigo
  // bila tautan statis sudah membawa ?field=... (mis. tabVocabulary).
  ['tabVocab','tabKanji','tabGrammar','tabListening','tabReading','tabQuiz','tabMock','tabProgress'].forEach(function(id) {
    const el = document.getElementById(id);
    if (!el || !el.href) return;
    try {
      const url = new URL(el.href, location.origin);
      url.searchParams.set('field', slug);
      el.href = url.toString();
    } catch (e) { /* bukan URL valid statis — lewati */ }
  });

  function esc(s) { const d = document.createElement('div'); d.textContent = String(s == null ? '' : s); return d.innerHTML; }

  function countLessons(modules) {
    return modules.reduce((n, m) => n + ((m.ssw_lessons && m.ssw_lessons.length) || 0), 0);
  }

  function paintOverview(cat, modules, counts) {
    const lessons = countLessons(modules);
    const cards = [
      { n: modules.length, l: 'Modul', href: '#materi' },
      { n: lessons, l: 'Lesson', href: '#materi' },
      { n: counts.vocabulary || 0, l: 'Vocabulary', href: '/SSW/Vocabulary.html?field=' + slug },
      { n: counts.kanji || 0, l: 'Kanji', href: '/SSW/Kanji.html?field=' + slug },
      { n: counts.grammar || 0, l: 'Grammar', href: '/SSW/Grammar.html?field=' + slug },
      { n: counts.listening || 0, l: 'Listening', href: '/SSW/Listening.html?field=' + slug },
      { n: counts.reading || 0, l: 'Reading', href: '/SSW/Reading.html?field=' + slug },
      { n: counts.quiz || 0, l: 'Quiz / Exam', href: '/SSW/Quiz.html?field=' + slug },
    ];
    const grid = document.getElementById('overGrid');
    grid.innerHTML = cards.map(c => `
      <a class="ssw-over-card" href="${esc(c.href)}">
        <div class="oc-num">${c.n}</div>
        <div class="oc-lbl">${esc(c.l)}</div>
      </a>`).join('');
    document.getElementById('overEmpty').hidden = cards.some(c => c.n > 0);
  }

  function paintMateri(modules) {
    const wrap = document.getElementById('materiList');
    if (!modules.length) { document.getElementById('materiEmpty').hidden = false; return; }
    wrap.innerHTML = modules.map((m, mi) => `
      <div class="ssw-module">
        <h3><span class="mj">Modul ${mi + 1}</span>${esc(m.title)}${m.title_jp ? ' <span class="jp">' + esc(m.title_jp) + '</span>' : ''}</h3>
        ${m.description ? `<p style="color:var(--ink-soft);font-size:13.5px;margin-top:2px">${esc(m.description)}</p>` : ''}
        <div class="ssw-lesson-list">
          ${(m.ssw_lessons || []).map((ls, li) => `
            <a class="ssw-lesson-item ${SSWAPI.isCompleted('lesson', ls.id) ? 'done' : ''}" href="/SSW/Lesson.html?field=${encodeURIComponent(slug)}&lesson=${esc(ls.id)}">
              <span class="li-num">${li + 1}</span>
              <span>
                <span class="li-title">${esc(ls.title)}</span>
                ${ls.description ? `<span class="li-desc" style="display:block">${esc(ls.description)}</span>` : ''}
              </span>
              <span class="li-check">✓</span>
            </a>`).join('')}
        </div>
      </div>`).join('');
  }

  function paintHero(cat) {
    document.getElementById('heroJp').textContent = cat.name_jp + ' SSW';
    document.getElementById('heroId').textContent = [cat.name_id, cat.name_en].filter(Boolean).join(' · ') + (cat.description ? ' — ' + cat.description : '');
    document.getElementById('fieldHero').setAttribute('data-kanji', cat.name_jp.slice(0, 4));
    const crumb = document.getElementById('crumbField');   // null-safe: lihat Lesson.html
    if (crumb) crumb.textContent = cat.name_jp + ' ' + cat.name_id;
    document.title = cat.name_jp + ' SSW — ' + cat.name_id + ' | Nihongo Pro Academy';
  }

  // Dipanggil dua kali: sekali dengan lesson saja (supaya bar tidak kosong
  // selama jumlah konten per jenis masih dimuat), lalu sekali lagi setelah
  // jumlahnya tiba. Sebelumnya total vocab/kanji/grammar dipatok 0, jadi
  // penyebutnya nol dan seluruh jenis selain lesson tidak pernah terhitung.
  // Kuis sengaja TIDAK masuk bar ini: bar ini soal materi yang dipelajari,
  // sedangkan hasil kuis/ujian punya tempat sendiri di Progress.html.
  function paintProgress(modules, counts) {
    const lessons = countLessons(modules);
    const c = counts || {};
    const totals = {
      lesson: lessons,
      vocab: c.vocabulary || 0,
      kanji: c.kanji || 0,
      grammar: c.grammar || 0,
      listening: c.listening || 0,
      reading: c.reading || 0,
    };
    const sum = SSWAPI.categorySummary(slug, totals);
    document.getElementById('heroFill').style.width = sum.percent + '%';
    document.getElementById('heroPercent').textContent = sum.percent + '%';
    document.getElementById('heroDone').textContent = sum.done.lesson + ' / ' + lessons + ' lesson selesai';
  }

  SSWAPI.getFieldTree(slug).then(async ({ category, modules, source }) => {
    if (!category) {
      document.getElementById('heroJp').textContent = 'Bidang tidak ditemukan';
      document.getElementById('heroId').textContent = 'Periksa kembali tautan, atau mulai dari daftar bidang.';
      return;
    }
    window.__sswField = { slug, category };
    paintHero(category);
    paintProgress(modules, null);
    // Hitungan konten per jenis — dari DB bila ada, dari seed bila belum.
    // seed.fields hanya mengisi kaigo; bidang lain tampil 0 sampai admin
    // mengisi lewat CMS — itu perilaku yang benar, bukan bug.
    const counts = window.__sswCounts = {};
    for (const kind of ['vocabulary', 'kanji', 'grammar', 'listening', 'reading', 'quizzes']) {
      try {
        const { items } = await SSWAPI.getItems(slug, kind);
        counts[kind === 'quizzes' ? 'quiz' : kind] = (items && items.length) || 0;
      } catch (e) { /* jenis belum tersedia — biarkan 0 */ }
    }
    paintProgress(modules, counts);
    paintOverview(category, modules, counts);
    paintMateri(modules);
    if (source === 'seed') console.info('[SSW] mode contoh lokal (DB belum terisi)');
  }).catch(err => {
    console.error('[SSW]', err);
    document.getElementById('heroJp').textContent = 'Gagal memuat bidang';
  });
})();
</script>
</body>
</html>
